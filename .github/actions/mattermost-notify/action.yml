name: Mattermost-Benachrichtigung
description: Postet eine Karte (Message-Attachment mit Farbbalken, Titel, Feldern und Footer) als Bot n8n-bot in einen Mattermost-Channel. Ohne Token passiert nichts.

inputs:
  channel:
    description: Channel-Name (URL-Name), der Bot muss Mitglied sein
    required: true
  message:
    description: Markdown-Text der Karte
    required: true
  title:
    description: Titel der Karte, verlinkt auf link. Ohne Titel hat die Karte nur Farbbalken, Text und Footer
    required: false
    default: ""
  status:
    description: success (gruen), failure (rot), warning (orange) oder info (blau)
    required: false
    default: info
  link:
    description: Ziel des Titels, Standard ist der aktuelle Workflow-Lauf
    required: false
    default: ""
  fields:
    description: 'JSON-Array fuer Felder, zum Beispiel [{"title":"Commit","value":"abc1234","short":true}]'
    required: false
    default: ""
  token:
    description: Access-Token des Mattermost-Bots n8n-bot
    required: false
    default: ""
  url:
    description: Basis-URL von Mattermost
    required: false
    default: https://matter-tech.pkr-lab.de

runs:
  using: composite
  steps:
    - name: Nachricht senden
      shell: bash
      env:
        MM_CHANNEL: ${{ inputs.channel }}
        MM_MESSAGE: ${{ inputs.message }}
        MM_TITLE: ${{ inputs.title }}
        MM_STATUS: ${{ inputs.status }}
        MM_LINK: ${{ inputs.link }}
        MM_FIELDS: ${{ inputs.fields }}
        MM_TOKEN: ${{ inputs.token }}
        MM_URL: ${{ inputs.url }}
        MM_FOOTER: ${{ github.repository }} · ${{ github.workflow }}
        MM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ -z "$MM_TOKEN" ]; then
          echo "Kein Bot-Token gesetzt, Mattermost-Benachrichtigung uebersprungen."
          exit 0
        fi
        case "$MM_STATUS" in
          success) color="#2e7d32" ;;
          failure) color="#c62828" ;;
          warning) color="#ef6c00" ;;
          *) color="#1565c0" ;;
        esac
        fields_json="$(printf '%s' "${MM_FIELDS:-[]}" | jq -c 'if type == "array" then map({title: (.title | tostring), value: (.value | tostring), short: (.short // false)}) else [] end' 2>/dev/null)" || fields_json="[]"
        [ -n "$fields_json" ] || fields_json="[]"
        post() {
          channel_id="$(curl -sS --fail-with-body --max-time 20 -H "Authorization: Bearer $MM_TOKEN" "$MM_URL/api/v4/users/me/channels" \
            | jq -r --arg name "$MM_CHANNEL" 'map(select(.name == $name)) | .[0].id // empty')"
          [ -n "$channel_id" ] || { echo "Channel $MM_CHANNEL nicht gefunden oder Bot kein Mitglied" >&2; return 1; }
          jq -n \
            --arg channel_id "$channel_id" \
            --arg text "$MM_MESSAGE" \
            --arg title "$MM_TITLE" \
            --arg link "${MM_LINK:-$MM_RUN_URL}" \
            --arg color "$color" \
            --arg footer "$MM_FOOTER" \
            --argjson fields "$fields_json" \
            '{
              channel_id: $channel_id,
              message: "",
              props: {
                attachments: [
                  ({
                    fallback: (if $title != "" then $title + ": " + $text else $text end),
                    color: $color,
                    text: $text,
                    footer: $footer
                  }
                  + (if $title != "" then {title: $title, title_link: $link} else {} end)
                  + (if ($fields | length) > 0 then {fields: $fields} else {} end))
                ]
              }
            }' \
            | curl -sS --fail-with-body --max-time 20 -X POST "$MM_URL/api/v4/posts" \
                -H "Authorization: Bearer $MM_TOKEN" -H "Content-Type: application/json" --data @- >/dev/null
        }
        post || echo "::warning title=Mattermost::Benachrichtigung konnte nicht gesendet werden"
