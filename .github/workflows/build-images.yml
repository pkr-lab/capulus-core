name: Build Workload Images

# Builds/pushes the three custom-built workload images (pacman, carplay-api,
# n8n) to GHCR whenever their build context changes on main. Replaces the
# previous manual `argo submit --from workflowtemplate/kaniko-build-push`
# step — see argocd/apps/tech/pacman/README.md#image-bauen.
#
# On pull requests the same build runs WITHOUT pushing (Dockerfile/Go-Code
# muss vor dem Merge bauen; ein kaputter Renovate-Bump fiel sonst erst nach dem
# Merge im Image-Build auf). Kein Required-Check: der Pfadfilter unten laesst den
# Workflow bei PRs ohne Image-Aenderung gar nicht erst laufen.
#
# Nach dem Push oeffnet der Lauf einen PR, der `image.tag` in der values.yaml der App auf
# den neuen Tag setzt (scripts/bump-image-tag.py, Branch bump/<app>-image). Es wird nichts
# direkt auf main committet: der PR laeuft durch die Pflicht-Checks und wird von Hand gemergt
# (Merge = Rollout in TECH). Braucht ein PAT (PROMOTE_TOKEN, ersatzweise RENOVATE_TOKEN), weil
# PRs mit dem Standard-GITHUB_TOKEN keine CI ausloesen; ohne PAT bleibt es beim Hinweis im
# Job-Summary und der Tag wird von Hand eingetragen. Details: f0060-build-images.md
on:
  push:
    branches: [main]
    paths:
      - "argocd/apps/tech/pacman/Dockerfile"
      - "argocd/apps/tech/pacman/server/**"
      - "argocd/apps/tech/pacman/src/**"
      - "argocd/apps/tech/pacman/.dockerignore"
      - "argocd/apps/tech/carplay-api/Dockerfile"
      - "argocd/apps/tech/carplay-api/src/**"
      - "argocd/apps/tech/carplay-api/.dockerignore"
      - "argocd/apps/tech/n8n/image/Dockerfile"
  pull_request:
    branches: [main]
    paths:
      - "argocd/apps/tech/pacman/Dockerfile"
      - "argocd/apps/tech/pacman/server/**"
      - "argocd/apps/tech/pacman/src/**"
      - "argocd/apps/tech/pacman/.dockerignore"
      - "argocd/apps/tech/carplay-api/Dockerfile"
      - "argocd/apps/tech/carplay-api/src/**"
      - "argocd/apps/tech/carplay-api/.dockerignore"
      - "argocd/apps/tech/n8n/image/Dockerfile"
  workflow_dispatch:
    inputs:
      app:
        description: "App neu bauen (all = alle drei, z.B. nach einem reinen Base-Image-Update ohne Dateiänderung)"
        type: choice
        options: [all, pacman, carplay-api, n8n]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  # Push auf main: nie abbrechen (ein halb gepushtes Image waere schlimmer).
  # PR: ein neuer Push macht den alten Probebuild ueberfluessig.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: pacman
            path: argocd/apps/tech/pacman
            values: argocd/apps/tech/pacman/values.yaml
            dockerfile: argocd/apps/tech/pacman/Dockerfile
            image: ghcr.io/pkr-lab/pacman
          - app: carplay-api
            path: argocd/apps/tech/carplay-api
            values: argocd/apps/tech/carplay-api/values.yaml
            dockerfile: argocd/apps/tech/carplay-api/Dockerfile
            image: ghcr.io/pkr-lab/carplay-api
          - app: n8n
            path: argocd/apps/tech/n8n/image
            values: argocd/apps/tech/n8n/values.yaml
            dockerfile: argocd/apps/tech/n8n/image/Dockerfile
            image: ghcr.io/pkr-lab/n8n-custom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Per-app gate: the workflow-level `paths` filter above only decides
      # whether the run happens at all, not which of the 3 matrix apps
      # actually changed - without this, editing just pacman's Dockerfile
      # would rebuild carplay-api and n8n too.
      - name: Decide whether to build this app
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH_APP: ${{ github.event.inputs.app }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR-Checkout ist der Merge-Commit; Diff gegen den Base-Stand zeigt
            # genau die Aenderungen des PRs.
            if git diff --name-only "$PR_BASE" HEAD -- "${{ matrix.path }}" | grep -q .; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_APP" = "all" ] || [ "$DISPATCH_APP" = "${{ matrix.app }}" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" -- "${{ matrix.path }}" | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tag
        if: steps.gate.outputs.build == 'true'
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.image }}:${{ steps.tag.outputs.tag }}

      - name: Report new tag
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.app }}: neues Image gepusht"
            echo
            echo '```'
            echo "${{ matrix.image }}:${{ steps.tag.outputs.tag }}"
            echo '```'
            echo
            echo "Ein PR setzt \`image.tag\` in \`${{ matrix.values }}\` automatisch (Branch \`bump/${{ matrix.app }}-image\`)."
            echo "Fehlt das PAT (PROMOTE_TOKEN/RENOVATE_TOKEN), den Tag von Hand eintragen."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install PyYAML
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request'
        run: pip install --disable-pip-version-check pyyaml

      - name: Open image.tag bump PR
        if: steps.gate.outputs.build == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}
          APP: ${{ matrix.app }}
          VALUES: ${{ matrix.values }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Kein PAT::PROMOTE_TOKEN/RENOVATE_TOKEN fehlt - image.tag-PR uebersprungen, Tag von Hand eintragen."
            exit 0
          fi
          git fetch -q origin main
          branch="bump/${APP}-image"
          git checkout -q -B "$branch" origin/main
          set +e
          change=$(python3 scripts/bump-image-tag.py "$VALUES" "$TAG")
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "image.tag steht schon auf $TAG - nichts zu tun."
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          git add -- "$VALUES"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore($APP): image.tag auf $TAG ($change)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            gh label create image-bump --color 5319e7 --description "Neuer Image-Tag nach Build" 2>/dev/null || true
            gh pr create --base main --head "$branch" --label image-bump \
              --title "chore($APP): image.tag auf $TAG" \
              --body "Neues Image \`$IMAGE:$TAG\` wurde gebaut und gepusht ($RUN_URL). Der PR setzt \`image.tag\` in \`$VALUES\` ($change). **Merge = Rollout in TECH.** Hinweis: GHCR-Packages sind anfangs privat - bei ImagePullBackOff die Sichtbarkeit pruefen (f0060-build-images.md)."
          else
            echo "PR fuer $branch ist offen - Branch wurde aktualisiert."
          fi
