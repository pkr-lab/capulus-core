name: CI

# Pflicht-Gate auf jedem PR gegen main (siehe docs/f-cicd-automatisierung/
# f0090-branch-schutz-main.md: die vier Jobs unten sind die "Required checks"
# des main-Rulesets) und Nachkontrolle auf jedem Push nach main.
#
# Zusaetzlich als wiederverwendbarer Workflow (`workflow_call`): promote-entw.yml
# ruft ihn mit `ref: entw` auf, um den Branch `entw` mit denselben Pruefungen
# freizugeben, bevor ein PR nach main entsteht (f0080-entw-promotion.md).
#
# Historie: `make lint` existierte lange nur lokal, ein kaputtes Manifest fiel
# erst beim ArgoCD-Sync gegen den Live-Cluster auf (docs/4-planung/
# 40080-multi-cluster-entw-prod-tech.md, Baustein 6, f0070-ci-lint.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git-Ref, der geprueft wird (Standard: der ausloesende Ref)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # `inputs.ref` in der Gruppe: der Aufruf aus promote-entw.yml (Branch entw)
  # darf einen laufenden CI-Lauf auf main weder abbrechen noch blockieren.
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: make lint (yamllint, ansible-lint, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint + ansible-lint
        run: pip install --disable-pip-version-check yamllint ansible-lint

      - name: Install Ansible Galaxy collections (ansible-lint braucht sie zur Modul-Aufloesung)
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: make lint
        run: make lint

  manifest-validate:
    name: helm template | kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL --retry 3 https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Render + validate charts, plain manifests and bootstrap
        run: |
          set -eu

          # Schemas: Kubernetes-Kernressourcen (default) plus der CRDs-catalog
          # (datreeio) fuer ArgoCD (Application/ApplicationSet/AppProject),
          # SealedSecret, cert-manager, VictoriaMetrics usw. Ohne ihn wuerden
          # diese Typen mit -ignore-missing-schemas nur uebersprungen, nicht
          # geprueft - genau die ApplicationSet-/AppProject-Fehler aus
          # b0020-argocd-projects.md fielen dann weiterhin erst im Cluster auf.
          # -ignore-missing-schemas bleibt fuer CRDs, die auch der Katalog
          # nicht kennt. Die Schemas werden bei jedem Lauf per HTTPS geladen,
          # daher ein Retry gegen kurze Netzwerkfehler (connection reset).
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          validate() {
            for attempt in 1 2 3; do
              if out=$(kubeconform -strict -ignore-missing-schemas -summary \
                  -schema-location default -schema-location "$catalog" "$@" 2>&1); then
                echo "$out"; return 0
              fi
              # Nur bei Netzwerkfehlern wiederholen, echte Validierungsfehler sofort melden.
              if echo "$out" | grep -qE 'connection reset|connection refused|no such host|i/o timeout|unexpected EOF|TLS handshake|failed downloading'; then
                echo "kubeconform: Schema-Download fehlgeschlagen (Versuch $attempt/3), neuer Versuch ..."
                sleep $((attempt * 5))
              else
                echo "$out"; return 1
              fi
            done
            echo "$out"; return 1
          }

          fail=0

          # 1) Helm-Charts: rendern (helm template), dann validieren.
          for chart in argocd/apps/*/*/; do
            [ -f "${chart}Chart.yaml" ] || continue
            echo "==> chart $chart"
            if grep -q '^dependencies:' "${chart}Chart.yaml"; then
              helm dependency build "$chart" >/dev/null 2>&1 || helm dependency update "$chart" >/dev/null 2>&1
            fi
            # Datei statt Pipe/stdin: validate() wiederholt bei Netzwerkfehlern,
            # und stdin waere beim zweiten Versuch schon leer gelesen. Ein
            # fehlgeschlagenes `helm template` bricht den Chart ausserdem laut ab,
            # statt seine Fehlermeldung als "0 Ressourcen" durchzuwinken.
            rendered="$(mktemp --suffix=.yaml)"
            if ! helm template "$chart" > "$rendered" 2>"$rendered.err"; then
              echo "helm template fehlgeschlagen:"; cat "$rendered.err"; fail=1; continue
            fi
            validate "$rendered" || fail=1
          done

          # 2) Reine Manifest-Ordner (kein Chart.yaml, direkt von ArgoCD angewendet).
          for dir in argocd/apps/*/*/; do
            [ -f "${dir}Chart.yaml" ] && continue
            echo "==> manifests $dir"
            validate "$dir" || fail=1
          done

          # 3) Bootstrap: Hub-/PROD-ApplicationSets, AppProjects, Migrations-Jobs.
          for dir in argocd/bootstrap argocd/bootstrap-prod; do
            [ -d "$dir" ] || continue
            echo "==> bootstrap $dir"
            validate "$dir" || fail=1
          done

          exit $fail

  go-check:
    name: go build, vet, test, tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      # Module werden per `git ls-files` gefunden statt fest verdrahtet: so
      # greift der Job auch auf dem Branch `entw` (anderes Ordner-Layout) und
      # fuer kuenftige Go-Dienste ohne Aenderung am Workflow.
      # Anlass: Ein Renovate-Merge (geoip2-golang v1 -> v2) hat pacmans go.mod
      # kaputt gemacht, ohne dass irgendetwas den Go-Code vor dem Image-Build
      # uebersetzt hat.
      - name: Build, vet, test and tidy-check every Go module
        run: |
          set -eu
          mods=$(git ls-files -- 'go.mod' '*/go.mod')
          if [ -z "$mods" ]; then
            echo "Keine Go-Module gefunden - nichts zu pruefen."
            exit 0
          fi
          fail=0
          for mod in $mods; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (
              cd "$dir"
              # go.mod/go.sum muessen mit `go mod tidy` uebereinstimmen (faengt
              # halb aktualisierte Abhaengigkeiten, wie beim kaputten v2-Bump).
              go mod tidy -diff
              go build -o /dev/null ./...
              go vet ./...
              go test ./...
            ) || fail=1
          done
          exit $fail

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action listet bei PRs die Commits ueber die API
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
