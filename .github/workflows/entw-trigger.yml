name: Trigger ENTW promotion

on:
  push:
    branches: [entw]

permissions:
  actions: write
  contents: read

concurrency:
  group: entw-trigger
  cancel-in-progress: true

jobs:
  trigger:
    name: promote-entw.yml starten
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch promote-entw.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run promote-entw.yml --repo "$GITHUB_REPOSITORY" --ref main
