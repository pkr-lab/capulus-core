name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["**"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitHub -> GitLab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_REMOTE: ${{ secrets.GITLAB_MIRROR_REMOTE }}
          GITLAB_USER: ${{ secrets.GITLAB_MIRROR_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror.git
          cd mirror.git
          git push --mirror "https://${GITLAB_USER}:${GITLAB_TOKEN}@${GITLAB_REMOTE}"
