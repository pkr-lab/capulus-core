name: Promote chain (ENTW -> TECH -> PROD)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Welche Stufe? (entw = ENTW -> erstes Ziel, tech = TECH -> PROD)"
        type: choice
        options: [all, entw, tech]
        default: all
      plan_only:
        description: "Nur planen: keine Branches, PRs oder Issues"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote-chain
  cancel-in-progress: false

jobs:
  chain:
    name: Gates pruefen, PRs oeffnen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      PROMOTE_PAT: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}
      ARGOCD_ENTW_TOKEN: ${{ secrets.ARGOCD_ENTW_TOKEN }}
      ARGOCD_HUB_TOKEN: ${{ secrets.ARGOCD_HUB_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
    steps:
      - name: Konfiguration pruefen
        id: cfg
        run: |
          missing=""
          [ -n "$ARGOCD_ENTW_TOKEN" ] || missing="$missing ARGOCD_ENTW_TOKEN"
          [ -n "$ARGOCD_HUB_TOKEN" ] || missing="$missing ARGOCD_HUB_TOKEN"
          [ -n "$TS_OAUTH_CLIENT_ID" ] || missing="$missing TS_OAUTH_CLIENT_ID"
          [ -n "$TS_AUDIENCE" ] || missing="$missing TS_AUDIENCE"
          [ -n "$PROMOTE_PAT" ] || missing="$missing PROMOTE_TOKEN/RENOVATE_TOKEN"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Promotion-Kette inaktiv::Es fehlen die Repo-Secrets:$missing (https://github.com/pkr-lab/pkr-lab-docs/blob/main/capulus-core/f-cicd-automatisierung/f00b0-promotion-chain.md#einrichtung)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.configured == 'true'
        with:
          fetch-depth: 0
          token: ${{ env.PROMOTE_PAT }}

      - name: Install PyYAML
        if: steps.cfg.outputs.configured == 'true'
        run: pip install --disable-pip-version-check pyyaml

      - name: Connect runner to tailnet
        if: steps.cfg.outputs.configured == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: 1.104.2

      - name: Verify tailnet connection
        if: steps.cfg.outputs.configured == 'true'
        run: |
          state=$(tailscale status --json | jq -r '.BackendState')
          if [ "$state" != "Running" ]; then
            echo "::error title=Tailscale nicht verbunden::BackendState=$state (erwartet: Running). OAuth-Client pruefen (Scope auth_keys:write, Tag tag:ci) und ob tag:ci in tagOwners steht."
            exit 1
          fi

      - name: Resolve ArgoCD hosts
        if: steps.cfg.outputs.configured == 'true'
        run: |
          printf '%s\n' "192.168.178.94 argocd.tech.homeserver" "192.168.178.100 argocd.dev.homeserver" | sudo tee -a /etc/hosts >/dev/null
          cp pki/homeserver-root-ca.pem "$RUNNER_TEMP/argocd-ca.pem"

      - name: Run promotion chain
        if: steps.cfg.outputs.configured == 'true'
        env:
          ARGOCD_CA_FILE: ${{ runner.temp }}/argocd-ca.pem
          GH_TOKEN: ${{ env.PROMOTE_PAT }}
          AUTOMERGE_TECH: ${{ vars.PROMOTE_AUTOMERGE_TECH }}
          STAGE: ${{ github.event.inputs.stage || 'all' }}
          PLAN_ONLY: ${{ github.event.inputs.plan_only }}
          ENTW_URL: ${{ vars.ARGOCD_ENTW_URL || 'https://argocd.dev.homeserver' }}
          HUB_URL: ${{ vars.ARGOCD_HUB_URL || 'https://argocd.tech.homeserver' }}
        run: |
          set -eu
          flags=""
          [ "$PLAN_ONLY" = "true" ] && flags="--plan-only"
          # shellcheck disable=SC2086
          python3 scripts/promote-chain.py --stage "$STAGE" --argocd "entw=$ENTW_URL" --argocd "hub=$HUB_URL" $flags
