name: Promote ENTW to main

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: promote-entw
  cancel-in-progress: false

jobs:
  detect:
    name: neue entw-Commits?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      head: ${{ steps.detect.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/promote-entw.sh detect

  ci:
    name: CI auf entw
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.detect.outputs.head }}

  ci-failed:
    name: Issue bei rotem CI
    needs: [detect, ci]
    if: always() && needs.ci.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_HEAD: ${{ needs.detect.outputs.head }}
        run: bash scripts/promote-entw.sh report-ci-failure

  promote:
    name: PR nach main
    needs: [detect, ci]
    if: needs.detect.outputs.changed == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}

      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}
          PROMOTE_HEAD: ${{ needs.detect.outputs.head }}
        run: bash scripts/promote-entw.sh promote
