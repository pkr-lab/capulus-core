name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: pkr-lab/.github/.github/workflows/release.yml@c2aab65b86ebe3710b2947b100e49a7a33d9455e # v1.2.0
    with:
      changelog: false
