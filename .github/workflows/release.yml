name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: pkr-lab/.github/.github/workflows/release.yml@c2aab65b86ebe3710b2947b100e49a7a33d9455e # v1.2.0
    with:
      changelog: false

  notify:
    name: Mattermost
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release-Tag ermitteln
        id: tag
        run: echo "name=$(git tag --points-at HEAD | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Mattermost
        if: steps.tag.outputs.name != ''
        uses: ./.github/actions/mattermost-notify
        with:
          channel: deployments
          token: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          title: "\U0001F4E6 Release ${{ steps.tag.outputs.name }}"
          status: success
          link: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}
          message: "Neue Version veroeffentlicht."
