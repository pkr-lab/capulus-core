name: Sync main into ENTW

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-entw
  cancel-in-progress: false

jobs:
  sync:
    name: main -> entw
    if: vars.ENTW_SYNC_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.RENOVATE_TOKEN }}
        run: bash scripts/sync-entw.sh
