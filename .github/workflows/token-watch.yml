name: Token watch

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: token-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Ablaufdaten pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install --disable-pip-version-check pyyaml

      - name: Register pruefen und Ablaufdaten melden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: python3 scripts/token-watch.py

      - name: Mattermost bei Fehler
        if: failure()
        uses: ./.github/actions/mattermost-notify
        with:
          channel: sicherheit
          token: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          title: "\U0001F511 Token-Ablauf in 7 Tagen oder weniger"
          status: failure
          message: "Der Token-Watch ist rot, Details stehen in den offenen Token-Issues."
