---
# ============================================================
# Configuration knobs for the home-server playbook.
# Every value with a "CHANGE" comment must be set before running.
# ============================================================

# ---- Server identity ---------------------------------------
hostname: homeserver
timezone: Europe/Berlin                # CHANGE: your timezone

# ---- Upgrade strategy --------------------------------------
# When true (default), every Ansible run keeps the OS and all installed
# components on the latest available stable version, and enables
# unattended-upgrades for background security patches between runs.
# Set to false to pin everything for reproducibility/CI.
auto_upgrade: true

# Reboot the server at the end of the `common` role if a kernel/libc update
# placed `/var/run/reboot-required` on disk.
auto_reboot_if_required: true

# ---- k3s ---------------------------------------------------
# When `k3s_version` is empty, the role follows `k3s_channel` (always latest
# release in that channel). Set to a concrete version like "v1.30.2+k3s1" to pin.
# See https://github.com/k3s-io/k3s/releases and
# https://update.k3s.io/v1-release/channels for available channels.
k3s_version: ""
k3s_channel: stable
k3s_server_ip: "{{ ansible_default_ipv4.address }}"
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# ---- k3s Agent (Worker Node) --------------------------------
# k3s_server_host: Ansible-Inventory-Name des Control-Plane-Servers.
# Wird in der k3s_agent-Rolle verwendet, um per delegate_to den Join-Token
# zu lesen und den Server-Endpoint dynamisch zu ermitteln.
k3s_server_host: homeserver
# Kubernetes-Node-Name des Worker-Nodes (muss im Cluster eindeutig sein).
k3s_agent_hostname: worker-0

# ---- Helm --------------------------------------------------
# Empty = always install the latest Helm 3 release. Pin to e.g. "v3.16.0" if needed.
helm_version: ""

# ---- ArgoCD ------------------------------------------------
# Argo Helm chart version. Empty + auto_upgrade=true ⇒ chart is upgraded to
# latest on every run. Pin to a concrete chart version (e.g. "7.3.11") for
# reproducibility — see https://artifacthub.io/packages/helm/argo/argo-cd
argocd_version: ""
argocd_namespace: argocd
argocd_server_insecure: true
# Git repo ArgoCD pulls from. Must be reachable by argocd-repo-server pod.
argocd_repo_url: "https://github.com/pkr-lab/capulus-core.git"
# Branch/tag/SHA ArgoCD tracks. Pinned to `main` (the GitOps branch) instead of
# the ambiguous `HEAD` for reproducible bootstraps; set a tag or SHA to freeze.
argocd_repo_revision: main

# ---- Tailscale ---------------------------------------------
# Generate the auth key at https://login.tailscale.com/admin/settings/keys
# and ALWAYS store it vault-encrypted, e.g.:
#   ansible-vault encrypt_string 'tskey-auth-...' --name 'tailscale_auth_key'
# then paste the resulting `!vault |` block over the value below.
tailscale_auth_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          64623636653861316663633961333439383537306661346461663562313538383465313663626530
          3835636336646435613461356636313734393862343134320a303363343534343062383834326361
          62313965303931626134613639343531303961316639323433363534646363336232663733396439
          3661313164363635610a396338343537363537366565353461366631313766353332343932323661
          39343836356531336166643838333763373836613237336262333936333263366133323035663533
          36383162386565343861653032306638336136313333656539313138313138646261343532366265
          353739393462373065373337663336633931
tailscale_hostname: "{{ hostname }}"

# ---- Local network ----------------------------------------
local_subnet: "192.168.178.0/24"

# ---- Pi-hole (network-wide ad blocking) --------------------
# Cluster-App: argocd/apps/platform/pihole (Helm-Chart). dnsmasq (Rolle oben)
# forwardet alle nicht-*.homeserver-Anfragen an diesen NodePort statt
# direkt an die Fritz!Box — muss mit dnsService.nodePort in
# argocd/apps/platform/pihole/values.yaml übereinstimmen.
pihole_dns_nodeport: 30053

# ---- Semaphore UI -----------------------------------------
# Master Ansible-Vault password — same value you type when running
# `ansible-playbook --ask-vault-pass`. Semaphore uses this so playbooks
# triggered from the UI can decrypt vault-encrypted vars. To rotate:
#
#   ansible-vault encrypt_string 'YOUR_VAULT_PW' \
#     --name 'semaphore_vault_password'
#   then paste the resulting `!vault |` block over the value below.
semaphore_vault_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35346131356339656538326366323064356465663434383638373535646463316638333139613938
          6436346330346630386331313937626339613563333364630a343162326530393762363862353339
          38376335313130383036356266646337663164376234636438386638336366663763376330313332
          3635643637353930370a646565663731366364353566363766366130666535346635393864323937
          6433

# ---- Semaphore projects (auto-bootstrap) ------------------
# After Semaphore is reachable, the `semaphore_bootstrap` role calls the
# Semaphore REST API and idempotently creates two projects:
#
#   - home-server   (this repo, deployed against the home-server itself)
#   - worker-0   (dieses Repo, ansible/worker-0.yml,
#                    deployed to worker-0 at 192.168.178.95)
#
# To add a third project, copy/extend the `semaphore_projects` list from
# ansible/roles/semaphore_bootstrap/defaults/main.yml here. The role only
# creates resources that don't already exist — to change an existing one,
# delete it in the UI and re-run `make semaphore-bootstrap`.

semaphore_projects:
  - name: home-server
    description: "Deploy / re-provision the home-server itself."
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: homeservers
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [homeservers]
          homeserver ansible_host=192.168.178.94
    templates:
      - name: "Deploy Home Server"
        playbook: ansible/site.yml
        inventory: homeservers
        environment: default-env
        vault_key: vault-password
        description: "Run the full site.yml against the home-server (recursive)."
    schedules:
      - name: "Daily 06:00"
        template: "Deploy Home Server"
        cron: "0 6 * * *"
        active: true

  - name: worker-0
    description: "Deploy k3s-Agent + Watchdogs auf worker-0 (192.168.178.95)."
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: worker_0_only
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [k3s_agents]
          worker-0 ansible_host=192.168.178.95

          [homeservers]
          homeserver ansible_host=192.168.178.94
    templates:
      - name: "Deploy worker-0"
        playbook: ansible/worker-0.yml
        inventory: worker_0_only
        environment: default-env
        vault_key: vault-password
        description: "k3s-Agent, thermal_watchdog, resource_watchdog auf worker-0."
    schedules:
      - name: "Daily 06:00"
        template: "Deploy worker-0"
        cron: "0 6 * * *"
        active: true

  - name: worker-1
    description: "Deploy k3s-Agent + Watchdogs auf worker-1 (192.168.178.96)."
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: worker_1_only
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [k3s_agents]
          worker-1 ansible_host=192.168.178.96

          [homeservers]
          homeserver ansible_host=192.168.178.94
    templates:
      - name: "Deploy worker-1"
        playbook: ansible/worker-1.yml
        inventory: worker_1_only
        environment: default-env
        vault_key: vault-password
        description: "k3s-Agent, thermal_watchdog, resource_watchdog auf worker-1."
    schedules:
      - name: "Daily 06:00"
        template: "Deploy worker-1"
        cron: "0 6 * * *"
        active: true

  - name: alarm-kiosks
    description: >-
      Alarmmonitor-Kiosks (Raspberry Pi, ALAMOS AMweb) einrichten — siehe
      docs/20-alamos-apager.md.
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: raspberry_pis
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [raspberry_pis]
          # Pi-Hostnamen hier eintragen, sobald vorhanden (Stationsname muss
          # zu einem Key im SealedSecret alamos-apager-stations passen):
          # geraetehaus ansible_host=192.168.178.110 alamos_kiosk_station=geraetehaus
    templates:
      - name: "Deploy Alarmmonitor Kiosks"
        playbook: ansible/alarm-kiosks.yml
        inventory: raspberry_pis
        environment: default-env
        vault_key: vault-password
        description: "Chromium-Kiosk + Heartbeat-Timer auf den Alarmmonitor-Pis."
    # Bewusst kein Schedule: anders als bei home-server/worker-0 soll ein
    # Re-Run hier nur manuell per Knopfdruck laufen, nicht automatisch nachts
    # — siehe docs/20-alamos-apager.md.

  - name: xibo-displays
    description: >-
      xibosignage-Displays (Raspberry Pi 3 B+, Bilder-Slideshow + Tailscale)
      einrichten — siehe docs/44-xibosignage.md.
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: xibo_displays
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [xibo_displays]
          # Pi-Hostnamen hier eintragen, sobald vorhanden:
          # wohnzimmer ansible_host=192.168.178.120
    templates:
      - name: "Deploy xibosignage Displays"
        playbook: ansible/xibo-kiosks.yml
        inventory: xibo_displays
        environment: default-env
        vault_key: vault-password
        description: "Tailscale + Chromium-Slideshow-Kiosk auf den xibosignage-Displays."
    # Bewusst kein Schedule, gleiches Prinzip wie bei alarm-kiosks: ein
    # Re-Run soll hier nur manuell per Knopfdruck laufen.

  - name: banana-pi-kiosks
    description: >-
      Banana-Pi-Alarmmonitore (Armbian, ALAMOS AMweb + lokaler
      Server-Fallback) einrichten — siehe docs/45-vereinsheim-alarmmonitor.md.
      ACHTUNG: funktioniert per Semaphore NUR solange der Pi noch am LAN
      haengt (Phase 1) — Semaphore laeuft selbst als Pod im Cluster und hat
      wie jeder Pod keinen Netzwerkpfad zu Tailscale-Peers. Nach dem Umzug
      an den Tailscale-only-Standort (Phase 2) nur noch per `make
      banana-pi-kiosks` von einer im Tailnet angemeldeten Maschine aus
      re-provisionieren, nicht mehr per Semaphore-UI.
    repository:
      name: home-server-git
      url: "{{ argocd_repo_url }}"
      branch: main
    environments:
      - "{{ semaphore_default_environment }}"
    inventories:
      - name: banana_pis
        type: static
        ssh_key: semaphore-ssh-key
        content: |
          [banana_pis]
          # ansible_host gilt nur fuer Phase 1 (Pi noch am LAN) — siehe
          # docs/45-vereinsheim-alarmmonitor.md.
          vereinsheim-alarmmonitor ansible_host=100.123.214.4 ansible_user=pela banana_pi_kiosk_user=pela banana_pi_kiosk_station=1002011_Fahrzeughalle
    templates:
      - name: "Deploy Banana-Pi Alarmmonitore"
        playbook: ansible/banana-pi-kiosks.yml
        inventory: banana_pis
        environment: default-env
        vault_key: vault-password
        description: "Chromium-Kiosk + Server-Fallback + node_exporter + Watchdogs auf den Banana-Pi-Alarmmonitoren."
    # Bewusst kein Schedule, gleiches Prinzip wie bei alarm-kiosks: ein
    # Re-Run soll hier nur manuell per Knopfdruck laufen.

# ---- Scanner / Paperless Ingestion ------------------------
# Fujitsu USB-Scanner direkt am Home-Server; scanbd hört auf den
# Hardware-Button und schreibt Scans als PDF in den SMB-Share von
# worker-0, von wo Paperless-NGX sie automatisch einliest.
# Vollständige Migrations-Checkliste: docs/10-scanner.md.
#
# USB-IDs auf dem Host ermitteln (`lsusb | grep -i fujitsu`):
scanner_usb_vendor_id: "04c5"
scanner_usb_product_id: "132b"
#
# Das SMB-Passwort MUSS vault-encrypted sein. Hinweis in docs/10-scanner.md.
#   ansible-vault encrypt_string 'DEIN_SMB_PASSWORT' \
#     --name 'scanner_smb_password'
scanner_consume_mount_type: "cifs"
scanner_smb_share: "//192.168.178.95/personal_folder/paperless/consume"
scanner_smb_username: "pkretzer"
scanner_smb_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          65623261646538323630323466633031663134333430613862666532623333613636336531366139
          3532663330613862383963333766653037366136333366610a366565313636363230323335636365
          31653863353437633462656237356332666233326465386637363235343337323733346364366235
          3233363763343830650a613038653936323431313035656165323733613939313137383563396662
