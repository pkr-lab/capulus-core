# ---- Drucker (CUPS) ----------------------------------------
# Samsung Xpress M2026 per USB direkt am Homeserver; cups_print_server
# gibt ihn per IPP/AirPrint im LAN + Tailnet frei. Device-URI und PPD
# erst nach dem ersten Rollen-Lauf bekannt — siehe docs/38-printer.md.
#
# Device-URI ermittelt per `lpinfo -v` auf dem Homeserver — meldet sich
# als generische "M2020 Series" (viele günstige Samsung-SPL2-Modelle
# M2020/M2021/M2022/M2026 teilen sich denselben USB-Controller-Chip).
cups_print_server_device_uri: "usb://Samsung/M2020%20Series?serial=08HVB8GM1B0870W"
#
# Weder printer-driver-splix noch hplip unterstützen die M2020-Serie
# (spricht ein neueres "QPDL"-Protokoll) — daher der inoffizielle,
# quellcode-geprüfte QPDL-Treiber-Build (Details + Review-Notizen:
# docs/38-printer.md).
cups_print_server_build_qpdl_driver: true
# Passende PPD nach dem Build (bestätigt per lpinfo -m auf homeserver):
cups_print_server_ppd: "samsung/m2020.ppd"

# Samsung ML-1630W: hängt NICHT am Homeserver, sondern per USB an einer
# FritzBox im Mesh/Repeater-Modus, die ihn als Netzwerkdrucker über
# Raw-TCP Port 9100 teilt. FritzBox und Homeserver sind im selben
# Hauptnetz (keine Gast-WLAN-Isolation) — direkter socket://-Zugriff
# reicht, kein USB-Passthrough nötig. Spricht natives SPL2, das
# printer-driver-splix (bereits installiert) regulär abdeckt — kein
# QPDL-Build nötig. ppd erst nach dem ersten Rollen-Lauf einmalig per
# lpinfo -m auf dem Homeserver ermitteln (Debug-Ausgabe der Rolle zeigt
# passende Treffer) und hier eintragen. Siehe docs/38-printer.md.
cups_print_server_extra_queues:
  - name: "Samsung_ML-1630"
    device_uri: "socket://192.168.178.57:9100"
    ppd: "drv:///splix-samsung.drv/ml1630.ppd"
    description: "Samsung ML-1630 (WiFi, homeserver)"
    location: "1.OG Repeater"
    media_size: "A4"
    set_default: false

# ---- worker-0 (192.168.178.95) --------------------------
# sudo-Passwort für worker-0 vault-verschlüsselt speichern:
#   ansible-vault encrypt_string 'DEIN_SUDO_PW' --name 'vault_worker-0_become_password'
# vault_worker-0_become_password: !vault | ...

# ---- worker-1 (192.168.178.96) --------------------------
# sudo-Passwort für worker-1 vault-verschlüsselt speichern und das
# Ergebnis als ansible/host_vars/worker-1/vault.yml ablegen
# (siehe ansible/host_vars/worker-0/vault.yml als Vorlage):
#   ansible-vault encrypt_string 'DEIN_SUDO_PW' --name 'vault_worker_1_become_password'

# ---- Optional: configure a static IP via Netplan ----------
# Set to true to have Ansible deploy /etc/netplan/99-static.yaml.
# WARNING: the SSH session will briefly drop while the new IP is applied.
# Make sure `ansible_host` in the inventory matches `network_static_ip`
# (or update it after the first run).
network_configure_static_ip: false
network_interface: "eno1"              # CHANGE: run `ip link show` on the server
network_static_ip: "192.168.178.94"
network_prefix_length: 24              # 24 = /24 = 255.255.255.0
network_gateway: "192.168.178.1"
network_dns:
  - "1.1.1.1"
  - "8.8.8.8"
