---
# ============================================================
# homeserver — host-spezifische Variablen
# ============================================================

# ---- libvirt_host: PROD-VM (docs/4-planung/40080 Baustein 5) ----------
# libvirt_host_enabled/libvirt_host_configure_bridge kommen aus
# group_vars/all.yml (dort aktuell: enabled=true, configure_bridge=false)
# - diese VM-Liste ist der host-spezifische Teil, der vorher in den
# Rollen-Defaults lag und jetzt hierher gehoert, weil worker-1 (ENTW)
# eine eigene, andere Liste braucht.
# Bridge-Parameter explizit gepinnt statt aus den Default-Route-Facts: bei
# einem Re-Run nach Teil-Setup liefern die Facts br0 bzw. eine andere IP
# (Vorfall worker-1, 2026-09-19, siehe docs/4-planung/40080).
libvirt_host_bridge_interface: "{{ network_interface }}"
libvirt_host_static_ip: "{{ network_static_ip }}"
libvirt_host_vms:
  - name: prod-vm
    vcpus: 6
    memory_mb: 24576 # 24 GiB, siehe Baustein 5 Sizing-Begruendung
    disk_gb: 100
    ip: "192.168.178.99" # .98 ist bereits infotafel/Xibo, siehe inventory/hosts.yml
    prefix_length: "{{ network_prefix_length }}"
    gateway: "{{ network_gateway }}"
    # CHANGE: eigene, im LAN eindeutige MAC waehlen (z. B. per
    # "openssl rand -hex 5 | sed 's/\(..\)/\1:/g; s/.$//'" unter dem
    # QEMU/KVM-Praefix 52:54:00), falls diese kollidiert.
    mac: "52:54:00:00:00:99"
