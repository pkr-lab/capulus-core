---
ansible_become_password: "{{ vault_worker_1_become_password }}"
hostname: worker-1
k3s_agent_hostname: worker-1

wake_on_lan_mac_address: "b8:97:5a:ea:a4:fa"

# worker-1 bekommt (anders als worker-0) per DHCPv6 vom Fritz!Box-Router
# zuverlaessig DNS -- der Fallback ist hier nur zusaetzliche Absicherung
# (Konsistenz mit worker-0), nicht Voraussetzung fuer funktionierendes apt.
# Siehe worker_apt_update_dns_fallback_enabled in
# ansible/roles/worker_apt_update/defaults/main.yml und
# docs/2-betrieb-hardware/20030-nightly-worker-update.md.
worker_apt_update_dns_fallback_enabled: true
worker_apt_update_dns_fallback_interface: "enp2s0"  # anderer NIC-Name als worker-0 (eno1) -- mit `ip -br addr` pruefen

# ---- Tailscale ------------------------------------------------
# worker-1 ist reiner Tailnet-Client, kein Subnet-Router (das übernimmt
# bereits der homeserver für das ganze LAN) -- deshalb KEIN
# --advertise-routes.
tailscale_advertise_routes: ""

# Braucht einen EIGENEN Auth-Key -- der globale Default-Key in
# group_vars/all.yml ist bereits vom homeserver verbraucht, und der fuer
# worker-0 generierte Key ist (Single-Use-Policy) ebenfalls nicht
# wiederverwendbar. Einmalig einrichten (siehe host_vars/worker-0/vars.yml
# fuer den identischen Ablauf inkl. "Disable key expiry"):
#   1. https://login.tailscale.com/admin/keys -> Generate auth key
#   2. ansible-vault encrypt_string 'tskey-auth-...' --name 'tailscale_auth_key'
#      Ergebnis hier einsetzen oder nach
#      ansible/host_vars/worker-1/vault.yml verschieben.
# tailscale_auth_key: !vault |
#           $ANSIBLE_VAULT;1.1;AES256
#           ...
