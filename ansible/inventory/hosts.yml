---
# ============================================================
# Inventory
# ============================================================
#
# `homeservers` runs the full k3s/ArgoCD/Semaphore stack.
# Targets under `semaphore_targets` get the Semaphore SSH public key
# pushed into authorized_keys so the UI can run playbooks against them.
# `homeservers` is also a member of `semaphore_targets` so Semaphore
# can deploy this very repo against the home-server itself (recursive
# "Deploy Home Server" template).
#
# `ugreen_nas` ist das UGREEN NAS (RAID1, NFS-Export für die "nas"-
# StorageClass, siehe docs/16-nas-storage.md). Kein Playbook läuft dagegen —
# UGOS ist eine eigene Firmware, RAID/NFS-Setup laeuft manuell ueber die
# Web-UI. Der Host steht hier nur zur Dokumentation/Referenz (DNS, spaetere
# Backup-Rolle auf einer extern angeschlossenen Platte).
# ============================================================

all:
  children:
    homeservers:
      hosts:
        homeserver:
          ansible_host: 192.168.178.94
          ansible_user: ubuntu
    k3s_agents:
      hosts:
        worker-0:
          ansible_host: 192.168.178.95
          ansible_user: ubuntu
        worker-1:
          ansible_host: 192.168.178.96
          ansible_user: ubuntu
    ugreen_nas:
      hosts:
        ugreen-nas:
          ansible_host: 192.168.178.97
    # Hosts hier eintragen, damit `make semaphore-targets` den Semaphore-
    # SSH-Pubkey in deren authorized_keys pusht. Raspberry-Pi-Alarmmonitore
    # (Gruppe `raspberry_pis` unten) UND xibosignage-Displays (Gruppe
    # `xibo_displays` unten) muessen hier mit aufgefuehrt werden, sobald
    # echte Hosts eingetragen sind — sonst schlaegt das jeweilige Playbook
    # mit "Permission denied (publickey)" fehl (siehe docs/08-semaphore.md).
    semaphore_targets:
      hosts:
        homeserver:
        worker-0:
        worker-1:

    # Raspberry-Pi-Alarmmonitore (ALAMOS AMweb-Kiosk), siehe
    # docs/20-alamos-apager.md und ansible/roles/alamos_kiosk.
    #
    # alamos_kiosk_station ist PFLICHT pro Host und muss zu einem Key im
    # SealedSecret alamos-apager-stations (argocd/apps/alamos-apager)
    # passen, z.B.:
    #   geraetehaus:
    #     ansible_host: 192.168.178.110
    #     ansible_user: pi
    #     alamos_kiosk_station: geraetehaus
    #   zentrale:
    #     ansible_host: 192.168.178.111
    #     ansible_user: pi
    #     alamos_kiosk_station: zentrale
    raspberry_pis:
      hosts: {}

    # xibosignage-Displays (Raspberry Pi 3 B+, Bilder-Slideshow ueber einen
    # NFS-gemounteten Ordner — kein echter Xibo-Player, siehe
    # docs/44-xibosignage.md und ansible/roles/xibo_kiosk). Eigene Gruppe statt
    # "raspberry_pis" oben, da diese Hosts keinen alamos_kiosk_station
    # brauchen und eine eigene Tailscale-/NFS-Konfiguration haben
    # (ansible/group_vars/xibo_displays.yml).
    #
    # Beispiel:
    #   wohnzimmer:
    #     ansible_host: 192.168.178.120
    #     ansible_user: pi
    xibo_displays:
      hosts: {}
