---
# ============================================================
# Inventory
# ============================================================
#
# `homeservers` runs the full k3s/ArgoCD/Semaphore stack.
# Targets under `semaphore_targets` get the Semaphore SSH public key
# pushed into authorized_keys so the UI can run playbooks against them.
# `homeservers` is also a member of `semaphore_targets` so Semaphore
# can deploy this very repo against the home-server itself (recursive
# "Deploy Home Server" template).
#
# `ugreen_nas` ist das UGREEN NAS (RAID1, NFS-Export für die "nas"-
# StorageClass, siehe docs/16-nas-storage.md). Kein Playbook läuft dagegen —
# UGOS ist eine eigene Firmware, RAID/NFS-Setup laeuft manuell ueber die
# Web-UI. Der Host steht hier nur zur Dokumentation/Referenz (DNS, spaetere
# Backup-Rolle auf einer extern angeschlossenen Platte).
# ============================================================

all:
  children:
    homeservers:
      hosts:
        homeserver:
          ansible_host: 192.168.178.94
          ansible_user: ubuntu
    k3s_agents:
      hosts:
        worker-0:
          ansible_host: 192.168.178.95
          ansible_user: ubuntu
        worker-1:
          ansible_host: 192.168.178.96
          ansible_user: ubuntu
    ugreen_nas:
      hosts:
        ugreen-nas:
          ansible_host: 192.168.178.97
    # Hosts hier eintragen, damit `make semaphore-targets` den Semaphore-
    # SSH-Pubkey in deren authorized_keys pusht. Raspberry-Pi-Alarmmonitore
    # (Gruppe `raspberry_pis` unten), xibosignage-Displays (Gruppe
    # `xibo_displays` unten) UND Banana-Pi-Alarmmonitore (Gruppe
    # `banana_pis` unten) muessen hier mit aufgefuehrt werden, sobald
    # echte Hosts eingetragen sind — sonst schlaegt das jeweilige Playbook
    # mit "Permission denied (publickey)" fehl (siehe docs/08-semaphore.md).
    semaphore_targets:
      hosts:
        homeserver:
        worker-0:
        worker-1:
        vereinsheim-alarmmonitor:

    # Raspberry-Pi-Alarmmonitore (ALAMOS AMweb-Kiosk), siehe
    # docs/20-alamos-apager.md und ansible/roles/alamos_kiosk.
    #
    # alamos_kiosk_station ist PFLICHT pro Host und muss zu einem Key im
    # SealedSecret alamos-apager-stations (argocd/apps/workloads/alamos-apager)
    # passen, z.B.:
    #   geraetehaus:
    #     ansible_host: 192.168.178.110
    #     ansible_user: pi
    #     alamos_kiosk_station: geraetehaus
    #   zentrale:
    #     ansible_host: 192.168.178.111
    #     ansible_user: pi
    #     alamos_kiosk_station: zentrale
    raspberry_pis:
      hosts: {}

    # xibosignage-Displays (Raspberry Pi 3 B+, Bilder-Slideshow ueber einen
    # NFS-gemounteten Ordner — kein echter Xibo-Player, siehe
    # docs/44-xibosignage.md und ansible/roles/xibo_kiosk). Eigene Gruppe statt
    # "raspberry_pis" oben, da diese Hosts keinen alamos_kiosk_station
    # brauchen und eine eigene Tailscale-/NFS-Konfiguration haben
    # (ansible/group_vars/xibo_displays.yml).
    #
    # Beispiel:
    #   wohnzimmer:
    #     ansible_host: 192.168.178.120
    #     ansible_user: pi
    xibo_displays:
      hosts: {}

    # Banana-Pi-Alarmmonitore (ALAMOS AMweb-Kiosk auf Armbian statt
    # Raspberry Pi OS, siehe docs/45-vereinsheim-alarmmonitor.md und
    # ansible/roles/banana_pi_kiosk). Eigene Gruppe statt "raspberry_pis",
    # da Paketnamen (chromium statt chromium-browser), X11-/Autologin-Setup
    # und der lokale Server-Fallback (banana_pi_kiosk_fallback_url,
    # Ansible-Vault-verschluesselt in host_vars/<name>/vault.yml) vom
    # Raspberry-Pi-Muster abweichen.
    #
    # banana_pi_kiosk_station ist PFLICHT pro Host und muss zu einem Key im
    # SealedSecret alamos-apager-stations passen (identisches Prinzip wie
    # alamos_kiosk_station bei den Raspberry Pis).
    #
    # ansible_host — ZWEI PHASEN, siehe docs/45-vereinsheim-alarmmonitor.md:
    #   Phase 1 (aktuell): Pi haengt noch am LAN, ansible_host = LAN-IP.
    #     Notwendig fuer den ALLERERSTEN Lauf, der Tailscale ueberhaupt erst
    #     installiert (ansible/roles/tailscale) — vorher gibt es keinen
    #     anderen Pfad zum Pi.
    #   Phase 2 (nach Umzug an den Tailscale-only-Standort): ansible_host
    #     hier auf die Tailscale-IP (`tailscale ip -4` auf dem Pi) oder den
    #     MagicDNS-Namen umstellen — die LAN-IP ist dann nicht mehr
    #     erreichbar. Voraussetzung: die Maschine, von der aus `make
    #     banana-pi-kiosks` laeuft (oder Semaphore selbst), ist im selben
    #     Tailnet.
    banana_pis:
      hosts:
        vereinsheim-alarmmonitor:
          ansible_host: 100.123.214.4  # Tailscale-IP (vorzeitig auf Phase 2 umgestellt — LAN-Pfad zum Pi war defekt, siehe docs/45-vereinsheim-alarmmonitor.md)
          ansible_user: pela  # echter Username auf diesem Geraet, nicht "pi" (Raspberry-Pi-OS-Konvention gilt hier nicht)
          banana_pi_kiosk_user: pela  # ueberschreibt den Rollen-Default "pi", siehe ansible/roles/banana_pi_kiosk/defaults/main.yml
          banana_pi_kiosk_station: 1002011_Fahrzeughalle
