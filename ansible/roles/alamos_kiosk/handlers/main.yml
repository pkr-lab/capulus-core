---
- name: Homeserver-CA-Vertrauensspeicher aktualisieren
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: Restart alamos kiosk
  ansible.builtin.systemd:
    name: alamos-kiosk.service
    daemon_reload: true
    state: restarted

- name: Restart alamos heartbeat timer
  ansible.builtin.systemd:
    name: alamos-heartbeat.timer
    daemon_reload: true
    state: restarted
