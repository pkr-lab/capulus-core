---

- name: alert-caller einrichten
  when: alert_caller_enabled | bool
  block:
    - name: Pflichtvariablen prüfen
      ansible.builtin.assert:
        that:
          - alert_caller_sip_password | length > 0
          - alert_caller_sip_password is not search('[;"\s]')
          - alert_caller_call_targets | length > 0
          - alert_caller_call_targets | select('search', 'EINTRAGEN') | list | length == 0
        fail_msg: >-
          alert_caller_sip_password muss im Vault stehen (Passwort ohne ; und "),
          alert_caller_call_targets braucht echte SIP-Adressen
          (docs/1-benachrichtigungen/10020-telefon-alarm.md, Abschnitt Vault-Variablen).
        quiet: true

    - name: Zugriffsschutz prüfen
      ansible.builtin.assert:
        that:
          - alert_caller_auth_mode in ['log', 'enforce']
          - alert_caller_auth_mode == 'log' or alert_caller_token | length > 0
          - alert_caller_token is not search('\s')
        fail_msg: >-
          alert_caller_auth_mode ist log oder enforce, enforce braucht alert_caller_token
          (Vault-Variable vault_alert_caller_token, docs/1-benachrichtigungen/10020-telefon-alarm.md).
        quiet: true

    - name: Pakete installieren (Sprachausgabe, Build von baresip, Firewall)
      ansible.builtin.apt:
        name:
          - sox
          - python3
          - python3-venv
          - python3-packaging
          - ca-certificates
          - build-essential
          - cmake
          - pkg-config
          - git
          - patch
          - libssl-dev
          - libopus-dev
          - zlib1g-dev
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: ufw installieren
      ansible.builtin.apt:
        name: ufw
        state: present
      when: alert_caller_manage_firewall | bool

    - name: Verzeichnisse anlegen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ alert_caller_install_dir }}"
        - "{{ alert_caller_piper_dir }}"
        - "{{ alert_caller_config_dir }}"
        - "{{ alert_caller_baresip_dir }}"
        - "{{ alert_caller_baresip_build_dir }}"

    - name: Quellen von re und baresip holen
      ansible.builtin.git:
        repo: "https://github.com/baresip/{{ item }}.git"
        dest: "{{ alert_caller_baresip_build_dir }}/{{ item }}"
        version: "v{{ alert_caller_baresip_version }}"
        depth: 1
        force: true
      loop:
        - re
        - baresip

    - name: libre patchen (sips-Routen, ICE-Takt)
      ansible.posix.patch:
        src: "{{ alert_caller_patch_dir }}/{{ item }}"
        basedir: "{{ alert_caller_baresip_build_dir }}/re"
        strip: 1
      loop: "{{ alert_caller_libre_patches }}"

    - name: baresip patchen (SRTP-Suitenwechsel)
      ansible.posix.patch:
        src: "{{ alert_caller_patch_dir }}/{{ item }}"
        basedir: "{{ alert_caller_baresip_build_dir }}/baresip"
        strip: 1
      loop: "{{ alert_caller_baresip_patches }}"

    - name: re und baresip bauen und installieren
      ansible.builtin.shell:
        cmd: |
          set -e
          cmake -S re -B re/build -DCMAKE_INSTALL_PREFIX={{ alert_caller_baresip_prefix }} -DCMAKE_INSTALL_RPATH={{ alert_caller_baresip_prefix }}/lib -DCMAKE_BUILD_TYPE=Release
          cmake --build re/build --parallel {{ alert_caller_build_jobs }}
          cmake --install re/build
          cmake -S baresip -B baresip/build -DCMAKE_INSTALL_PREFIX={{ alert_caller_baresip_prefix }} -DCMAKE_PREFIX_PATH={{ alert_caller_baresip_prefix }} -DCMAKE_INSTALL_RPATH={{ alert_caller_baresip_prefix }}/lib -DCMAKE_BUILD_TYPE=Release -DSTATIC=OFF -DMODULES="{{ alert_caller_baresip_modules }}"
          cmake --build baresip/build --parallel {{ alert_caller_build_jobs }}
          cmake --install baresip/build
          touch {{ alert_caller_baresip_prefix }}/.built-{{ build_stamp }}
        chdir: "{{ alert_caller_baresip_build_dir }}"
        executable: /bin/bash
        creates: "{{ alert_caller_baresip_prefix }}/.built-{{ build_stamp }}"
      vars:
        build_stamp: "{{ (alert_caller_baresip_version ~ alert_caller_baresip_modules ~ patch_hashes) | hash('sha1') | truncate(8, True, '') }}"
        patch_hashes: >-
          {%- for f in alert_caller_libre_patches + alert_caller_baresip_patches -%}
          {{ lookup('ansible.builtin.file', alert_caller_patch_dir ~ '/' ~ f) | hash('sha1') }}
          {%- endfor -%}
      notify: Restart alert caller

    - name: Piper in eigener venv installieren
      ansible.builtin.pip:
        name: "piper-tts=={{ alert_caller_piper_version }}"
        virtualenv: "{{ alert_caller_piper_dir }}/venv"
        virtualenv_command: python3 -m venv
      when: not (alert_caller_static_announcement | bool)
      notify: Restart alert caller

    - name: Piper-Stimme laden
      ansible.builtin.command:
        cmd: "{{ alert_caller_piper_dir }}/venv/bin/python -m piper.download_voices {{ alert_caller_piper_voice }} --download-dir {{ alert_caller_piper_dir }}"
        creates: "{{ alert_caller_piper_dir }}/{{ alert_caller_piper_voice }}.onnx"
      when: not (alert_caller_static_announcement | bool)

    - name: Feste Ansage deployen
      ansible.builtin.copy:
        src: cluster-down.wav
        dest: "{{ alert_caller_install_dir }}/cluster-down.wav"
        owner: root
        group: root
        mode: "0644"
      when: alert_caller_static_announcement | bool
      notify: Restart alert caller

    - name: caller.py deployen
      ansible.builtin.copy:
        src: "{{ role_path }}/../../../argocd/apps/tech/alert-caller/src/caller.py"
        dest: "{{ alert_caller_install_dir }}/caller.py"
        owner: root
        group: root
        mode: "0644"
      notify: Restart alert caller

    - name: baresip-Konfiguration templaten
      ansible.builtin.template:
        src: baresip-config.j2
        dest: "{{ alert_caller_baresip_dir }}/config"
        owner: root
        group: root
        mode: "0644"
      notify: Restart alert caller

    - name: Gruppe für den Lesezugriff auf das SIP-Passwort anlegen
      ansible.builtin.group:
        name: alert-caller-cfg
        system: true

    - name: baresip-Konto templaten
      ansible.builtin.template:
        src: baresip-accounts.j2
        dest: "{{ alert_caller_baresip_dir }}/accounts"
        owner: root
        group: alert-caller-cfg
        mode: "0640"
      no_log: true
      notify: Restart alert caller

    - name: Umgebungsdatei templaten
      ansible.builtin.template:
        src: alert-caller.env.j2
        dest: "{{ alert_caller_config_dir }}/alert-caller.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart alert caller

    - name: systemd-Unit deployen
      ansible.builtin.template:
        src: alert-caller.service.j2
        dest: /etc/systemd/system/alert-caller.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart alert caller

    - name: Firewall einrichten
      when: alert_caller_manage_firewall | bool
      block:
        - name: SSH in UFW erlauben
          community.general.ufw:
            rule: allow
            port: "22"
            proto: tcp
            comment: "SSH"

        - name: UFW Default für eingehenden Verkehr auf deny
          community.general.ufw:
            default: deny
            direction: incoming

        - name: Webhook-Port nur aus den erlaubten Netzen öffnen
          community.general.ufw:
            rule: allow
            port: "{{ alert_caller_port }}"
            proto: tcp
            src: "{{ item }}"
            comment: "alert-caller webhook"
          loop: "{{ alert_caller_webhook_sources }}"

        - name: RTP-Portbereich öffnen
          community.general.ufw:
            rule: allow
            port: "{{ alert_caller_rtp_port_min }}:{{ alert_caller_rtp_port_max }}"
            proto: udp
            comment: "alert-caller RTP"

        - name: UFW aktivieren
          community.general.ufw:
            state: enabled

    - name: alert-caller aktivieren und starten
      ansible.builtin.systemd:
        name: alert-caller
        daemon_reload: true
        enabled: true
        state: started

- name: alert-caller deaktivieren, falls alert_caller_enabled false
  ansible.builtin.systemd:
    name: alert-caller
    enabled: false
    state: stopped
  when: not (alert_caller_enabled | bool)
  failed_when: false
