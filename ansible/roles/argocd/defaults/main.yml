---

argocd_entw_layout: false


argocd_ci_account_enabled: true

# HTTPS-Ingress fuer die ArgoCD-Web-UI ueber Traefik. Standard aus: die ENTW-Instanz (entw-vm) hat
# keinen eigenen Ingress-Host. Der Hub aktiviert ihn in host_vars/homeserver/vars.yml. Der Host
# muss im Wildcard-Zertifikat stehen (argocd/apps/tech/cert-manager) und unter *.homeserver
# aufloesen (dnsmasq-Wildcard).
argocd_ingress_enabled: false
argocd_ui_host: ""

argocd_platform_apps:
  - sealed-secrets
  - kubeseal-webgui
  - authentik
  - lldap
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_workloads_apps:
  - alamos-apager
  - alamos-relay
  - carplay-api
  - github-release-watcher
  - mediamtx
  - n8n
  - ollama
  - pacman
  - uptime-kuma
  - vaultwarden
  - zammad

argocd_apply_network_policies: true

argocd_network_policy_refined_namespaces:
  - n8n
  - alamos-apager
  - alamos-relay
  - carplay-api
  - github-release-watcher
  - mediamtx
  - uptime-kuma
  - vaultwarden
  - zammad
  - authentik
  - lldap
  - sealed-secrets
  - kubeseal-webgui
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_network_policy_excluded_apps:
  - ollama

argocd_network_policy_extra_ingress:
  lldap:
    - authentik
  n8n:
    - alamos-relay
  ntfy:
    - carplay-api
    - alamos-apager
    - ntfy-bridge
    - n8n
  monitoring:
    - carplay-api
    - n8n
    - argo-workflows
  uptime-kuma:
    - carplay-api
  gotify:
    - gotify-bridge
  gotify-bridge:
    - monitoring
  ntfy-bridge:
    - monitoring
  minio:
    - argo-workflows
