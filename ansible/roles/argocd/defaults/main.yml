---
# Single source of truth for the platform/workloads namespace-tier split
# (docs/49-argocd-projects.md). Used to build each AppProject's allowed
# `destinations` and to label the resulting namespaces with `security-tier`.
# Keep in sync with the folders under argocd/apps/platform/ and
# argocd/apps/workloads/ — each entry here is also the app's namespace name
# (destination.namespace == the app's folder basename, see
# bootstrap-applicationset.yaml.j2).
argocd_platform_apps:
  - authentik
  - sealed-secrets
  - kubeseal-webgui
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_workloads_apps:
  - alamos-apager
  - carplay-api
  - example-whoami
  - github-release-watcher
  - immich
  - mealie
  - mediamtx
  - n8n
  - nextcloud
  - paperless-ngx
  - tinyteller
  - uptime-kuma
  - vaultwarden
  - wiki-docs-sync
  - wikijs
  - xibosignage
  - zammad

# Phase 3 der Security-Härtung (docs/51-security-hardening-roadmap.md,
# docs/52-network-policies.md). War default false, damit ein normaler
# `make argocd`-Lauf nicht ungefragt cluster-weite NetworkPolicies
# ausrollt — nach Backup, Pilotlauf auf example-whoami/tinyteller und
# vollständig verifiziertem Rollout (13.08.2026, siehe docs/52) auf true
# gesetzt, damit künftige `make argocd`-Läufe den Zustand halten.
argocd_apply_network_policies: true

# Phase 3, Schritt 2 (docs/51, docs/52 → "Schrittweise pro Namespace
# verfeinern"): Namespaces in dieser Liste bekommen die STRIKTE Policy
# (nur eigener Namespace + kube-system + monitoring, KEIN pauschaler
# Tier-weiter Zugriff mehr) statt der groben Tier-Default-Policy aus
# Schritt 1. Wächst schrittweise, einer nach dem anderen, mit Validierung
# dazwischen — nie alle 36 auf einmal. Reihenfolge laut Roadmap:
# unkritische Apps zuerst, dann Apps mit eigener DB, zuletzt Plattform.
argocd_network_policy_refined_namespaces:
  - example-whoami
  - tinyteller
  # Batch 2 (13.08.2026): Apps mit eigener DB, komplett im selben Namespace
  # (Postgres/State läuft dort, keine Cross-Namespace-Abhängigkeit für den
  # Normalbetrieb geprüft — siehe docs/52 für den n8n-Sonderfall, ein
  # inaktiver Workflow, der VictoriaMetrics in `monitoring` direkt abfragt).
  - wikijs
  - mealie
  - n8n

# Gezielte Zusatz-Ausnahmen, wenn ein anderer Namespace legitim per
# ClusterIP direkt reinruft (nicht über Traefik) — unabhängig davon, ob
# das Ziel schon in argocd_network_policy_refined_namespaces steht: bei
# einer groben Tier-Policy braucht es das nur für CROSS-TIER-Aufrufe (die
# blockiert die Tier-Regel ja gerade), bei einer verfeinerten Policy für
# JEDEN fremden Namespace, auch innerhalb desselben Tiers.
#
# Gefunden per `grep -rn "svc.cluster.local" argocd/apps/` (13.08.2026,
# nach dem Cloudflared-Beinahe-Incident aus Vorsicht komplett durchsucht,
# siehe docs/52) — das sind alle im Repo sichtbaren Cross-Namespace-
# ClusterIP-Aufrufe, die nicht schon durch security-tier (Intra-Tier) oder
# die generellen kube-system/monitoring/cloudflared-Ausnahmen abgedeckt
# waren:
argocd_network_policy_extra_ingress:
  # wiki-docs-sync (eigener CronJob-Namespace) ruft wikijs per ClusterIP
  # direkt an, nicht über Traefik. wikijs ist verfeinert (Schritt 2).
  wikijs:
    - wiki-docs-sync
  # ntfy (platform, noch grobe Policy): carplay-api und alamos-apager
  # (beide workload) senden Push-Benachrichtigungen per ClusterIP direkt
  # an ntfy — Cross-Tier, von der groben Policy sonst blockiert. Nur
  # bedarfsgesteuert (bei einem echten Alarm/einer echten Anfrage), daher
  # nicht in den bisherigen Logs sichtbar — proaktiv gefixt statt
  # abgewartet, ob es im Ernstfall lautlos fehlschlägt.
  ntfy:
    - carplay-api
    - alamos-apager
  # monitoring (platform, noch grobe Policy): carplay-api fragt
  # VictoriaMetrics direkt per ClusterIP ab (Cross-Tier, aktiv genutzt).
  # n8n hat einen Workflow mit demselben Zugriffsmuster
  # (workflows/banana-pi-down-to-zammad.json) — aktuell "active": false,
  # aber die Ausnahme schadet nicht und erspart eine Überraschung, falls
  # der Workflow mal aktiviert wird.
  monitoring:
    - carplay-api
    - n8n
