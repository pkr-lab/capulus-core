---
# Single source of truth for the platform/workloads namespace-tier split
# (docs/b-kubernetes-gitops/b0020-argocd-projects.md). Used to build each AppProject's allowed
# `destinations` and to label the resulting namespaces with `security-tier`.
# Keep in sync with the folders under argocd/apps/platform/ and
# argocd/apps/workloads/ — each entry here is also the app's namespace name
# (destination.namespace == the app's folder basename, see
# bootstrap-applicationset.yaml.j2).
# false (Default): ApplicationSet-Generator nimmt alle Ordner unter
# argocd/apps/<tier>/*. true: nur die Apps aus argocd_platform_apps /
# argocd_workloads_apps unten (frueher ENTW; dort seit argocd_entw_layout ohne Wirkung).
argocd_apps_from_lists: false

# true = ein Projekt "entw" und ein ApplicationSet fuer alle Apps unter argocd/apps/entw/ (nur ENTW-Cluster,
# siehe host_vars/entw-vm). Hat Vorrang vor argocd_tech_layout und argocd_apps_from_lists.
argocd_entw_layout: false

# true = ein Projekt "tech" und ein ApplicationSet fuer alle Apps unter argocd/apps/tech/ (Hub).
# false = altes Layout platform/workloads (von keinem Cluster mehr genutzt, seit ENTW auf argocd_entw_layout ist).
argocd_tech_layout: false

# true = lokales ArgoCD-Konto `ci` (nur API-Token, kein Login) mit Nur-Lese-Rolle: die Promotion-Kette
# (.github/workflows/promote-chain.yml) liest damit den Gesundheitsstatus der Applications. Der Token wird
# NICHT von Ansible erzeugt, sondern einmalig per scripts/create-argocd-ci-token.sh
# (docs/f-cicd-automatisierung/f00b0-promotion-chain.md#einrichtung).
argocd_ci_account_enabled: true

# HTTPS-Ingress fuer die ArgoCD-Web-UI ueber Traefik. Standard aus: die ENTW-Instanz (entw-vm) hat
# keinen eigenen Ingress-Host. Der Hub aktiviert ihn in host_vars/homeserver/vars.yml. Der Host
# muss im Wildcard-Zertifikat stehen (argocd/apps/tech/cert-manager) und unter *.homeserver
# aufloesen (dnsmasq-Wildcard).
argocd_ingress_enabled: false
argocd_ui_host: ""

argocd_platform_apps:
  - sealed-secrets
  - kubeseal-webgui
  - authentik
  - lldap
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_workloads_apps:
  - alamos-apager
  - alamos-relay
  - carplay-api
  - github-release-watcher
  - mediamtx
  - n8n
  - ollama
  - pacman
  - uptime-kuma
  - vaultwarden
  - zammad

argocd_apply_network_policies: true

argocd_network_policy_refined_namespaces:
  - n8n
  - alamos-apager
  - alamos-relay
  - carplay-api
  - github-release-watcher
  - mediamtx
  - uptime-kuma
  - vaultwarden
  - zammad
  - authentik
  - lldap
  - sealed-secrets
  - kubeseal-webgui
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_network_policy_excluded_apps:
  - ollama

argocd_network_policy_extra_ingress:
  lldap:
    - authentik
  wikijs:
    - wiki-docs-sync
  n8n:
    - alamos-relay   # alamos-relay/values.yaml, Server-zu-Server-Forward des ALAMOS-Webhooks
  ntfy:
    - carplay-api
    - alamos-apager
    - ntfy-bridge   # Batch 4: ntfy-bridge/values.yaml
    - n8n   # n8n-Workflows pushen per HTTP an ntfy.ntfy.svc (zammad-ki-entwuerfe, whatsapp-relay)
  monitoring:
    - carplay-api
    - n8n
    - argo-workflows
  uptime-kuma:
    - carplay-api
  gotify:
    - gotify-bridge   # gotify-bridge/values.yaml
  gotify-bridge:
    - monitoring   # vmalertmanager-Webhook in monitoring/values.yaml
  ntfy-bridge:
    - monitoring   # vmalertmanager-Webhook in monitoring/values.yaml
  minio:
    - argo-workflows   # Artifact-Storage-Endpoint in argo-workflows/values.yaml
