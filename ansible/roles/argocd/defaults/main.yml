---
# Single source of truth for the platform/workloads namespace-tier split
# (docs/49-argocd-projects.md). Used to build each AppProject's allowed
# `destinations` and to label the resulting namespaces with `security-tier`.
# Keep in sync with the folders under argocd/apps/platform/ and
# argocd/apps/workloads/ — each entry here is also the app's namespace name
# (destination.namespace == the app's folder basename, see
# bootstrap-applicationset.yaml.j2).
argocd_platform_apps:
  - authentik
  - sealed-secrets
  - kubeseal-webgui
  - monitoring
  - logging
  - gotify
  - gotify-bridge
  - ntfy
  - ntfy-bridge
  - cloudflared
  - pihole
  - coredns-custom
  - nas-storage
  - immich-storage
  - minio
  - argo-workflows
  - semaphore
  - headlamp
  - traefik-config

argocd_workloads_apps:
  - alamos-apager
  - carplay-api
  - example-whoami
  - github-release-watcher
  - immich
  - mealie
  - mediamtx
  - n8n
  - nextcloud
  - paperless-ngx
  - tinyteller
  - uptime-kuma
  - vaultwarden
  - wiki-docs-sync
  - wikijs
  - xibosignage
  - zammad

# Phase 3 der Security-Härtung (docs/51-security-hardening-roadmap.md,
# docs/52-network-policies.md). War default false, damit ein normaler
# `make argocd`-Lauf nicht ungefragt cluster-weite NetworkPolicies
# ausrollt — nach Backup, Pilotlauf auf example-whoami/tinyteller und
# vollständig verifiziertem Rollout (13.08.2026, siehe docs/52) auf true
# gesetzt, damit künftige `make argocd`-Läufe den Zustand halten.
argocd_apply_network_policies: true

# Phase 3, Schritt 2 (docs/51, docs/52 → "Schrittweise pro Namespace
# verfeinern"): Namespaces in dieser Liste bekommen die STRIKTE Policy
# (nur eigener Namespace + kube-system + monitoring, KEIN pauschaler
# Tier-weiter Zugriff mehr) statt der groben Tier-Default-Policy aus
# Schritt 1. Wächst schrittweise, einer nach dem anderen, mit Validierung
# dazwischen — nie alle 36 auf einmal. Reihenfolge laut Roadmap:
# unkritische Apps zuerst, dann Apps mit eigener DB, zuletzt Plattform.
argocd_network_policy_refined_namespaces:
  - example-whoami
  - tinyteller
  # Batch 2 (13.08.2026): Apps mit eigener DB, komplett im selben Namespace
  # (Postgres/State läuft dort, keine Cross-Namespace-Abhängigkeit für den
  # Normalbetrieb geprüft — siehe docs/52 für den n8n-Sonderfall, ein
  # inaktiver Workflow, der VictoriaMetrics in `monitoring` direkt abfragt).
  - wikijs
  - mealie
  - n8n
