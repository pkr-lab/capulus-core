---
# ============================================================
# argocd/tasks/main.yml — ArgoCD GitOps installation
# ============================================================

# ---- Namespace ----------------------------------------------
- name: Create argocd namespace (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml |
        kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_ns_apply
  changed_when: "'created' in argocd_ns_apply.stdout"

# ---- Helm Repository ----------------------------------------
- name: Add Argo Helm repository
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: argocd_helm_repo_add
  changed_when: '"has been added" in argocd_helm_repo_add.stdout'
  failed_when:
    - argocd_helm_repo_add.rc != 0
    - "'already exists' not in argocd_helm_repo_add.stderr"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ---- ArgoCD Helm Values -------------------------------------
- name: Template ArgoCD Helm values to /tmp
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /tmp/argocd-values.yaml
    owner: root
    group: root
    mode: '0644'

# ---- Install ArgoCD -----------------------------------------
# When `argocd_version` is set, that exact chart is installed; when empty,
# Helm pulls the latest chart from the repo (already refreshed above).
- name: Install or upgrade ArgoCD via Helm
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    {% if argocd_version | length > 0 %}--version {{ argocd_version }}{% endif %}
    --namespace {{ argocd_namespace }}
    --values /tmp/argocd-values.yaml
    --atomic
    --timeout 20m
    --create-namespace
  register: argocd_helm_result
  changed_when: "'deployed' in argocd_helm_result.stdout or 'upgraded' in argocd_helm_result.stdout"
  retries: 2
  delay: 30
  until: argocd_helm_result.rc == 0
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Display Helm release status
  ansible.builtin.debug:
    var: argocd_helm_result.stdout_lines

# ---- Wait for ArgoCD Server ---------------------------------
- name: Wait for ArgoCD server deployment to be available
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-server
    --namespace {{ argocd_namespace }}
    --timeout=5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_rollout
  changed_when: false

- name: Wait for all ArgoCD pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pods
    --all
    --namespace {{ argocd_namespace }}
    --timeout=300s
    --field-selector=status.phase!=Succeeded
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_pods_ready
  changed_when: false

# ---- Retrieve Initial Admin Password -------------------------
- name: Check if initial admin secret exists
  ansible.builtin.command: >
    kubectl get secret argocd-initial-admin-secret
    --namespace {{ argocd_namespace }}
    --ignore-not-found
    -o name
  register: argocd_secret_check
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Get ArgoCD initial admin password
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret \
        -o jsonpath="{.data.password}" | base64 -d
    executable: /bin/bash
  register: argocd_initial_password
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: argocd_secret_check.stdout | length > 0

# Don't print the password by default — it lands in terminal scrollback, -v
# output and any CI/Semaphore job log that captures stdout. Show the retrieval
# command instead; pass `-e argocd_show_initial_password=true` to reveal it.
- name: Display ArgoCD initial credentials (password redacted)
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "ArgoCD Initial Credentials"
      - "=================================================="
      - "URL:      https://{{ ansible_default_ipv4.address }}:30443"
      - "Username: admin"
      - "Password: retrieve with —"
      - "  kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d; echo"
      - "  (re-run with -e argocd_show_initial_password=true to print it here)"
      - "=================================================="
      - "IMPORTANT: Change this password after first login!"
      - "=================================================="
  when: not (argocd_show_initial_password | default(false) | bool)

- name: Display ArgoCD initial credentials (password shown)
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "ArgoCD Initial Credentials"
      - "=================================================="
      - "URL:      https://{{ ansible_default_ipv4.address }}:30443"
      - "Username: admin"
      - "Password: {{ argocd_initial_password.stdout | default('secret already deleted or changed') }}"
      - "=================================================="
      - "IMPORTANT: Change this password after first login!"
      - "=================================================="
  when: argocd_show_initial_password | default(false) | bool

# ---- Bootstrap AppProjects (must exist before the ApplicationSet syncs) ----
# Applications referencing a project that doesn't exist yet fail sync, so
# these are applied before the ApplicationSet below.
- name: Template bootstrap AppProjects
  ansible.builtin.template:
    src: bootstrap-appprojects.yaml.j2
    dest: /tmp/argocd-bootstrap-appprojects.yaml
    owner: root
    group: root
    mode: '0644'

- name: Apply bootstrap AppProjects
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-appprojects.yaml
  register: argocd_appprojects_apply
  changed_when: "'created' in argocd_appprojects_apply.stdout or 'configured' in argocd_appprojects_apply.stdout"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ---- Bootstrap ApplicationSet ------------------------------
- name: Template bootstrap ApplicationSet
  ansible.builtin.template:
    src: bootstrap-applicationset.yaml.j2
    dest: /tmp/argocd-bootstrap-applicationset.yaml
    owner: root
    group: root
    mode: '0644'

- name: Apply bootstrap ApplicationSet
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-applicationset.yaml
  register: argocd_appset_apply
  changed_when: "'created' in argocd_appset_apply.stdout or 'configured' in argocd_appset_apply.stdout"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Display ApplicationSet status
  ansible.builtin.debug:
    var: argocd_appset_apply.stdout

- name: Wait for ApplicationSets to be processed
  ansible.builtin.command: >
    kubectl get applicationsets home-server-apps-{{ item }}
    --namespace {{ argocd_namespace }}
    -o jsonpath='{.status.conditions[?(@.type=="ErrorOccurred")].status}'
  loop: ["platform", "workloads"]
  register: argocd_appset_status
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  retries: 5
  delay: 10

- name: List created Applications
  ansible.builtin.command: >
    kubectl get applications
    --namespace {{ argocd_namespace }}
    --no-headers
  register: argocd_apps_list
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Display Applications
  ansible.builtin.debug:
    msg: "{{ argocd_apps_list.stdout_lines | default(['No applications found yet — ArgoCD is polling Git']) }}"

# ---- Namespace security-tier labels -------------------------
# Best-effort: on a brand-new namespace, ArgoCD only creates it once the
# ApplicationSet has actually synced that Application (can lag behind this
# playbook run, see docs/b-kubernetes-gitops/b0020-argocd-projects.md). `failed_when: false` so a
# not-yet-existing namespace doesn't fail the whole play — re-running
# `make argocd` later catches up on any it missed.
- name: Label platform-tier namespaces with security-tier=platform
  ansible.builtin.command: >
    kubectl label namespace {{ item }} security-tier=platform --overwrite
  loop: "{{ argocd_platform_apps }}"
  register: argocd_platform_label
  changed_when: "'labeled' in argocd_platform_label.stdout"
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Label workloads-tier namespaces with security-tier=workload
  ansible.builtin.command: >
    kubectl label namespace {{ item }} security-tier=workload --overwrite
  loop: "{{ argocd_workloads_apps }}"
  register: argocd_workloads_label
  changed_when: "'labeled' in argocd_workloads_label.stdout"
  failed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ---- Phase 3 Security-Härtung: tier-default-ingress NetworkPolicies ------
# Off by default (argocd_apply_network_policies), see defaults/main.yml and
# docs/d-sicherheit/d0030-network-policies.md — deliberately not part of the unconditional
# bootstrap path, this is a cluster-wide behavioural change that needs a
# backup + staged pilot rollout, not something a routine `make argocd` run
# should silently (re-)apply.
#
# Same lag as the labeling tasks above: a brand-new app's namespace may not
# exist yet if ArgoCD hasn't synced it (this file is applied as one
# `kubectl apply -f`, so a single missing namespace would otherwise fail the
# whole batch even though every other namespace's policy is fine). Fetch the
# namespaces that currently exist and only template policies for those; a
# not-yet-existing one is picked up on the next `make argocd` run.
- name: Get existing namespaces
  ansible.builtin.command: >
    kubectl get namespaces -o jsonpath={.items[*].metadata.name}
  register: argocd_existing_namespaces_raw
  changed_when: false
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: argocd_apply_network_policies | bool

- name: Set existing namespaces fact
  ansible.builtin.set_fact:
    argocd_existing_namespaces: "{{ argocd_existing_namespaces_raw.stdout.split() }}"
  when: argocd_apply_network_policies | bool

- name: Template tier-default-ingress NetworkPolicies
  ansible.builtin.template:
    src: bootstrap-networkpolicies.yaml.j2
    dest: /tmp/argocd-bootstrap-networkpolicies.yaml
    owner: root
    group: root
    mode: '0644'
  when: argocd_apply_network_policies | bool

- name: Apply tier-default-ingress NetworkPolicies
  ansible.builtin.command: >
    kubectl apply -f /tmp/argocd-bootstrap-networkpolicies.yaml
  register: argocd_netpol_apply
  changed_when: "'created' in argocd_netpol_apply.stdout or 'configured' in argocd_netpol_apply.stdout"
  when: argocd_apply_network_policies | bool
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# ---- Clean up temp files -----------------------------------
- name: Remove temporary Helm values file
  ansible.builtin.file:
    path: /tmp/argocd-values.yaml
    state: absent
