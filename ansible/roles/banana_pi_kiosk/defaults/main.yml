---
# Kill-switch: auf false setzen (z.B. in host_vars) um Kiosk/Heartbeat auf
# einem bestimmten Host zu deaktivieren, ohne die Rolle aus dem Playbook zu
# entfernen (gleiches Prinzip wie alamos_kiosk_enabled).
banana_pi_kiosk_enabled: true

# Basis-URL des alamos-apager Helm Charts (argocd/apps/workloads/alamos-apager).
# Normalbetrieb: der Pi zeigt "{{ banana_pi_kiosk_base_url }}/start?station=
# {{ banana_pi_kiosk_station }}", der Cluster loest serverseitig zur echten
# ALAMOS-AMweb-URL auf (siehe docs/19-alamos-apager.md).
banana_pi_kiosk_base_url: "https://alamos-apager.prod.homeserver"

# Stationsname dieses Pi. MUSS pro Host gesetzt werden (siehe
# ansible/inventory/hosts.yml, Gruppe banana_pis) und muss zu einem Key im
# SealedSecret alamos-apager-stations passen — kein Default, damit ein
# fehlender Wert laut auffaellt statt eine falsche Station anzuzeigen.
# banana_pi_kiosk_station: "1002011_Fahrzeughalle"  # Beispiel -- reale Alamos-Stationskennung, NICHT der Monitoring-Instance-Name

# Echte ALAMOS-AMweb-URL als lokaler Fallback, falls
# {{ banana_pi_kiosk_base_url }} nicht erreichbar ist (Server/Cluster down).
# MUSS pro Host in host_vars/<name>/vault.yml (Ansible-Vault-verschluesselt)
# gesetzt werden — kein Default, bewusster Bruch mit der sonstigen Alamos-
# Regel "Secret bleibt im Cluster", nur fuer diese Geraeteklasse. Siehe
# docs/45-vereinsheim-alarmmonitor.md.
# banana_pi_kiosk_fallback_url: "{{ vault_vereinsheim_alarmmonitor_fallback_url }}"

# Linux-User, unter dessen grafischer Session (startx via Autologin auf
# tty1) der Kiosk-Browser laeuft. Anders als bei alamos_kiosk (Raspberry Pi
# Imager "Enable autologin") richtet DIESE Rolle den Autologin selbst ein,
# da Armbian keinen vergleichbaren Imaging-Schalter hat — der User muss nur
# bereits existieren (beim ersten Armbian-Boot angelegt).
banana_pi_kiosk_user: "pi"

# Wie oft der Pi ein Lebenszeichen an den Cluster sendet (Sekunden, gleiches
# Prinzip wie bei alamos_kiosk — steuert NUR den ntfy-Ausfall-Alarm in
# argocd/apps/workloads/alamos-apager, nicht die Fallback-Umschaltung unten).
banana_pi_kiosk_heartbeat_interval: 60

# ---- Server-Fallback (lokaler Supervisor, nicht der Cluster-Heartbeat) --
# Wie oft der Kiosk-Supervisor die Erreichbarkeit von
# {{ banana_pi_kiosk_base_url }} prueft (Sekunden).
banana_pi_kiosk_failover_poll_seconds: 30

# Nach wie vielen AUFEINANDERFOLGENDEN fehlgeschlagenen Pruefungen auf die
# lokale Fallback-URL umgeschaltet wird (3 x 30s = 90s, bewusst traege, damit
# ein einzelner kurzer Netz-Hickser noch nicht umschaltet).
banana_pi_kiosk_failover_fail_threshold: 3

# Nach wie vielen aufeinanderfolgenden ERFOLGREICHEN Pruefungen wieder auf
# die normale Cluster-URL zurueckgeschaltet wird (bewusst schnell — 1x
# reicht, damit der Monitor moeglichst schnell wieder auf dem zentral
# verwalteten Pfad laeuft).
banana_pi_kiosk_failover_recover_threshold: 1

# ---- Taeglicher Kiosk-Session-Neustart ------------------------------------
# Unbeaufsichtigtes Kiosk-Geraet — ein taeglicher Neustart der tty1-Session
# (getty@tty1 -> startx -> X/openbox/Chromium) raeumt Chromium-Prozess-
# zustand/Speicher auf, unabhaengig von der Absturzschleifen-Ursache. Bewusst
# KEIN Kernel-/Firmware-Reboot (systemctl reboot / /usr/sbin/reboot) — auf
# diesem Board (Armbian "Community Supported") ist der Warm-Reset-Pfad
# unzuverlaessig, siehe Kommentar in
# templates/banana-pi-daily-reboot.service.j2. Kill-switch: auf false setzen,
# um den Timer zu deaktivieren.
banana_pi_kiosk_daily_reboot_enabled: true

# Uhrzeit (systemd OnCalendar-Zeitformat, lokale Zeit des Pi) fuer den
# taeglichen Kiosk-Session-Neustart.
banana_pi_kiosk_daily_reboot_time: "00:00:00"
