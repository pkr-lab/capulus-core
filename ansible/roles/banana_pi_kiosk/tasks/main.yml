---

- name: Sicherstellen dass banana_pi_kiosk_station gesetzt ist
  ansible.builtin.assert:
    that:
      - banana_pi_kiosk_station is defined
      - banana_pi_kiosk_station | length > 0
    fail_msg: >-
      banana_pi_kiosk_station ist nicht gesetzt. Pro Host in
      ansible/inventory/hosts.yml (Gruppe banana_pis) als Host-Var setzen
      (muss zu einem Key im SealedSecret alamos-apager-stations passen).
  when: banana_pi_kiosk_enabled | bool

- name: Sicherstellen dass banana_pi_kiosk_fallback_url gesetzt und entschluesselt ist
  ansible.builtin.assert:
    that:
      - banana_pi_kiosk_fallback_url is defined
      - banana_pi_kiosk_fallback_url | length > 0
      - "'CHANGE-ME' not in banana_pi_kiosk_fallback_url"
    fail_msg: >-
      banana_pi_kiosk_fallback_url ist nicht gesetzt (oder noch der
      Platzhalter aus host_vars/{{ inventory_hostname }}/vault.yml). Echte
      ALAMOS-AMweb-URL per `ansible-vault encrypt_string` eintragen — siehe
      Kommentar in dieser Datei und docs/3-apps-workloads/30020-vereinsheim-alarmmonitor.md.
  when: banana_pi_kiosk_enabled | bool

- name: Kiosk-Pakete installieren (Debian-Paketnamen, nicht Raspbian)
  ansible.builtin.apt:
    name:
      - chromium
      - xserver-xorg
      - xinit
      - openbox
      - unclutter
      - x11-xserver-utils
      - curl
      - scrot
      - libnss3-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: banana_pi_kiosk_enabled | bool

- name: Homeserver-Root-CA-Zertifikat deployen
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docs/assets/homeserver-root-ca.pem"
    dest: /usr/local/share/ca-certificates/homeserver-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Homeserver-CA-Vertrauensspeicher aktualisieren

- name: NSS-Datenbank-Verzeichnis des Kiosk-Users anlegen
  ansible.builtin.file:
    path: "/home/{{ banana_pi_kiosk_user }}/.pki/nssdb"
    state: directory
    owner: "{{ banana_pi_kiosk_user }}"
    group: "{{ banana_pi_kiosk_user }}"
    mode: "0700"
  when: banana_pi_kiosk_enabled | bool

- name: Pruefen ob Homeserver-Root-CA bereits in NSS-Datenbank des Kiosk-Users vertraut ist
  become: true
  become_user: "{{ banana_pi_kiosk_user }}"
  ansible.builtin.command: >-
    certutil -d sql:/home/{{ banana_pi_kiosk_user }}/.pki/nssdb
    -L -n homeserver-root-ca
  register: banana_pi_kiosk_nssdb_ca_check
  changed_when: false
  failed_when: false
  when: banana_pi_kiosk_enabled | bool

- name: Homeserver-Root-CA in NSS-Datenbank des Kiosk-Users importieren
  become: true
  become_user: "{{ banana_pi_kiosk_user }}"
  ansible.builtin.command: >-
    certutil -d sql:/home/{{ banana_pi_kiosk_user }}/.pki/nssdb
    -A -t "C,," -n homeserver-root-ca
    -i /usr/local/share/ca-certificates/homeserver-root-ca.crt
  changed_when: true
  when:
    - banana_pi_kiosk_enabled | bool
    - banana_pi_kiosk_nssdb_ca_check.rc != 0
  notify: Reload getty@tty1

- name: lightdm stoppen und deaktivieren (falls vorhanden)
  ansible.builtin.systemd:
    name: lightdm
    enabled: false
    state: stopped
    masked: true
  when: banana_pi_kiosk_enabled | bool
  failed_when: false

- name: Verzeichnis fuer getty@tty1-Drop-in anlegen
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

- name: Autologin-Drop-in fuer getty@tty1 deployen
  ansible.builtin.template:
    src: getty-autologin.conf.j2
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Reload getty@tty1

- name: ".bash_profile von {{ banana_pi_kiosk_user }} um automatischen startx-Aufruf ergaenzen"
  ansible.builtin.blockinfile:
    path: "/home/{{ banana_pi_kiosk_user }}/.bash_profile"
    create: true
    owner: "{{ banana_pi_kiosk_user }}"
    group: "{{ banana_pi_kiosk_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (banana_pi_kiosk role)"
    block: |
      if [ -z "${DISPLAY:-}" ] && [ "$(tty)" = "/dev/tty1" ]; then
        exec startx -- -nocursor
      fi
  when: banana_pi_kiosk_enabled | bool

- name: .xinitrc deployen
  ansible.builtin.template:
    src: xinitrc.j2
    dest: "/home/{{ banana_pi_kiosk_user }}/.xinitrc"
    owner: "{{ banana_pi_kiosk_user }}"
    group: "{{ banana_pi_kiosk_user }}"
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

- name: Kiosk-Supervisor-Skript deployen
  ansible.builtin.template:
    src: banana-pi-kiosk-supervisor.sh.j2
    dest: /usr/local/bin/banana-pi-kiosk-supervisor.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool
  notify: Reload getty@tty1

- name: Screenshot-Skript deployen
  ansible.builtin.template:
    src: banana-pi-screenshot.sh.j2
    dest: /usr/local/bin/banana-pi-screenshot.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

- name: wakeonlan installieren
  ansible.builtin.apt:
    name: wakeonlan
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_enabled | bool

- name: Wake-on-LAN-Skript deployen
  ansible.builtin.template:
    src: banana-pi-wol.sh.j2
    dest: /usr/local/bin/banana-pi-wol.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_enabled | bool

- name: Config-Verzeichnis für WoL-HTTP-Agent anlegen
  ansible.builtin.file:
    path: /etc/banana-pi-wol-agent
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: Bearer-Token für WoL-HTTP-Agent erzeugen (falls noch nicht vorhanden)
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand -hex 32 > {{ banana_pi_kiosk_wol_agent_token_path }}"
    creates: "{{ banana_pi_kiosk_wol_agent_token_path }}"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: Token-Datei-Rechte absichern
  ansible.builtin.file:
    path: "{{ banana_pi_kiosk_wol_agent_token_path }}"
    owner: root
    group: root
    mode: "0600"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: Erzeugtes WoL-Agent-Token einlesen
  ansible.builtin.slurp:
    src: "{{ banana_pi_kiosk_wol_agent_token_path }}"
  register: banana_pi_kiosk_wol_agent_token_raw
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: WoL-HTTP-Agent-Skript deployen
  ansible.builtin.copy:
    src: banana-pi-wol-agent.py
    dest: /usr/local/bin/banana-pi-wol-agent.py
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool
  notify: Restart banana-pi wol agent

- name: WoL-HTTP-Agent-Konfiguration templaten
  ansible.builtin.template:
    src: banana-pi-wol-agent.env.j2
    dest: /etc/banana-pi-wol-agent/config.env
    owner: root
    group: root
    mode: "0600"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool
  vars:
    banana_pi_kiosk_wol_agent_token: "{{ banana_pi_kiosk_wol_agent_token_raw.content | b64decode | trim }}"
  notify: Restart banana-pi wol agent

- name: WoL-HTTP-Agent-systemd-Unit deployen
  ansible.builtin.template:
    src: banana-pi-wol-agent.service.j2
    dest: /etc/systemd/system/banana-pi-wol-agent.service
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool
  notify: Restart banana-pi wol agent

- name: WoL-HTTP-Agent aktivieren und starten
  ansible.builtin.systemd:
    name: banana-pi-wol-agent
    daemon_reload: true
    enabled: true
    state: started
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: WoL-HTTP-Agent deaktivieren, falls banana_pi_kiosk_wol_agent_enabled false
  ansible.builtin.systemd:
    name: banana-pi-wol-agent
    enabled: false
    state: stopped
  when: not (banana_pi_kiosk_wol_agent_enabled | bool) or not (banana_pi_kiosk_enabled | bool)
  failed_when: false

- name: Hinweis zum WoL-Agent-Token ausgeben
  ansible.builtin.debug:
    msg: >-
      WoL-Agent-Token liegt in {{ banana_pi_kiosk_wol_agent_token_path }} auf
      {{ inventory_hostname }}. Falls dies eine Ersteinrichtung oder eine
      Token-Rotation war: Wert per
      "ssh {{ ansible_user }}@{{ inventory_hostname }} sudo cat {{ banana_pi_kiosk_wol_agent_token_path }}"
      auslesen und in der iOS-App unter Einstellungen einfügen -- siehe
      docs/3-apps-workloads/30020-vereinsheim-alarmmonitor.md.
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_wol_agent_enabled | bool

- name: Heartbeat-Skript deployen
  ansible.builtin.copy:
    src: banana-pi-heartbeat.sh
    dest: /usr/local/bin/banana-pi-heartbeat.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-Environment-Datei deployen
  ansible.builtin.template:
    src: banana-pi-heartbeat.env.j2
    dest: /etc/banana-pi-heartbeat.env
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-systemd-Service + Timer deployen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - banana-pi-heartbeat.service
    - banana-pi-heartbeat.timer
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-Timer aktivieren
  ansible.builtin.systemd:
    name: banana-pi-heartbeat.timer
    daemon_reload: true
    enabled: true
    state: started
  when: banana_pi_kiosk_enabled | bool

- name: Heartbeat-Timer deaktivieren (banana_pi_kiosk_enabled false)
  ansible.builtin.systemd:
    name: banana-pi-heartbeat.timer
    enabled: false
    state: stopped
  when: not (banana_pi_kiosk_enabled | bool)
  failed_when: false

- name: Daily-Reboot-systemd-Service + Timer deployen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - banana-pi-daily-reboot.service
    - banana-pi-daily-reboot.timer
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_daily_reboot_enabled | bool
  notify: Restart banana-pi daily reboot timer

- name: Daily-Reboot-Timer aktivieren
  ansible.builtin.systemd:
    name: banana-pi-daily-reboot.timer
    daemon_reload: true
    enabled: true
    state: started
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_daily_reboot_enabled | bool

- name: Daily-Reboot-Timer deaktivieren (banana_pi_kiosk_daily_reboot_enabled false)
  ansible.builtin.systemd:
    name: banana-pi-daily-reboot.timer
    enabled: false
    state: stopped
  when: not (banana_pi_kiosk_daily_reboot_enabled | bool) or not (banana_pi_kiosk_enabled | bool)
  failed_when: false
