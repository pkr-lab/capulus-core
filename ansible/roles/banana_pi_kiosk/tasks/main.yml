---
# ============================================================
# banana_pi_kiosk role — Banana-Pi-Alarmmonitor (ALAMOS AMweb, Armbian)
# ============================================================
# Wie alamos_kiosk (Raspberry Pi), aber fuer Armbian/Debian statt
# Raspberry Pi OS: anderer Chromium-Paketname, kein Imager-Autologin-
# Schalter (wird hier per getty-Drop-in + .bash_profile + startx
# nachgebildet), und ein lokaler Failover-Supervisor, der bei
# Nichterreichbarkeit von alamos-apager auf eine lokal hinterlegte,
# Vault-verschluesselte Fallback-URL umschaltet (siehe
# docs/45-vereinsheim-alarmmonitor.md und docs/19-alamos-apager.md).
# ============================================================

- name: Sicherstellen dass banana_pi_kiosk_station gesetzt ist
  ansible.builtin.assert:
    that:
      - banana_pi_kiosk_station is defined
      - banana_pi_kiosk_station | length > 0
    fail_msg: >-
      banana_pi_kiosk_station ist nicht gesetzt. Pro Host in
      ansible/inventory/hosts.yml (Gruppe banana_pis) als Host-Var setzen
      (muss zu einem Key im SealedSecret alamos-apager-stations passen).
  when: banana_pi_kiosk_enabled | bool

- name: Sicherstellen dass banana_pi_kiosk_fallback_url gesetzt und entschluesselt ist
  ansible.builtin.assert:
    that:
      - banana_pi_kiosk_fallback_url is defined
      - banana_pi_kiosk_fallback_url | length > 0
      - "'CHANGE-ME' not in banana_pi_kiosk_fallback_url"
    fail_msg: >-
      banana_pi_kiosk_fallback_url ist nicht gesetzt (oder noch der
      Platzhalter aus host_vars/{{ inventory_hostname }}/vault.yml). Echte
      ALAMOS-AMweb-URL per `ansible-vault encrypt_string` eintragen — siehe
      Kommentar in dieser Datei und docs/45-vereinsheim-alarmmonitor.md.
  when: banana_pi_kiosk_enabled | bool

- name: Kiosk-Pakete installieren (Debian-Paketnamen, nicht Raspbian)
  ansible.builtin.apt:
    name:
      - chromium
      - xserver-xorg
      - xinit
      - openbox
      - unclutter
      - x11-xserver-utils
      - curl
      - scrot
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: banana_pi_kiosk_enabled | bool

# ---- Homeserver-Root-CA vertrauen (https://*.homeserver, siehe docs/54-internal-tls.md) --
# Anders als die uebrigen Geraete in docs/54 ("Client-Geraete", dort bewusst
# manuell -- kein Remote-Zugriff/kein einheitlicher OS-Mechanismus) ist
# dieser Pi bereits Ansible-verwaltet, daher hier automatisiert statt
# manuell nachgezogen. Quelle bleibt EINZIG das committete
# docs/assets/homeserver-root-ca.pem (keine Kopie im Rollen-files/-
# Verzeichnis) -- sonst muesste eine kuenftige CA-Rotation (docs/54,
# Abschnitt "CA laeuft aus / CA-Key kompromittiert") zusaetzlich hier
# nachgepflegt werden.
- name: Homeserver-Root-CA-Zertifikat deployen
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docs/assets/homeserver-root-ca.pem"
    dest: /usr/local/share/ca-certificates/homeserver-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Homeserver-CA-Vertrauensspeicher aktualisieren

# ---- Vorinstallierten Display-Manager deaktivieren -----------------------
# Das Armbian-Image bringt lightdm mit, das beim Boot eine eigene X-Session
# auf :0 (tty7) startet — parallel zu unserer eigenen manuellen X-Session
# auf :1 (tty1) via Autologin unten. Auf einem 2-GB-RAM-Geraet unnoetiger
# Speicherverbrauch und moeglicher Mitverursacher der Chromium-Absturz-
# schleife (siehe docs/45-vereinsheim-alarmmonitor.md). "failed_when: false",
# da der Dienst je nach Image ggf. gar nicht existiert.
- name: lightdm stoppen und deaktivieren (falls vorhanden)
  ansible.builtin.systemd:
    name: lightdm
    enabled: false
    state: stopped
    masked: true
  when: banana_pi_kiosk_enabled | bool
  failed_when: false

# ---- Autologin auf tty1 (kein Raspberry-Pi-Imager-Schalter auf Armbian) --
- name: Verzeichnis fuer getty@tty1-Drop-in anlegen
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

- name: Autologin-Drop-in fuer getty@tty1 deployen
  ansible.builtin.template:
    src: getty-autologin.conf.j2
    dest: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Reload getty@tty1

- name: ".bash_profile von {{ banana_pi_kiosk_user }} um automatischen startx-Aufruf ergaenzen"
  ansible.builtin.blockinfile:
    path: "/home/{{ banana_pi_kiosk_user }}/.bash_profile"
    create: true
    owner: "{{ banana_pi_kiosk_user }}"
    group: "{{ banana_pi_kiosk_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (banana_pi_kiosk role)"
    block: |
      if [ -z "${DISPLAY:-}" ] && [ "$(tty)" = "/dev/tty1" ]; then
        exec startx -- -nocursor
      fi
  when: banana_pi_kiosk_enabled | bool

- name: .xinitrc deployen
  ansible.builtin.template:
    src: xinitrc.j2
    dest: "/home/{{ banana_pi_kiosk_user }}/.xinitrc"
    owner: "{{ banana_pi_kiosk_user }}"
    group: "{{ banana_pi_kiosk_user }}"
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

# ---- Kiosk-Supervisor (Normalbetrieb + lokaler Server-Fallback) --------
# notify noetig: das Skript laeuft als lang lebender Prozess (X-Session-
# Client, exec'd aus .xinitrc) mit BASE_URL etc. bereits als Bash-Variable
# im Prozessspeicher -- ein neu auf die Platte geschriebenes Template
# aendert daran ohne Neustart nichts (Skript liest sich nicht selbst neu
# ein). Gleicher Neustart-Weg wie beim taeglichen Session-Neustart (siehe
# templates/banana-pi-daily-reboot.service.j2): NUR die tty1-Session
# durchstarten, kein Kernel-Reboot (auf diesem Board unzuverlaessig).
- name: Kiosk-Supervisor-Skript deployen
  ansible.builtin.template:
    src: banana-pi-kiosk-supervisor.sh.j2
    dest: /usr/local/bin/banana-pi-kiosk-supervisor.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool
  notify: Reload getty@tty1

# ---- On-Demand-Screenshot (manuelle Sichtpruefung, kein Automatismus) ---
# Bewusst kein Timer/Dienst (kein x11vnc, kein Cron) -- nur ein Skript, das
# bei Bedarf per SSH ausgefuehrt wird, siehe
# docs/45-vereinsheim-alarmmonitor.md, "Sichtpruefung ohne physischen
# Zugriff". Vermeidet einen staendig offenen/laufenden Zugriffspfad.
- name: Screenshot-Skript deployen
  ansible.builtin.template:
    src: banana-pi-screenshot.sh.j2
    dest: /usr/local/bin/banana-pi-screenshot.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool

# ---- Heartbeat (zentraler ntfy-Ausfall-Alarm in alamos-apager) ---------
- name: Heartbeat-Skript deployen
  ansible.builtin.copy:
    src: banana-pi-heartbeat.sh
    dest: /usr/local/bin/banana-pi-heartbeat.sh
    owner: root
    group: root
    mode: "0755"
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-Environment-Datei deployen
  ansible.builtin.template:
    src: banana-pi-heartbeat.env.j2
    dest: /etc/banana-pi-heartbeat.env
    owner: root
    group: root
    mode: "0644"
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-systemd-Service + Timer deployen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - banana-pi-heartbeat.service
    - banana-pi-heartbeat.timer
  when: banana_pi_kiosk_enabled | bool
  notify: Restart banana-pi heartbeat timer

- name: Heartbeat-Timer aktivieren
  ansible.builtin.systemd:
    name: banana-pi-heartbeat.timer
    daemon_reload: true
    enabled: true
    state: started
  when: banana_pi_kiosk_enabled | bool

- name: Heartbeat-Timer deaktivieren (banana_pi_kiosk_enabled false)
  ansible.builtin.systemd:
    name: banana-pi-heartbeat.timer
    enabled: false
    state: stopped
  when: not (banana_pi_kiosk_enabled | bool)
  failed_when: false

# ---- Taeglicher Kiosk-Session-Neustart (kein Kernel-Reboot) --------------
- name: Daily-Reboot-systemd-Service + Timer deployen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - banana-pi-daily-reboot.service
    - banana-pi-daily-reboot.timer
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_daily_reboot_enabled | bool
  notify: Restart banana-pi daily reboot timer

- name: Daily-Reboot-Timer aktivieren
  ansible.builtin.systemd:
    name: banana-pi-daily-reboot.timer
    daemon_reload: true
    enabled: true
    state: started
  when: banana_pi_kiosk_enabled | bool and banana_pi_kiosk_daily_reboot_enabled | bool

- name: Daily-Reboot-Timer deaktivieren (banana_pi_kiosk_daily_reboot_enabled false)
  ansible.builtin.systemd:
    name: banana-pi-daily-reboot.timer
    enabled: false
    state: stopped
  when: not (banana_pi_kiosk_daily_reboot_enabled | bool) or not (banana_pi_kiosk_enabled | bool)
  failed_when: false
