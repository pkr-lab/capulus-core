---

- name: Public Key des cluster-power-manager vom Homeserver lesen
  ansible.builtin.slurp:
    src: "{{ cluster_power_manager_ssh_key_path }}.pub"
  delegate_to: "{{ groups['homeservers'][0] }}"
  become: true
  register: cluster_power_manager_pubkey

- name: cluster-power-manager-Key autorisieren (nur für poweroff, forced command)
  ansible.posix.authorized_key:
    user: "{{ cluster_power_manager_ssh_user }}"
    state: present
    key: "{{ cluster_power_manager_pubkey.content | b64decode | trim }}"
    key_options: >-
      command="sudo {{ cluster_power_manager_poweroff_bin }}",no-agent-forwarding,no-port-forwarding,no-pty,no-X11-forwarding
    comment: "cluster-power-manager@homeserver"

- name: Passwortlosen sudo für poweroff erlauben ({{ cluster_power_manager_ssh_user }})
  ansible.builtin.copy:
    dest: /etc/sudoers.d/cluster-power-manager
    content: |
      {{ cluster_power_manager_ssh_user }} ALL=(root) NOPASSWD: {{ cluster_power_manager_poweroff_bin }}
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
