- name: Install gnupg for the key handling
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check whether the CrowdSec repository keyring exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: crowdsec_keyring

- name: Download CrowdSec repository key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /tmp/crowdsec-repo.gpgkey
    mode: '0600'
  when: not crowdsec_keyring.stat.exists

- name: Create temporary GnuPG home
  ansible.builtin.tempfile:
    state: directory
    prefix: crowdsec-gnupg-
  register: crowdsec_gnupg_home
  changed_when: false

- name: Convert CrowdSec repository key to a keyring
  ansible.builtin.command: >-
    gpg --homedir {{ crowdsec_gnupg_home.path }} --dearmor
    --output /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg /tmp/crowdsec-repo.gpgkey
  when: not crowdsec_keyring.stat.exists

- name: Remove downloaded CrowdSec repository key
  ansible.builtin.file:
    path: /tmp/crowdsec-repo.gpgkey
    state: absent

- name: Read CrowdSec keyring fingerprint
  ansible.builtin.command: >-
    gpg --homedir {{ crowdsec_gnupg_home.path }} --show-keys --with-colons --fingerprint
    /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
  register: crowdsec_key_info
  changed_when: false

- name: Remove temporary GnuPG home
  ansible.builtin.file:
    path: "{{ crowdsec_gnupg_home.path }}"
    state: absent
  changed_when: false

- name: Verify CrowdSec repository key fingerprint
  ansible.builtin.assert:
    that:
      - "('fpr:::::::::' ~ crowdsec_repo_key_fingerprint ~ ':') in crowdsec_key_info.stdout"
    fail_msg: >-
      Der Fingerprint von /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg weicht von
      crowdsec_repo_key_fingerprint ab. Schlüssel nicht vertrauen, Ursache klären
      (docs/6-hintergruende/60020-ansible-rollen.md, Abschnitt Installer und Prüfsummen).

- name: Write CrowdSec APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    content: |
      deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
      deb-src [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
    owner: root
    group: root
    mode: '0644'

- name: Install crowdsec package
  ansible.builtin.apt:
    name: crowdsec
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: Enable and start crowdsec service
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true

- name: Wait for the local CrowdSec API to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 30

- name: Install crowdsec-firewall-bouncer package (iptables backend, matches UFW)
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"

- name: Enable and start crowdsec-firewall-bouncer service
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true

- name: Install CrowdSec collections
  ansible.builtin.command: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_collections }}"
  register: crowdsec_collection_install
  changed_when: "'already installed' not in crowdsec_collection_install.stdout"
  failed_when: >
    crowdsec_collection_install.rc != 0 and
    'already installed' not in crowdsec_collection_install.stdout

- name: Ensure acquisition.d directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy SSH log acquisition config (journald)
  ansible.builtin.template:
    src: acquis-ssh.yaml.j2
    dest: /etc/crowdsec/acquis.d/ssh.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

- name: Deploy Traefik log acquisition config
  ansible.builtin.template:
    src: acquis-traefik.yaml.j2
    dest: /etc/crowdsec/acquis.d/traefik.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

- name: Deploy CIDR whitelist for LAN + Tailscale
  ansible.builtin.template:
    src: whitelist.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/local-whitelist.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

- name: Flush handlers so acquisition/whitelist changes are live before verifying
  ansible.builtin.meta: flush_handlers

- name: Verify firewall bouncer registered with the local API
  ansible.builtin.command: cscli bouncers list -o json
  register: crowdsec_bouncers
  changed_when: false

- name: Warn if no bouncer is registered
  ansible.builtin.debug:
    msg: >
      WARNING: `cscli bouncers list` returned no registered bouncer.
      crowdsec-firewall-bouncer likely failed to auto-register — check
      `journalctl -u crowdsec-firewall-bouncer` and docs/d-sicherheit/d0020-crowdsec.md.
  when: "'[]' in crowdsec_bouncers.stdout"
