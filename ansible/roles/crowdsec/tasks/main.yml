# ============================================================
# crowdsec/tasks/main.yml — Brute-force protection (SSH + Traefik)
# ============================================================

# ---- Repository ------------------------------------------------
- name: Check whether cscli is already installed
  ansible.builtin.stat:
    path: /usr/bin/cscli
  register: crowdsec_cscli_present

- name: Download official CrowdSec repository install script
  ansible.builtin.get_url:
    url: https://install.crowdsec.net
    dest: /tmp/crowdsec-install.sh
    mode: '0700'
  when: not crowdsec_cscli_present.stat.exists

- name: Run CrowdSec repository install script
  ansible.builtin.command: /tmp/crowdsec-install.sh
  when: not crowdsec_cscli_present.stat.exists
  changed_when: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# ---- Install crowdsec (LAPI + agent) first ----------------------
- name: Install crowdsec package
  ansible.builtin.apt:
    name: crowdsec
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: Enable and start crowdsec service
  ansible.builtin.systemd:
    name: crowdsec
    state: started
    enabled: true

- name: Wait for the local CrowdSec API to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 30

# ---- Install the firewall bouncer AFTER crowdsec is running -----
- name: Install crowdsec-firewall-bouncer package (iptables backend, matches UFW)
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer-iptables
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"

- name: Enable and start crowdsec-firewall-bouncer service
  ansible.builtin.systemd:
    name: crowdsec-firewall-bouncer
    state: started
    enabled: true

# ---- Collections --------------------------------------------------
- name: Install CrowdSec collections
  ansible.builtin.command: "cscli collections install {{ item }}"
  loop: "{{ crowdsec_collections }}"
  register: crowdsec_collection_install
  changed_when: "'already installed' not in crowdsec_collection_install.stdout"
  failed_when: >
    crowdsec_collection_install.rc != 0 and
    'already installed' not in crowdsec_collection_install.stdout

# ---- Acquisition sources -------------------------------------------
- name: Ensure acquisition.d directory exists
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy SSH log acquisition config (journald)
  ansible.builtin.template:
    src: acquis-ssh.yaml.j2
    dest: /etc/crowdsec/acquis.d/ssh.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

- name: Deploy Traefik log acquisition config
  ansible.builtin.template:
    src: acquis-traefik.yaml.j2
    dest: /etc/crowdsec/acquis.d/traefik.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

# ---- Whitelist LAN + Tailscale so nobody bans themselves -----------
- name: Deploy CIDR whitelist for LAN + Tailscale
  ansible.builtin.template:
    src: whitelist.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/local-whitelist.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart crowdsec

- name: Flush handlers so acquisition/whitelist changes are live before verifying
  ansible.builtin.meta: flush_handlers

# ---- Verify -----------------------------------------------------
- name: Verify firewall bouncer registered with the local API
  ansible.builtin.command: cscli bouncers list -o json
  register: crowdsec_bouncers
  changed_when: false

- name: Warn if no bouncer is registered
  ansible.builtin.debug:
    msg: >
      WARNING: `cscli bouncers list` returned no registered bouncer.
      crowdsec-firewall-bouncer likely failed to auto-register — check
      `journalctl -u crowdsec-firewall-bouncer` and docs/d-sicherheit/d0020-crowdsec.md.
  when: "'[]' in crowdsec_bouncers.stdout"
