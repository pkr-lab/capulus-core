---

- name: CUPS-/Drucker-Pakete installieren
  ansible.builtin.apt:
    name: "{{ cups_print_server_packages }}"
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true
  when: cups_print_server_enabled | bool

- name: Admin-Nutzer zur lpadmin-Gruppe hinzufügen
  ansible.builtin.user:
    name: "{{ item }}"
    groups: lpadmin
    append: true
  loop: "{{ cups_print_server_admin_users }}"
  when: cups_print_server_enabled | bool

- name: cups + avahi-daemon aktivieren und starten
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - cups
    - avahi-daemon
  when: cups_print_server_enabled | bool

- name: Warten, bis cupsd auf Port 631 antwortet
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 631
    delay: 2
    timeout: 30
  when: cups_print_server_enabled | bool

- name: Aktuelle cupsd-Einstellungen auslesen
  ansible.builtin.command: cupsctl
  register: cups_print_server_current_settings
  changed_when: false
  when: cups_print_server_enabled | bool

- name: CUPS-Sharing/Remote-Zugriff setzen
  ansible.builtin.command:
    argv:
      - cupsctl
      - "{{ '--remote-admin' if cups_print_server_remote_admin | bool else '--no-remote-admin' }}"
      - "{{ '--remote-any' if cups_print_server_remote_any | bool else '--no-remote-any' }}"
      - "{{ '--share-printers' if cups_print_server_share_printers | bool else '--no-share-printers' }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - >-
      ('_remote_admin=' ~ (1 if cups_print_server_remote_admin | bool else 0) not in cups_print_server_current_settings.stdout)
      or ('_remote_any=' ~ (1 if cups_print_server_remote_any | bool else 0) not in cups_print_server_current_settings.stdout)
      or ('_share_printers=' ~ (1 if cups_print_server_share_printers | bool else 0) not in cups_print_server_current_settings.stdout)

- name: Build-Abhängigkeiten für den QPDL-Treiber installieren
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - libcups2-dev
      - pkg-config
    state: present
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: QPDL-Treiber-Quellcode klonen (gepinnter Commit)
  ansible.builtin.git:
    repo: "{{ cups_print_server_qpdl_repo }}"
    dest: "{{ cups_print_server_qpdl_build_dir }}"
    version: "{{ cups_print_server_qpdl_repo_version }}"
    force: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: "Patch: PPDFile::getDefaultChoice() deklarieren (ppdfile.h)"
  ansible.builtin.blockinfile:
    path: "{{ cups_print_server_qpdl_build_dir }}/splix/include/ppdfile.h"
    marker: "// {mark} ANSIBLE MANAGED BLOCK — cups_print_server PageSize-Fallback"
    insertafter: 'Value\s+getPageSize\(const char \*name\);'
    block: |
        /**
          * capulus-core: Fallback, falls cupsd keine per Job
          * aufgelöste Option weitergibt — liest den PPD-eigenen
          * *DefaultXxx-Wert direkt, ohne ppdFindMarkedChoice().
          * Siehe docs/2-betrieb-hardware/20040-printer.md.
          */
        Value                   getDefaultChoice(const char *name);
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: "Patch: PPDFile::getDefaultChoice() implementieren (ppdfile.cpp)"
  ansible.builtin.blockinfile:
    path: "{{ cups_print_server_qpdl_build_dir }}/splix/src/ppdfile.cpp"
    marker: "// {mark} ANSIBLE MANAGED BLOCK — cups_print_server PageSize-Fallback"
    insertbefore: '^/\* vim: set expandtab tabstop=4 shiftwidth=4 smarttab tw=80 cin enc=utf8: \*/$'
    block: |
      PPDValue PPDFile::getDefaultChoice(const char *name)
      {
          ppd_option_t *opt;
          PPDValue val;

          if (!(opt = ppdFindOption(_ppd, name)) || !opt->defchoice[0])
              return val;
          val.set(opt->defchoice);
          return val;
      }

  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: "Patch: Printer::loadInformation() nutzt den PageSize-Fallback (printer.cpp)"
  ansible.builtin.blockinfile:
    path: "{{ cups_print_server_qpdl_build_dir }}/splix/src/printer.cpp"
    marker: "    // {mark} ANSIBLE MANAGED BLOCK — cups_print_server PageSize-Fallback"
    insertbefore: '^    if \(!paperType\) \{$'
    block: |
        if (!paperType)
            paperType = request.ppd()->getDefaultChoice("PageSize");
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: QPDL-Filter kompilieren
  ansible.builtin.command:
    cmd: make DISABLE_JBIG=1
    chdir: "{{ cups_print_server_qpdl_build_dir }}/splix"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: QPDL-Filter + PPDs installieren
  ansible.builtin.command:
    cmd: make install DISABLE_JBIG=1
    chdir: "{{ cups_print_server_qpdl_build_dir }}/splix"
  register: cups_print_server_qpdl_install
  changed_when: true
  notify: Restart cups
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: Install-Ausgabe des QPDL-Treibers anzeigen
  ansible.builtin.debug:
    msg: "{{ cups_print_server_qpdl_install.stdout_lines | default([]) }}"
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_build_qpdl_driver | bool

- name: Handler sofort ausführen, damit lpinfo -m die neue PPD sieht
  ansible.builtin.meta: flush_handlers

- name: Verfügbare Drucker-Device-URIs ermitteln
  ansible.builtin.command: lpinfo -v
  register: cups_print_server_detected_devices
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: cups_print_server_detected_devices.rc == 0
  when: cups_print_server_enabled | bool

- name: Erkannte Device-URIs anzeigen
  ansible.builtin.debug:
    msg: "{{ cups_print_server_detected_devices.stdout_lines | default([]) }}"
  when: cups_print_server_enabled | bool

- name: Verfügbare PPDs ermitteln
  ansible.builtin.command: lpinfo -m
  register: cups_print_server_available_ppds
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: cups_print_server_available_ppds.rc == 0
  when: cups_print_server_enabled | bool

- name: Samsung/SPL-passende PPDs anzeigen
  ansible.builtin.debug:
    msg: >-
      {{ cups_print_server_available_ppds.stdout_lines
         | default([])
         | select('search', '(?i)samsung|spl')
         | list
         | default(['(keine gefunden — siehe docs/2-betrieb-hardware/20040-printer.md für Alternativen)'], true) }}
  when: cups_print_server_enabled | bool

- name: Warnen, wenn Device-URI/PPD noch nicht gesetzt sind
  ansible.builtin.debug:
    msg: >-
      cups_print_server_device_uri und/oder cups_print_server_ppd sind noch
      leer — die Warteschlange wird NICHT angelegt. Werte aus den
      lpinfo-Ausgaben oben übernehmen und in ansible/group_vars/all.yml
      eintragen, dann die Rolle erneut laufen lassen
      (`make cups-print-server`). Siehe docs/2-betrieb-hardware/20040-printer.md.
  when:
    - cups_print_server_enabled | bool
    - (cups_print_server_device_uri | length == 0) or (cups_print_server_ppd | length == 0)

- name: Druckerwarteschlange anlegen/aktualisieren
  ansible.builtin.command:
    argv:
      - lpadmin
      - "-p"
      - "{{ cups_print_server_printer_name }}"
      - "-E"
      - "-v"
      - "{{ cups_print_server_device_uri }}"
      - "-m"
      - "{{ cups_print_server_ppd }}"
      - "-D"
      - "{{ cups_print_server_printer_description }}"
      - "-L"
      - "{{ cups_print_server_printer_location }}"
      - "-o"
      - "printer-is-shared=true"
      - "-o"
      - "PageSize={{ cups_print_server_media_size }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_device_uri | length > 0
    - cups_print_server_ppd | length > 0

- name: Warteschlange aktivieren
  ansible.builtin.command:
    argv: ["cupsenable", "{{ cups_print_server_printer_name }}"]
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_device_uri | length > 0
    - cups_print_server_ppd | length > 0

- name: Job-Annahme für Warteschlange aktivieren
  ansible.builtin.command:
    argv: ["cupsaccept", "{{ cups_print_server_printer_name }}"]
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_device_uri | length > 0
    - cups_print_server_ppd | length > 0

- name: Warteschlange als System-Default setzen
  ansible.builtin.command:
    argv: ["lpoptions", "-d", "{{ cups_print_server_printer_name }}"]
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_set_default | bool
    - cups_print_server_device_uri | length > 0
    - cups_print_server_ppd | length > 0

- name: "Extra-Queues: Splix-Katalog nach passenden PPDs durchsuchen (Debug)"
  ansible.builtin.debug:
    msg: >-
      {{ cups_print_server_available_ppds.stdout_lines
         | default([])
         | select('search', '(?i)splix|samsung|spl')
         | list
         | default(['(keine gefunden — siehe docs/2-betrieb-hardware/20040-printer.md)'], true) }}
  when:
    - cups_print_server_enabled | bool
    - cups_print_server_extra_queues | length > 0

- name: "Extra-Queues: warnen, wenn ppd noch nicht gesetzt ist"
  ansible.builtin.debug:
    msg: >-
      Queue "{{ item.name }}": ppd ist noch leer — wird NICHT angelegt.
      Passenden Treffer aus der Splix-Katalog-Debug-Ausgabe oben in
      cups_print_server_extra_queues eintragen. Siehe docs/2-betrieb-hardware/20040-printer.md.
  loop: "{{ cups_print_server_extra_queues }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - cups_print_server_enabled | bool
    - (item.ppd | default('')) | length == 0

- name: "Extra-Queues: Warteschlange anlegen/aktualisieren"
  ansible.builtin.command:
    argv:
      - lpadmin
      - "-p"
      - "{{ item.name }}"
      - "-E"
      - "-v"
      - "{{ item.device_uri }}"
      - "-m"
      - "{{ item.ppd }}"
      - "-D"
      - "{{ item.description | default(item.name) }}"
      - "-L"
      - "{{ item.location | default('') }}"
      - "-o"
      - "printer-is-shared=true"
      - "-o"
      - "PageSize={{ item.media_size | default('A4') }}"
  loop: "{{ cups_print_server_extra_queues }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - (item.ppd | default('')) | length > 0
    - (item.device_uri | default('')) | length > 0

- name: "Extra-Queues: Warteschlange aktivieren"
  ansible.builtin.command:
    argv: ["cupsenable", "{{ item.name }}"]
  loop: "{{ cups_print_server_extra_queues }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - (item.ppd | default('')) | length > 0
    - (item.device_uri | default('')) | length > 0

- name: "Extra-Queues: Job-Annahme aktivieren"
  ansible.builtin.command:
    argv: ["cupsaccept", "{{ item.name }}"]
  loop: "{{ cups_print_server_extra_queues }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - (item.ppd | default('')) | length > 0
    - (item.device_uri | default('')) | length > 0

- name: "Extra-Queues: als System-Default setzen (falls gewünscht)"
  ansible.builtin.command:
    argv: ["lpoptions", "-d", "{{ item.name }}"]
  loop: "{{ cups_print_server_extra_queues }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true
  when:
    - cups_print_server_enabled | bool
    - item.set_default | default(false) | bool
    - (item.ppd | default('')) | length > 0
    - (item.device_uri | default('')) | length > 0

- name: Status aller Warteschlangen anzeigen
  ansible.builtin.command: lpstat -t
  register: cups_print_server_status
  changed_when: false
  failed_when: false
  when: cups_print_server_enabled | bool

- name: Warteschlangen-Status ausgeben
  ansible.builtin.debug:
    msg: "{{ cups_print_server_status.stdout_lines | default([]) }}"
  when: cups_print_server_enabled | bool
