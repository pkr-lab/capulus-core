---

- name: ethtool installieren (für EEE-Konfiguration)
  ansible.builtin.apt:
    name: ethtool
    state: present
    update_cache: true
  when: disable_eee_enabled | bool

- name: systemd-Unit zur EEE-Deaktivierung beim Boot deployen
  ansible.builtin.template:
    src: disable-eee.service.j2
    dest: /etc/systemd/system/disable-eee.service
    owner: root
    group: root
    mode: "0644"
  when: disable_eee_enabled | bool
  register: disable_eee_unit

- name: disable-eee.service aktivieren und (neu) starten
  ansible.builtin.systemd:
    name: disable-eee.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if disable_eee_unit.changed else 'started' }}"
  when: disable_eee_enabled | bool

- name: disable-eee.service deaktivieren, falls disable_eee_enabled false
  ansible.builtin.systemd:
    name: disable-eee.service
    enabled: false
    state: stopped
  when: not (disable_eee_enabled | bool)
  failed_when: false
