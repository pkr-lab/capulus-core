---
# Handler laufen in der Reihenfolge dieser Datei: erst systemd neu laden (Drop-ins),
# dann dnsmasq neu starten, damit der Neustart die neuen Unit-Einstellungen bekommt.
- name: systemd nach dnsmasq-Drop-in neu laden
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    state: restarted

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
