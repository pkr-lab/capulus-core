---

- name: Install dnsmasq
  ansible.builtin.apt:
    name: dnsmasq
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

- name: Deploy dnsmasq configuration
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

# dnsmasq ist beim Boot der DNS-Dienst fuer das ganze LAN und fuer die PROD-VM. Das Debian-
# Unit hat kein Restart=: stuerzt dnsmasq beim Start ab (z. B. Konflikt bind-interfaces/
# bind-dynamic durch den libvirt-Snippet, Vorfall 2026-09-18 und 2026-09-24), bleibt er
# bis zum naechsten Eingriff tot. Neustart bei Fehlern, ohne Start-Limit (sonst gibt
# systemd nach 5 Versuchen auf).
- name: dnsmasq - automatischer Neustart bei Fehlern (systemd-Drop-in)
  block:
    - name: Drop-in-Verzeichnis anlegen
      ansible.builtin.file:
        path: /etc/systemd/system/dnsmasq.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in schreiben
      ansible.builtin.copy:
        dest: /etc/systemd/system/dnsmasq.service.d/10-restart.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (dnsmasq role).
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=on-failure
          RestartSec=5
      notify: systemd nach dnsmasq-Drop-in neu laden

- name: Allow DNS from local subnet (UFW)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
    src: "{{ local_subnet }}"
  loop:
    - tcp
    - udp

- name: Allow DNS from Tailnet (UFW)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
    src: "100.64.0.0/10"
  loop:
    - tcp
    - udp

- name: Enable and start dnsmasq
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point systemd-resolved at dnsmasq (primary) + gateway (fallback)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dnsmasq.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (dnsmasq role).
      # Domains=~. routes ALL host lookups through dnsmasq so *.homeserver
      # resolves locally; dnsmasq itself forwards non-local names to the gateway.
      [Resolve]
      DNS={{ network_static_ip }}
      FallbackDNS={{ network_gateway }}
      Domains=~.
  notify: Restart systemd-resolved

- name: Ensure /etc/resolv.conf is the systemd-resolved stub symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: ../run/systemd/resolve/stub-resolv.conf
    state: link
    force: true
  notify: Restart systemd-resolved
