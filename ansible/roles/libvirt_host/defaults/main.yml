---
# ============================================================
# libvirt_host — Defaults
# ============================================================
# KVM/libvirt auf `homeserver`, NICHT Proxmox (siehe
# docs/4-planung/40030-gitlab-hosting-proxmox-pruefung.md und
# docs/4-planung/40080-multi-cluster-entw-prod-tech.md, Baustein 5) —
# schlankes Paket auf dem bestehenden Ubuntu Server, kein OS-Wechsel.
#
# ACHTUNG Bridge-Task (libvirt_host_configure_bridge): baut die
# physische NIC in eine Linux-Bridge (br0) ein und verschiebt die
# Host-IP darauf. `homeserver` hat nur ein Netzwerkinterface und keine
# Out-of-Band-/Remote-Konsole - ein Fehler hier kann den Host komplett
# vom Netz trennen, ohne dass jemand remote rankommt. Deshalb per
# eigenem Tag (`libvirt-bridge`) von den übrigen, risikoärmeren Tasks
# getrennt und standardmäßig NICHT automatisch mitgezogen
# (libvirt_host_configure_bridge: false) - explizit gegenlesen und mit
# Wartungsfenster/Vor-Ort-Zugriff-Backup fahren, siehe Plan-Doc Phase 2.
# ============================================================

# Master-Schalter fuer die ganze Rolle - bewusst false, bis Phase 2 aus
# dem Plan-Doc (Wartungsfenster + Rollback-Plan) tatsaechlich beginnt.
# Die Rolle steht damit gefahrlos in site.yml, ohne dass ein normaler
# "make install"-Lauf versehentlich anfaengt, eine 24-GiB-VM zu bauen.
libvirt_host_enabled: false

# Bridge-Netzwerk - siehe Warnung oben. Erst auf true setzen, wenn
# Wartungsfenster + Rollback-Plan stehen.
libvirt_host_configure_bridge: false
libvirt_host_bridge_name: br0
libvirt_host_bridge_interface: "{{ network_interface }}" # wiederverwendet aus group_vars/all.yml, Default "eno1"

# Storage-Pool für VM-Disks + gecachte Cloud-Images.
libvirt_host_pool_dir: /var/lib/libvirt/images

# Basis-Cloud-Image (Ubuntu Server 26.04 LTS, "generischer" Cloud-Build
# mit cloud-init vorinstalliert) - wird einmal heruntergeladen, jede VM
# bekommt eine eigene Copy-on-Write-Disk darauf (qemu-img backing file),
# spart Platz gegenüber einer vollen Kopie pro VM.
libvirt_host_base_image_url: "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img" # CHANGE: URL pruefen, sobald 26.04 LTS Cloud-Images offiziell verfuegbar sind
libvirt_host_base_image_name: "ubuntu-26.04-server-cloudimg-amd64.img"

# CHANGE: euer eigener SSH-Public-Key, den cloud-init in den
# "ubuntu"-User jeder VM eintraegt - gleiches Prinzip wie bei den
# bare-metal-Nodes (ansible_user: ubuntu in inventory/hosts.yml), damit
# Ansible sich danach identisch verhaelt.
libvirt_host_admin_ssh_public_key: ""

# Liste der VMs, die dieser Host traegt. Start: nur die PROD-VM aus
# Baustein 5 - Struktur ist bewusst eine Liste, damit spaeter weitere
# VMs (z. B. eine zweite auf worker-1, siehe Node-Zuordnung im Plan)
# ergaenzt werden koennen, ohne die Rolle selbst anzufassen.
libvirt_host_vms:
  - name: prod-vm
    vcpus: 6
    memory_mb: 24576 # 24 GiB, siehe Baustein 5 Sizing-Begruendung
    disk_gb: 100
    ip: "192.168.178.99" # .98 ist bereits infotafel/Xibo, siehe inventory/hosts.yml
    prefix_length: "{{ network_prefix_length }}"
    gateway: "{{ network_gateway }}"
    # Zufaellige, aber stabile MAC noetig, damit die IP-Zuordnung ueber
    # DHCP-Reservierung (falls genutzt) oder wiederholte Ansible-Laeufe
    # konsistent bleibt - CHANGE: eigene, im LAN eindeutige MAC waehlen
    # (z. B. per "openssl rand -hex 5 | sed 's/\(..\)/\1:/g; s/.$//'"
    # unter dem QEMU/KVM-Praefix 52:54:00).
    mac: "52:54:00:00:00:99"
