---

- name: QEMU/KVM + libvirt-Pakete installieren
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - libvirt-daemon-system
      - libvirt-clients
      - bridge-utils
      - virtinst
      - cloud-image-utils
      - genisoimage
    state: present
    update_cache: true
  when: libvirt_host_enabled | bool

- name: Konfliktenden dnsmasq-Snippet von libvirt-daemon-system entschaerfen
  when: libvirt_host_enabled | bool
  block:
    - name: Pruefen, ob der Snippet existiert
      ansible.builtin.stat:
        path: /etc/dnsmasq.d/libvirt-daemon
      register: libvirt_host_dnsmasq_snippet

    - name: Symlink auf das Paket-Original entfernen
      ansible.builtin.file:
        path: /etc/dnsmasq.d/libvirt-daemon
        state: absent
      when: libvirt_host_dnsmasq_snippet.stat.islnk | default(false)

    - name: Leeren Platzhalter anlegen (blockt die Neuanlage des Symlinks durch Upgrades)
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/libvirt-daemon
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (libvirt_host role): bewusst leer.
          # libvirt-daemon-config-network legt hier bei jedem Upgrade einen Symlink
          # mit "bind-interfaces" an - kollidiert mit "bind-dynamic" in /etc/dnsmasq.conf.
      notify: System-dnsmasq nach Snippet-Entschaerfung neu starten

    - name: Handler sofort ausfuehren (System-dnsmasq moeglichst schnell wieder hochbringen)
      ansible.builtin.meta: flush_handlers

- name: libvirtd aktivieren und starten
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started
  when: libvirt_host_enabled | bool

- name: libvirt-guests - Verhalten beim Host-Shutdown und -Boot festlegen
  ansible.builtin.lineinfile:
    path: /etc/default/libvirt-guests
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: false
  loop:
    - { key: ON_BOOT, value: "{{ libvirt_host_guests_on_boot }}" }
    - { key: ON_SHUTDOWN, value: "{{ libvirt_host_guests_on_shutdown }}" }
    - { key: SHUTDOWN_TIMEOUT, value: "{{ libvirt_host_guests_shutdown_timeout }}" }
  when: libvirt_host_enabled | bool

- name: libvirt-guests - Start nach dnsmasq und Tailscale ordnen (systemd-Drop-in)
  when: libvirt_host_enabled | bool
  block:
    - name: Drop-in-Verzeichnis anlegen
      ansible.builtin.file:
        path: /etc/systemd/system/libvirt-guests.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in schreiben
      ansible.builtin.copy:
        dest: /etc/systemd/system/libvirt-guests.service.d/10-ordering.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (libvirt_host role).
          [Unit]
          After=dnsmasq.service tailscaled.service
          Wants=dnsmasq.service
      notify: systemd nach libvirt-guests-Drop-in neu laden

- name: Bridge-Netzwerk einrichten (nur wenn explizit aktiviert)
  when:
    - libvirt_host_enabled | bool
    - libvirt_host_configure_bridge | bool
  tags: [libvirt-bridge]
  block:
    - name: Sicherstellen, dass die Bridge-Parameter plausibel sind
      ansible.builtin.assert:
        that:
          - libvirt_host_bridge_interface != libvirt_host_bridge_name
        fail_msg: >-
          libvirt_host_bridge_interface ({{ libvirt_host_bridge_interface }})
          darf nicht die Bridge ({{ libvirt_host_bridge_name }}) selbst sein.
          In host_vars/<host>/vars.yml libvirt_host_bridge_interface und
          libvirt_host_static_ip explizit setzen.

    - name: Sicherstellen, dass die physische NIC auf dem Host existiert
      ansible.builtin.assert:
        that:
          - libvirt_host_bridge_interface in ansible_facts['interfaces']
        fail_msg: >-
          Interface "{{ libvirt_host_bridge_interface }}" existiert auf
          {{ inventory_hostname }} nicht (vorhanden:
          {{ ansible_facts['interfaces'] | reject('match', '^(veth|cali|flannel|cni|vnet|lo$)') | join(', ') }}).
          Die Bridge wuerde ohne Uplink angelegt und den Host vom LAN
          trennen. Mit `ip -br link` den echten Namen pruefen und in
          host_vars/<host>/vars.yml (bzw. network_interface) korrigieren.

    - name: Vorhandene Netplan-Configs finden
      ansible.builtin.find:
        paths: /etc/netplan
        patterns: ["*.yaml", "*.yml"]
        excludes: ["99-libvirt-bridge.yaml"]
      register: libvirt_host_netplan_existing

    - name: Alte Netplan-Configs entfernen
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ libvirt_host_netplan_existing.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Bridge-Netplan-Konfiguration deployen
      ansible.builtin.template:
        src: bridge-netplan.yaml.j2
        dest: /etc/netplan/99-libvirt-bridge.yaml
        owner: root
        group: root
        mode: "0600"
      register: libvirt_host_netplan_bridge

    - name: Netplan anwenden (Verbindung kann kurz abreissen)
      ansible.builtin.command: netplan apply
      async: 15
      poll: 0
      changed_when: true
      when: libvirt_host_netplan_bridge.changed or libvirt_host_netplan_existing.files | length > 0

    - name: Warten, bis der Host wieder erreichbar ist (jetzt ueber die Bridge)
      ansible.builtin.wait_for:
        host: "{{ libvirt_host_static_ip }}"
        port: 22
        delay: 5
        timeout: 60
      delegate_to: localhost
      become: false
      when: libvirt_host_netplan_bridge.changed or libvirt_host_netplan_existing.files | length > 0

    - name: SSH-Verbindung zuruecksetzen
      ansible.builtin.meta: reset_connection

    - name: UFW installiert?
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: libvirt_host_ufw_binary

    - name: UFW - Verkehr innerhalb der Bridge (LAN <-> VMs) erlauben
      community.general.ufw:
        rule: allow
        route: true
        interface_in: "{{ libvirt_host_bridge_name }}"
        interface_out: "{{ libvirt_host_bridge_name }}"
        comment: "libvirt bridge LAN <-> VM"
      when: libvirt_host_ufw_binary.stat.exists

- name: Storage-Pool-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ libvirt_host_pool_dir }}"
    state: directory
    owner: libvirt-qemu
    group: kvm
    mode: "0751"
  when: libvirt_host_enabled | bool

- name: default-Storage-Pool definieren, falls noch nicht vorhanden
  ansible.builtin.command: >
    virsh pool-define-as default dir --target {{ libvirt_host_pool_dir }}
  register: libvirt_host_pool_define
  changed_when: "'already exists' not in libvirt_host_pool_define.stderr"
  failed_when:
    - libvirt_host_pool_define.rc != 0
    - "'already exists' not in libvirt_host_pool_define.stderr"
  when: libvirt_host_enabled | bool

- name: default-Storage-Pool starten + autostart aktivieren
  ansible.builtin.command: "{{ item }}"
  loop:
    - virsh pool-start default
    - virsh pool-autostart default
  register: libvirt_host_pool_start
  changed_when: "'already active' not in libvirt_host_pool_start.stderr"
  failed_when:
    - libvirt_host_pool_start.rc != 0
    - "'already active' not in libvirt_host_pool_start.stderr"
  when: libvirt_host_enabled | bool

# NUR herunterladen, wenn die Datei noch fehlt - niemals ersetzen. get_url
# schickt bei vorhandenem dest ein If-Modified-Since und ueberschreibt die Datei,
# sobald Canonical unter derselben URL ein neueres Build veroeffentlicht. Das
# passierte bei jedem taeglichen Semaphore-Lauf (06:00) und hat die Basis der
# VM-Disks ausgetauscht (Vorfall 2026-09-23, docs/5-incidents/50010-...).
# Neue VMs kopieren das Image in eine eigene Disk (vm.yml), das Basis-Image
# dient nur noch als Vorlage fuer NEUE VMs.
- name: Pruefen, ob das Basis-Cloud-Image schon vorhanden ist
  ansible.builtin.stat:
    path: "{{ libvirt_host_pool_dir }}/{{ libvirt_host_base_image_name }}"
  register: libvirt_host_base_image
  when: libvirt_host_enabled | bool

- name: Basis-Cloud-Image herunterladen (nur wenn es fehlt, bestehende Datei wird nie ersetzt)
  ansible.builtin.get_url:
    url: "{{ libvirt_host_base_image_url }}"
    dest: "{{ libvirt_host_pool_dir }}/{{ libvirt_host_base_image_name }}"
    mode: "0644"
    force: false
  when:
    - libvirt_host_enabled | bool
    - not libvirt_host_base_image.stat.exists

- name: Pro VM aus libvirt_host_vms
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ libvirt_host_vms }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"
  when: libvirt_host_enabled | bool
