---

- name: Pruefen, ob die VM-Domain bereits existiert
  ansible.builtin.command: "virsh dominfo {{ vm.name }}"
  register: libvirt_host_vm_exists
  changed_when: false
  failed_when: false

# EIGENSTAENDIGE Disk (kein Backing-File): eine Kopie des Basis-Images, danach
# auf die gewuenschte Groesse vergroessert. Ein Overlay auf dem Basis-Image
# wurde unbrauchbar, als das Basis-Image ausgetauscht wurde (Vorfall
# 2026-09-23, docs/5-incidents/50010-prod-vm-basis-image-ersetzt.md).
# Kostet nur den tatsaechlich belegten Platz (~3 GB), nicht die virtuelle Groesse.
- name: Eigenstaendige Disk fuer die VM aus dem Basis-Image anlegen (ueberspringt, falls sie schon existiert)
  ansible.builtin.command: >
    qemu-img convert -O qcow2
    {{ libvirt_host_pool_dir }}/{{ libvirt_host_base_image_name }}
    {{ libvirt_host_pool_dir }}/{{ vm.name }}.qcow2
  args:
    creates: "{{ libvirt_host_pool_dir }}/{{ vm.name }}.qcow2"
  register: libvirt_host_vm_disk_created
  when: libvirt_host_vm_exists.rc != 0

- name: Disk auf die konfigurierte Groesse vergroessern
  ansible.builtin.command: >
    qemu-img resize {{ libvirt_host_pool_dir }}/{{ vm.name }}.qcow2 {{ vm.disk_gb }}G
  changed_when: true
  when:
    - libvirt_host_vm_exists.rc != 0
    - libvirt_host_vm_disk_created is changed

# Bestehende VMs (vor dieser Aenderung angelegt) haengen noch als Overlay am
# Basis-Image. Ersetzt jemand die Basis-Datei von Hand, startet die VM nicht mehr.
# Nur eine Warnung, kein Umbau: das Aufloesen braucht eine ausgeschaltete VM
# (Runbook: docs/5-incidents/50010-prod-vm-basis-image-ersetzt.md).
- name: Pruefen, ob die Disk einer bestehenden VM noch ein Backing-File hat
  ansible.builtin.command: >
    qemu-img info --force-share --output=json
    {{ libvirt_host_pool_dir }}/{{ vm.name }}.qcow2
  register: libvirt_host_vm_disk_info
  changed_when: false
  failed_when: false
  when: libvirt_host_vm_exists.rc == 0

- name: Warnen, wenn die Disk einer bestehenden VM am Basis-Image haengt
  ansible.builtin.debug:
    msg: >-
      WARNUNG: Die Disk von {{ vm.name }} ist ein Overlay auf
      {{ (libvirt_host_vm_disk_info.stdout | from_json)['full-backing-filename'] }}.
      Wird diese Datei ersetzt oder geloescht, startet die VM nicht mehr. Disk bei
      ausgeschalteter VM per `qemu-img convert` unabhaengig machen, siehe
      docs/5-incidents/50010-prod-vm-basis-image-ersetzt.md.
  when:
    - libvirt_host_vm_exists.rc == 0
    - libvirt_host_vm_disk_info.rc == 0
    - "'full-backing-filename' in (libvirt_host_vm_disk_info.stdout | from_json)"

- name: cloud-init user-data + meta-data + network-config rendern
  ansible.builtin.template:
    src: "cloud-init-{{ item }}.yaml.j2"
    dest: "/tmp/{{ vm.name }}-{{ item }}.yaml"
    mode: "0600"
  loop:
    - user-data
    - meta-data
    - network-config
  when: libvirt_host_vm_exists.rc != 0

- name: cloud-init Seed-ISO erzeugen
  ansible.builtin.command: >
    cloud-localds
    --network-config=/tmp/{{ vm.name }}-network-config.yaml
    {{ libvirt_host_pool_dir }}/{{ vm.name }}-seed.iso
    /tmp/{{ vm.name }}-user-data.yaml
    /tmp/{{ vm.name }}-meta-data.yaml
  args:
    creates: "{{ libvirt_host_pool_dir }}/{{ vm.name }}-seed.iso"
  when: libvirt_host_vm_exists.rc != 0

- name: cloud-init-Temp-Dateien aufraeumen
  ansible.builtin.file:
    path: "/tmp/{{ vm.name }}-{{ item }}.yaml"
    state: absent
  loop: [user-data, meta-data, network-config]
  when: libvirt_host_vm_exists.rc != 0

- name: VM-Domain per virt-install definieren + starten
  ansible.builtin.command: >
    virt-install
    --name {{ vm.name }}
    --memory {{ vm.memory_mb }}
    --vcpus {{ vm.vcpus }}
    --disk path={{ libvirt_host_pool_dir }}/{{ vm.name }}.qcow2,format=qcow2,bus=virtio
    --disk path={{ libvirt_host_pool_dir }}/{{ vm.name }}-seed.iso,device=cdrom
    --network bridge={{ libvirt_host_bridge_name }},mac={{ vm.mac }},model=virtio
    --os-variant ubuntu24.04
    --import
    --noautoconsole
    --autostart
  changed_when: true
  when: libvirt_host_vm_exists.rc != 0

- name: Warten, bis die VM per SSH erreichbar ist (erster Boot + cloud-init dauert etwas)
  ansible.builtin.wait_for:
    host: "{{ vm.ip }}"
    port: 22
    delay: 20
    timeout: 300
  delegate_to: localhost
  become: false
  when: libvirt_host_vm_exists.rc != 0
