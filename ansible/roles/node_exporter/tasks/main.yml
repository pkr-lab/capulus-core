---

- name: prometheus-node-exporter installieren
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: node_exporter_enabled | bool

- name: node_exporter aktivieren und starten
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: node_exporter_enabled | bool

- name: node_exporter deaktivieren (node_exporter_enabled false)
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: false
    state: stopped
  when: not (node_exporter_enabled | bool)
  failed_when: false
