---

- name: Python3 installieren (Laufzeit für power-agent.py)
  ansible.builtin.apt:
    name: python3
    state: present
    update_cache: true
  when: power_agent_enabled | bool

- name: Config-Verzeichnis anlegen
  ansible.builtin.file:
    path: /etc/power-agent
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: power_agent_enabled | bool

- name: Bearer-Token für power-agent erzeugen (falls noch nicht vorhanden)
  ansible.builtin.shell:
    cmd: "umask 077 && openssl rand -hex 32 > {{ power_agent_token_path }}"
    creates: "{{ power_agent_token_path }}"
  when: power_agent_enabled | bool

- name: Token-Datei-Rechte absichern
  ansible.builtin.file:
    path: "{{ power_agent_token_path }}"
    owner: root
    group: root
    mode: "0600"
  when: power_agent_enabled | bool

- name: Erzeugtes Token einlesen
  ansible.builtin.slurp:
    src: "{{ power_agent_token_path }}"
  register: power_agent_token_raw
  when: power_agent_enabled | bool

- name: bekannte hostschlüssel der worker aus der root-known_hosts lesen
  ansible.builtin.command: "ssh-keygen -F {{ item.ansible_host }} -f /root/.ssh/known_hosts"
  check_mode: false
  register: power_agent_known_hosts_lookup
  changed_when: false
  failed_when: false
  loop: "{{ power_agent_targets }}"
  loop_control:
    label: "{{ item.name }}"
  when: power_agent_enabled | bool

- name: hostschlüssel fehlender worker einmalig abrufen
  ansible.builtin.command: "ssh-keyscan -T 5 -t ed25519 {{ item.item.ansible_host }}"
  check_mode: false
  register: power_agent_known_hosts_scan
  changed_when: false
  failed_when: false
  loop: "{{ power_agent_known_hosts_lookup.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - power_agent_enabled | bool
    - item.stdout | default('') | length == 0

- name: known_hosts-zeilen zusammenstellen
  ansible.builtin.set_fact:
    power_agent_known_hosts_lines: >-
      {{ ((power_agent_known_hosts_lookup.results | default([]) | map(attribute='stdout_lines') | flatten)
      + (power_agent_known_hosts_scan.results | default([]) | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten))
      | reject('match', '^#') | reject('equalto', '') | unique | list }}
  when: power_agent_enabled | bool

- name: festes known_hosts für die ssh-aufrufe des power-agent schreiben
  ansible.builtin.copy:
    dest: "{{ power_agent_known_hosts_path }}"
    content: "{{ power_agent_known_hosts_lines | join('\n') }}\n"
    owner: root
    group: root
    mode: "0600"
  when:
    - power_agent_enabled | bool
    - power_agent_known_hosts_lines | length > 0

- name: warnen, wenn kein worker-hostschlüssel gefunden wurde
  ansible.builtin.debug:
    msg: >-
      Für die Worker wurde kein Hostschlüssel gefunden, {{ power_agent_known_hosts_path }} bleibt unverändert.
      Ohne die Datei scheitert der Poweroff der Worker über die App mit Host key verification failed.
  when:
    - power_agent_enabled | bool
    - power_agent_known_hosts_lines | length == 0

- name: power-agent.py deployen
  ansible.builtin.copy:
    src: power-agent.py
    dest: /usr/local/bin/power-agent.py
    owner: root
    group: root
    mode: "0755"
  when: power_agent_enabled | bool
  notify: Restart power agent

- name: Konfiguration templaten
  ansible.builtin.template:
    src: config.env.j2
    dest: /etc/power-agent/config.env
    owner: root
    group: root
    mode: "0600"
  when: power_agent_enabled | bool
  vars:
    power_agent_token: "{{ power_agent_token_raw.content | b64decode | trim }}"
  notify: Restart power agent

- name: systemd-Unit deployen
  ansible.builtin.template:
    src: power-agent.service.j2
    dest: /etc/systemd/system/power-agent.service
    owner: root
    group: root
    mode: "0644"
  when: power_agent_enabled | bool
  notify: Restart power agent

- name: power-agent aktivieren und starten
  ansible.builtin.systemd:
    name: power-agent
    daemon_reload: true
    enabled: true
    state: started
  when: power_agent_enabled | bool

- name: power-agent deaktivieren, falls power_agent_enabled false
  ansible.builtin.systemd:
    name: power-agent
    enabled: false
    state: stopped
  when: not (power_agent_enabled | bool)
  failed_when: false

- name: Hinweis zum Sealed-Secret-Abgleich ausgeben
  ansible.builtin.debug:
    msg: >-
      power-agent-Token liegt in {{ power_agent_token_path }} auf
      {{ inventory_hostname }}. Falls dies ein Ersteinrichtung oder eine
      Token-Rotation war: Wert auslesen und in
      argocd/apps/tech/carplay-api/values.yaml unter secrets.powerAgentToken neu
      versiegeln (kubeseal) — sonst bekommt die App dauerhaft 502 auf
      Helligkeit/Wake/Shutdown. Siehe docs/3-apps-workloads/300d0-carplay-api.md "power-agent".
  when: power_agent_enabled | bool
