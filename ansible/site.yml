---
- name: Home Server Setup
  hosts: homeservers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Display server info
      ansible.builtin.debug:
        msg:
          - "Setting up home server: {{ inventory_hostname }}"
          - "IP: {{ ansible_default_ipv4.address }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "CPU: {{ ansible_processor_count }} cores"
          - "RAM: {{ ansible_memtotal_mb }} MB"

  roles:
    - role: common
      tags: [common, base]
    - role: crowdsec
      tags: [crowdsec, security]
    - role: dnsmasq
      tags: [dnsmasq, dns]
    - role: tailscale
      tags: [tailscale, vpn]
    - role: disable_eee
      tags: [disable-eee, network]
    - role: k3s
      tags: [k3s, kubernetes]
    - role: argocd
      tags: [argocd, gitops]
    - role: semaphore_secrets
      tags: [semaphore, semaphore-secrets]
    - role: thermal_watchdog
      tags: [thermal-watchdog, thermal]
    - role: resource_watchdog
      tags: [resource-watchdog, thermal]
    - role: cluster_power_manager
      tags: [cluster-power-manager, power-management]
    - role: power_agent
      tags: [power-agent, power-management]
    - role: nightly_worker_wake
      tags: [nightly-worker-wake, power-management]
    - role: cups_print_server
      tags: [cups-print-server, printer]

  post_tasks:
    # UFW's nftables backend can silently drop its own default
    # "-i lo -j ACCEPT" rule when its tables are rebuilt while k3s/kube-router
    # hold their own nftables/iptables state on the same host (observed
    # 2026-09-05: broke systemd-resolved's DNS stub, Tailscale check-ins, and
    # local k3s API traffic on port 6444 for ~2 days, while inbound HTTPS kept
    # working fine). Tagged `always` so this safeguard runs on every
    # invocation of this play, even with `--tags` limiting which roles run —
    # see docs/c-netzwerk-dns/c0000-dns-architecture.md → "Nachtrag 2026-09-06".
    - name: Check whether UFW is dropping loopback traffic (known nftables bug)
      ansible.builtin.command: iptables -C ufw-before-input -i lo -j ACCEPT
      register: common_ufw_loopback_check
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Self-heal UFW by disabling/re-enabling to rebuild its nftables tables
      ansible.builtin.command: "{{ item }}"
      loop:
        - ufw disable
        - ufw --force enable
      when: common_ufw_loopback_check.rc != 0
      changed_when: true
      tags: [always]

    - name: Warn that UFW's loopback rule had to be repaired
      ansible.builtin.debug:
        msg: >-
          WARNING: UFW was dropping loopback traffic (missing '-i lo -j
          ACCEPT' in ufw-before-input) — this breaks local DNS resolution,
          Tailscale check-ins, and internal k3s API traffic. UFW was
          disabled/re-enabled to rebuild its nftables tables from
          /etc/ufw/before.rules. See
          docs/c-netzwerk-dns/c0000-dns-architecture.md for details.
      when: common_ufw_loopback_check.rc != 0
      tags: [always]

    - name: Display setup summary
      ansible.builtin.debug:
        msg:
          - "======================================"
          - "Home Server Setup Complete!"
          - "======================================"
          - "ArgoCD UI:    https://{{ ansible_default_ipv4.address }}:30443"
          - "ArgoCD/TS:    https://{{ hostname }}:30443"
          - "Semaphore UI: https://semaphore.tech.homeserver"
          - "kubectl:      kubectl get nodes"
          - "======================================"

# ============================================================
# Distribute the Semaphore SSH key to every managed target so
# Semaphore can SSH in non-interactively. Skipped automatically
# when no target host is defined in the inventory.
# ============================================================
- name: Authorize Semaphore on managed targets
  hosts: semaphore_targets
  become: true
  gather_facts: false
  tags: [semaphore, semaphore-targets]
  roles:
    - role: semaphore_targets

# ============================================================
# After Semaphore is up and reachable, talk to its REST API and
# provision Projects / Keys / Repositories / Inventories /
# Templates so the UI is ready to use with zero manual clicks.
# ============================================================
- name: Bootstrap Semaphore projects via API
  hosts: homeservers
  become: true
  gather_facts: false
  tags: [semaphore, semaphore-bootstrap]
  roles:
    - role: semaphore_bootstrap
