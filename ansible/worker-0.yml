---
# ============================================================
# worker-0 Playbook — provisioniert worker-0 (192.168.178.95).
#
# Seit der Umstellung auf die NAS-gestützte "nas"-StorageClass
# (siehe docs/2-betrieb-hardware/20000-nas-storage.md) ist worker-0 ein reiner k3s-Compute-Node —
# identisch zu worker-1.yml. Die frühere HDD-Rolle (sda) und die
# Docker-Compose-Dienste (Paperless-NGX/TinyTeller) sind entfallen:
# Paperless-NGX läuft als ArgoCD-App, TinyTeller ebenso
# (argocd/apps/prod/tinyteller).
#
# Reihenfolge:
#   1. worker_apt_update — apt update/dist-upgrade (worker-0 bekommt sonst
#      nie ein OS-Update, da es keine common-Rolle nutzt). Läuft
#      normalerweise nachts um 01:00 über nightly_worker_wake auf
#      homeserver, das dieses Playbook per Semaphore-API triggert, siehe
#      docs/2-betrieb-hardware/20030-nightly-worker-update.md. Setzt bei
#      Bedarf auch statische Fallback-Nameserver (worker-0 haengt an einem
#      Fritz-WLAN-Repeater ohne nutzbares DHCPv6-DNS) -- muss deshalb VOR
#      tailscale laufen, das fuer die eigene Paketinstallation selbst
#      funktionierendes DNS braucht.
#   2. tailscale — Ansible-verwaltete Tailscale-Verbindung (vorher manuell/
#      unmanaged installiert, siehe "Fehlerbehebung" in
#      docs/2-betrieb-hardware/20030-nightly-worker-update.md für den
#      Vorfall, der zu dieser Umstellung führte). Erfordert einen eigenen,
#      vault-verschlüsselten tailscale_auth_key in
#      ansible/host_vars/worker-0/vault.yml (der globale Default-Key in
#      group_vars/all.yml ist bereits vom homeserver verbraucht).
#   3. k3s_agent  — tritt dem k3s-Cluster als Worker-Node bei
#      (benötigt laufenden k3s-Server auf homeserver/.94)
#   4. disable_eee — deaktiviert Energy Efficient Ethernet dauerhaft
#      (Vorfall 2026-09-02 auf homeserver: EEE verursachte einen
#      Link-Drop ohne Selbstheilung, siehe ansible/roles/disable_eee)
#   5. thermal_watchdog / resource_watchdog — automatischer Shutdown bei
#      Übertemperatur bzw. anhaltend hoher CPU/RAM-Last
#   6. journal_upload — pusht das Host-journald an VictoriaLogs (der
#      bestehende victoria-logs-collector-DaemonSet liest nur
#      Container-Logs, nicht das journald des Nodes selbst), siehe
#      docs/3-apps-workloads/300j0-logging.md
#   7. wake_on_lan — WoL-Empfangsbereitschaft, damit cluster_power_manager
#      (läuft auf homeserver, siehe ansible/site.yml) diesen Node aus dem
#      ausgeschalteten Zustand aufwecken kann
#   8. cluster_power_manager_target — autorisiert den auf homeserver
#      erzeugten Shutdown-Key hier, beschränkt auf "poweroff" (setzt
#      voraus, dass site.yml bereits gegen homeserver gelaufen ist, sonst
#      existiert der Public Key dort noch nicht)
#   9. Uncordon — stellt sicher dass worker-0 schedulable bleibt
#      (kubectl drain/cordon durch Maintenance-Schritte rückgängig machen)
#
# Run with:
#   make worker-0
# Dry-run:
#   make worker-0-check
# Nur k3s-Agent:
#   make k3s-agent
# ============================================================

- name: Deploy k3s agent and watchdogs on worker-0
  hosts: worker-0
  become: true
  roles:
    - role: worker_apt_update
      tags: [apt-update, updates]
    - role: tailscale
      tags: [tailscale, vpn]
    - role: k3s_agent
      tags: [k3s-agent, kubernetes]
    - role: disable_eee
      tags: [disable-eee, network]
    - role: thermal_watchdog
      tags: [thermal-watchdog, thermal]
    - role: resource_watchdog
      tags: [resource-watchdog, thermal]
    - role: journal_upload
      tags: [journal-upload, logging]
    - role: wake_on_lan
      tags: [wake-on-lan, power-management]
    - role: cluster_power_manager_target
      tags: [cluster-power-manager-target, power-management]

- name: Uncordon worker-0 nach Provisioning
  hosts: homeservers
  become: true
  tags: [uncordon, kubernetes]
  tasks:
    - name: worker-0 schedulable halten
      ansible.builtin.command:
        cmd: kubectl uncordon worker-0
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
      failed_when: >
        uncordon_result.rc != 0 and
        'not found' not in uncordon_result.stderr
