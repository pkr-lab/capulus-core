---
# ============================================================
# worker-0 Playbook — provisioniert worker-0 (192.168.178.95).
#
# Seit der Umstellung auf die NAS-gestützte "nas"-StorageClass
# (siehe docs/16-nas-storage.md) ist worker-0 ein reiner k3s-Compute-Node —
# identisch zu worker-1.yml. Die frühere HDD-Rolle (sda) und die
# Docker-Compose-Dienste (Paperless-NGX/TinyTeller/Day Pilot) sind entfallen:
# Paperless-NGX läuft als ArgoCD-App, TinyTeller/Day Pilot ebenso
# (argocd/apps/tinyteller, argocd/apps/day-pilot).
#
# Reihenfolge:
#   1. k3s_agent  — tritt dem k3s-Cluster als Worker-Node bei
#      (benötigt laufenden k3s-Server auf homeserver/.94)
#   2. Uncordon — stellt sicher dass worker-0 schedulable bleibt
#      (kubectl drain/cordon durch Maintenance-Schritte rückgängig machen)
#
# Run with:
#   make worker-0
# Dry-run:
#   make worker-0-check
# Nur k3s-Agent:
#   make k3s-agent
# ============================================================

- name: Deploy k3s agent and watchdogs on worker-0
  hosts: worker-0
  become: true
  roles:
    - role: k3s_agent
      tags: [k3s-agent, kubernetes]
    - role: thermal_watchdog
      tags: [thermal-watchdog, thermal]
    - role: resource_watchdog
      tags: [resource-watchdog, thermal]

- name: Uncordon worker-0 nach Provisioning
  hosts: homeservers
  become: true
  tags: [uncordon, kubernetes]
  tasks:
    - name: worker-0 schedulable halten
      ansible.builtin.command:
        cmd: kubectl uncordon worker-0
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
      failed_when: >
        uncordon_result.rc != 0 and
        'not found' not in uncordon_result.stderr
