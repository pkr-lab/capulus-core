---

- name: Deploy k3s agent and watchdogs on worker-1
  hosts: worker-1
  become: true
  roles:
    - role: worker_apt_update
      tags: [apt-update, updates]
    - role: tailscale
      tags: [tailscale, vpn]
    - role: k3s_agent
      tags: [k3s-agent, kubernetes]
    - role: disable_eee
      tags: [disable-eee, network]
    - role: thermal_watchdog
      tags: [thermal-watchdog, thermal]
    - role: resource_watchdog
      tags: [resource-watchdog, thermal]
    - role: journal_upload
      tags: [journal-upload, logging]
    - role: smartctl_exporter
      tags: [smartctl-exporter, monitoring]
    - role: wake_on_lan
      tags: [wake-on-lan, power-management]
    - role: cluster_power_manager_target
      tags: [cluster-power-manager-target, power-management]
    - role: libvirt_host
      tags: [libvirt-host, virtualization]

- name: Uncordon worker-1 nach Provisioning
  hosts: homeservers
  become: true
  tags: [uncordon, kubernetes]
  tasks:
    - name: worker-1 schedulable halten
      ansible.builtin.command:
        cmd: kubectl uncordon worker-1
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
      failed_when: >
        uncordon_result.rc != 0 and
        'not found' not in uncordon_result.stderr
