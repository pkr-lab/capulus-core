---
# ============================================================
# Worker-1 Playbook — provisioniert worker-1 (192.168.178.96).
#
# Anders als worker-0.yml NUR reiner k3s-Compute-Node: keine
# Docker-Compose-Dienste (die sind an worker-0/dessen HDD gebunden).
# worker-1 uebernimmt zusaetzliche Rechenlast im k3s-Cluster.
#
# Reihenfolge (identisch zu worker-0.yml, siehe dort fuer den Vorfall, der
# zu Schritt 1/2 gefuehrt hat):
#   1. worker_apt_update — apt update/dist-upgrade (worker-1 bekommt sonst
#      nie ein OS-Update, da es keine common-Rolle nutzt). Laeuft
#      normalerweise nachts um 01:00 ueber nightly_worker_wake auf
#      homeserver, das dieses Playbook per Semaphore-API triggert, siehe
#      docs/2-betrieb-hardware/20030-nightly-worker-update.md. Setzt
#      zusaetzlich statische Fallback-Nameserver -- muss deshalb VOR
#      tailscale laufen, das fuer die eigene Paketinstallation selbst
#      funktionierendes DNS braucht.
#   2. tailscale — Ansible-verwaltete Tailscale-Verbindung, siehe
#      "Fehlerbehebung" in
#      docs/2-betrieb-hardware/20030-nightly-worker-update.md fuer den
#      Vorfall auf worker-0, der zu dieser Umstellung fuehrte. Erfordert
#      einen eigenen, vault-verschluesselten tailscale_auth_key in
#      ansible/host_vars/worker-1/vault.yml.
#   3. k3s_agent — tritt dem k3s-Cluster als Worker-Node bei
#      (benoetigt laufenden k3s-Server auf homeserver/.94)
#   4. disable_eee — deaktiviert Energy Efficient Ethernet dauerhaft
#      (Vorfall 2026-09-02 auf homeserver: EEE verursachte einen
#      Link-Drop ohne Selbstheilung, siehe ansible/roles/disable_eee)
#   5. thermal_watchdog / resource_watchdog — automatischer Shutdown bei
#      Uebertemperatur bzw. anhaltend hoher CPU/RAM-Last
#   6. journal_upload — pusht das Host-journald an VictoriaLogs (der
#      bestehende victoria-logs-collector-DaemonSet liest nur
#      Container-Logs, nicht das journald des Nodes selbst), siehe
#      docs/3-apps-workloads/300j0-logging.md
#   7. wake_on_lan — WoL-Empfangsbereitschaft, damit cluster_power_manager
#      (laeuft auf homeserver, siehe ansible/site.yml) diesen Node aus dem
#      ausgeschalteten Zustand aufwecken kann
#   8. cluster_power_manager_target — autorisiert den auf homeserver
#      erzeugten Shutdown-Key hier, beschraenkt auf "poweroff" (setzt
#      voraus, dass site.yml bereits gegen homeserver gelaufen ist, sonst
#      existiert der Public Key dort noch nicht)
#   9. Uncordon — stellt sicher dass worker-1 schedulable bleibt
#      (kubectl drain/cordon durch Maintenance-Schritte rueckgaengig machen)
# ============================================================
#
# Run with:
#   make worker-1
# Dry-run:
#   make worker-1-check
# ============================================================

- name: Deploy k3s agent and watchdogs on worker-1
  hosts: worker-1
  become: true
  roles:
    - role: worker_apt_update
      tags: [apt-update, updates]
    - role: tailscale
      tags: [tailscale, vpn]
    - role: k3s_agent
      tags: [k3s-agent, kubernetes]
    - role: disable_eee
      tags: [disable-eee, network]
    - role: thermal_watchdog
      tags: [thermal-watchdog, thermal]
    - role: resource_watchdog
      tags: [resource-watchdog, thermal]
    - role: journal_upload
      tags: [journal-upload, logging]
    - role: wake_on_lan
      tags: [wake-on-lan, power-management]
    - role: cluster_power_manager_target
      tags: [cluster-power-manager-target, power-management]

- name: Uncordon worker-1 nach Provisioning
  hosts: homeservers
  become: true
  tags: [uncordon, kubernetes]
  tasks:
    - name: worker-1 schedulable halten
      ansible.builtin.command:
        cmd: kubectl uncordon worker-1
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
      failed_when: >
        uncordon_result.rc != 0 and
        'not found' not in uncordon_result.stderr
