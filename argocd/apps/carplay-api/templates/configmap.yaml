apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "carplay-api.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "carplay-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CACHE_TTL: {{ .Values.config.cacheTTLSeconds | quote }}
  API_TIMEOUT: {{ .Values.config.apiTimeoutSeconds | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  TRUSTED_PROXIES: {{ .Values.config.trustedProxies | quote }}
  IP_ALLOWLIST_CIDRS: {{ if .Values.config.ipAllowlist.enabled }}{{ .Values.config.ipAllowlist.cidrs | quote }}{{ else }}""{{ end }}
  VM_URL: {{ .Values.config.victoriaMetrics.url | quote }}
  {{- $hostEntries := list }}
  {{- range .Values.config.hosts }}
  {{- $hostEntries = append $hostEntries (printf "%s|%s|%s" .id .name .instance) }}
  {{- end }}
  HOSTS: {{ join "," $hostEntries | quote }}
  {{- $serviceEntries := list }}
  {{- range .Values.config.services }}
  {{- $serviceEntries = append $serviceEntries (printf "%s|%s|%s" .id .name .match) }}
  {{- end }}
  SERVICES: {{ join "," $serviceEntries | quote }}
  NTFY_URL: {{ .Values.config.ntfy.url | quote }}
  NTFY_TOPIC: {{ .Values.config.ntfy.topic | quote }}
  NTFY_SINCE: {{ .Values.config.ntfy.sinceWindow | quote }}
  NTFY_LIMIT: {{ .Values.config.ntfy.alertLimit | quote }}
  UPTIME_KUMA_URL: {{ .Values.config.uptimeKuma.url | quote }}
  UPTIME_KUMA_SLUG: {{ .Values.config.uptimeKuma.slug | quote }}
  UPDATES_NAMESPACE: {{ .Values.config.updates.namespace | quote }}
  UPDATES_CONFIGMAP_NAME: {{ .Values.config.updates.configMapName | quote }}
  UPDATES_CACHE_TTL: {{ .Values.config.updates.cacheTTLSeconds | quote }}
  POWER_AGENT_URL: {{ .Values.config.powerAgent.url | quote }}
  POWER_AGENT_TIMEOUT: {{ .Values.config.powerAgent.timeoutSeconds | quote }}
