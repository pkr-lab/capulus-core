{{- if .Values.secrets.shutdownConfirmationCode.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.shutdownConfirmationCode.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{ .Values.secrets.shutdownConfirmationCode.secretKey }}: {{ .Values.secrets.shutdownConfirmationCode.encryptedData }}
  template:
    metadata:
      name: {{ .Values.secrets.shutdownConfirmationCode.secretName }}
      namespace: {{ .Release.Namespace }}
{{- end }}
