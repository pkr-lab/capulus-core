apiVersion: v1
kind: Service
metadata:
  name: {{ include "day-pilot.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "day-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "day-pilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
