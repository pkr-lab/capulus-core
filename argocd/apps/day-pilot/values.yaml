---
# Day Pilot — vormals Docker-Compose auf worker-0 (ansible/roles/day_pilot),
# jetzt als reguläre k8s-App. Postgres/Redis-Persistenz liegt auf der
# "nas"-StorageClass (NFS, siehe docs/16-nas-storage.md) — keine
# NodeAffinity mehr nötig, der Scheduler darf frei verteilen.

replicaCount: 1

secrets:
  enabled: true
  name: day-pilot-secrets
  # Alle Werte mit kubeseal versiegeln (Namespace = day-pilot):
  #   echo -n 'WERT' | kubeseal --raw --namespace day-pilot \
  #     --name day-pilot-secrets --controller-namespace sealed-secrets \
  #     --controller-name sealed-secrets-controller
  # Siehe docs/20-wikijs.md → "Secrets versiegeln" für das identische Muster.
  # TODO vor dem ersten ArgoCD-Sync: alle CHANGE_ME-Platzhalter durch echte
  # Ciphertexte ersetzen — von hier aus kein Zugriff auf den laufenden
  # Sealed-Secrets-Controller möglich, daher nur Platzhalter vorbereitet.
  encryptedPostgresPassword: "CHANGE_ME"
  encryptedOpenaiApiKey: "CHANGE_ME"
  encryptedGithubToken: "CHANGE_ME"
  encryptedWeatherapiApiKey: "CHANGE_ME"
  encryptedCaldavPassword: "CHANGE_ME"
  encryptedNtfyToken: "CHANGE_ME"
  encryptedVoiceWebhookSecret: "CHANGE_ME"

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
  db: daypilot
  user: daypilot
  persistence:
    storageClassName: nas
    size: 5Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  image:
    repository: redis
    tag: "7-alpine"
  persistence:
    storageClassName: nas
    size: 1Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

backend:
  image:
    repository: ghcr.io/pkr-lab/day-pilot/backend
    pullPolicy: IfNotPresent
    tag: "latest"
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: ghcr.io/pkr-lab/day-pilot/frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  port: 80
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# GHCR-Packages unter ghcr.io/pkr-lab/... sind standardmäßig privat.
# Entweder Package-Sichtbarkeit auf "Public" stellen, oder hier ein
# imagePullSecrets-Secret (kubernetes.io/dockerconfigjson) referenzieren,
# z.B. [{name: ghcr-pull}].
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: day-pilot.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  appName: "Day Pilot"
  timezone: "Europe/Berlin"
  dailySummaryTime: "07:00"
  aiProvider: "openai"
  aiModel: ""
  openaiModel: "gpt-4o-mini"
  weatherCity: "Berlin"
  weatherUnits: "metric"
  caldavUrl: ""
  caldavUsername: ""
  ntfyServer: "https://ntfy.sh"
  ntfyTopic: ""

nodeSelector: {}
tolerations: []
affinity: {}
