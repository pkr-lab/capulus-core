fullnameOverride: "demo-app"

replicaCount: 1

image:
  repository: hashicorp/http-echo
  tag: "1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186"
  pullPolicy: IfNotPresent

message: "Hello from GitOps - Version 1"

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: demo.dev.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 25m
    memory: 32Mi
