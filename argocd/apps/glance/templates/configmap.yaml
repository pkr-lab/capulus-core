apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glance.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
data:
  glance.yml: |
    server:
      host: 0.0.0.0
      port: {{ .Values.service.targetPort }}

    pages:
      - name: Home
        columns:
          # Links: Wetter morgen, darunter Status der Infrastruktur-Apps.
          - size: full
            widgets:
              - type: custom-api
                title: Wetter — Morgen
                cache: 3h
                url: https://api.open-meteo.com/v1/forecast
                parameters:
                  latitude: "{{ .Values.weather.latitude }}"
                  longitude: "{{ .Values.weather.longitude }}"
                  daily: temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max
                  timezone: Europe/Berlin
                  forecast_days: "2"
                template: |
{{ include "glance.weatherTomorrowTemplate" . | nindent 18 }}

              - type: monitor
                title: Infrastruktur
                cache: 1m
                sites:
                  - title: ArgoCD-UI
                    url: http://homeserver:30080
                  - title: Headlamp
                    url: http://headlamp.homeserver
                  - title: Semaphore
                    url: http://semaphore.homeserver
                  - title: Authentik
                    url: http://authentik.homeserver
                  - title: Grafana
                    url: http://grafana.homeserver
                  - title: Pi-hole
                    url: http://pihole.homeserver
                  - title: kubeseal-webgui
                    url: http://kubeseal-webgui.homeserver
                  - title: Argo Workflows
                    url: http://argo-workflows.homeserver
                  - title: MinIO Console
                    url: http://minio.homeserver

          # Mitte: Wetter heute, darunter Status der Apps & Produktivität/
          # Benachrichtigung — bildet zusammen mit der linken Spalte optisch
          # einen durchgehenden Apps-Status-Block (Glance kennt kein
          # spaltenübergreifendes Widget, siehe docs/41-glance.md).
          - size: full
            widgets:
              - type: weather
                title: Wetter — Heute
                location: "{{ .Values.weather.location }}"
                units: metric
                hour-format: 24h

              - type: monitor
                title: Apps & Produktivität
                cache: 1m
                sites:
                  - title: Nextcloud
                    url: http://nextcloud.homeserver
                  - title: Immich
                    url: http://immich.homeserver
                  - title: Vaultwarden
                    url: http://vault.homeserver
                  - title: Paperless-ngx
                    url: http://paperless.homeserver
                  - title: Mealie
                    url: http://mealie.homeserver
                  - title: Grocy
                    url: http://grocy.homeserver
                  - title: n8n
                    url: http://n8n.homeserver
                  - title: Wiki.js
                    url: http://wiki.homeserver
                  - title: Zammad
                    url: http://zammad.homeserver

              - type: monitor
                title: Benachrichtigung & Sonstiges
                cache: 1m
                sites:
                  - title: Gotify
                    url: http://gotify.homeserver
                  - title: ntfy
                    url: http://ntfy.homeserver
                  - title: Uptime Kuma
                    url: http://uptime-kuma.homeserver
                  - title: MediaMTX (Stream)
                    url: http://stream.homeserver
                  - title: Alarmmonitor
                    url: http://alamos-apager.homeserver

          # Rechts: Tankpreise, darunter Server-Status (94-97).
          - size: small
            widgets:
              - type: custom-api
                title: Tankpreise
                cache: 15m
                url: https://creativecommons.tankerkoenig.de/json/prices.php
                parameters:
                  ids: "c40eefd2-1343-48f1-aafe-3e97f46222b0,effdf24b-44b3-4ddc-9c38-feedb636b05e,40b99699-12d6-48b4-9a90-9d8a9db99ba0"
                  {{- if .Values.secrets.tankerkoenig.enabled }}
                  apikey: "${TANKERKOENIG_API_KEY}"
                  {{- else }}
                  apikey: ""
                  {{- end }}
                template: |
{{ include "glance.fuelPricesTemplate" . | nindent 18 }}

              - type: custom-api
                title: Server-Status
                cache: 1m
                url: "{{ .Values.monitoring.vmQueryUrl }}"
                parameters:
                  query: "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"homeserver|worker-0|worker-1|ugreen-nas\"}[5m])) * 100)"
                subrequests:
                  mem:
                    url: "{{ .Values.monitoring.vmQueryUrl }}"
                    parameters:
                      query: "(node_memory_MemTotal_bytes{instance=~\"homeserver|worker-0|worker-1|ugreen-nas\"} - node_memory_MemAvailable_bytes{instance=~\"homeserver|worker-0|worker-1|ugreen-nas\"}) / node_memory_MemTotal_bytes{instance=~\"homeserver|worker-0|worker-1|ugreen-nas\"} * 100"
                template: |
{{ include "glance.serverStatusTemplate" . | nindent 18 }}
