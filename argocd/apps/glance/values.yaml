---
# ============================================================
# Glance — Dashboard mit Übersicht über alle Home-Server-Dienste
#
# Setup-/Betriebs-Anleitung: docs/41-glance.md
# Die eigentliche Dashboard-Konfiguration (Seiten, Widgets, Links)
# liegt statisch in templates/configmap.yaml, nicht hier — Anpassungen
# dort vornehmen.
# ============================================================

replicaCount: 1

image:
  repository: glanceapp/glance
  pullPolicy: IfNotPresent
  # Pinned für Reproduzierbarkeit. Releases:
  # https://github.com/glanceapp/glance/releases
  tag: "v0.8.5"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

# Glance ist ein reiner Go-Binary ohne Root-Bedarf und schreibt nichts auf
# die eigene Root-FS — Config kommt read-only aus der ConfigMap, für /tmp
# gibt es ein separates emptyDir (siehe deployment.yaml).
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Bewusst nur intern über *.homeserver erreichbar — verlinkt u. a. auf
# Headlamp, Pi-hole und ArgoCD und gehört damit nicht per Cloudflare
# Tunnel nach außen (siehe docs/41-glance.md, Abschnitt "Warum kein
# öffentlicher Zugriff").
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: glance.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Standort für die beiden Wetter-Widgets — Andernach (nahe den unten
# konfigurierten Tankstellen). Bei abweichendem Standort hier anpassen;
# location ist für das native weather-Widget (Open-Meteo-Geocoding-Suche),
# latitude/longitude für das custom-api "Wetter — Morgen"-Widget.
weather:
  location: "Andernach, Germany"
  latitude: "50.4205"
  longitude: "7.4061"

# VictoriaMetrics-Query-API (bereits vorhandener Monitoring-Stack, siehe
# argocd/apps/monitoring/) — liefert die CPU-/RAM-Werte fürs
# "Server-Status"-Widget. Service-Name folgt der VictoriaMetrics-Operator-
# Konvention `vmsingle-<VMSingle-CR-Name>`; bei einem Upgrade/Rename des
# monitoring-Charts ggf. mit `kubectl -n monitoring get svc` prüfen.
monitoring:
  vmQueryUrl: "http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428/api/v1/query"

# Tankerkönig-API liefert die MTS-K-Pflichtmeldedaten (dieselben Preise, die
# auch clever-tanken.de anzeigt) für die drei fest im ConfigMap hinterlegten
# Tankstellen (Andernach, Plaidt, Mülheim-Kärlich). Kostenlosen Key
# registrieren: https://creativecommons.tankerkoenig.de — danach:
#   echo -n "<dein-tankerkoenig-api-key>" \
#     | kubeseal --raw --namespace glance --name glance-tankerkoenig-api-key \
#         --from-file=/dev/stdin
# Solange encryptedApiKey noch der Platzhalter ist, kann der sealed-secrets-
# Controller ihn nicht entschlüsseln → kein Secret → der Pod bleibt in
# CreateContainerConfigError hängen (TANKERKOENIG_API_KEY ist ein Pflicht-
# secretKeyRef in deployment.yaml). Deshalb vorerst enabled: false — Pod
# startet ohne Tankpreise-Widget. Sobald der Key da ist: auf true setzen +
# encryptedApiKey mit dem kubeseal-Ergebnis befüllen (siehe docs/41-glance.md).
secrets:
  tankerkoenig:
    enabled: false
    secretName: glance-tankerkoenig-api-key
    encryptedApiKey: "REPLACE_ME_WITH_KUBESEAL_OUTPUT"

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
