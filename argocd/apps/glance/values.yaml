---
# ============================================================
# Glance — Dashboard mit Übersicht über alle Home-Server-Dienste
#
# Setup-/Betriebs-Anleitung: docs/41-glance.md
# Die eigentliche Dashboard-Konfiguration (Seiten, Widgets, Links)
# liegt statisch in templates/configmap.yaml, nicht hier — Anpassungen
# dort vornehmen.
# ============================================================

replicaCount: 1

image:
  repository: glanceapp/glance
  pullPolicy: IfNotPresent
  # Pinned für Reproduzierbarkeit. Releases:
  # https://github.com/glanceapp/glance/releases
  tag: "v0.8.5"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

# Glance ist ein reiner Go-Binary ohne Root-Bedarf und schreibt nichts auf
# die eigene Root-FS — Config kommt read-only aus der ConfigMap, für /tmp
# gibt es ein separates emptyDir (siehe deployment.yaml).
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Bewusst nur intern über *.homeserver erreichbar — verlinkt u. a. auf
# Headlamp, Pi-hole und ArgoCD und gehört damit nicht per Cloudflare
# Tunnel nach außen (siehe docs/41-glance.md, Abschnitt "Warum kein
# öffentlicher Zugriff").
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: glance.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
