---
apiVersion: v2
name: logging
description: |
  Zentrales Logging für den k3s-Cluster.
  Bündelt VictoriaLogs (single-node Log-Storage) mit victoria-logs-collector
  (DaemonSet), der Container-Logs von jedem Node einsammelt.

  - Collector: läuft auf jedem Node, liest Pod-/Container-Logs direkt (kein
    manuelles hostPath-Mounting nötig, das übernimmt der Chart) und pusht sie
    an VictoriaLogs.
  - Storage: VictoriaLogs single-node, wie vmsingle in argocd/apps/monitoring
    per local-path auf dem Node "homeserver" gepinnt.
  - UI: Abfrage über Grafana (Namespace monitoring) mit der Datasource
    "VictoriaLogs" (LogsQL), siehe templates/datasource-victorialogs.yaml.
type: application
version: 0.1.0
appVersion: "latest"
keywords:
  - logging
  - victorialogs
  - observability
home: https://docs.victoriametrics.com/victorialogs/
sources:
  - https://github.com/VictoriaMetrics/helm-charts
maintainers:
  - name: home-server-admin
dependencies:
  - name: victoria-logs-single
    repository: https://victoriametrics.github.io/helm-charts
    version: "0.13.9"
  - name: victoria-logs-collector
    repository: https://victoriametrics.github.io/helm-charts
    version: "0.3.7"
