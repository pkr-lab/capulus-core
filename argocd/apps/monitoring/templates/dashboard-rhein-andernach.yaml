          "options": {
            "content": "## DWD Warnungen — Kreis Mayen-Koblenz\n\n**Aktuelle Warnungen direkt beim DWD abrufen:**\n\n- [DWD WarnWetter — Andernach/Mayen-Koblenz](https://www.dwd.de/DE/wetter/warnungen_aktuell/warnkarten/warnkarte_gemeinden_bw.html)\n- [DWD Warnapp (warnwetter.de)](https://www.wettergefahren.de/warnkarte/gemeinden/aktuelle-warnungen.html)\n- [Katwarn Mayen-Koblenz](https://katwarn.de/)\n\n**Warnstufen:**\n\n| Stufe | Farbe | Bedeutung |\n|---|---|---|\n| 1 | Gelb | Wetterwarnung |\n| 2 | Orange | Markante Wetterwarnung |\n| 3 | Rot | Unwetterwarnung |\n| 4 | Violett | Extremes Unwetter |\n\n> **Hinweis:** Die DWD JSON-API wurde eingestellt. Die Warnungsdaten sind nur noch als JSONP oder im CAP-XML-Format verfügbar — nicht kompatibel mit dem Infinity-Plugin.",
            "mode": "markdown"
