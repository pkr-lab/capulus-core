          "options": {
            "content": "## Hochwasservorhersage RLP\n\nDas LUWG (Landesamt für Umwelt) RLP bietet eine **24–48h Hochwasservorhersage** für den Rhein bei Andernach:\n\n- [Hochwasserkarte RLP — Andernach](https://www.hochwasser-rlp.de/)\n- [Hochwassernachrichten-App RLP](https://www.hochwasser-rlp.de/service/hochwassernachrichten-app)\n\n**Meldestufen Rhein Andernach:**\n\n| Stufe | Pegel (cm) | Maßnahme |\n|---|---|---|\n| 1 | ≥ 430 | Beobachtung |\n| 2 | ≥ 570 | verstärkte Kontrollen |\n| 3 | ≥ 660 | Einsatz |\n| 4 | ≥ 800 | Katastrophenschutz |",
            "mode": "markdown"
          },
          "title": "Hochwasservorhersage RLP",
          "type": "text"
        },
        {
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 18},
          "id": 6,
          "options": {
            "content": "## ELWIS — Schifffahrt & Wasserstraßen\n\nDer Elektronische Wasserstraßen-Informationsservice (ELWIS) des Bundes bietet:\n\n- **Schifffahrtsmeldungen** (Sperrungen, Baustellen, Fahrwassereinschränkungen)\n- **Wasserstände** entlang des Rheins\n- **Nachrichten** für Wassersportler und Schifffahrt\n\n**Links:**\n- [ELWIS Rhein Andernach](https://www.elwis.de/DE/dynamisch/gewaesserkundliche-Grundlagen/Wasserstaende/index.php)\n- [Schifffahrtsmeldungen Rhein](https://www.elwis.de/DE/dynamisch/Bekanntmachungen/Binnenschifffahrt/index.php)\n- [Fahrwasserzustand Rhein](https://www.elwis.de/DE/dynamisch/gewaesserkundliche-Grundlagen/Fahrwassertiefe/index.php)\n\n*Quelle: Wasserstraßen- und Schifffahrtsverwaltung des Bundes (WSV), öffentlich & kostenlos.*",
            "mode": "markdown"
          },
