apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-infinity
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
data:
  infinity.yaml: |
    apiVersion: 1
    datasources:
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        access: proxy
        uid: infinity
        isDefault: false
        jsonData:
          # Vollständige URL-Präfixe (mit https://) — Infinity v3 erfordert das im Gegensatz zu v2.
          # Änderungen hier → ArgoCD-Sync → Grafana-Neustart erforderlich.
          allowedHosts:
            - "https://www.pegelonline.wsv.de"
            - "https://www.dwd.de"
            - "https://www.elwis.de"
            - "https://www.hochwasser-rlp.de"
            - "https://www.hochwasser.rlp.de"
            - "https://opendata.dwd.de"
            - "https://warnung.bund.de"
