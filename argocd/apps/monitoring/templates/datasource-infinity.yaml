apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-infinity
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
data:
  infinity.yaml: |
    apiVersion: 1
    datasources:
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        access: proxy
        uid: infinity
        isDefault: false
        jsonData:
          # Erlaubte URL-Muster — schränkt ein, welche externen APIs abgefragt werden dürfen.
          # Änderungen hier → ArgoCD-Sync → Grafana-Neustart erforderlich.
          allowedHosts:
            - "www.pegelonline.wsv.de"
            - "www.dwd.de"
            - "www.elwis.de"
            - "www.hochwasser-rlp.de"
            - "opendata.dwd.de"
