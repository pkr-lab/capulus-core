---
replicaCount: 1

image:
  # Custom image with n8n-nodes-imap baked in, see ./image/Dockerfile.
  # Built and imported locally (k3s ctr images import) — no registry push,
  # so pullPolicy must stay IfNotPresent (Never would also work, but
  # IfNotPresent avoids ImagePullBackOff if the tag is ever missing after a
  # node reboot and someone forgets to re-import).
  repository: n8n-custom
  pullPolicy: IfNotPresent
  tag: "2.32.7-imap"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: n8n.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: nas
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /home/node/.n8n

env:
  N8N_HOST: "n8n.pke-lab.de"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  WEBHOOK_URL: "https://n8n.pke-lab.de/"
  TZ: Europe/Berlin
  # SQLite als Datenbank (keine externe DB nötig im Home Lab)
  DB_TYPE: sqlite
  # Basis-Auth kann hier oder über Authentik (ForwardAuth) aktiviert werden
  N8N_BASIC_AUTH_ACTIVE: "true"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

affinity: {}

nodeSelector: {}
tolerations: []

# ============================================================
# xibosignage-Inbox/Display-Ordner (siehe docs/44-xibosignage.md)
#
# Zwei statische NFS-PVs mit festem Pfad auf dem UGREEN NAS (nicht über die
# dynamische "nas"-StorageClass, siehe templates/xibosignage-pv.yaml) werden
# hier in den n8n-Pod gemountet, damit ein "Local File Trigger"-Workflow den
# Inbox-Ordner beobachten und verarbeitete Bilder in den Display-Ordner
# schreiben kann, den wiederum der Raspberry-Pi-Kiosk per rohem NFS-Mount
# liest (ansible/roles/xibo_kiosk).
xibosignage:
  enabled: true
  nfsServer: "192.168.178.97"
  inbox:
    nfsPath: "/volume1/k8s-storage/xibosignage-inbox"
    mountPath: /data/xibosignage-inbox
    size: 20Gi
  display:
    nfsPath: "/volume1/k8s-storage/xibosignage-display"
    mountPath: /data/xibosignage-display
    size: 20Gi
