---
# ============================================================
# Nextcloud — wrapper values
#
# Secrets-Block (SealedSecret):
#   DB- und Admin-Passwort mit kubeseal versiegeln und hier eintragen.
#   Anleitung: docs/33-nextcloud.md → Abschnitt "Secrets versiegeln"
# ============================================================

secrets:
  enabled: true
  name: nextcloud-secrets
  # Versiegeln (zwei Keys, ein Secret):
  #   echo -n 'DB_PASSWORT' | kubeseal --raw --namespace nextcloud \
  #     --name nextcloud-secrets --controller-namespace sealed-secrets \
  #     --controller-name sealed-secrets-controller
  # kubeseal --raw erlaubt nur EINEN Key pro Aufruf — siehe docs/33-nextcloud.md
  # für den vollständigen Multi-Key-Workflow (--merge-into).
  encryptedDbPassword: ""
  encryptedAdminPassword: ""

# ============================================================
# Nextcloud App
# ============================================================
nextcloud:
  replicaCount: 1

  image:
    repository: nextcloud
    pullPolicy: IfNotPresent
    # Pinned für Reproduzierbarkeit. Releases: https://github.com/nextcloud/docker/releases
    tag: "34.0.2-apache"

  # Offizielles Apache-Image läuft als root (kein USER im Dockerfile,
  # Apache-Master-Prozess braucht Port 80 + der Entrypoint chownt beim
  # ersten Start) — analog zu Vaultwarden kann hier kein runAsNonRoot
  # gesetzt werden.
  # ACHTUNG (Stand 2026-07-26): Der Kommentar hier lautete früher, die
  # "nas"-StorageClass sei mit no_root_squash exportiert und root-Schreib-
  # zugriff funktioniere daher. Das NAS erzwingt inzwischen all_squash (kein
  # no_root_squash mehr verfügbar) — auch root-Requests werden gesquasht.
  # Dieser Pod (html/data-PVCs, bewusst weiter auf "nas") crasht deshalb
  # aktuell ebenfalls (chown schlägt fehl). Bewusst nicht Teil der aktuellen
  # DB-Migration (siehe Auftrag), aber zur Kenntnisnahme dokumentiert.
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false

  adminUser: admin

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: nextcloud.homeserver
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Trusted Domains: intern (*.homeserver, Traefik) + extern (Cloudflare
  # Tunnel, siehe argocd/apps/cloudflared/values.yaml). Ohne beide Einträge
  # weist Nextcloud Requests mit "Access through untrusted domain" ab.
  trustedDomains: "nextcloud.homeserver nextcloud.pke-lab.de"

  persistence:
    html:
      enabled: true
      storageClassName: nas
      size: 5Gi
      accessMode: ReadWriteOnce
    data:
      enabled: true
      storageClassName: nas
      size: 100Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  nodeSelector: {}
  affinity: {}
  tolerations: []

# ============================================================
# PostgreSQL (eigenes Deployment, kein Bitnami-Subchart)
# Persistenz auf der "nas"-StorageClass (docs/16-nas-storage.md)
# ============================================================
postgresql:
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "16-alpine"

  database: nextcloud
  username: nextcloud

  service:
    port: 5432

  persistence:
    enabled: true
    # War auf "nas" (NFS), bis das UGREEN-NAS all_squash statt no_root_squash
    # erzwang und jedes chmod/chown des DB-Containers scheiterte (docs/16-nas-storage.md).
    # Postgres-Datenverzeichnis ist reiner State, gehört daher auf lokalen
    # Storage — Files/Blobs (html/data oben) bleiben bewusst auf "nas".
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
  # wird — fest auf homeserver (aktuell ohnehin der einzige Ready-Node).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - homeserver

# ============================================================
# Redis (Datei-Locking + Transactional-Cache, kein PVC nötig —
# reiner Lock-/Cache-Zustand, unkritisch bei Neustart)
# ============================================================
redis:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "7-alpine"

  service:
    port: 6379

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
