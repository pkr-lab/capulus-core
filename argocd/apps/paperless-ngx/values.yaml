---
replicaCount: 1

image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  pullPolicy: IfNotPresent
  # Zwischenschritt vor v3: laut Upstream-Doku ist der v3-Sprung nur ab 2.20.15
  # unterstützt (aktuell hier gepinnt). Erst deployen, Migrationen durchlaufen
  # lassen und verifizieren, DANN auf 3.0.4 heben. v3-Migrationsschritte dann:
  # PAPERLESS_SECRET_KEY setzen, PAPERLESS_DBENGINE explizit setzen, deprecated
  # Env-Vars umbenennen (CONSUMER_POLLING -> CONSUMER_POLLING_INTERVAL etc.),
  # evtl. vorher decrypt_documents falls Verschlüsselung genutzt wird.
  tag: "2.20.15"

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClassName: nas
    size: 1Gi
    accessMode: ReadWriteOnce

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: paperless.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  data:
    enabled: true
    storageClassName: nas
    size: 20Gi
    accessMode: ReadWriteOnce
  media:
    enabled: true
    storageClassName: nas
    size: 50Gi
    accessMode: ReadWriteOnce
  consume:
    enabled: true
    storageClassName: nas
    size: 5Gi
    accessMode: ReadWriteOnce
  export:
    enabled: true
    storageClassName: nas
    size: 10Gi
    accessMode: ReadWriteOnce

env:
  PAPERLESS_REDIS: "redis://localhost:6379"
  PAPERLESS_DBENGINE: "sqlite"
  PAPERLESS_TIME_ZONE: "Europe/Berlin"
  # OCR: Deutsch + Englisch — weitere Sprachen per "deu+eng+fra" ergänzen
  PAPERLESS_OCR_LANGUAGE: "deu+eng"
  PAPERLESS_OCR_LANGUAGES: "deu eng"
  PAPERLESS_URL: "https://paperless.pke-lab.de"
  # Anzahl Worker/Threads — für Home Lab reicht 1
  PAPERLESS_TASK_WORKERS: "1"
  PAPERLESS_THREADS_PER_WORKER: "1"
  # Secret Key — in Produktion per SealedSecret übergeben.
  # Vorläufig ein fester Wert; nach Deploy sofort per SealedSecret ersetzen.
  PAPERLESS_SECRET_KEY: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

affinity: {}

nodeSelector: {}
tolerations: []
