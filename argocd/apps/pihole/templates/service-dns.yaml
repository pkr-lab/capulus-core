apiVersion: v1
kind: Service
metadata:
  name: {{ include "pihole.fullname" . }}-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dnsService.type }}
  externalTrafficPolicy: Cluster
  ports:
    - port: {{ .Values.dnsService.port }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
      {{- if eq .Values.dnsService.type "NodePort" }}
      nodePort: {{ .Values.dnsService.nodePort }}
      {{- end }}
    - port: {{ .Values.dnsService.port }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
      {{- if eq .Values.dnsService.type "NodePort" }}
      nodePort: {{ .Values.dnsService.nodePort }}
      {{- end }}
  selector:
    {{- include "pihole.selectorLabels" . | nindent 4 }}
