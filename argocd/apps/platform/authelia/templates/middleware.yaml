# ForwardAuth-Middleware, die andere Apps per
# `traefik.ingress.kubernetes.io/router.middlewares: "authelia-authelia@kubernetescrd"`
# in ihrer eigenen ingress.annotations referenzieren (siehe
# docs/4-planung/40000-authelia-sso.md, Baustein 2). Identisches Muster wie
# das historische authentik-authentik-forwardauth (siehe Git-Historie vor
# Commit 1800642).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: "http://{{ include "authelia.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local/api/verify?rd=https://auth.tech.homeserver/"
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
