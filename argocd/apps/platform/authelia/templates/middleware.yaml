# ForwardAuth-Middlewares — EINE pro Domain-Tier, nicht eine einzige
# gemeinsame. Grund: Traefik hängt den in `rd=` konfigurierten Wert nicht
# dynamisch am Ziel-Host aus, sondern nutzt ihn 1:1 als Basis-URL für die
# Login-Seite (der eigentliche Ziel-Request wird separat als eigener
# rd=-Parameter AUF diese Basis-URL gehängt) — mit nur einer Middleware
# würden alle Apps unabhängig von ihrem Tier zur selben Login-Portal-Domain
# geschickt, deren Session-Cookie (siehe values.yaml → config →
# session.cookies) aber nur für dieses eine Tier gültig ist. Ergebnis ohne
# diese Aufteilung: Endlos-Redirect-Schleife für jedes andere Tier
# (live beim Pilot am 21.08.2026 aufgetreten und hier korrigiert). Jede App
# referenziert in ihrer eigenen ingress.annotations die zu ihrem Tier
# passende Middleware, siehe docs/4-planung/40000-authelia-sso.md, Baustein 2.
{{- $fullname := include "authelia.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- range $tier, $host := (dict "prod" "auth.prod.homeserver" "tech" "auth.tech.homeserver" "external" "auth-tech.pke-lab.de") }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-{{ $tier }}
  namespace: {{ $ns }}
  labels:
    {{- include "authelia.labels" $ | nindent 4 }}
spec:
  forwardAuth:
    address: "http://{{ $fullname }}.{{ $ns }}.svc.cluster.local/api/verify?rd=https://{{ $host }}/"
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
{{- end }}
