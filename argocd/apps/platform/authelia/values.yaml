---
replicaCount: 1
# Session-/Regulation-State liegt lokal (SQLite + In-Memory), keine geteilte
# Session-Store — mehr als 1 Replica würde Logins zufällig auf einer Instanz
# ohne die passende Session landen lassen. Passt zur aktuellen
# Cluster-Realität: nur `homeserver` ist schedulebar (worker-0/worker-1
# NotReady), siehe docs/4-planung/40000-authelia-sso.md.

image:
  repository: authelia/authelia
  pullPolicy: IfNotPresent
  tag: "4.39.20"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 9091

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    # Zwei interne Hostnamen sind kein Zufall: "homeserver" ist ein
    # Single-Label-Fake-TLD ohne Punkt, Authelias Session-Cookie-Domain
    # verlangt aber mindestens einen Punkt (validiert per
    # `authelia config validate`) — ein Cookie mit Domain "homeserver" wird
    # von Authelia selbst abgelehnt. Deshalb bekommt jede Domain-Tier-Ebene
    # (tech.homeserver / prod.homeserver) ihren eigenen Cookie-Scope +
    # eigenen Portal-Hostnamen (session.cookies in configuration.yml unten),
    # sonst funktioniert SSO nur innerhalb einer Tier-Ebene, nicht darüber
    # hinweg. pke-lab.de braucht das NICHT (echte Domain mit Punkt), ein
    # einziger externer Hostname deckt beide Tiers ab.
    - host: auth.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: auth.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: auth-tech.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /config

# local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
# wird — fest auf homeserver, analog zu uptime-kuma/values.yaml.
nodeSelector:
  kubernetes.io/hostname: homeserver

tolerations: []
affinity: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Secrets kommen aus templates/sealedsecret.yaml (SealedSecret,
# verschlüsselt mit dem kubeseal-Public-Key dieses Clusters). Erzeugt am
# 21.08.2026 per `authelia crypto rand`/`authelia crypto hash generate
# argon2` (siehe docs/4-planung/40000-authelia-sso.md) + `kubeseal --raw
# --namespace authelia --name authelia-secrets`. Enthält:
#   - jwt-secret: signiert Passwort-Reset-Links (identity_validation)
#   - session-secret: verschlüsselt Session-Cookies
#   - storage-encryption-key: verschlüsselt die SQLite-Storage (TOTP-Secrets etc.)
#   - ldap-bind-password: Passwort des Service-Accounts "authelia-bind" in
#     lldap (lldap_strict_readonly-Gruppe) — muss manuell in lldaps Web-UI
#     angelegt werden, siehe docs/d-sicherheit/d0072-lldap.md. Seit dem
#     LDAP-Cutover (22.08.2026) kein file-basiertes users_database.yml mehr.
secrets:
  secretName: authelia-secrets
  encryptedJwtSecret: ""
  encryptedSessionSecret: ""
  encryptedStorageEncryptionKey: ""
  encryptedLdapBindPassword: ""

# `authelia config validate` erfolgreich gegen diese Datei getestet
# (v4.39.20, 22.08.2026, inkl. echtem Ende-zu-Ende-Test gegen ein lokales
# lldap — LDAP-Bind, Gruppen-Auflösung und subject:/domain-Wildcard-Regeln
# alle bestätigt funktionsfähig) — Session-Secret/Storage-Encryption-Key/
# Reset-Password-JWT-Secret/LDAP-Bind-Passwort kommen NICHT hier rein,
# sondern per Env-Var aus dem SealedSecret oben (siehe templates/deployment.yaml).
#
# Seit dem LDAP-Cutover (22.08.2026, docs/4-planung/40000-authelia-sso.md)
# kein file-basiertes Backend mehr — Nutzer/Gruppen kommen aus lldap
# (argocd/apps/platform/lldap/), manuell über dessen Web-UI verwaltet
# (docs/d-sicherheit/d0072-lldap.md).
config: |
  theme: light

  server:
    address: 'tcp://:9091'

  log:
    level: info

  totp:
    issuer: 'homeserver'

  authentication_backend:
    refresh_interval: '1m'
    ldap:
      implementation: 'lldap'
      address: 'ldap://lldap.lldap.svc.cluster.local:3890'
      base_dn: 'dc=homeserver'
      user: 'uid=authelia-bind,ou=people,dc=homeserver'

  access_control:
    default_policy: deny
    rules:
      # Break-Glass-Fallback "admin" — bewusst KEIN 2FA (ein TOTP-Geräteverlust
      # ist genau der Fall, für den dieser Account existiert), dafür NUR
      # intern erreichbar als Kompensation. NICHT Teil der admins-Gruppe.
      - domain: ["*.tech.homeserver", "*.prod.homeserver"]
        subject: "user:admin"
        policy: one_factor

      # Vollzugriff mit 2FA (admins-Gruppe, aktuell: pke) — ebenfalls nur intern.
      - domain: ["*.tech.homeserver", "*.prod.homeserver"]
        subject: "group:admins"
        policy: two_factor

      # rdn — Mealie, intern + extern.
      - domain: ["mealie.prod.homeserver", "mealie-prod.pke-lab.de"]
        subject: "user:rdn"
        policy: one_factor

  session:
    cookies:
      - domain: 'prod.homeserver'
        authelia_url: 'https://auth.prod.homeserver'
        name: 'authelia_session'
        expiration: '1h'
        inactivity: '5m'
      - domain: 'tech.homeserver'
        authelia_url: 'https://auth.tech.homeserver'
        name: 'authelia_session'
        expiration: '1h'
        inactivity: '5m'
      - domain: 'pke-lab.de'
        authelia_url: 'https://auth-tech.pke-lab.de'
        name: 'authelia_session'
        expiration: '1h'
        inactivity: '5m'

  regulation:
    max_retries: 5
    find_time: '2m'
    ban_time: '15m'

  storage:
    local:
      path: /config/db.sqlite3

  notifier:
    # Kein SMTP-Relay im Repo vorhanden — filesystem-Notifier schreibt
    # Passwort-Reset-/Identitätsbestätigungs-Links in eine Datei im Pod
    # (per `kubectl exec` lesbar), verschickt aber keine echte E-Mail. Für
    # den Admin-Only-Pilot ausreichend; bei Bedarf später auf smtp:
    # umstellen, sobald ein Mail-Relay existiert.
    filesystem:
      filename: /config/notification.txt
