# TOTP-Pflicht für die "admins"-Gruppe (aus lldap synchronisiert, siehe
# 00-ldap-source.yaml) — identische Abgrenzung wie bisher bei Authelia
# (docs/4-planung/40000-authelia-sso.md, Baustein 4): nur Admin-/Infra-Tools
# erzwingen 2FA, Endnutzer-Apps laufen mit Passwort-Login.
#
# WICHTIG: gegen docs.goauthentik.io/docs/add-secure-apps/flows-stages/stages/authenticator_totp/
# und .../policies/ für die Ziel-Version prüfen, siehe Hinweis in
# 00-ldap-source.yaml.
#
# Korrektur (nach Live-Betrieb): Admins mussten TOTP bei JEDEM Login neu
# einrichten (neuer QR-Code statt Code-Abfrage), weil hier ursprünglich die
# rohe "authenticatortotpstage" (Setup/Enrollment-Stage, legt IMMER ein
# neues Geräte-Objekt an) direkt im Login-Flow gebunden war — ganz ohne
# Prüfung, ob der Nutzer schon ein TOTP-Gerät hat. Fix: stattdessen eine
# eigene "authenticatorvalidatestage" binden (prüft ein vorhandenes Gerät
# und verweist per configuration_stages nur bei fehlendem Gerät EINMALIG
# auf die Setup-Stage). Die zwei "state: absent"-Einträge am Ende räumen
# die alte, fehlerhafte Bindung aus dem Cluster; sobald sie synced sind,
# können auch diese zwei Einträge aus der Datei entfernt werden.
version: 1
metadata:
  name: admin-2fa-enforcement
entries:
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup-stage
    identifiers:
      name: totp-setup
    attrs:
      digits: 6

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: totp-validation-stage
    identifiers:
      name: admin-totp-validation
    attrs:
      device_classes:
        - totp
      not_configured_action: configure
      configuration_stages:
        - !KeyOf totp-setup-stage

  - model: authentik_policies_expression.expressionpolicy
    id: require-2fa-admins-policy
    identifiers:
      name: require-2fa-for-admins-group
    attrs:
      expression: |
        # Nur Mitglieder der lldap-Gruppe "admins" müssen TOTP einrichten —
        # alle anderen überspringen diese Stage.
        return ak_is_group_member(request.user, name="admins")

  - model: authentik_flows.flowstagebinding
    id: totp-validation-binding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf totp-validation-stage
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf totp-validation-binding
      policy: !KeyOf require-2fa-admins-policy
      order: 0

  # Aufräumen der alten, fehlerhaften Direkt-Bindung der Setup-Stage
  # (siehe Korrektur-Hinweis oben). Policy-Binding zuerst, dann die
  # Flow-Stage-Binding selbst.
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-authentication-flow]], stage, !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, totp-setup]], order, 30]]
      policy: !KeyOf require-2fa-admins-policy
      order: 0
    state: absent

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf totp-setup-stage
      order: 30
    state: absent
