---
# Kein Bitnami-Postgres-Subchart wie im historischen Setup (siehe
# docs/4-planung/40070-authentik-sso-iac.md → Ausgangslage) — stattdessen
# ein eigenes, leichtgewichtiges Postgres-Deployment nach demselben Muster
# wie argocd/apps/workloads/{wikijs,nextcloud,immich}/templates/postgres-*.yaml.
# Ebenfalls kein Redis: Authentik läuft seit mehreren Major-Versionen ohne
# Pflicht-Redis (In-Memory-Cache reicht bei einer Server-Replica).

image:
  repository: ghcr.io/goauthentik/server
  # TODO vor erstem Sync: aktuellste stabile Version prüfen
  # (https://github.com/goauthentik/authentik/releases) — dieser Tag ist ein
  # zum Planungszeitpunkt bekannter Startwert, kein garantiert aktueller.
  tag: "2025.8.3"
  pullPolicy: IfNotPresent

logLevel: info

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------
# Server (Web-UI + API + eingebetteter Outpost für ForwardAuth)
# ---------------------------------------------------------------
server:
  replicaCount: 1
  # HPA/Autoscaling bewusst nicht vorgesehen — Ein-Node-Cluster
  # (worker-0/worker-1 NotReady), mehr Replicas bringen keine
  # Ausfallsicherheit, nur zusätzlichen RAM-Verbrauch. Identische
  # Begründung wie bei authelia/values.yaml und historisch bei Authentik.
  resources:
    # Historisch validierte Werte (letzter Stand vor der Entfernung,
    # 18.08.2026) als Startpunkt übernommen — vor dem ersten Rollout-Batch
    # trotzdem `kubectl describe node homeserver` gegen das aktuelle
    # Gesamtbudget prüfen (siehe docs/4-planung/40070-authentik-sso-iac.md).
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 768Mi
  service:
    port: 80
    targetPort: 9000
    metricsPort: 9300
  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - authentik.tech.homeserver
    tls: []

# ---------------------------------------------------------------
# Worker (Background-Tasks: Blueprints anwenden, Flows ausführen, ...)
# ---------------------------------------------------------------
worker:
  replicaCount: 1
  resources:
    # Historisch mit 384Mi/768Mi bereits einmal OOMKilled gewesen
    # (Commit 983e338 hat auf diesen Wert angehoben) — hier von Anfang an
    # mit dem gefixten Wert UND einem VMRule-Alert (siehe
    # templates/vmservicescrape.yaml) statt reaktivem Nachziehen.
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi

# ---------------------------------------------------------------
# Postgres (eigenes, leichtgewichtiges Deployment — kein Subchart)
# ---------------------------------------------------------------
postgresql:
  database: authentik
  username: authentik
  image:
    repository: postgres
    tag: "17-bookworm"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    storageClassName: local-path
    size: 2Gi
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------
# Secrets — SealedSecret, verschlüsselt mit dem kubeseal-Public-Key dieses
# Clusters. Erzeugt per `openssl rand` + `kubeseal --raw --namespace
# authentik --name authentik-credentials --controller-namespace
# sealed-secrets --controller-name sealed-secrets-controller` (Muster wie
# bei authelia/lldap). Enthält:
#   - secret-key: Authentiks interner Signier-/Verschlüsselungsschlüssel
#   - db-password: Passwort für den "authentik"-User im eigenen Postgres
#   - bootstrap-password: initiales Passwort für den Erstadmin "akadmin"
#     (einmalig im Chat mitgeteilt, siehe docs/d-sicherheit/d0073-authentik-sso.md —
#     SOFORT nach dem ersten Login ändern, analog lldap-root)
#   - bootstrap-email: E-Mail für "akadmin" (Platzhalter, wird nie versendet,
#     kein SMTP-Relay im Repo vorhanden)
#   - ldap-bind-password: Passwort des Service-Accounts "authentik-bind" in
#     lldap (Gruppe lldap_strict_readonly) — muss manuell in lldaps Web-UI
#     gesetzt werden, siehe docs/d-sicherheit/d0072-lldap.md und
#     docs/d-sicherheit/d0073-authentik-sso.md, Abschnitt "LDAP Source".
credentials:
  secretName: authentik-credentials
  encryptedSecretKey: ""
  encryptedDbPassword: ""
  encryptedBootstrapPassword: ""
  encryptedBootstrapEmail: ""
  encryptedLdapBindPassword: ""

# local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
# wird — fest auf homeserver, analog zu authelia/uptime-kuma/lldap.
nodeSelector:
  kubernetes.io/hostname: homeserver

tolerations: []
affinity: {}

backup:
  # pg_dump-CronJob auf die NAS — Muster wie
  # argocd/apps/workloads/vaultwarden/templates/backup-cronjob.yaml.
  enabled: true
  schedule: "45 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: nas
  size: 2Gi
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

metrics:
  enabled: true
  # Handgeschriebene VMServiceScrape statt ServiceMonitor-CRD — die
  # monitoring.coreos.com/v1-CRD ist in diesem Cluster nicht installiert,
  # nur VictoriaMetrics-CRDs (Lehre aus der historischen Authentik-Runde,
  # dort erst nachträglich korrigiert, siehe docs/4-planung/40070-authentik-sso-iac.md).

blueprints:
  # Blueprints werden aus templates/blueprints/*.yaml (Helm .Files.Glob) als
  # ConfigMap gebaut und in Server + Worker unter /blueprints/custom
  # gemountet — Authentik wendet sie beim Start automatisch an. Neue App
  # anlegen = neue Datei unter templates/blueprints/apps/ committen, siehe
  # docs/d-sicherheit/d0074-authentik-iac-cookbook.md.
  mountPath: /blueprints/custom
