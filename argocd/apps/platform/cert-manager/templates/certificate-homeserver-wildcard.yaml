# Ersetzt sowohl den manuellen "SAN-Liste live aus dem Cluster ziehen +
# openssl signieren + kubeseal"-Ablauf als auch das committete
# SealedSecret aus docs/d-sicherheit/d0040-internal-tls.md — cert-manager erstellt das
# `homeserver-wildcard-tls`-Secret jetzt selbst (namespace kube-system,
# exakt der Name, den argocd/apps/platform/traefik-config/tlsstore.yaml
# als Traefik-Default-Zertifikat referenziert) und erneuert es automatisch
# vor Ablauf (duration/renewBefore unten) — kein Kalender-Reminder für den
# 11.11.2028 mehr nötig.
#
# KEIN echtes `*.homeserver`-Wildcard (wie in docs/d-sicherheit/d0040-internal-tls.md erklärt, strukturell
# unmöglich — Single-Label-TLD, RFC-6125/X509_check_host-Regel, unabhängig
# vom Tool). Explizite `dnsNames`-Liste bleibt deshalb bestehen, jetzt aber
# tier-behaftet (`<app>.tech.homeserver`/`<app>.prod.homeserver`, siehe
# docs/c-netzwerk-dns/c0040-domain-tiers.md) — der alte SealedSecret trug noch die
# UNTIERTE Liste von vor der Domain-Tier-Migration, was seither zu einem
# Zertifikats-Hostname-Mismatch auf jedem tier-behafteten Host führte
# (das eigentliche "der aktuelle Weg funktioniert nicht"). Ein neuer Host
# braucht weiterhin einen Eintrag hier + Commit — das ist inhärent zur
# fehlenden Wildcard-Fähigkeit, nicht spezifisch für cert-manager.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homeserver-wildcard-tls
  namespace: kube-system
spec:
  secretName: homeserver-wildcard-tls
  issuerRef:
    name: homeserver-ca-issuer
    kind: ClusterIssuer
  commonName: homeserver
  duration: 2160h # 90 Tage
  renewBefore: 720h # 30 Tage vor Ablauf automatisch erneuern
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - homeserver
    - alamos-apager.prod.homeserver
    - argo-workflows.tech.homeserver
    # Authelia-Portal, zwei Hostnamen (nicht einer) — Begründung:
    # docs/4-planung/40000-authelia-sso.md, Baustein 1 (Cookie-Domain
    # braucht mindestens einen Punkt, "homeserver" allein reicht nicht,
    # daher ein Hostname pro Domain-Tier).
    - auth.prod.homeserver
    - auth.tech.homeserver
    - carplay-api.prod.homeserver
    - demo.prod.homeserver
    - gotify-api.tech.homeserver
    - gotify.tech.homeserver
    - grafana.tech.homeserver
    - headlamp.tech.homeserver
    - immich.prod.homeserver
    - kubeseal-webgui.tech.homeserver
    # lldap-Web-UI (Nutzer-/Gruppenverwaltung), Tailscale/LAN-only wie
    # andere Admin-Tools, siehe docs/d-sicherheit/d0072-lldap.md.
    - lldap.tech.homeserver
    - mealie.prod.homeserver
    - mealie-native.prod.homeserver
    - minio.tech.homeserver
    - n8n.prod.homeserver
    - nextcloud.prod.homeserver
    - ntfy.tech.homeserver
    - paperless.prod.homeserver
    - pihole.tech.homeserver
    - semaphore-api.tech.homeserver
    - semaphore.tech.homeserver
    - stream.prod.homeserver
    - tinyteller.prod.homeserver
    - uptime-kuma.prod.homeserver
    # Bypass-Ingress "Knopfdruck zur nativen Anmeldung" für Uptime Kuma
    # (Batch 1/Pilot), siehe docs/4-planung/40000-authelia-sso.md, Baustein 3.
    - uptime-kuma-native.prod.homeserver
    - vault.tech.homeserver
    - vm-write.tech.homeserver
    - whoami.prod.homeserver
    - wiki.prod.homeserver
    - xibo.prod.homeserver
    - zammad.tech.homeserver
