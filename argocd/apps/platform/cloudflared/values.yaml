---
# ============================================================
# Cloudflare Tunnel — Werte-Datei
#
# Setup-Anleitung: docs/22-cloudflare-tunnel.md
# Deploy-Anleitung: docs/23-cloudflare-deploy.md
# ============================================================

# Zwei Replicas = zwei unabhängige Edge-Verbindungen für denselben Tunnel
# (cloudflared unterstützt das nativ — kein Leader-Election-Gedöns nötig).
# Nur wirksam solange autoscaling.enabled=false ist — danach übernimmt der
# HPA die Replica-Anzahl (minReplicas unten bewusst auf 2 gesetzt, um die
# zwei unabhängigen Edge-Verbindungen als Minimum beizubehalten).
replicaCount: 2

# CPU-only: winziger Footprint (32Mi request/128Mi limit), nicht
# speicherbound — eine Memory-Metrik würde hier nichts sinnvolles messen.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # Pinned für Reproduzierbarkeit. Releases:
  # https://github.com/cloudflare/cloudflared/releases
  tag: "2026.7.3"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

tunnel:
  # Name, den `cloudflared tunnel create <name>` vergeben hat.
  name: homeserver

  # Tunnel-ID (UUID aus `cloudflared tunnel create`). Kein Secret — nur ein
  # Bezeichner, unbedenklich im Klartext in Git.
  id: "47c69d59-cf11-4859-968c-a03dfa153ff1"

  # credentials.json aus `cloudflared tunnel create` mit kubeseal versiegeln:
  #   kubeseal --raw --namespace cloudflared --name cloudflared-credentials \
  #     --controller-namespace sealed-secrets --controller-name sealed-secrets-controller \
  #     --from-file=/pfad/zur/<tunnel-id>.json
  # Details: docs/22-cloudflare-tunnel.md → Schritt 3
  credentialsSecretName: cloudflared-credentials
  encryptedCredentialsJson: ""

  # Wildcard-Routing statt eine Regel pro App: alle drei Tier-Wildcards
  # zeigen auf Traefik (kube-system) statt direkt auf den jeweiligen
  # Backend-Service — Traefik übernimmt danach das ganz normale
  # Host-Header-Routing zur richtigen App, exakt wie es das intern für
  # *.homeserver bereits tut (siehe docs/56-domain-tiers.md). Eine App wird
  # dadurch NICHT automatisch extern erreichbar — dafür braucht sie
  # zusätzlich zu ihrem *.homeserver-Host einen passenden
  # *.pke-lab.de-Host in der eigenen ingress.hosts-Liste. Ohne den
  # zusätzlichen Host findet Traefik keinen passenden Router und liefert
  # 404 — dieselbe "nur was explizit eingetragen ist" Garantie wie vorher
  # über cloudflareds defaultService, nur eine Ebene tiefer.
  #
  # Noch gegen den echten Cluster zu verifizieren (siehe
  # docs/22-cloudflare-tunnel.md → Troubleshooting): cloudflared muss dafür
  # standardmäßig den ORIGINAL angefragten Hostnamen (z. B.
  # "grafana.tech.pke-lab.de") als HTTP-Host-Header an den Origin
  # weiterreichen, nicht den Hostnamen aus "service:" — das ist Cloudflares
  # dokumentiertes Default-Verhalten für originRequest.httpHostHeader,
  # sollte aber nach dem Rollout per curl bestätigt werden. Falls nicht:
  # httpHostHeader hier pro Regel explizit setzen.
  ingress:
    rules:
      - hostname: "*.tech.pke-lab.de"
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: "*.prod.pke-lab.de"
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: "*.dev.pke-lab.de"
        service: http://traefik.kube-system.svc.cluster.local:80
    defaultService: "http_status:404"

nodeSelector: {}

tolerations: []

affinity: {}
