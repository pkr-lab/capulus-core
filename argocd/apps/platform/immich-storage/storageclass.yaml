# StorageClass "immich-nas": dedizierter NFS-Export für Immich auf dem
# UGREEN NAS (192.168.178.97/volume2/immich-storage) — bewusst getrennt
# von der generischen "nas"-StorageClass (/volume1/k8s-storage), siehe
# docs/16-nas-storage.md und docs/35-immich.md.
#
# Verwendung in PVCs:
#   storageClassName: immich-nas
#
# Eigenschaften identisch zur "nas"-StorageClass (siehe dort für Details):
# Retain-Reclaim, Immediate-Binding, keine Volume-Expansion, keine
# NodeAffinity für nutzende Pods nötig.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: immich-nas
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: k8s-sigs.io/immich-storage-provisioner
parameters:
  archiveOnDelete: "false"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
