---
replicaCount: 1
# Genau wie Authelia: SQLite lokal, keine geteilte Session/DB — mehr als 1
# Replica ist mit local-path-PVC ohnehin nicht sinnvoll (RWO), siehe
# docs/4-planung/40000-authelia-sso.md.

image:
  repository: lldap/lldap
  pullPolicy: IfNotPresent
  tag: "stable"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# KEIN runAsNonRoot/runAsUser erzwingen — das Image-Entrypoint startet
# bewusst als root, chownt /app + /data auf UID/GID (env, Default 1000) und
# droppt danach selbst per gosu (siehe docker-entrypoint.sh im Image,
# identisches Muster wie bei uptime-kuma/values.yaml). Mit erzwungenem
# Nicht-root-Start scheitert der chown-Schritt.
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false

# Steuert den Privilege-Drop im Entrypoint (chown + gosu) — Image-Default ist
# bereits 1000:1000, hier nur explizit gemacht (Konsistenz mit dem Rest des
# Repos, z. B. uptime-kuma PUID/PGID).
env:
  UID: "1000"
  GID: "1000"
  LLDAP_LDAP_BASE_DN: "dc=homeserver"
  # Umbenannter Superuser — NICHT "admin", damit der App-seitige "admin"-
  # Nutzer (Authelia-Fallback-Login, siehe docs/4-planung/40000-authelia-sso.md)
  # keinen Namenskonflikt mit lldaps eingebautem Superuser hat. Getrennte
  # Accounts für getrennte Zwecke (lldap-Verwaltung vs. App-Zugriff).
  LLDAP_LDAP_USER_DN: "lldap-root"
  LLDAP_LDAP_USER_EMAIL: "lldap-root@homeserver.local"
  LLDAP_HTTP_URL: "https://lldap.tech.homeserver"
  # Kein SMTP-Relay im Repo vorhanden (wie bei Authelia) — Passwort-Reset
  # läuft ausschließlich manuell über die Web-UI (lldap-root kann jedes
  # Nutzerpasswort direkt zurücksetzen, ganz ohne E-Mail).
  LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: "false"

service:
  type: ClusterIP
  ldapPort: 3890
  httpPort: 17170

ingress:
  enabled: true
  className: traefik
  annotations: {}
  # NUR intern — Admin-Tool-Charakter wie Headlamp/Semaphore/MinIO
  # ("Nicht freigeben" in docs/e-externe-erreichbarkeit/e0000-cloudflare-tunnel.md).
  # Kein externer Host.
  hosts:
    - host: lldap.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /data

# local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
# wird — fest auf homeserver, analog zu authelia/uptime-kuma.
nodeSelector:
  kubernetes.io/hostname: homeserver

tolerations: []
affinity: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Secrets: templates/sealedsecret.yaml. Erzeugt am 22.08.2026 per `openssl
# rand` + `kubeseal --raw --namespace lldap --name lldap-secrets`
# (docs/d-sicherheit/d0072-lldap.md). Enthält:
#   - jwt-secret: signiert lldaps eigene Web-UI-Sessions
#   - key-seed: leitet den Schlüssel zum Passwort-Storage ab —
#     EINMALIG, niemals rotieren (macht sonst alle gesetzten Passwörter ungültig)
#   - root-password: Login für LLDAP_LDAP_USER_DN (lldap-root, s.o.)
#   - bind-password: Passwort für den Service-Account "authelia-bind"
#     (wird manuell in der Web-UI angelegt, siehe d0072-lldap.md — muss mit
#     diesem Secret übereinstimmen, sonst schlägt Authelias LDAP-Bind fehl)
secrets:
  secretName: lldap-secrets
  encryptedJwtSecret: ""
  encryptedKeySeed: ""
  encryptedRootPassword: ""
  encryptedBindPassword: ""
