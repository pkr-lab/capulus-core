apiVersion: v1
kind: ConfigMap
metadata:
  name: datasource-victorialogs
  # Grafana läuft im monitoring-Namespace; der Sidecar dort sucht per
  # searchNamespace: ALL nach ConfigMaps mit dem Label unten (siehe
  # argocd/apps/platform/monitoring/values.yaml, grafana.sidecar.datasources).
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  victorialogs.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://logging-victoria-logs-single-server.logging.svc.cluster.local:9428
        isDefault: false
        jsonData:
          maxLines: 1000
