---
# ============================================================
# Monitoring stack — values for victoria-metrics-k8s-stack.
# All keys live under `victoria-metrics-k8s-stack:` because that
# is the dependency name in Chart.yaml.
#
# Upstream values.yaml reference:
#   https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-k8s-stack/values.yaml
# Chart docs:
#   https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/
# ============================================================

victoria-metrics-k8s-stack:
  global:
    clusterLabel: homeserver
    cluster:
      dnsDomain: cluster.local.

  # ---- VictoriaMetrics Operator ----------------------------
  # Installs VM CRDs (VMSingle, VMAgent, VMAlert, VMServiceScrape, ...).
  # `crds.plain: true` renders CRDs as plain templates so ArgoCD can apply
  # them — required because ArgoCD ignores Helm's `crds/` folder by default.
  victoria-metrics-operator:
    enabled: true
    crds:
      plain: true
      cleanup:
        # Deleting the chart leaves CRDs on the cluster (safer default).
        enabled: false
    admissionWebhooks:
      # Avoid sync-loop races against the operator's webhook on first install.
      policy: Ignore
    operator:
      # Auto-convert Prometheus ServiceMonitor → VMServiceScrape so apps
      # that ship Prometheus-style monitors work out of the box.
      disable_prometheus_converter: false

  # ---- VictoriaMetrics single-node TSDB --------------------
  # Single-node is plenty for a home server. Switch to vmcluster only if
  # you ever push > 1M active series.
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "15d"       # h/d/w/y; unit-less = months
      replicaCount: 1
      extraArgs:
        # Drop scrapes from misbehaving targets instead of blowing memory.
        memory.allowedPercent: "60"
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        # War auf "nas" (NFS), bis das UGREEN-NAS all_squash erzwang und
        # VictoriaMetrics beim Öffnen bestehender Storage-Parts mit
        # "permission denied" panickte (docs/2-betrieb-hardware/20000-nas-storage.md). TSDB-Daten
        # sind reiner State → lokaler Storage. Bewusst ohne Datenmigration
        # neu aufgesetzt (nur 15d Retention, Verdacht auf teilbeschädigte
        # Parts durch die vorherigen Schreibfehler).
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
      # local-path bindet den Pod an den Node, auf dem die PVC zuerst
      # provisioniert wird — fest auf homeserver (aktuell ohnehin der
      # einzige Ready-Node).
      nodeSelector:
        kubernetes.io/hostname: homeserver
      affinity: {}

  # ---- VMAgent ---------------------------------------------
  # Scrapes everything matching a VMServiceScrape / VMPodScrape /
  # VMNodeScrape / VMStaticScrape in any namespace. ServiceMonitors are
  # auto-converted by the operator.
  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      scrapeInterval: 30s
      externalLabels:
        cluster: homeserver
      extraArgs:
        promscrape.streamParse: "true"
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # ---- VMAlert ---------------------------------------------
  vmalert:
    enabled: true
    spec:
      selectAllByDefault: true
      evaluationInterval: 30s

  # ---- Alertmanager ----------------------------------------
  # Routing:
  #   alle Alerts (außer InfoInhibitor/Watchdog) → gotify-bridge
  #   zusätzlich severity=critical → auch ntfy /Home-Lab (iOS Push)
  #   zusätzlich NUR alertname=BananaPiAlarmmonitorDown → auch n8n-Webhook
  #     (-> Zammad-Ticket, siehe docs/3-apps-workloads/30020-vereinsheim-alarmmonitor.md). Rein
  #     additiv: die anderen Alamos-Raspberry-Pis bekommen bewusst weiterhin
  #     KEIN Ticket pro Ausfall (siehe docs/3-apps-workloads/30010-alamos-apager.md), nur dieser
  #     eine Alertname bekommt den zusätzlichen Pfad.
  #
  # gotify-bridge: argocd/apps/platform/gotify-bridge/ — übersetzt Alertmanager-JSON
  #   in Gotifys message-API. Token als Secret `gotify-bridge-token` anlegen
  #   (siehe argocd/apps/platform/gotify-bridge/values.yaml).
  # ntfy: argocd/apps/platform/ntfy/ — Alertmanager-Webhook wird direkt empfangen.
  # n8n: argocd/apps/workloads/n8n/ — Webhook-Trigger des Workflows
  #   "Banana-Pi-Down -> Zammad-Ticket"
  #   (argocd/apps/workloads/n8n/workflows/banana-pi-down-to-zammad.json).
  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
    config:
      route:
        receiver: blackhole
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - matchers:
              - alertname=~"InfoInhibitor|Watchdog"
            receiver: blackhole
          # Match-all sibling: every alert reaching here goes to gotify, then
          # (continue: true) falls through to the next matching sibling
          # below. A bare top-level receiver does NOT get combined with a
          # matched child route — Alertmanager only falls back to it when no
          # child matches at all — so the "default + critical (+ banana-pi)"
          # fan-out has to be modeled as explicit sibling routes.
          - matchers:
              - severity=~".*"
            receiver: gotify
            continue: true
          # Nur dieser eine Alertname zusätzlich an n8n — muss VOR der
          # severity=critical-Route stehen (die hat kein continue: true und
          # würde die Auswertung sonst dort beenden).
          - matchers:
              - alertname="BananaPiAlarmmonitorDown"
            receiver: n8n-banana-pi-down
            continue: true
          - matchers:
              - severity="critical"
            receiver: ntfy
      receivers:
        - name: blackhole
        - name: gotify
          webhook_configs:
            - url: 'http://gotify-bridge.gotify-bridge.svc.cluster.local:8080/alert'
              send_resolved: true
        - name: ntfy
          webhook_configs:
            - url: 'http://ntfy-bridge.ntfy-bridge.svc.cluster.local:8080/alert'
              send_resolved: true
        - name: n8n-banana-pi-down
          webhook_configs:
            - url: 'http://n8n.n8n.svc.cluster.local/webhook/banana-pi-down'
              send_resolved: false
      inhibit_rules:
        - target_matchers:
            - severity=~"warning|info"
          source_matchers:
            - severity=critical
          equal:
            - namespace
            - alertname


  # ---- Default alert rules ---------------------------------
  defaultRules:
    create: true
    # Disable rules for components k3s does not expose as separate pods:
    # controller-manager, scheduler, and etcd all run inside the single
    # k3s server process. kubeProxy is also baked in.
    groups:
      etcd:
        create: false
      kubeScheduler:
        create: false
      kubernetesSystemScheduler:
        create: false
      kubernetesSystemControllerManager:
        create: false

  # ---- Default dashboards (cluster, nodes, VM components) ---
  defaultDashboards:
    enabled: true
    defaultTimezone: browser
    dashboards:
      node-exporter-full:
        enabled: true
      victoriametrics-vmalert:
        enabled: true
      victoriametrics-operator:
        enabled: true

  # ---- Grafana --------------------------------------------
  # Exposed at https://grafana.tech.homeserver via Traefik. Admin password is
  # auto-generated and stored in the `monitoring-grafana` Secret. Retrieve
  # with:
  #   kubectl -n monitoring get secret monitoring-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d; echo
  grafana:
    enabled: true
    defaultDashboardsTimezone: browser

    plugins:
      - victoriametrics-metrics-datasource
      # Infinity: direkte HTTP/JSON-API-Abfragen in Grafana-Panels —
      # wird für Pegelonline, DWD und ELWIS-Dashboards benötigt.
      - yesoreyeram-infinity-datasource
      # VictoriaLogs: Datasource für zentrales Logging, siehe
      # argocd/apps/platform/logging/.
      - victoriametrics-logs-datasource

    admin:
      existingSecret: "grafana-admin"        # leave empty → auto-generated password

    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472

    initChownData:
      enabled: false

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Sidecar picks up any ConfigMap labelled `grafana_dashboard=1` —
    # `defaultDashboards` above ships its dashboards this way, and you
    # can drop extra ConfigMaps in the `monitoring` namespace to add more.
    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /var/lib/grafana/dashboards
        searchNamespace: ALL
        provider:
          name: default
          orgid: 1
          foldersFromFilesStructure: true

    ingress:
      enabled: true
      ingressClassName: traefik
      # Authelia-SSO (docs/d-sicherheit/d0070-authelia-sso.md) — gilt für
      # BEIDE Hosts unten (ein Ingress-Objekt für beide, kein Split wie bei
      # den eigenen Charts). Nur die dlrg-einsatz-Gruppe hat aktuell Zugriff
      # (access_control-Regel in argocd/apps/platform/authelia/values.yaml),
      # sonst die admins-Gruppe über die Catch-all-Regel.
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: "authelia-authelia-tech@kubernetescrd"
      labels: {}
      path: /
      pathType: Prefix
      # Zweiter Host: extern, per Cloudflare-Tunnel-Wildcard (cloudflared)
      # an Traefik weitergereicht, siehe docs/c-netzwerk-dns/c0040-domain-tiers.md.
      hosts:
        - grafana.tech.homeserver
        - grafana-tech.pke-lab.de
      tls: []

    # Grafana itself is scraped by VMAgent.
    vmScrape:
      enabled: true

    grafana.ini:
      server:
        domain: grafana-tech.pke-lab.de
        root_url: "https://grafana-tech.pke-lab.de"

  # ---- prometheus-node-exporter ----------------------------
  # DaemonSet: one pod per node (homeserver, worker-0, worker-1), exposes
  # host CPU/RAM/disk/network/load. Mounts /proc and /sys read-only.
  prometheus-node-exporter:
    enabled: true
    # worker-0/worker-1 werden vom cluster-power-manager nur bei Bedarf
    # geweckt und sind sonst absichtlich ausgeschaltet (ansible/roles/
    # cluster_power_manager) -> für k8s dauerhaft "unreachable". Jedes
    # DaemonSet toleriert node.kubernetes.io/unreachable/not-ready OHNE
    # tolerationSeconds (Kubernetes-Default, nicht hier konfigurierbar) —
    # der alte Pod auf einem schlafenden Worker bleibt beim Chart-Update
    # daher dauerhaft "Terminating" hängen. Beim Default
    # maxUnavailable: 1 blockiert genau dieser eine feststeckende Pod
    # JEDEN weiteren Rollout, auch auf gesunden Nodes (homeserver) — der
    # Helm-Release/die ArgoCD-App bleibt dadurch dauerhaft "Progressing"
    # statt "Healthy" (siehe docs/d-sicherheit/d0000-incident-2026-08-12.md, Abschnitt
    # "Grafana zeigte nach Recovery nur noch UGREEN-NAS-Werte"). Fix:
    # genug Unavailable-Budget, dass beide Worker gleichzeitig "stuck"
    # sein können, ohne den Rollout auf homeserver zu blockieren.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 2
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # ---- kube-state-metrics ----------------------------------
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # ---- Kubernetes component scraping ----------------------
  # Enabled where k3s actually exposes the metric.
  kubelet:
    enabled: true
  kubeApiServer:
    enabled: true
  coreDns:
    enabled: true

  # Disabled — k3s bakes these into a single process bound to 127.0.0.1.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  # k3s ships an embedded SQLite datastore by default; no etcd to scrape.
  kubeEtcd:
    enabled: false
