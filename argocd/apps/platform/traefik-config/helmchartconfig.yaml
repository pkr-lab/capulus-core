# Aktiviert Prometheus-Metriken für das k3s-eigene, im kube-system
# gebündelte Traefik (siehe docs/b-kubernetes-gitops/b0000-k3s.md) — braucht dafür eine
# HelmChartConfig, k3s' eigenes CRD zum additiven Überschreiben der Werte
# des eingebauten HelmChart-Objekts "traefik" (kein separates ArgoCD-App,
# k3s' interner helm-controller wendet das an, sobald das CR existiert).
#
# WICHTIG: explizites metadata.namespace: kube-system nötig (wie bei
# argocd/apps/platform/coredns-custom/configmap.yaml) — sonst landet das Objekt in
# der Namensraum-Konvention des root-ApplicationSet (Namespace
# "traefik-config", passend zum Ordnernamen), wo es der helm-controller nie
# findet, weil der nur nach HelmChartConfig mit demselben Namen UND
# Namespace wie das zugehörige HelmChart sucht.
#
# Port 9100 ist NICHT über Ingress exponiert (expose.default: false) — nur
# clusterintern für den VMServiceScrape (siehe vmservicescrape.yaml)
# erreichbar.
#
# ports.web.http.redirections: erzwingt HTTP(80)->HTTPS(443) global für JEDEN Ingress-
# Host, ohne die ~36 Ingress-Objekte einzeln anzufassen (gleiche Begründung
# wie beim TLSStore in tlsstore.yaml: ein zentraler Ort statt 36 Dateien).
# Ohne das beantwortet Traefik Port 80 für jeden Host weiterhin unverschlüsselt
# — das global konfigurierte homeserver-wildcard-tls-Zertifikat (tlsstore.yaml)
# greift nur, wenn der Client tatsächlich :443/https anfragt. Sichtbar wurde
# das über Authentik: dessen ForwardAuth-Middleware berechnet die Rückkehr-
# URL dynamisch aus dem tatsächlichen Request-Schema (middleware.yaml,
# trustForwardHeader: true) — kam der Request über Port 80 rein, blieb der
# komplette Login-Flow (inkl. Auth-Cookie) auf Klartext-HTTP, statt auf
# https hochgestuft zu werden. cloudflared zeigt für externe Hosts ohnehin
# schon auf Traefiks HTTPS-Entrypoint (siehe
# docs/d-sicherheit/d0073-authentik-sso.md), ist von diesem Redirect also
# nicht betroffen.
#
# Vor dem Mergen prüfen (kann hier nicht gegen den echten Cluster
# verifiziert werden):
#   kubectl get helmchart traefik -n kube-system -o yaml   # Chart-Version
#   kubectl get svc traefik -n kube-system --show-labels   # Service-Labels
#     für den Selector in vmservicescrape.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        entryPoint: metrics
        addRoutersLabels: true
        addServicesLabels: true
    ports:
      metrics:
        port: 9100
        expose:
          default: false
        protocol: TCP
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
