# Security-Härtung Phase 5 (docs/51-security-hardening-roadmap.md,
# docs/54-internal-tls.md): *.homeserver-Wildcard-Zertifikat, signiert von
# einer lokalen, per openssl erzeugten CA (Root-Zertifikat öffentlich,
# keine Secrets: docs/assets/homeserver-root-ca.pem — muss auf jedem
# Client-Gerät im Trust-Store landen, siehe docs/54). Gültig bis
# 11.11.2028. Bewusst NICHT per `mkcert` direkt ausgestellt — mkcert
# schreibt Username+Hostname des generierenden Rechners in CA- und
# Leaf-Zertifikat (OU-Feld), was bei einem öffentlichen Repo ungewollt
# Metadaten preisgeben würde. Stattdessen: CA einmalig per openssl mit
# neutralem Subject (O=Homeserver Internal CA) erzeugt, Leaf-Zertifikat
# ebenfalls per openssl signiert — Details + vollständige Befehle für
# künftige Erneuerungen: docs/54, Abschnitt "Zertifikat erneuern".
#
# Der CA-Private-Key (rootCA-key.pem) liegt NICHT in diesem Repo — separat
# gesichert (Passwort-Manager), nur für künftige Zertifikats-Erneuerungen
# gebraucht, siehe docs/54.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: homeserver-wildcard-tls
  namespace: kube-system
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: homeserver-wildcard-tls
      namespace: kube-system
    type: kubernetes.io/tls
