# Security-Härtung Phase 5 (docs/51-security-hardening-roadmap.md,
# docs/54-internal-tls.md): TLS-Zertifikat für alle `*.homeserver`-Hosts,
# signiert von einer lokalen, per openssl erzeugten CA (Root-Zertifikat
# öffentlich, keine Secrets: docs/assets/homeserver-root-ca.pem — muss auf
# jedem Client-Gerät im Trust-Store landen, siehe docs/54). Gültig bis
# 11.11.2028.
#
# KEIN Wildcard-Zertifikat (`*.homeserver`) — das funktioniert strukturell
# nicht: OpenSSL/Browser lehnen Wildcards unter einem Suffix mit nur einem
# DNS-Label ab (`X509_check_host`-Regel gegen genau die "*.com"-Klasse von
# Zertifikaten, die hier versehentlich mit ausgelöst wurde — empirisch
# bestätigt per `openssl s_client ... -verify_hostname`, Fehler 62
# "hostname mismatch"). Stattdessen: explizite SAN-Liste aller
# tatsächlichen Hosts, per `kubectl get ingress -A` ermittelt (siehe
# docs/54, Abschnitt "Zertifikat erneuern" für den vollständigen Befehl,
# der die Liste automatisch aus dem Cluster zieht statt sie
# handzupflegen).
#
# CA ebenfalls per openssl statt `mkcert` direkt — mkcert schreibt
# Username+Hostname des generierenden Rechners ins OU-Feld, was bei einem
# öffentlichen Repo (dieses hier ist `public`) ungewollt Metadaten
# preisgeben würde.
#
# Der CA-Private-Key (rootCA-key.pem) liegt NICHT in diesem Repo — separat
# gesichert (Passwort-Manager), nur für künftige Zertifikats-Erneuerungen
# gebraucht, siehe docs/54.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: homeserver-wildcard-tls
  namespace: kube-system
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: homeserver-wildcard-tls
      namespace: kube-system
    type: kubernetes.io/tls
