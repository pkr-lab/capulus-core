# Scraped die in helmchartconfig.yaml aktivierten Traefik-Metriken für
# VictoriaMetrics — kein prometheus-operator in diesem Cluster, nur die
# VictoriaMetrics-CRDs, daher VMServiceScrape statt ServiceMonitor.
#
# Selector nur auf app.kubernetes.io/name: traefik (nicht zusätzlich auf
# app.kubernetes.io/instance), weil k3s' Addon-Charts den Instance-Label-
# Suffix je nach k3s-Version unterschiedlich benennen — mit
# `kubectl get svc traefik -n kube-system --show-labels` prüfen und bei
# Bedarf präzisieren, falls der Name-Selector in eurem Cluster nicht
# eindeutig auf den Traefik-Service trifft.
#
# Trifft auf ZWEI Services: den Haupt-Service "traefik" (kein Port namens
# "metrics", da helmchartconfig.yaml Port 9100 bewusst mit
# expose.default: false vom Haupt-Service fernhält) und den seit
# metrics.prometheus.service.enabled: true (siehe helmchartconfig.yaml)
# zusätzlich gerenderten ClusterIP-Service "traefik-metrics", der den
# Port tatsächlich "metrics" nennt — nur dort greift dieser Endpoint.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: traefik-metrics
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
