---
apiVersion: v2
name: zot
description: |
  Self-hosted OCI-Registry (Zot, CNCF Sandbox) als Ersatz für ghcr.io —
  Images müssen so nicht mehr extern auf GitHub liegen. Bewusst gegen
  Harbor entschieden: Harbor bräuchte zusätzlich eigenes Postgres, Redis
  und Trivy als separate Komponenten — passt nicht zum Fußabdruck dieses
  Clusters (siehe andere Charts: 10m/16Mi-Requests, distroless wo möglich).
  Zot ist ein einzelnes, statisch gelinktes Go-Binary, spricht die
  Standard-OCI-Distribution-API (kaniko braucht keine Anpassung außer
  Ziel-Host + Credentials) und bringt eingebautes GC/Retention sowie
  repo-level Access-Control mit, ohne eine eigene DB zu brauchen.
type: application
version: 0.1.0
appVersion: "v2.1.18"
keywords:
  - zot
  - oci
  - registry
  - container-images
home: https://zotregistry.dev
sources:
  - https://github.com/project-zot/zot
  - https://github.com/project-zot/helm-charts
maintainers:
  - name: home-server-admin
dependencies:
  - name: zot
    repository: https://zotregistry.dev/helm-charts/
    version: "0.1.122"
