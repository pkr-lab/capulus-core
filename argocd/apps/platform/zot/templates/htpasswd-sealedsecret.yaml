apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: zot-htpasswd
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    # "kaniko"-User (Push/Pull/Delete, siehe adminPolicy in values.yaml).
    # Neu versiegeln bei Passwortwechsel:
    #   echo -n "kaniko:$(htpasswd -nbBC10 kaniko '<neues-passwort>' | cut -d: -f2)" \
    #     | kubeseal --raw --namespace zot --name zot-htpasswd \
    #       --controller-namespace sealed-secrets \
    #       --controller-name sealed-secrets-controller --from-file=/dev/stdin
    htpasswd: {{ .Values.htpasswdSecret.encryptedHtpasswd | quote }}
  template:
    metadata:
      name: zot-htpasswd
      namespace: {{ .Release.Namespace }}
    type: Opaque
