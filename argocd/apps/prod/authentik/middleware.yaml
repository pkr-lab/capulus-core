# ForwardAuth-Middleware fuer PROD-Apps hinter Authentik-SSO. Der Name
# "authentik" im Namespace "authentik" entspricht dem Annotations-Wert
# `authentik-authentik@kubernetescrd`, den die App-Ingresses aus TECH schon
# verwenden - die Ingresses muessen in PROD nicht geaendert werden.
#
# Authentik selbst laeuft nur in TECH. Die Middleware ruft dessen eingebetteten
# Outpost per HTTPS ueber den TECH-Host auf (LAN, dnsmasq). Die Rueckkehr-URL
# berechnet der Outpost aus X-Forwarded-Host/-Proto (trustForwardHeader), die
# Provider-Konfiguration in Authentik bleibt unveraendert, weil sich die Hosts
# (*.prod.homeserver, *.pke-lab.de) nicht aendern.
#
# TLS: das TECH-Zertifikat stammt von der internen Root-CA, die der Traefik in
# PROD nicht kennt - deshalb das Secret homeserver-root-ca (nur oeffentliches
# CA-Zertifikat) und tls.caSecret unten.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    address: "https://authentik.tech.homeserver/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    tls:
      caSecret: homeserver-root-ca
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
