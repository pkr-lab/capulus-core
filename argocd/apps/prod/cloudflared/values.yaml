---
# ============================================================
# Cloudflare Tunnel — Werte-Datei (PROD-Kopie, eigener Tunnel homeserver-prod)
#
# Eigener Tunnel fuer den PROD-Cluster (docs/4-planung/40080, Baustein 3.3).
# Es kommen nur Hosts an, deren DNS-Eintrag per `cloudflared tunnel route dns
# homeserver-prod <host>` auf diesen Tunnel zeigt - der Wildcard `*.pke-lab.de`
# zeigt weiter auf den TECH-Tunnel. Die Regel unten ist deshalb bewusst ein
# Wildcard: welcher Host hier ankommt, entscheidet allein das DNS.
#
# Setup-Anleitung: docs/e-externe-erreichbarkeit/e0000-cloudflare-tunnel.md
# Deploy-Anleitung: docs/e-externe-erreichbarkeit/e0010-cloudflare-deploy.md
# ============================================================

# Zwei Replicas = zwei unabhängige Edge-Verbindungen für denselben Tunnel
# (cloudflared unterstützt das nativ — kein Leader-Election-Gedöns nötig).
# Nur wirksam solange autoscaling.enabled=false ist — danach übernimmt der
# HPA die Replica-Anzahl (minReplicas unten bewusst auf 2 gesetzt, um die
# zwei unabhängigen Edge-Verbindungen als Minimum beizubehalten).
replicaCount: 2

# CPU-only: winziger Footprint (32Mi request/128Mi limit), nicht
# speicherbound — eine Memory-Metrik würde hier nichts sinnvolles messen.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  # Pinned für Reproduzierbarkeit. Releases:
  # https://github.com/cloudflare/cloudflared/releases
  tag: "2026.8.3"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

tunnel:
  # Name, den `cloudflared tunnel create <name>` vergeben hat.
  name: homeserver-prod

  # Tunnel-ID (UUID aus `cloudflared tunnel create`). Kein Secret — nur ein
  # Bezeichner, unbedenklich im Klartext in Git.
  id: "3faaf987-cda6-40f1-8bfe-7901b341f43e"

  # credentials.json aus `cloudflared tunnel create` mit kubeseal versiegeln:
  #   kubeseal --raw --namespace cloudflared --name cloudflared-credentials \
  #     --controller-namespace sealed-secrets --controller-name sealed-secrets-controller \
  #     --from-file=/pfad/zur/<tunnel-id>.json
  # Details: docs/e-externe-erreichbarkeit/e0000-cloudflare-tunnel.md → Schritt 3
  credentialsSecretName: cloudflared-credentials
  encryptedCredentialsJson: ""

  ingress:
    rules:
      # https://+443 statt http://+80 (22.08.2026, ursprünglich wegen
      # Authelia, gilt unverändert für Authentik weiter — siehe
      # docs/d-sicherheit/d0073-authentik-sso.md): Session-Cookies über eine
      # als "unsicher" gemeldete Verbindung werden abgelehnt — auf dem alten
      # Klartext-Port 80 setzte Traefik X-Forwarded-Proto: http, obwohl TLS
      # längst an der Cloudflare-Edge terminiert war (401 statt Redirect für
      # jeden extern exponierten, SSO-geschützten Host). noTLSVerify: true,
      # weil das interne
      # Zertifikat von der privaten Homeserver-CA kommt, die cloudflared
      # nicht kennt — die eigentliche Sicherheitsgrenze ist ohnehin die
      # Cloudflare-Tunnel-Verschlüsselung selbst, nicht diese interne Hop.
      - hostname: "*.pke-lab.de"
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
    defaultService: "http_status:404"

nodeSelector: {}

tolerations: []

affinity: {}
