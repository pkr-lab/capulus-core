fullnameOverride: "demo-app"

replicaCount: 1

image:
  repository: hashicorp/http-echo
  tag: "1.0.0"
  pullPolicy: IfNotPresent

message: "Hello from GitOps - Version 1"

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

# PROD-Kopie (Phase 3.3): der oeffentliche Host demo-prod.pke-lab.de faellt
# vorerst weg - cloudflared routet *.pke-lab.de auf den Traefik in TECH und
# kennt PROD noch nicht.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: demo.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 25m
    memory: 32Mi
