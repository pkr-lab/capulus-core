apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-release-watcher.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
data:
  watcher.py: |
    #!/usr/bin/env python3
    """
    GitHub-Release-Watcher -> Zammad-Bridge + App-Update-Status.

    Pollt die GitHub-Releases-API für eine Liste von Repos.
    - Bei einem neuen Release UND notify_zammad=true wird per Zammad-REST-API
      ein Ticket in einer Gruppe angelegt; Zammads eigene Agenten-
      Benachrichtigung (Profil-Einstellungen) verschickt daraufhin die
      E-Mail. Der zuletzt gesehene Tag pro Repo wird dafür in der
      state-ConfigMap persistiert (reines Kantenerkennungs-Gedächtnis, nicht
      von außen gelesen).
    - Bei JEDEM Lauf wird zusätzlich für alle Repos der aktuelle Stand
      (current_version aus der Config vs. gerade abgefragte GitHub-Version)
      in eine zweite, separate updates-ConfigMap geschrieben — das ist der
      Teil, den carplay-api liest (siehe role.yaml) und der iOS-App als
      Update-Liste zeigt. Getrennt von state.json, damit ein Lesezugriff
      von außen niemals das interne Zammad-Kantenerkennungs-Gedächtnis
      berühren kann.

    Beide ConfigMaps liegen im eigenen Namespace, Zugriff über das
    ServiceAccount-Token (kein kubectl nötig). Nutzt ausschließlich die
    Python-Standardbibliothek.
    """
    import json
    import os
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.request


    def parse_repos(raw):
        # "id|name|owner/repo|currentVersion|notifyZammad" pro Eintrag,
        # gleiche "|"-Konvention wie HOSTS/SERVICES in carplay-api
        # (main.go parseHosts/parseServices) — ein Format für
        # strukturierte Listen-Werte in diesem Repo, egal in welcher
        # Sprache der Konsument geschrieben ist.
        entries = []
        for chunk in raw.split(","):
            chunk = chunk.strip()
            if not chunk:
                continue
            parts = chunk.split("|", 4)
            if len(parts) != 5:
                print(f"[WARN] GITHUB_REPOS-Eintrag ignoriert (erwarte 5 Felder): {chunk!r}", file=sys.stderr)
                continue
            id_, name, repo, current_version, notify_raw = parts
            entries.append({
                "id": id_,
                "name": name,
                "repo": repo,
                "current_version": current_version,
                "notify_zammad": notify_raw.strip().lower() == "true",
            })
        return entries


    GITHUB_REPOS = parse_repos(os.environ["GITHUB_REPOS"])
    GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")

    ZAMMAD_URL = os.environ["ZAMMAD_URL"].rstrip("/")
    ZAMMAD_TOKEN = os.environ["ZAMMAD_TOKEN"]
    ZAMMAD_GROUP = os.environ["ZAMMAD_GROUP"]
    ZAMMAD_REQUESTER_EMAIL = os.environ["ZAMMAD_REQUESTER_EMAIL"]

    NAMESPACE = os.environ["NAMESPACE"]
    STATE_CONFIGMAP = os.environ["STATE_CONFIGMAP_NAME"]
    UPDATES_CONFIGMAP = os.environ["UPDATES_CONFIGMAP_NAME"]

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    K8S_API = "https://{}:{}".format(
        os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"]
    )


    def k8s_request(method, path, body=None):
        with open(f"{SA_DIR}/token") as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        data = json.dumps(body).encode() if body is not None else None
        content_type = "application/merge-patch+json" if method == "PATCH" else "application/json"
        req = urllib.request.Request(
            f"{K8S_API}{path}",
            data=data,
            method=method,
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": content_type,
                "Accept": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                raw = resp.read()
                return resp.status, (json.loads(raw) if raw else {})
        except urllib.error.HTTPError as exc:
            raw = exc.read()
            return exc.code, (json.loads(raw) if raw else {})


    def load_configmap(name, data_key, default):
        path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{name}"
        status, body = k8s_request("GET", path)
        if status == 200:
            return True, json.loads(body.get("data", {}).get(data_key, "null") or "null") or default
        if status == 404:
            return False, default
        raise RuntimeError(f"Konnte ConfigMap {name} nicht lesen: HTTP {status} {body}")


    def save_configmap(name, data_key, existed, value):
        cm = {
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {"name": name, "namespace": NAMESPACE},
            "data": {data_key: json.dumps(value)},
        }
        if existed:
            path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{name}"
            status, body = k8s_request("PATCH", path, cm)
        else:
            path = f"/api/v1/namespaces/{NAMESPACE}/configmaps"
            status, body = k8s_request("POST", path, cm)
        if status not in (200, 201):
            raise RuntimeError(f"Konnte ConfigMap {name} nicht schreiben: HTTP {status} {body}")


    def load_state():
        return load_configmap(STATE_CONFIGMAP, "state.json", {})


    def save_state(state, existed):
        save_configmap(STATE_CONFIGMAP, "state.json", existed, state)


    def latest_release(repo):
        headers = {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
        }
        if GITHUB_TOKEN:
            headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
        req = urllib.request.Request(
            f"https://api.github.com/repos/{repo}/releases/latest", headers=headers
        )
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                return json.loads(resp.read())
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return None  # noch kein Release veroeffentlicht
            raise


    def notify_zammad(repo, release):
        tag = release.get("tag_name", "?")
        name = release.get("name") or tag
        url = release.get("html_url", "")
        notes = release.get("body") or "(keine Release-Notes)"

        payload = {
            "title": f"Neues Release: {repo} {name}",
            "group": ZAMMAD_GROUP,
            "customer": ZAMMAD_REQUESTER_EMAIL,
            "article": {
                "subject": f"Neues Release: {repo} {name}",
                "body": (
                    f"Repo: {repo}<br>Tag: {tag}<br>URL: "
                    f"<a href=\"{url}\">{url}</a><br><br>{notes}"
                ),
                "content_type": "text/html",
                "type": "note",
                "internal": False,
            },
        }
        req = urllib.request.Request(
            f"{ZAMMAD_URL}/api/v1/tickets",
            data=json.dumps(payload).encode(),
            method="POST",
            headers={
                "Authorization": f"Token token={ZAMMAD_TOKEN}",
                "Content-Type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, timeout=10):
                print(f"[OK] Zammad-Ticket erstellt für {repo} {tag}")
        except urllib.error.HTTPError as exc:
            detail = exc.read().decode(errors="replace")
            raise RuntimeError(f"Zammad-Ticket fehlgeschlagen: HTTP {exc.code} {detail}") from exc


    def main():
        state_existed, state = load_state()
        updates_existed, _ = load_configmap(UPDATES_CONFIGMAP, "updates.json", {})
        changed = False
        update_entries = []

        for entry in GITHUB_REPOS:
            repo = entry["repo"]
            try:
                release = latest_release(repo)
            except Exception as exc:
                print(f"[ERR] {repo}: GitHub-Abfrage fehlgeschlagen: {exc}", file=sys.stderr)
                # Letzten bekannten Stand aus state.json zeigen statt die
                # App-Liste für diesen Eintrag ganz verschwinden zu lassen.
                latest_tag = state.get(repo)
                update_entries.append({
                    "id": entry["id"],
                    "name": entry["name"],
                    "repo": repo,
                    "current_version": entry["current_version"] or None,
                    "latest_version": latest_tag,
                    "latest_url": None,
                    "has_update": (
                        latest_tag != entry["current_version"]
                        if entry["current_version"] and latest_tag
                        else None
                    ),
                })
                continue

            if release is None:
                print(f"[SKIP] {repo}: keine Releases vorhanden")
                update_entries.append({
                    "id": entry["id"],
                    "name": entry["name"],
                    "repo": repo,
                    "current_version": entry["current_version"] or None,
                    "latest_version": None,
                    "latest_url": None,
                    "has_update": None,
                })
                continue

            tag = release.get("tag_name")
            previous = state.get(repo)

            update_entries.append({
                "id": entry["id"],
                "name": entry["name"],
                "repo": repo,
                "current_version": entry["current_version"] or None,
                "latest_version": tag,
                "latest_url": release.get("html_url"),
                # None (nicht False) wenn current_version nicht gepflegt ist
                # -> App zeigt "unbekannt" statt fälschlich "aktuell".
                "has_update": (tag != entry["current_version"]) if entry["current_version"] else None,
            })

            if previous is None:
                print(f"[INIT] {repo}: Baseline gesetzt auf {tag}")
                state[repo] = tag
                changed = True
                continue

            if tag != previous:
                print(f"[NEW] {repo}: {previous} -> {tag}")
                state[repo] = tag
                changed = True
                if entry["notify_zammad"]:
                    try:
                        notify_zammad(repo, release)
                    except Exception as exc:
                        print(f"[ERR] {repo}: Zammad-Benachrichtigung fehlgeschlagen: {exc}", file=sys.stderr)
            else:
                print(f"[OK] {repo}: kein neues Release ({tag})")

        if changed:
            save_state(state, state_existed)

        save_configmap(UPDATES_CONFIGMAP, "updates.json", updates_existed, {
            "updated_at": int(time.time()),
            "repos": update_entries,
        })


    if __name__ == "__main__":
        main()
