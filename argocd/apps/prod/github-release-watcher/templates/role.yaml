apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-release-watcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
rules:
  # "create" kann nicht per resourceNames eingeschraenkt werden (das Objekt
  # existiert vor dem Request noch nicht) -> eigene Regel ohne resourceNames.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ include "github-release-watcher.stateConfigMapName" . }}
      - {{ include "github-release-watcher.updatesConfigMapName" . }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-release-watcher.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-release-watcher.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "github-release-watcher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Erlaubt carplay-api (anderer Namespace), NUR die Update-Status-ConfigMap
# zu lesen — kein Zugriff auf state-ConfigMap oder irgendetwas anderes in
# diesem Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "github-release-watcher.fullname" . }}-updates-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "github-release-watcher.updatesConfigMapName" . }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "github-release-watcher.fullname" . }}-updates-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "github-release-watcher.fullname" . }}-updates-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.carplayApiServiceAccountName }}
    namespace: carplay-api
