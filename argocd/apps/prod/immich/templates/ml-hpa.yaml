{{- if .Values.machineLearning.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "immich.ml.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "immich.ml.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "immich.ml.fullname" . }}
  minReplicas: {{ .Values.machineLearning.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.machineLearning.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.machineLearning.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.machineLearning.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
