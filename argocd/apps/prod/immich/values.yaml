---

secrets:
  enabled: true
  name: immich-secrets
  encryptedDbPassword: ""

server:
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75

  image:
    repository: ghcr.io/immich-app/immich-server
    pullPolicy: IfNotPresent
    tag: "v3.2.2"

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false

  service:
    type: ClusterIP
    port: 80
    targetPort: 2283

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: immich.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: immich-prod.pke-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  persistence:
    library:
      enabled: true
      storageClassName: immich-nas
      size: 500Gi
      accessMode: ReadWriteOnce

  externalLibrary:
    enabled: false
    mountPath: /mnt/external
    nfs:
      server: "192.168.178.97"
      path: "/volume2/immich-storage/external"
      readOnly: true
    extraMounts: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 4000m
      memory: 4Gi

  nodeSelector: {}
  tolerations: []

machineLearning:
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  image:
    repository: ghcr.io/immich-app/immich-machine-learning
    pullPolicy: IfNotPresent
    tag: "v3.2.2"

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false

  service:
    port: 3003

  persistence:
    modelCache:
      enabled: true
      storageClassName: immich-nas
      size: 10Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

  nodeSelector: {}
  tolerations: []

postgresql:
  replicaCount: 1
  image:
    repository: ghcr.io/immich-app/postgres
    pullPolicy: IfNotPresent
    tag: "16-vectorchord0.4.3-pgvectors0.2.1"

  database: immich
  username: immich

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: immich-nas
    size: 20Gi
    accessMode: ReadWriteOnce

  initdbArgs: "--data-checksums"

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

  affinity: {}

backup:
  enabled: true
  schedule: "50 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: immich-nas
  size: 5Gi
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  image:
    repository: docker.io/valkey/valkey
    pullPolicy: IfNotPresent
    tag: "9-alpine"

  service:
    port: 6379

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
