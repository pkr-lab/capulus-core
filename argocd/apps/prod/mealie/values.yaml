---
replicaCount: 1

image:
  repository: ghcr.io/mealie-recipes/mealie
  pullPolicy: IfNotPresent
  tag: "v3.25.1"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 911

securityContext:
  runAsNonRoot: true
  runAsUser: 911
  runAsGroup: 911
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 9000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: mealie.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: mealie-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressNative:
  enabled: true
  host: mealie-native.prod.homeserver

persistence:
  enabled: true
  storageClassName: nas
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

env:
  TZ: Europe/Berlin
  ALLOW_SIGNUP: "false"
  BASE_URL: "https://mealie-prod.pke-lab.de"
  MAX_WORKERS: "1"
  WEB_CONCURRENCY: "1"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

affinity: {}

nodeSelector: {}
tolerations: []
