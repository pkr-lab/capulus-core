apiVersion: apps/v1
kind: Deployment
metadata:
  name: nas-nfs-subdir-external-provisioner
  namespace: nas-storage
  labels:
    app: nas-nfs-subdir-external-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nas-nfs-subdir-external-provisioner
  template:
    metadata:
      labels:
        app: nas-nfs-subdir-external-provisioner
    spec:
      serviceAccountName: nas-nfs-subdir-external-provisioner
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nfs-subdir-external-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nfs-storage-root
              mountPath: /persistentvolumes
          env:
            - name: PROVISIONER_NAME
              value: k8s-sigs.io/nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: "192.168.178.97"
            - name: NFS_PATH
              value: "/volume1/k8s-storage"
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: nfs-storage-root
          nfs:
            server: 192.168.178.97
            path: /volume1/k8s-storage
