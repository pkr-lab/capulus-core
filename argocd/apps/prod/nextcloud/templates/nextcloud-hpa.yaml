{{- if .Values.nextcloud.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nextcloud.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nextcloud.fullname" . }}
  minReplicas: {{ .Values.nextcloud.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.nextcloud.autoscaling.maxReplicas }}
  # Nur CPU als Scaling-Signal — Memory-Utilization hielt hier ständig 2/2
  # Replicas, obwohl die tatsächliche Auslastung weit unter dem Target lag;
  # RAM-Verbrauch ist kein zuverlässiges Lastsignal für diesen Prozess.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.nextcloud.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
