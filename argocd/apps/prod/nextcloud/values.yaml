---

secrets:
  name: nextcloud-secrets

nextcloud:
  fixConfigJob:
    enabled: true
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

  image:
    repository: nextcloud
    pullPolicy: IfNotPresent
    tag: "35.0.3-apache"

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false

  adminUser: admin

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: nextcloud.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: nextcloud-prod.pkr-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  trustedDomains: "nextcloud.prod.homeserver nextcloud-prod.pkr-lab.de"

  overwriteProtocol: "https"
  overwriteHost: "nextcloud-prod.pkr-lab.de"
  overwriteCliUrl: "https://nextcloud-prod.pkr-lab.de"

  persistence:
    html:
      enabled: true
      storageClassName: nas
      size: 5Gi
      accessMode: ReadWriteOnce
    data:
      enabled: true
      storageClassName: nas
      size: 100Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  nodeSelector: {}
  tolerations: []

backup:
  enabled: true
  schedule: "30 2 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: nas
  size: 10Gi
  keep: 7
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

postgresql:
  replicaCount: 1
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015"

  database: nextcloud
  username: nextcloud

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity: {}

redis:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3"

  service:
    port: 6379

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

networkPolicy:
  enabled: true
  extraIngressNamespaces: []
