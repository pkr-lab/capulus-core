---

secrets:
  enabled: true
  name: nextcloud-secrets
  encryptedDbPassword: ""
  encryptedAdminPassword: ""

nextcloud:
  fixConfigJob:
    enabled: false
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

  image:
    repository: nextcloud
    pullPolicy: IfNotPresent
    tag: "34.0.2-apache"

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false

  adminUser: admin

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: nextcloud.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: nextcloud-prod.pke-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  trustedDomains: "nextcloud.prod.homeserver nextcloud-prod.pke-lab.de"

  overwriteProtocol: "https"
  overwriteHost: "nextcloud-prod.pke-lab.de"
  overwriteCliUrl: "https://nextcloud-prod.pke-lab.de"

  persistence:
    html:
      enabled: true
      storageClassName: nas
      size: 5Gi
      accessMode: ReadWriteOnce
    data:
      enabled: true
      storageClassName: nas
      size: 100Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  nodeSelector: {}
  tolerations: []

postgresql:
  replicaCount: 1
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "18-alpine"

  database: nextcloud
  username: nextcloud

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity: {}

redis:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "8-alpine"

  service:
    port: 6379

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
