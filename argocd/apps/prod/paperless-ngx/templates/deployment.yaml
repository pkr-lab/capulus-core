apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "paperless-ngx.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "paperless-ngx.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # s6-overlay in the 2.20.x+ image demands /run be owned by the
        # container's UID (see securityContext.runAsUser below) and refuses
        # to chown it itself when not running as root. fsGroup only fixes
        # the GROUP ownership of mounted volumes, not the owning UID, so a
        # short-lived root init container has to chown it explicitly first.
        - name: fix-run-perms
          image: busybox:1.36
          command: ["chown", "1000:1000", "/run"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: run
              mountPath: /run
      containers:
        # Redis-Sidecar — paperless benötigt Redis für Task-Queuing
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          # Explizit als UID/GID 1000 starten (wie die Redis-PVC-Daten selbst
          # gehoeren) statt als root — der interne chown-Fixup des Images
          # scheitert sonst auf dem NFS-Mount ("nas" StorageClass) mit
          # "Operation not permitted" (root_squash-artiges Verhalten).
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
        # Paperless-ngx Hauptcontainer
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
            # s6-overlay in the 2.20.x+ image insists /run be owned by the
            # container's UID and refuses to chown it itself when not running
            # as root (runAsUser: 1000 above). /run is baked into the image
            # owned by root, so give it a fresh emptyDir instead — fsGroup
            # 1000 (see podSecurityContext) makes k8s own it correctly.
            - name: run
              mountPath: /run
      volumes:
        - name: run
          emptyDir: {}
        - name: redis-data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.fullname" . }}-redis
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: media
          {{- if .Values.persistence.media.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: consume
          {{- if .Values.persistence.consume.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.fullname" . }}-consume
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: export
          {{- if .Values.persistence.export.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.fullname" . }}-export
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
