apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinyteller.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    reason: "nginx upstream 'backend' DNS-Alias, siehe Kommentar oben"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tinyteller.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
