apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wiki-docs-sync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wiki-docs-sync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "wiki-docs-sync.selectorLabels" . | nindent 8 }}
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "wiki-docs-sync.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: GITHUB_OWNER
                  value: {{ .Values.github.owner | quote }}
                - name: GITHUB_REPO
                  value: {{ .Values.github.repo | quote }}
                - name: GITHUB_BRANCH
                  value: {{ .Values.github.branch | quote }}
                - name: EXCLUDE
                  value: {{ join "," .Values.github.exclude | quote }}
                {{- if .Values.github.tokenSecretName }}
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.github.tokenSecretName }}
                      key: {{ .Values.github.tokenSecretKey }}
                {{- end }}
                - name: WIKIJS_API_URL
                  value: {{ .Values.wikijs.url | quote }}
                - name: WIKIJS_LOCALE
                  value: {{ .Values.wikijs.locale | quote }}
                - name: WIKIJS_PATH_PREFIX
                  value: {{ .Values.wikijs.pathPrefix | quote }}
                - name: WIKIJS_LEGACY_PREFIXES
                  value: {{ join "," .Values.wikijs.legacyPrefixes | quote }}
                - name: DRY_RUN
                  value: {{ .Values.wikijs.dryRun | quote }}
                - name: MIN_PAGES
                  value: {{ .Values.wikijs.minPages | quote }}
                - name: WIKIJS_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.wikijs.tokenSecretName }}
                      key: {{ .Values.wikijs.tokenSecretKey }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
