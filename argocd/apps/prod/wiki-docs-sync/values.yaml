---
image:
  repository: python
  tag: "3.14-slim"
  pullPolicy: IfNotPresent

schedule: "*/15 * * * *"
timezone: "Europe/Berlin"
suspend: false
concurrencyPolicy: Forbid
failedJobsHistoryLimit: 3
successfulJobsHistoryLimit: 3

github:
  owner: "pkr-lab"
  repo: "capulus-core"
  branch: "main"
  docsPath: "docs"
  extraFiles:
    - path: "README.md"
      slug: "ReadMe"
  tokenSecretName: "github-api-token"
  tokenSecretKey: token

wikijs:
  url: "http://wikijs.wikijs.svc.cluster.local"
  locale: "en"
  pathPrefix: "Github/capulus-core"
  docsSubpath: "docs"
  tokenSecretName: wiki-docs-sync-wikijs-token
  tokenSecretKey: token

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
