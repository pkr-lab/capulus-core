---
image:
  repository: ghcr.io/pkr-lab/capulus-wiki-sync
  tag: "v1.1.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

schedule: "*/15 * * * *"
timezone: "Europe/Berlin"
suspend: false
concurrencyPolicy: Forbid
failedJobsHistoryLimit: 3
successfulJobsHistoryLimit: 3

github:
  owner: "pkr-lab"
  repo: "pkr-lab-docs"
  branch: "main"
  exclude:
    - ".github/**"
    - "scripts/**"
    - "CLAUDE.md"
    - "LICENSE"
    - "CHANGELOG.md"
    - "capulus-core/archiv/**"
  tokenSecretName: "github-api-token"
  tokenSecretKey: token

wikijs:
  url: "http://wikijs.wikijs.svc.cluster.local"
  locale: "en"
  pathPrefix: "docs"
  legacyPrefixes: []
  dryRun: false
  minPages: 20
  tokenSecretName: wiki-docs-sync-wikijs-token
  tokenSecretKey: token

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 5m
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  extraIngressNamespaces: []
