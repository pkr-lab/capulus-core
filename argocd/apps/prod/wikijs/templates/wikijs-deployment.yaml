apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wikijs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wikijs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.wikijs.autoscaling.enabled }}
  replicas: {{ .Values.wikijs.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "wikijs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wikijs.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.wikijs.podSecurityContext | nindent 8 }}
      {{- with .Values.wikijs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wikijs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.wikijs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wikijs
          image: "{{ .Values.wikijs.image.repository }}:{{ .Values.wikijs.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.wikijs.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.wikijs.service.targetPort }}
              protocol: TCP
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: kubernetes.default.svc
            - name: DB_HOST
              value: {{ include "wikijs.postgresql.fullname" . | quote }}
            - name: DB_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.wikijs.dbSchema | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-password
            - name: ADMIN_EMAIL
              value: {{ required "wikijs.admin.email fehlt" .Values.wikijs.admin.email | quote }}
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: admin-password
          startupProbe:
            httpGet:
              path: /_live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /_live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.wikijs.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.wikijs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /wiki/data
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/node
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.wikijs.dataSizeLimit }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
