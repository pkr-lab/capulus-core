---

secrets:
  name: wikijs-secrets

wikijs:
  replicaCount: 1

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  image:
    repository: ghcr.io/requarks/wiki
    pullPolicy: IfNotPresent
    tag: "3.3.1@sha256:2bdfa19d02d3f0ce18020648cc38ca138c5467fe1cfc4765d4b5f2a59c8efcad"

  dbSchema: wiki

  dataSizeLimit: 2Gi

  admin:
    email: admin@wiki.prod.homeserver

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    hosts:
      - host: wiki.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: wiki-prod.pkr-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  nodeSelector: {}
  affinity: {}
  tolerations: []

postgresql:
  replicaCount: 1
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5"

  database: wiki
  username: wikijs

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: nas
    size: 20Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  affinity: {}

networkPolicy:
  enabled: true
  extraIngressNamespaces:
    - wiki-docs-sync
