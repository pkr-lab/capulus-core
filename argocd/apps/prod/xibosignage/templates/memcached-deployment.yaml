apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xibosignage.memcached.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xibosignage.memcached.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "xibosignage.memcached.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xibosignage.memcached.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: memcached
          image: "{{ .Values.memcached.image.repository }}:{{ .Values.memcached.image.tag }}"
          imagePullPolicy: {{ .Values.memcached.image.pullPolicy }}
          args:
            {{- toYaml .Values.memcached.args | nindent 12 }}
          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memcached.resources | nindent 12 }}
