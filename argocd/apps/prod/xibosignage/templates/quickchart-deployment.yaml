{{- if .Values.quickchart.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xibosignage.quickchart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xibosignage.quickchart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "xibosignage.quickchart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xibosignage.quickchart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: quickchart
          image: "{{ .Values.quickchart.image.repository }}:{{ .Values.quickchart.image.tag }}"
          imagePullPolicy: {{ .Values.quickchart.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3400
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.quickchart.resources | nindent 12 }}
{{- end }}
