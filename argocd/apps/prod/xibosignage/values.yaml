---

secrets:
  name: xibosignage-secrets

mysql:
  replicaCount: 1
  image:
    repository: mysql
    pullPolicy: IfNotPresent
    tag: "26.10@sha256:3819b2b23835c4a73c8b022fafc33c8095c0f81c929a8b7a84613d2fba6c52f5"

  database: cms
  username: cms

  service:
    port: 3306

  persistence:
    enabled: true
    storageClassName: nas
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity: {}

xmr:
  image:
    repository: ghcr.io/xibosignage/xibo-xmr
    pullPolicy: IfNotPresent
    tag: "1.5@sha256:1bfaedea79b8d63fbd9fb22ea60f6b5c2622553097e6429a0f97953e4a72ed52"

  service:
    port: 9505

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

memcached:
  image:
    repository: memcached
    pullPolicy: IfNotPresent
    tag: "alpine@sha256:6d687bc26426d092694743054fc674fc54d3c161fefa1ad20b54192f8580a8c1"
  args: ["-m", "15"]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 100Mi

quickchart:
  enabled: true
  image:
    repository: ianw/quickchart
    pullPolicy: IfNotPresent
    tag: "v1.8.1@sha256:12e2d442e2db9974f2b310b72fadd4f6d595d0a0bf5480c3d50ef5cb5967ee56"

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

cms:
  replicaCount: 1

  image:
    repository: ghcr.io/xibosignage/xibo-cms
    pullPolicy: IfNotPresent
    tag: "release-4.5.6@sha256:fca8081e69d42b88218d14ab6c1c984887fb12bc97c67f290d5864c7f1b61127"

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: xibo.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: xibo-prod.pkr-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  env:
    CMS_SERVER_NAME: "xibo.prod.homeserver"
    CMS_USE_MEMCACHED: "true"
    XTR_ENABLED: "true"
    CMS_PHP_POST_MAX_SIZE: "512M"
    CMS_PHP_UPLOAD_MAX_FILESIZE: "512M"
    CMS_PHP_MAX_EXECUTION_TIME: "600"

  securityContext: {}

  persistence:
    library:
      enabled: true
      storageClassName: nas
      size: 50Gi
      accessMode: ReadWriteOnce
    state:
      enabled: true
      storageClassName: nas
      size: 2Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  affinity: {}
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: true
  extraIngressNamespaces: []
