---
replicaCount: 1

image:
  repository: python
  tag: "3.14-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

ntfy:
  url: "http://ntfy.ntfy.svc.cluster.local"
  topic: "Alarmmonitor"

stationsSecretName: alamos-apager-stations

heartbeatTimeoutSeconds: 300

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: alamos-apager.prod.homeserver

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
