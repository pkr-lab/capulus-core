apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alamos-relay.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alamos-relay.labels" . | nindent 4 }}
data:
  app.py: |
    #!/usr/bin/env python3
    import hmac
    import os
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlsplit

    # .strip() faengt ein versehentlich mitversiegeltes Newline ab (z. B.
    # "openssl rand -hex 24 | kubeseal ..." ohne "tr -d '\n'", siehe
    # values.yaml-Kommentar bei secrets.encryptedToken) -- ohne das wuerde
    # EXPECTED_PATH unten ein "\n" enthalten und nie mehr zu einem echten
    # URL-Pfad passen, unabhaengig vom Token in der Request-URL.
    RELAY_TOKEN = os.environ.get("RELAY_TOKEN", "").strip()
    N8N_TARGET_URL = os.environ.get("N8N_TARGET_URL", "").rstrip("/")
    EXPECTED_PATH = f"/relay/{RELAY_TOKEN}"
    TIMEOUT_SECONDS = 10

    ALLOWED_METHODS = ("GET", "POST")


    class Handler(BaseHTTPRequestHandler):
        def _respond(self, status, body=b"", headers=None):
            self.send_response(status)
            for key, value in (headers or {}).items():
                self.send_header(key, value)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if body:
                self.wfile.write(body)

        def _path_matches(self):
            path = urlsplit(self.path).path
            if not RELAY_TOKEN:
                return False
            return hmac.compare_digest(path, EXPECTED_PATH)

        def _forward(self, method):
            if not self._path_matches():
                self._respond(404, b"not found")
                return

            query = urlsplit(self.path).query
            target_url = N8N_TARGET_URL + (f"?{query}" if query else "")

            body = None
            content_length = int(self.headers.get("Content-Length", 0) or 0)
            if content_length:
                body = self.rfile.read(content_length)

            headers = {}
            content_type = self.headers.get("Content-Type")
            if content_type:
                headers["Content-Type"] = content_type

            req = urllib.request.Request(
                target_url, data=body, headers=headers, method=method
            )
            try:
                with urllib.request.urlopen(req, timeout=TIMEOUT_SECONDS) as resp:
                    resp_body = resp.read()
                    resp_headers = {}
                    resp_content_type = resp.headers.get("Content-Type")
                    if resp_content_type:
                        resp_headers["Content-Type"] = resp_content_type
                    self._respond(resp.status, resp_body, resp_headers)
            except urllib.error.HTTPError as exc:
                # n8n selbst hat geantwortet, nur mit Fehlerstatus (z. B.
                # Workflow inaktiv) -- 1:1 durchreichen, nicht verschlucken.
                self._respond(exc.code, exc.read())
            except (urllib.error.URLError, TimeoutError) as exc:
                print(f"Weiterleitung an n8n fehlgeschlagen: {exc}")
                self._respond(502, b"upstream unavailable")

        def do_GET(self):
            self._forward("GET")

        def do_POST(self):
            self._forward("POST")

        def do_HEAD(self):
            self._respond(404, b"")

        def do_PUT(self):
            self._respond(405, b"method not allowed")

        def do_DELETE(self):
            self._respond(405, b"method not allowed")

        def log_message(self, fmt, *args):
            print(fmt % args)


    if __name__ == "__main__":
        if not RELAY_TOKEN or not N8N_TARGET_URL:
            raise SystemExit("RELAY_TOKEN und N8N_TARGET_URL muessen gesetzt sein")
        port = int(os.environ.get("PORT", 8080))
        print(f"alamos-relay listening on :{port}")
        HTTPServer(("0.0.0.0", port), Handler).serve_forever()
