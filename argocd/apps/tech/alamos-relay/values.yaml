---
replicaCount: 1

image:
  repository: python
  tag: "3.14-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Ziel-Webhook in n8n, an den erfolgreich authentifizierte Requests 1:1
# weitergereicht werden (Methode, Query-String und Body bleiben erhalten).
# Interner Cluster-DNS-Name (Service "n8n" im Namespace "n8n", Port 80) --
# bewusst NICHT ueber Traefik/n8n.prod.homeserver, das waere ein unnoetiger
# Umweg ueber den Ingress-Controller fuer einen reinen Server-zu-Server-Call.
n8nTargetUrl: "http://n8n.n8n.svc.cluster.local/webhook/alamos-einsatz"
n8nNamespace: n8n
n8nTargetPort: 5678

# SealedSecret mit dem geheimen Pfad-Token, siehe templates/sealedsecret.yaml.
# Erzeugen/rotieren -- WICHTIG: "openssl rand -hex 24" haengt selbst ein
# Newline an, "| kubeseal" wuerde das als Teil des Tokens mitversiegeln.
# Der Relay-Pfad-Vergleich in configmap-script.yaml ist exakt (kein trim),
# ein mitversiegeltes "\n" macht den Pfad dauerhaft unmatchbar -> 404 fuer
# jeden Request, auch mit korrektem Token in der URL (siehe
# docs/3-apps-workloads/300i0-alamos-relay.md, Fehlerbehebung). Deshalb
# "tr -d '\n'" nicht vergessen:
#   openssl rand -hex 24 | tr -d '\n' | kubeseal --raw --namespace alamos-relay \
#     --name alamos-relay-secrets --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets-controller --from-file=/dev/stdin
secrets:
  name: alamos-relay-secrets
  encryptedToken: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: alamos-relay.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    # Externer Host -- per Cloudflare-Tunnel-Wildcard (cloudflared) an
    # Traefik weitergereicht, siehe docs/c-netzwerk-dns/c0040-domain-tiers.md.
    # Genau DAS ist der Zweck dieser App: dieser eine, oeffentlich erreichbare
    # Pfad soll existieren, damit ALAMOS AMweb ihn ohne PNA-Blockade und ohne
    # n8n selbst oeffentlich zu machen aufrufen kann -- siehe
    # docs/3-apps-workloads/300i0-alamos-relay.md.
    - host: alamos-relay-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
