---
replicaCount: 1

image:
  repository: python
  tag: "3.14-alpine"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

n8nTargetUrl: "http://n8n.n8n.svc.cluster.local/webhook/alamos-einsatz"
n8nNamespace: n8n
n8nTargetPort: 5678

secrets:
  name: alamos-relay-secrets
  encryptedToken: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: alamos-relay.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: alamos-relay-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
