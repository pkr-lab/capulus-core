---
replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/alert-caller
  tag: "sha-e399f22"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

hostNetwork: true

service:
  type: ClusterIP
  port: 9310

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "2"
    memory: 1Gi

stateSizeLimit: 64Mi
tmpSizeLimit: 64Mi

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

config:
  auth:
    mode: log
  sip:
    user: capulus-core
    domain: sip.linphone.org
    stunServer: stun.cloudflare.com:3478
    mediaEncryption: srtp-mand
  callTargets: "sip:pkr-lab@sip.linphone.org"
  watchdogTimeout: "600"
  callCooldown: "900"
  callRingTimeout: "45"
  registerTimeout: "15"
  iceTimeout: "40"
  vmUrl: "http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
  rtpPortMin: 10000
  rtpPortMax: 10100
  piperVoice: de_DE-thorsten-high

secrets:
  name: alert-caller-secrets
  encryptedData:
    SIP_PASSWORD: ""
    ALERT_CALLER_TOKEN: ""

nodeSelector:
  kubernetes.io/hostname: homeserver
tolerations: []
affinity: {}
