---
argo-workflows:
  singleNamespace: true

  crds:
    install: true
    keep: false

  workflow:
    serviceAccount:
      create: true
      name: argo-workflow
    rbac:
      create: true

  controller:
    clusterWorkflowTemplates:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  server:
    clusterWorkflowTemplates:
      enabled: false
    authModes:
      - server
    secure: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - argo-workflows.tech.homeserver
      paths:
        - /
      pathType: Prefix

  artifactRepository:
    archiveLogs: true
    s3:
      endpoint: garage.garage.svc.cluster.local:3900
      region: garage
      bucket: argo-artifacts
      insecure: true
      keyFormat: "artifacts/{{workflow.name}}/{{pod.name}}"
      accessKeySecret:
        name: argo-artifacts-s3
        key: accesskey
      secretKeySecret:
        name: argo-artifacts-s3
        key: secretkey

artifactSecret:
  name: argo-artifacts-s3
  encryptedAccessKey: ""
  encryptedSecretKey: ""

ghcrSecret:
  enabled: true
  name: ghcr-push
  encryptedDockerConfigJson: ""
