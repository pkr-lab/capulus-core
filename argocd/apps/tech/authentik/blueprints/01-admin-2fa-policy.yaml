version: 1
metadata:
  name: admin-2fa-enforcement
entries:
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup-stage
    identifiers:
      name: totp-setup
    attrs:
      digits: 6

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation-stage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes:
        - totp
      not_configured_action: configure
      configuration_stages:
        - !KeyOf totp-setup-stage

  - model: authentik_policies_expression.expressionpolicy
    id: require-2fa-admins-policy
    identifiers:
      name: require-2fa-for-admins-group
    attrs:
      expression: |
        # Nur Mitglieder der lldap-Gruppe "admins" müssen TOTP einrichten —
        # alle anderen überspringen diese Stage komplett (keine andere
        # Policy auf dieser Bindung, siehe Korrektur 2 oben).
        return ak_is_group_member(request.user, name="admins")

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_flows.flowstagebinding, [target, !Find [authentik_flows.flow, [slug, default-authentication-flow]]], [stage, !KeyOf mfa-validation-stage], [order, 30]]
      policy: !KeyOf require-2fa-admins-policy
      order: 0
