version: 1
metadata:
  name: app-uptime-kuma
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: uptime-kuma-provider
    identifiers:
      name: uptime-kuma
    attrs:
      mode: forward_single
      external_host: https://uptime-kuma.prod.homeserver
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: uptime-kuma-app
    identifiers:
      slug: uptime-kuma
    attrs:
      name: Uptime Kuma
      provider: !KeyOf uptime-kuma-provider
      policy_engine_mode: any

  - model: authentik_policies_expression.expressionpolicy
    id: uptime-kuma-access-policy
    identifiers:
      name: uptime-kuma-access
    attrs:
      expression: |
        return (
          ak_is_group_member(request.user, name="admins")
          or ak_is_group_member(request.user, name="uptime-kuma-user")
        )

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf uptime-kuma-app
      policy: !KeyOf uptime-kuma-access-policy
      order: 0

