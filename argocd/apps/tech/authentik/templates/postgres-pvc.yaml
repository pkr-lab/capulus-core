apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Schutz: ein Abraeumen der Application (Ordner-Umzug, ApplicationSet-Aenderung) darf dieses local-path-Volume
  # nicht loeschen - reclaimPolicy Delete wuerde die Daten von der Platte entfernen (Vorfall 2026-09-19).
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  name: {{ include "authentik.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "authentik.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.postgresql.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
