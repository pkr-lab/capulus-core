---

image:
  repository: ghcr.io/goauthentik/server
  tag: "2025.8.3"
  pullPolicy: IfNotPresent

logLevel: info

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

server:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 768Mi
  service:
    port: 80
    targetPort: 9000
    metricsPort: 9300
  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - authentik.tech.homeserver
      - authentik-tech.pke-lab.de
    tls: []

worker:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi

postgresql:
  database: authentik
  username: authentik
  image:
    repository: postgres
    tag: "18-bookworm"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    storageClassName: local-path
    size: 2Gi
    accessMode: ReadWriteOnce

redis:
  image:
    repository: docker.io/valkey/valkey
    pullPolicy: IfNotPresent
    tag: "9-alpine"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

credentials:
  secretName: authentik-credentials
  encryptedSecretKey: ""
  encryptedDbPassword: ""
  encryptedBootstrapPassword: ""
  encryptedBootstrapEmail: ""
  encryptedLdapBindPassword: ""

nodeSelector:
  kubernetes.io/hostname: homeserver

tolerations: []
affinity: {}

backup:
  enabled: true
  schedule: "45 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: nas
  size: 2Gi
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

metrics:
  enabled: true

blueprints:
  mountPath: /blueprints/custom
