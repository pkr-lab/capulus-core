apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capulus-operator.fullname" . }}
  labels:
    {{- include "capulus-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["capulus.homeserver"]
    resources: ["backups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["capulus.homeserver"]
    resources: ["backups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "capulus-operator.fullname" . }}
  labels:
    {{- include "capulus-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "capulus-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "capulus-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
