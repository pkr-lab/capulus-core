replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/capulus-operator
  tag: "sha-917f05b"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

backup:
  resticImage: restic/restic:0.18.1
  sqliteImage: alpine:3.24
  postgresImage: postgres:17-alpine

leaderElect: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  metricsPort: 8080

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
