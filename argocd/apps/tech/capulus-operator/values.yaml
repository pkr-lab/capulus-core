replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/capulus-operator
  tag: "sha-917f05b"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

backup:
  resticImage: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
  sqliteImage: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  postgresImage: postgres:17-alpine

leaderElect: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  metricsPort: 8080

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
