---

replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/carplay-api
  tag: "v5"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: carplay-api.prod.homeserver

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  initialDelaySeconds: 3
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

config:
  logLevel: info
  cacheTTLSeconds: "30"
  apiTimeoutSeconds: "5"
  rateLimitPerMinute: "100"

  corsAllowedOrigins: ""

  trustedProxies: ""

  ipAllowlist:
    enabled: false
    cidrs: "100.64.0.0/10,192.168.178.0/24"

  victoriaMetrics:
    url: "http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"

  hosts:
    - id: homeserver
      name: "Homeserver"
      instance: "192.168.178.94:9100"
    - id: worker-0
      name: "Worker 0"
      instance: "192.168.178.95:9100"
    - id: worker-1
      name: "Worker 1"
      instance: "192.168.178.96:9100"
    - id: nas
      name: "NAS"
      instance: "192.168.178.97:9100"

  services:
    - id: nextcloud
      name: "Nextcloud"
      match: "nextcloud"
    - id: immich
      name: "Immich"
      match: "immich"
    - id: vaultwarden
      name: "Vaultwarden"
      match: "vaultwarden"
    - id: paperless
      name: "Paperless-ngx"
      match: "paperless"
    - id: mealie
      name: "Mealie"
      match: "mealie"
    - id: n8n
      name: "n8n"
      match: "n8n"
    - id: wikijs
      name: "Wiki.js"
      match: "wikijs"
    - id: zammad
      name: "Zammad"
      match: "zammad"

  updates:
    namespace: "github-release-watcher"
    configMapName: "github-release-watcher-updates"
    cacheTTLSeconds: "900"

  powerAgent:
    url: "http://192.168.178.94:9101"
    timeoutSeconds: "8"

  ntfy:
    url: "http://ntfy.ntfy.svc.cluster.local"
    topic: "Home-Lab,Home-Lab-System"
    sinceWindow: "12h"
    alertLimit: "10"

  uptimeKuma:
    url: "http://uptime-kuma.uptime-kuma.svc.cluster.local"
    slug: "homeserver"

secrets:
  apiToken:
    enabled: true
    secretName: carplay-api-token
    secretKey: token
    encryptedData: ""

  ntfyToken:
    enabled: false
    secretName: carplay-api-ntfy-token
    secretKey: token
    encryptedData: "REPLACE_ME_WITH_KUBESEAL_OUTPUT"

  powerAgentToken:
    enabled: true
    secretName: carplay-api-power-agent-token
    secretKey: token
    encryptedData: ""

  shutdownConfirmationCode:
    enabled: false
    secretName: carplay-api-shutdown-code
    secretKey: code
    encryptedData: ""

nodeSelector: {}
tolerations: []
affinity: {}
