---

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

image:
  repository: cloudflare/cloudflared
  pullPolicy: IfNotPresent
  tag: "2026.8.3"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

tunnel:
  name: homeserver

  id: "47c69d59-cf11-4859-968c-a03dfa153ff1"

  credentialsSecretName: cloudflared-credentials
  encryptedCredentialsJson: ""

  ingress:
    rules:
      - hostname: "*.pke-lab.de"
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
    defaultService: "http_status:404"

nodeSelector: {}

tolerations: []

affinity: {}
