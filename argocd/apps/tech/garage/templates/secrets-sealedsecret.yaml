apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    rpcSecret: {{ .Values.secrets.encryptedRpcSecret | quote }}
    accessKey: {{ .Values.secrets.encryptedAccessKey | quote }}
    secretKey: {{ .Values.secrets.encryptedSecretKey | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.name }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
