apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3900
      targetPort: s3
      protocol: TCP
      name: s3
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
