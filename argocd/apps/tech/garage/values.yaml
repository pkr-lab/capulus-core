---
image:
  repository: dxflrs/garage
  tag: v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
  pullPolicy: IfNotPresent

s3Region: garage
defaultBucket: argo-artifacts

persistence:
  storageClassName: local-path
  size: 10Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

secrets:
  name: garage-secrets
  encryptedRpcSecret: ""
  encryptedAccessKey: ""
  encryptedSecretKey: ""
