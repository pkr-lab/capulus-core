# Oeffentliches Zertifikat der Homeserver-Root-CA (kein Geheimnis), damit der
# Zammad-Aufruf per https die interne CA prueft. Quelle: docs/assets/
# homeserver-root-ca.pem, als files/homeserver-root-ca.pem ins Chart kopiert
# (Helm kann keine Dateien ausserhalb des Chart-Ordners lesen). Bei einem
# Tausch der Root-CA beide Kopien aktualisieren.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-release-watcher.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
data:
  ca.pem: |
{{ .Files.Get "files/homeserver-root-ca.pem" | indent 4 }}
