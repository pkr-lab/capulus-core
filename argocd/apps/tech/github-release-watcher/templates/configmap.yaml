apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-release-watcher.fullname" . }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "github-release-watcher.labels" . | nindent 4 }}
data:
  watcher.py: |
    #!/usr/bin/env python3
    import json
    import os
    import re
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request


    def parse_repos(raw):
        entries = []
        for item in json.loads(raw or "[]"):
            if not item.get("id") or not item.get("repo"):
                print(f"[WARN] Eintrag ohne id/repo ignoriert: {item!r}", file=sys.stderr)
                continue
            entries.append({
                "id": item["id"],
                "name": item.get("name") or item["id"],
                "repo": item["repo"],
                "tag_prefix": item.get("tagPrefix") or "",
                "current_version": str(item.get("currentVersion") or ""),
                "current_from": item.get("currentFrom") or None,
                "notify_zammad": bool(item.get("notifyZammad")),
            })
        return entries


    GITHUB_REPOS = parse_repos(os.environ["GITHUB_REPOS_JSON"])
    GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
    SOURCE_REPO = os.environ.get("SOURCE_REPO", "pkr-lab/capulus-core")
    SOURCE_REF = os.environ.get("SOURCE_REF", "main")

    ZAMMAD_URL = os.environ["ZAMMAD_URL"].rstrip("/")
    ZAMMAD_TOKEN = os.environ["ZAMMAD_TOKEN"]
    ZAMMAD_GROUP = os.environ["ZAMMAD_GROUP"]
    ZAMMAD_REQUESTER_EMAIL = os.environ["ZAMMAD_REQUESTER_EMAIL"]
    ZAMMAD_CA_FILE = os.environ.get("ZAMMAD_CA_FILE", "")

    MATTERMOST_URL = os.environ.get("MATTERMOST_URL", "")
    MATTERMOST_CHANNEL = os.environ.get("MATTERMOST_CHANNEL", "releases")
    MATTERMOST_TOKEN = os.environ.get("MATTERMOST_TOKEN", "")

    NAMESPACE = os.environ["NAMESPACE"]
    STATE_CONFIGMAP = os.environ["STATE_CONFIGMAP_NAME"]
    UPDATES_CONFIGMAP = os.environ["UPDATES_CONFIGMAP_NAME"]

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    K8S_API = "https://{}:{}".format(
        os.environ.get("KUBERNETES_SERVICE_HOST", ""), os.environ.get("KUBERNETES_SERVICE_PORT", "")
    )


    def k8s_request(method, path, body=None):
        with open(f"{SA_DIR}/token") as f:
            token = f.read().strip()
        ctx = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")
        data = json.dumps(body).encode() if body is not None else None
        content_type = "application/merge-patch+json" if method == "PATCH" else "application/json"
        req = urllib.request.Request(
            f"{K8S_API}{path}",
            data=data,
            method=method,
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": content_type,
                "Accept": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
                raw = resp.read()
                return resp.status, (json.loads(raw) if raw else {})
        except urllib.error.HTTPError as exc:
            raw = exc.read()
            return exc.code, (json.loads(raw) if raw else {})


    def load_configmap(name, data_key, default):
        path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{name}"
        status, body = k8s_request("GET", path)
        if status == 200:
            return True, json.loads(body.get("data", {}).get(data_key, "null") or "null") or default
        if status == 404:
            return False, default
        raise RuntimeError(f"Konnte ConfigMap {name} nicht lesen: HTTP {status} {body}")


    def save_configmap(name, data_key, existed, value):
        cm = {
            "apiVersion": "v1",
            "kind": "ConfigMap",
            "metadata": {"name": name, "namespace": NAMESPACE},
            "data": {data_key: json.dumps(value)},
        }
        if existed:
            path = f"/api/v1/namespaces/{NAMESPACE}/configmaps/{name}"
            status, body = k8s_request("PATCH", path, cm)
        else:
            path = f"/api/v1/namespaces/{NAMESPACE}/configmaps"
            status, body = k8s_request("POST", path, cm)
        if status not in (200, 201):
            raise RuntimeError(f"Konnte ConfigMap {name} nicht schreiben: HTTP {status} {body}")


    def github_get(path, accept="application/vnd.github+json"):
        headers = {"Accept": accept, "X-GitHub-Api-Version": "2022-11-28"}
        if GITHUB_TOKEN:
            headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
        req = urllib.request.Request(f"https://api.github.com{path}", headers=headers)
        with urllib.request.urlopen(req, timeout=15) as resp:
            raw = resp.read()
        return raw if accept.endswith("raw+json") else json.loads(raw)


    def version_key(value):
        m = re.search(r"\d+(?:\.\d+)*", str(value or ""))
        return tuple(int(x) for x in m.group(0).split(".")) if m else None


    def strip_prefix(tag, prefix):
        return tag[len(prefix):] if prefix and tag.startswith(prefix) else tag


    def latest_release(entry):
        repo = entry["repo"]
        prefix = entry["tag_prefix"]
        candidates = []
        for release in github_get(f"/repos/{repo}/releases?per_page=100"):
            tag = release.get("tag_name") or ""
            if release.get("draft") or release.get("prerelease") or not tag.startswith(prefix):
                continue
            if re.search(r"(?i)(rc|alpha|beta|pre|nightly)[.-]?\d*$", tag):
                continue
            key = version_key(strip_prefix(tag, prefix))
            if key is not None:
                candidates.append((key, release))
        if not candidates:
            return None
        return max(candidates, key=lambda item: item[0])[1]


    SOURCE_CACHE = {}


    def source_file(path):
        if path not in SOURCE_CACHE:
            quoted = urllib.parse.quote(path)
            raw = github_get(f"/repos/{SOURCE_REPO}/contents/{quoted}?ref={SOURCE_REF}", "application/vnd.github.raw+json")
            SOURCE_CACHE[path] = raw.decode("utf-8", errors="replace")
        return SOURCE_CACHE[path]


    def current_version(entry):
        spec = entry["current_from"]
        if not spec:
            return entry["current_version"] or None
        text = source_file(spec["file"])
        if spec.get("image"):
            pattern = r"repository:\s*\"?" + re.escape(spec["image"]) + r"\"?\s*\n(?:[^\n]*\n){0,3}?\s*tag:\s*\"?([^\"@\s]+)"
        elif spec.get("chart"):
            pattern = r"-\s*name:\s*\"?" + re.escape(spec["chart"]) + r"\"?\s*\n(?:[^\n]*\n){0,3}?\s*version:\s*\"?([^\"\s]+)"
        else:
            pattern = spec["pattern"]
        m = re.search(pattern, text)
        if not m:
            raise RuntimeError(f"Version nicht gefunden in {spec['file']}")
        return m.group(1)


    def has_update(current, latest):
        if not current or not latest:
            return None
        a, b = version_key(current), version_key(latest)
        if a is None or b is None:
            return latest != current
        return b > a


    def notify_zammad(repo, release):
        tag = release.get("tag_name", "?")
        name = release.get("name") or tag
        url = release.get("html_url", "")
        notes = release.get("body") or "(keine Release-Notes)"
        payload = {
            "title": f"Neues Release: {repo} {name}",
            "group": ZAMMAD_GROUP,
            "customer": ZAMMAD_REQUESTER_EMAIL,
            "article": {
                "subject": f"Neues Release: {repo} {name}",
                "body": (
                    f"Repo: {repo}<br>Tag: {tag}<br>URL: "
                    f"<a href=\"{url}\">{url}</a><br><br>{notes}"
                ),
                "content_type": "text/html",
                "type": "note",
                "internal": False,
            },
        }
        req = urllib.request.Request(
            f"{ZAMMAD_URL}/api/v1/tickets",
            data=json.dumps(payload).encode(),
            method="POST",
            headers={
                "Authorization": f"Token token={ZAMMAD_TOKEN}",
                "Content-Type": "application/json",
            },
        )
        try:
            zammad_ctx = (
                ssl.create_default_context(cafile=ZAMMAD_CA_FILE)
                if ZAMMAD_URL.startswith("https://") and ZAMMAD_CA_FILE
                else None
            )
            with urllib.request.urlopen(req, context=zammad_ctx, timeout=10):
                print(f"[OK] Zammad-Ticket erstellt für {repo} {tag}")
        except urllib.error.HTTPError as exc:
            detail = exc.read().decode(errors="replace")
            raise RuntimeError(f"Zammad-Ticket fehlgeschlagen: HTTP {exc.code} {detail}") from exc


    def mattermost_request(method, path, body=None):
        req = urllib.request.Request(
            f"{MATTERMOST_URL}/api/v4{path}",
            data=json.dumps(body).encode() if body is not None else None,
            method=method,
            headers={
                "Authorization": f"Bearer {MATTERMOST_TOKEN}",
                "Content-Type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                return json.loads(resp.read())
        except urllib.error.HTTPError as exc:
            detail = exc.read().decode(errors="replace")
            raise RuntimeError(f"Mattermost {method} {path}: HTTP {exc.code} {detail}") from exc


    def mattermost_channel_id():
        for channel in mattermost_request("GET", "/users/me/channels"):
            if channel.get("name") == MATTERMOST_CHANNEL:
                return channel["id"]
        raise RuntimeError(f"Mattermost-Channel {MATTERMOST_CHANNEL} nicht gefunden oder Bot kein Mitglied")


    def notify_mattermost(entry, previous, release, current):
        tag = release.get("tag_name", "?")
        url = release.get("html_url", "")
        notes = (release.get("body") or "").strip().replace("@", "@\u200b")
        if len(notes) > 500:
            notes = notes[:500].rstrip() + " ..."
        lines = [
            f"#### \U0001F195 {entry['name']} {tag}",
            f"{previous} \u2192 {tag} ({entry['repo']})" + (f", installiert: {current}" if current else ""),
            url,
        ]
        if notes:
            lines.extend(["", "> " + notes.replace("\n", "\n> ")])
        mattermost_request("POST", "/posts", {"channel_id": mattermost_channel_id(), "message": "\n".join(lines)})
        print(f"[OK] Mattermost-Nachricht gesendet fuer {entry['repo']} {tag}")


    def state_key(entry):
        return f"{entry['repo']}#{entry['tag_prefix']}" if entry["tag_prefix"] else entry["repo"]


    def main():
        state_existed, state = load_configmap(STATE_CONFIGMAP, "state.json", {})
        updates_existed, _ = load_configmap(UPDATES_CONFIGMAP, "updates.json", {})
        changed = False
        update_entries = []

        for entry in GITHUB_REPOS:
            key = state_key(entry)
            prefix = entry["tag_prefix"]
            try:
                current = current_version(entry)
            except Exception as exc:
                print(f"[ERR] {entry['id']}: installierte Version nicht lesbar: {exc}", file=sys.stderr)
                current = None
            record = {
                "id": entry["id"],
                "name": entry["name"],
                "repo": entry["repo"],
                "current_version": current,
                "latest_version": None,
                "latest_url": None,
                "has_update": None,
            }
            try:
                release = latest_release(entry)
            except Exception as exc:
                print(f"[ERR] {key}: GitHub-Abfrage fehlgeschlagen: {exc}", file=sys.stderr)
                latest_tag = state.get(key)
                if latest_tag:
                    record["latest_version"] = strip_prefix(latest_tag, prefix)
                    record["has_update"] = has_update(current, record["latest_version"])
                update_entries.append(record)
                continue

            if release is None:
                print(f"[SKIP] {key}: keine Releases vorhanden")
                update_entries.append(record)
                continue

            tag = release.get("tag_name")
            record["latest_version"] = strip_prefix(tag, prefix)
            record["latest_url"] = release.get("html_url")
            record["has_update"] = has_update(current, record["latest_version"])
            update_entries.append(record)

            previous = state.get(key)
            if previous is None:
                print(f"[INIT] {key}: Baseline gesetzt auf {tag}")
                state[key] = tag
                changed = True
                continue
            if tag == previous:
                print(f"[OK] {key}: kein neues Release ({tag}), installiert {current or '?'}")
                continue

            print(f"[NEW] {key}: {previous} -> {tag}")
            state[key] = tag
            changed = True
            if entry["notify_zammad"]:
                try:
                    notify_zammad(entry["repo"], release)
                except Exception as exc:
                    print(f"[ERR] {key}: Zammad-Benachrichtigung fehlgeschlagen: {exc}", file=sys.stderr)
            if MATTERMOST_URL and MATTERMOST_TOKEN:
                try:
                    notify_mattermost(entry, previous, release, current)
                except Exception as exc:
                    print(f"[ERR] {key}: Mattermost-Benachrichtigung fehlgeschlagen: {exc}", file=sys.stderr)

        if changed:
            save_configmap(STATE_CONFIGMAP, "state.json", state_existed, state)

        save_configmap(UPDATES_CONFIGMAP, "updates.json", updates_existed, {
            "updated_at": int(time.time()),
            "repos": update_entries,
        })


    if __name__ == "__main__":
        main()
