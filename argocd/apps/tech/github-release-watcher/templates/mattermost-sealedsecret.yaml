{{- if and .Values.mattermost.enabled .Values.mattermost.encryptedToken }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.mattermost.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    {{ .Values.mattermost.tokenSecretKey }}: {{ .Values.mattermost.encryptedToken | quote }}
  template:
    metadata:
      name: {{ .Values.mattermost.tokenSecretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
