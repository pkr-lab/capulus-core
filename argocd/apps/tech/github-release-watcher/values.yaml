---
image:
  repository: python
  tag: "3.15-slim@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51"
  pullPolicy: IfNotPresent

schedule: "0 */2 * * *"
timezone: "Europe/Berlin"
suspend: false
concurrencyPolicy: Forbid
failedJobsHistoryLimit: 3
successfulJobsHistoryLimit: 3

github:
  repos:
    - id: docflowengine
      name: "DocFlowEngine"
      repo: "pkr-lab/DocFlowEngine"
      currentVersion: ""
      notifyZammad: true
    - id: nextcloud
      name: "Nextcloud"
      repo: "nextcloud/server"
      currentVersion: "v34.0.2"
      notifyZammad: false
    - id: immich
      name: "Immich"
      repo: "immich-app/immich"
      currentVersion: "v3.1.0"
      notifyZammad: false
    - id: vaultwarden
      name: "Vaultwarden"
      repo: "dani-garcia/vaultwarden"
      currentVersion: "1.37.1"
      notifyZammad: false
    - id: paperless-ngx
      name: "Paperless-ngx"
      repo: "paperless-ngx/paperless-ngx"
      currentVersion: "v3.0.5"
      notifyZammad: false
    - id: n8n
      name: "n8n"
      repo: "n8n-io/n8n"
      currentVersion: "n8n@2.33.7"
      notifyZammad: false
    - id: wikijs
      name: "Wiki.js"
      repo: "requarks/wiki"
      currentVersion: "3.3.1"
      notifyZammad: false
    - id: zammad
      name: "Zammad"
      repo: "zammad/zammad"
      currentVersion: "7.1.1"
      notifyZammad: false
  tokenSecretName: "github-api-token"
  tokenSecretKey: token

carplayApiServiceAccountName: "carplay-api"

zammad:
  url: "https://zammad.tech.homeserver"
  group: "Capulus-Core::RepoBenachrichtigung"
  requesterEmail: "peterkretzer36@gmail.com"
  tokenSecretName: github-release-watcher-zammad-token
  tokenSecretKey: token

mattermost:
  enabled: true
  url: "http://mattermost.mattermost.svc.cluster.local:8065"
  channel: "releases"
  tokenSecretName: github-release-watcher-mattermost-token
  tokenSecretKey: token
  encryptedToken: ""

secrets:
  enabled: true
  name: github-release-watcher-zammad-token
  encryptedToken: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations:
  - key: capulus.homeserver/protected
    operator: Exists
    effect: PreferNoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - controlplane-1
