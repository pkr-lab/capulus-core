  tokenSecretName: "github-api-token"
  tokenSecretKey: token

carplayApiServiceAccountName: "carplay-api"

zammad:
  url: "https://zammad.tech.homeserver"
  group: "Capulus-Core::RepoBenachrichtigung"
  requesterEmail: "peterkretzer36@gmail.com"
  tokenSecretName: github-release-watcher-zammad-token
  tokenSecretKey: token

mattermost:
  enabled: true
  url: "http://mattermost.mattermost.svc.cluster.local:8065"
  channel: "releases"
  tokenSecretName: github-release-watcher-mattermost-token
  tokenSecretKey: token
  encryptedToken: ""

secrets:
  enabled: true
  name: github-release-watcher-zammad-token
  encryptedToken: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations:
  - key: capulus.homeserver/protected
    operator: Exists
    effect: PreferNoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - controlplane-1
