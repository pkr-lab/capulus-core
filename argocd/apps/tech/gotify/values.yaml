---
replicaCount: 1

image:
  repository: gotify/server
  pullPolicy: IfNotPresent
  tag: "3.1.1"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: gotify.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressApi:
  enabled: true
  host: gotify-api.tech.homeserver

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

adminSecret:
  enabled: true
  username: admin
  secretName: gotify-admin
  encryptedPassword: ""

extraEnv: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
