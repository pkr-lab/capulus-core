---
headlamp:
  replicaCount: null

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
    hosts:
      - host: headlamp.tech.homeserver
        paths:
          - path: /
            type: Prefix
    tls: []

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  serviceAccount:
    create: true

  clusterRoleBinding:
    create: false

  tolerations:
    - key: capulus.homeserver/protected
      operator: Exists
      effect: PreferNoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - controlplane-1
