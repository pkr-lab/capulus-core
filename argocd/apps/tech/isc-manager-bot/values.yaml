---
replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/isc-manager-bot
  tag: "sha-5e2f5eb9"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 2Gi

tmpSizeLimit: 512Mi

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

config:
  iscBaseUrl: "https://dlrg.net"
  sewobeBaseUrl: "https://mv.dlrg.net"
  gliederungEdv: "1002011"
  mitgliedschaftGliederung: "Ortsgruppe Andernach e.V."
  stepTimeoutMs: "30000"
  searchTimeoutMs: "90000"
  searchSettleMs: "20000"
  saveTimeoutMs: "45000"
  syncTimeoutMs: "360000"
  lockWaitMs: "60000"
  maxBodyBytes: "65536"

n8nNamespace: n8n
n8nPodName: n8n

secrets:
  enabled: true
  name: isc-manager-bot-secrets
  encryptedData:
    ISC_USERNAME: ""
    ISC_PASSWORD: ""
    SEWOBE_USERNAME: ""
    SEWOBE_PASSWORD: ""
    SEWOBE_TOTP_SECRET: ""
    API_TOKEN: ""

nodeSelector: {}
tolerations: []
affinity: {}
