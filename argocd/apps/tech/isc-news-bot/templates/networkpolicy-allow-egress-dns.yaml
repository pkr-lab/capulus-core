apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "isc-news-bot.fullname" . }}-allow-egress-dns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "isc-news-bot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
