apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "isc-news-bot.fullname" . }}-allow-ingress-n8n
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "isc-news-bot.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.n8nNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.n8nPodName }}
      ports:
        - protocol: TCP
          port: 8080
