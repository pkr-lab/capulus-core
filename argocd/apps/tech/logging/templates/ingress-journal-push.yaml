apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logs-write
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ if and .Values.writeAuth.enabled .Values.writeAuth.encryptedUsers }}{{ .Release.Namespace }}-{{ .Values.writeAuth.secretName }}@kubernetescrd,{{ end }}kube-system-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: logs-write.tech.homeserver
      http:
        paths:
          - path: /insert/journald
            pathType: Prefix
            backend:
              service:
                name: logging-victoria-logs-single-server
                port:
                  number: 9428
