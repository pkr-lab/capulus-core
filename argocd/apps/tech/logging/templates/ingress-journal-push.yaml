apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logs-write
  namespace: {{ .Release.Namespace }}
  {{- if and .Values.writeAuth.enabled .Values.writeAuth.encryptedUsers }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.writeAuth.secretName }}@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: logs-write.tech.homeserver
      http:
        paths:
          - path: /insert/journald
            pathType: Prefix
            backend:
              service:
                name: logging-victoria-logs-single-server
                port:
                  number: 9428
