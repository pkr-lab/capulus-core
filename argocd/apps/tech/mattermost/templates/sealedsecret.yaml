{{- if .Values.secrets.enabled -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  encryptedData:
    datasource: {{ .Values.secrets.encryptedDatasource | quote }}
    postgresql-password: {{ .Values.secrets.encryptedPostgresPassword | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.name }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
