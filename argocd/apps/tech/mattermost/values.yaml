---
replicaCount: 1

image:
  repository: mattermost/mattermost-team-edition
  pullPolicy: IfNotPresent
  tag: "12.0.2@sha256:0e435f3397390c36797d0c09b6fcfd73841ebf89bb292d6c6e109082a21ad7b6"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8065
  targetPort: 8065

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: mattermost.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: matter-tech.pkr-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  data:
    enabled: true
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce
  plugins:
    enabled: true
    storageClassName: local-path
    size: 1Gi
    accessMode: ReadWriteOnce

secrets:
  enabled: true
  name: mattermost-secrets
  encryptedDatasource: "PLACEHOLDER-BITTE-MIT-SCRIPTS/SEAL-MATTERMOST-DB.SH-ERSETZEN"
  encryptedPostgresPassword: "PLACEHOLDER-BITTE-MIT-SCRIPTS/SEAL-MATTERMOST-DB.SH-ERSETZEN"

config:
  MM_SERVICESETTINGS_SITEURL: "https://matter-tech.pkr-lab.de"
  MM_SQLSETTINGS_DRIVERNAME: "postgres"
  MM_LOGSETTINGS_ENABLECONSOLE: "true"
  MM_LOGSETTINGS_CONSOLEJSON: "true"
  MM_LOGSETTINGS_ENABLEFILE: "false"
  MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
  MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
  MM_TEAMSETTINGS_MAXUSERSPERTEAM: "20"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

postgresql:
  enabled: true
  fullnameOverride: mattermost-postgresql
  auth:
    enablePostgresUser: false
    username: mattermost
    database: mattermost
    existingSecret: mattermost-secrets
    secretKeys:
      userPasswordKey: postgresql-password
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
