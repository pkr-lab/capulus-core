---
replicaCount: 1

image:
  repository: mattermost/mattermost-team-edition
  pullPolicy: IfNotPresent
  tag: "12.0.2@sha256:0e435f3397390c36797d0c09b6fcfd73841ebf89bb292d6c6e109082a21ad7b6"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 2000
  runAsGroup: 2000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8065
  targetPort: 8065

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: mattermost.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: matter-tech.pkr-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  data:
    enabled: true
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce
  plugins:
    enabled: true
    storageClassName: local-path
    size: 1Gi
    accessMode: ReadWriteOnce

secrets:
  enabled: true
  name: mattermost-secrets
  encryptedDatasource: ""
  encryptedPostgresPassword: ""
  encryptedSmtpPassword: ""

config:
  MM_SERVICESETTINGS_SITEURL: "https://matter-tech.pkr-lab.de"
  MM_SQLSETTINGS_DRIVERNAME: "postgres"
  MM_LOGSETTINGS_ENABLECONSOLE: "true"
  MM_LOGSETTINGS_CONSOLEJSON: "true"
  MM_LOGSETTINGS_ENABLEFILE: "false"
  MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
  MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
  MM_TEAMSETTINGS_MAXUSERSPERTEAM: "20"
  MM_TEAMSETTINGS_SITENAME: "Capulus Mattermost"
  MM_LOCALIZATIONSETTINGS_DEFAULTSERVERLOCALE: "de"
  MM_LOCALIZATIONSETTINGS_DEFAULTCLIENTLOCALE: "de"
  MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
  MM_SERVICESETTINGS_ENABLECOMMANDS: "true"
  MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
  MM_SERVICESETTINGS_ENABLEONLYADMININTEGRATIONS: "true"
  MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "n8n.n8n.svc.cluster.local"
  MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "true"
  MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
  MM_EMAILSETTINGS_ENABLESMTPAUTH: "true"
  MM_EMAILSETTINGS_SMTPSERVER: "mxe9f8.netcup.net"
  MM_EMAILSETTINGS_SMTPPORT: "465"
  MM_EMAILSETTINGS_CONNECTIONSECURITY: "TLS"
  MM_EMAILSETTINGS_SMTPUSERNAME: "info@pkr-service.de"
  MM_EMAILSETTINGS_FEEDBACKEMAIL: "info@pkr-service.de"
  MM_EMAILSETTINGS_REPLYTOADDRESS: "info@pkr-service.de"
  MM_EMAILSETTINGS_FEEDBACKNAME: "Capulus Mattermost"
  MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "true"
  MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: "https://push-test.mattermost.com"
  MM_PLUGINSETTINGS_PLUGINSTATES: '{"focalboard":{"Enable":true}}'

boardsPlugin:
  enabled: true
  version: "10.1.0"
  url: "https://github.com/mattermost/mattermost-plugin-boards/releases/download/v10.1.0/mattermost-plugin-boards-v10.1.0.tar.gz"
  sha256: "a9eeb367fe94640e3327228e493688d45ede182a250c0ece98dc912a171aa75f"
  image:
    repository: alpine
    tag: "3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

postgres:
  image:
    repository: postgres
    tag: "18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5"
  username: mattermost
  database: mattermost
  persistence:
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

resticBackup:
  enabled: true
  secretName: mattermost-restic
  encryptedPassword: ""
  schedule: "15 3 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 10Gi
  postgres:
    host: mattermost-postgresql
    user: mattermost
    database: mattermost
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
