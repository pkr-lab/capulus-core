{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mdm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range $host := list .Values.publicHost .Values.internalHost }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /mdm
            pathType: Exact
            backend:
              service:
                name: {{ include "mdm.fullname" $ }}-nanomdm
                port:
                  name: http
          {{- if $.Values.secrets.enrollmentProfile.encryptedData }}
          - path: /mdm/enroll
            pathType: Exact
            backend:
              service:
                name: {{ include "mdm.fullname" $ }}-enroll
                port:
                  name: http
          {{- end }}
          - path: /scep
            pathType: Prefix
            backend:
              service:
                name: {{ include "mdm.fullname" $ }}-scep
                port:
                  name: http
    {{- end }}
{{- end }}
