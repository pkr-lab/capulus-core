apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mdm.fullname" . }}-scep-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Values.scep.caPem | trim | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  name: {{ include "mdm.fullname" . }}-scep-depot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.scep.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.scep.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mdm.fullname" . }}-scep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mdm.selectorLabels" (dict "ctx" . "component" "scep") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/ca: {{ .Values.scep.caPem | sha256sum }}
      labels:
        {{- include "mdm.selectorLabels" (dict "ctx" . "component" "scep") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mdm.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "mdm.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      initContainers:
        - name: install-ca
          image: {{ .Values.toolbox.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "mdm.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              cp /ca-cert/ca.pem /depot/ca.pem
              cp /ca-key/ca.key /depot/ca.key
              chmod 0600 /depot/ca.key
          resources:
            {{- toYaml .Values.toolbox.resources | nindent 12 }}
          volumeMounts:
            - name: depot
              mountPath: /depot
            - name: ca-cert
              mountPath: /ca-cert
              readOnly: true
            - name: ca-key
              mountPath: /ca-key
              readOnly: true
      containers:
        - name: scep
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "mdm.containerSecurityContext" . | nindent 12 }}
          args:
            - -depot=/depot
            - -port={{ .Values.scep.port }}
            - -challenge=$(SCEP_CHALLENGE)
            - -crtvalid={{ .Values.scep.crtValidDays }}
            - -allowrenew={{ .Values.scep.allowRenewDays }}
            - -log-json
          env:
            {{- include "mdm.secretEnv" (dict "name" "SCEP_CHALLENGE" "secret" .Values.secrets.main.secretName "key" "scep-challenge") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.scep.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /scep?operation=GetCACaps
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /scep?operation=GetCACaps
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scep.resources | nindent 12 }}
          volumeMounts:
            - name: depot
              mountPath: /depot
      volumes:
        - name: depot
          persistentVolumeClaim:
            claimName: {{ include "mdm.fullname" . }}-scep-depot
        - name: ca-cert
          configMap:
            name: {{ include "mdm.fullname" . }}-scep-ca
        - name: ca-key
          secret:
            secretName: {{ .Values.secrets.scepCa.secretName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdm.fullname" . }}-scep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.scep.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mdm.selectorLabels" (dict "ctx" . "component" "scep") | nindent 4 }}
