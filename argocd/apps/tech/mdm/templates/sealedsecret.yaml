{{- range $key, $secret := dict "main" .Values.secrets.main "scepCa" .Values.secrets.scepCa "enrollmentProfile" .Values.secrets.enrollmentProfile }}
{{- if $secret.encryptedData }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secret.secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mdm.labels" $ | nindent 4 }}
spec:
  encryptedData:
    {{- range $name, $value := $secret.encryptedData }}
    {{ $name }}: {{ $value | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ $secret.secretName }}
      namespace: {{ $.Release.Namespace }}
    type: Opaque
{{- end }}
{{- end }}
