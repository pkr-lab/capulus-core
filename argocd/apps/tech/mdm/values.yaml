enroll:
  image:
    repository: nginx
    tag: "1.31-alpine3.24@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417"
  port: 8080
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 100m
      memory: 32Mi

postgres:
  image:
    repository: postgres
    tag: "17-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b"
  port: 5432
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 384Mi
  persistence:
    storageClassName: local-path
    size: 5Gi

toolbox:
  image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  resources:
    requests:
      cpu: 5m
      memory: 8Mi
    limits:
      cpu: 100m
      memory: 32Mi

automation:
  n8nNamespace: n8n
  n8nService: n8n.n8n.svc.cluster.local
  profilePrefix: de.pke-lab.mdm
  lockScreenText: "Dieses iPad gehört der Organisation. Gefunden? Bitte beim Eigentümer melden."

ingress:
  enabled: true
  className: traefik
  annotations: {}

networkPolicy:
  enabled: true
  ingressNamespaces:
    - kube-system
    - cloudflared
    - monitoring
  internetEgressPorts:
    - 443

backup:
  enabled: true
  schedule: "40 2 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 5Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeSelector:
  kubernetes.io/hostname: homeserver

secrets:
  main:
    secretName: mdm-secrets
    encryptedData:
      postgres-password: ""
      nanomdm-db-password: ""
      nanodep-db-password: ""
      automation-db-password: ""
      nanomdm-api-key: ""
      nanodep-api-key: ""
      scep-challenge: ""
      webhook-token: ""
      restic-password: ""
  scepCa:
    secretName: mdm-scep-ca
    encryptedData:
      ca.key: ""
  enrollmentProfile:
    secretName: mdm-enrollment-profile
    encryptedData: {}
