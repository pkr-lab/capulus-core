---

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 75

image:
  repository: bluenviron/mediamtx
  pullPolicy: IfNotPresent
  tag: "1.21.1"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  ports:
    hls: 8888
    webrtc: 8889
    api: 9997

publishService:
  type: NodePort
  ports:
    rtmp:
      port: 1935
      nodePort: 31935
    rtsp:
      port: 8554
      nodePort: 31554

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: stream.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: stream-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

auth:
  streamer:
    user: "sha256:jGl25bVBBBW96Qi9Te4V37Fnqchz/Eu4qB9vKrRIqRg="
    pass: "sha256:7o3snNoI9o1Kyb18PgLNDLhbkt74LiyeNsCD0kEp4hc="
  viewer:
    user: "sha256:01ylBRuC/8Mmo7C2V0qaMWHe4WuUeKGZ7jnNgDzlt5k="
    pass: "sha256:9yNXifrl2+t1sPvw+xyIF2riEtUwEWC5YJGLaPg3Ezg="

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
