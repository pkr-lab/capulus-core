---
minio:
  mode: standalone
  replicas: 1

  existingSecret: minio-root

  persistence:
    enabled: true
    storageClass: nas
    size: 10Gi
    accessMode: ReadWriteOnce

  affinity: {}

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  buckets:
    - name: argo-artifacts
      policy: none
      purge: false

  consoleIngress:
    enabled: true
    ingressClassName: traefik
    path: /
    hosts:
      - minio.tech.homeserver

  ingress:
    enabled: false

rootCreds:
  name: minio-root
  encryptedRootUser: ""
  encryptedRootPassword: ""
