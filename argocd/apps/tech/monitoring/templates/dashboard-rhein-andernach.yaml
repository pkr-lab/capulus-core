apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-rhein-andernach
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "OG Andernach"
data:
  rhein-andernach.json: |
    {
      "annotations": {"list": []},
      "description": "Einsatzlage am Gewässer: Wasserstufe, Pegel mit Vorhersage und Karten für Pegel, Wassertemperatur und Wetter rund um den gewählten Einsatzort",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "title": "Pegelonline",
          "url": "https://pegelonline.wsv.de/gast/stammdaten?pegelnr=${pegelnr}",
          "type": "link",
          "targetBlank": true
        },
        {
          "title": "Hochwasser RLP",
          "url": "https://www.hochwasser.rlp.de/",
          "type": "link",
          "targetBlank": true
        },
        {
          "title": "ELWIS",
          "url": "https://elwis.de/DE/dynamisch/gewaesserkundliche-Grundlagen/Wasserstaende/index.php",
          "type": "link",
          "targetBlank": true
        },
        {
          "title": "NINA-Warnlage",
          "url": "/d/nina-warnlage",
          "type": "link",
          "targetBlank": false
        }
      ],
      "panels": [
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "#5a6b7d", "value": null}]},
              "noValue": "Keine aktuelle Messung"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Wasserstufe"},
                "properties": [
                  {"id": "displayName", "value": "Wasserstufe ${ort} (${gewaesser_name})"},
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {"text": "Keine Kennwerte", "color": "#5a6b7d", "index": 0},
                          "1": {"text": "Niedrigwasser – unter MNW", "color": "#00c8ff", "index": 1},
                          "2": {"text": "Unter Mittelwasser", "color": "#0000ff", "index": 2},
                          "3": {"text": "Über Mittelwasser", "color": "#44a016", "index": 3},
                          "4": {"text": "Hochwasser – über MHW", "color": "#f3e600", "index": 4},
                          "5": {"text": "Starkes Hochwasser – über HW", "color": "#f8ae64", "index": 5},
                          "6": {"text": "Extremes Hochwasser – über HHW", "color": "#8a2d87", "index": 6}
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Schifffahrt"},
                "properties": [
                  {"id": "displayName", "value": "Schifffahrt"},
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {"text": "Keine Hochwassermarken", "color": "#5a6b7d", "index": 0},
                          "1": {"text": "Frei", "color": "#44a016", "index": 1},
                          "2": {"text": "Hochwassermarke I überschritten", "color": "#f8ae64", "index": 2},
                          "3": {"text": "Hochwassermarke II – eingestellt", "color": "#de0a14", "index": 3}
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
          "id": 20,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "showPercentChange": false,
            "text": {"titleSize": 16, "valueSize": 32},
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "A",
              "type": "json",
              "source": "url",
              "url": "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/${einsatzort}/W.json?includeCurrentMeasurement=true&includeCharacteristicValues=true",
              "url_options": {"method": "GET", "data": ""},
              "parser": "backend",
              "root_selector": "( $v := currentMeasurement.value; $c := characteristicValues; $k := function($n){ $c[shortname=$n][0].value }; $mnw := $k('MNW'); $mw := $k('MW'); $mhw := $k('MHW'); $hw := $k('HW'); $hhw := $k('HHW'); $m1 := $k('M_I'); $m2 := $k('M_II'); $hsw := $k('HSW'); [{'Wasserstufe':$not($exists($v)) or $not($exists($mw)) ? 0 : ($exists($hhw) and $v >= $hhw) ? 6 : ($exists($hw) and $v >= $hw) ? 5 : ($exists($mhw) and $v >= $mhw) ? 4 : $v >= $mw ? 3 : ($exists($mnw) and $v < $mnw) ? 1 : 2,'Schifffahrt':$not($exists($v)) ? 0 : ($exists($m2) and $v >= $m2) ? 3 : ($exists($m1) and $v >= $m1) ? 2 : ($exists($hsw) and $v >= $hsw) ? 3 : ($exists($m1) or $exists($m2) or $exists($hsw)) ? 1 : 0}] )",
              "columns": [
                {"selector": "Wasserstufe", "type": "number", "text": "Wasserstufe"},
                {"selector": "Schifffahrt", "type": "number", "text": "Schifffahrt"}
              ],
              "format": "table"
            }
          ],
          "transformations": [{"id": "organize", "options": {"indexByName": {"Wasserstufe": 0, "Schifffahrt": 1}}}],
          "title": "",
          "type": "stat"
        },
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "fixed", "fixedColor": "blue"},
              "decimals": 0,
              "mappings": [],
              "unit": "cm",
              "min": 0
            }
          },
          "gridPos": {"h": 10, "w": 6, "x": 0, "y": 4},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "A",
              "type": "json",
              "source": "url",
              "url": "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/${einsatzort}/W/measurements.json?start=PT3H",
              "url_options": {"method": "GET", "data": ""},
              "parser": "simple",
              "root_selector": "",
              "columns": [
                {"selector": "timestamp", "type": "timestamp", "text": "time"},
                {"selector": "value", "type": "number", "text": "Wasserstand (cm)"}
              ],
              "format": "timeseries"
            }
          ],
          "title": "${ort} — Aktueller Pegel",
          "type": "stat"
        },
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "cm"
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "RLP Median"},
                "properties": [
                  {"id": "displayName", "value": "Vorhersage Hochwasser RLP (Median)"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 6]}},
                  {"id": "custom.fillOpacity", "value": 0}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "RLP 10 %"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}},
                  {"id": "custom.lineWidth", "value": 1},
                  {"id": "custom.fillOpacity", "value": 0},
                  {"id": "custom.hideFrom", "value": {"legend": true, "tooltip": false, "viz": false}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "RLP 90 %"},
                "properties": [
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "purple"}},
                  {"id": "custom.lineWidth", "value": 1},
                  {"id": "custom.fillOpacity", "value": 15},
                  {"id": "custom.fillBelowTo", "value": "RLP 10 %"},
                  {"id": "custom.hideFrom", "value": {"legend": true, "tooltip": false, "viz": false}}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "BfG Vorhersage"},
                "properties": [
                  {"id": "displayName", "value": "Vorhersage BfG (WSV)"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}},
                  {"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 6]}},
                  {"id": "custom.fillOpacity", "value": 0}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "BfG Abschätzung"},
                "properties": [
                  {"id": "displayName", "value": "Abschätzung BfG (WSV)"},
                  {"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}},
                  {"id": "custom.lineStyle", "value": {"fill": "dot", "dash": [2, 6]}},
                  {"id": "custom.fillOpacity", "value": 0}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Wasserstand (cm)"},
                "properties": [{"id": "displayName", "value": "Gemessen"}]
              }
            ]
          },
          "gridPos": {"h": 10, "w": 18, "x": 6, "y": 4},
          "id": 2,
          "options": {
            "legend": {"calcs": ["lastNotNull", "min", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "A",
              "type": "json",
              "source": "url",
              "url": "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/${einsatzort}/W/measurements.json?start=P2D",
              "url_options": {"method": "GET", "data": ""},
              "parser": "simple",
              "root_selector": "",
              "columns": [
                {"selector": "timestamp", "type": "timestamp", "text": "time"},
                {"selector": "value", "type": "number", "text": "Wasserstand (cm)"}
              ],
              "format": "timeseries"
            },
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "B",
              "type": "json",
              "source": "url",
              "url": "${rlp_url:raw}",
              "url_options": {"method": "GET", "data": ""},
              "parser": "backend",
              "root_selector": "( $p := W.predictions; $map($p.p50, function($v,$i){ {'x':$v.x,'p10':$p.p10[$i].y,'p50':$v.y,'p90':$p.p90[$i].y} }) )",
              "columns": [
                {"selector": "x", "type": "timestamp", "text": "time"},
                {"selector": "p10", "type": "number", "text": "RLP 10 %"},
                {"selector": "p50", "type": "number", "text": "RLP Median"},
                {"selector": "p90", "type": "number", "text": "RLP 90 %"}
              ],
              "format": "timeseries"
            },
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "C",
              "type": "json",
              "source": "url",
              "url": "${wv_url:raw}",
              "url_options": {"method": "GET", "data": ""},
              "parser": "backend",
              "root_selector": "$map($, function($r){ {'timestamp':$r.timestamp,'wf':$r.type = 'forecast' ? $r.value,'we':$r.type = 'estimate' ? $r.value} })",
              "columns": [
                {"selector": "timestamp", "type": "timestamp", "text": "time"},
                {"selector": "wf", "type": "number", "text": "BfG Vorhersage"},
                {"selector": "we", "type": "number", "text": "BfG Abschätzung"}
              ],
              "format": "timeseries"
            }
          ],
          "description": "Gemessen: Pegelonline. Vorhersage Hochwasser RLP (Median mit 10–90-%-Band) und Vorhersage der BfG (über Pegelonline) erscheinen nur, wenn es für den gewählten Pegel eine gibt. Fehlt beides, zeigt das Panel nur die Messwerte.",
          "title": "${ort} — 48h Verlauf und Vorhersage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "text", "value": null}]}
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Zustand"},
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "low": {"text": "unter MNW", "color": "#00c8ff", "index": 0},
                          "normal": {"text": "normal", "color": "#44a016", "index": 1},
                          "high": {"text": "über MHW", "color": "#f8ae64", "index": 2},
                          "unknown": {"text": "keine Kennwerte", "color": "#5a6b7d", "index": 3},
                          "commented": {"text": "kommentiert", "color": "#5a6b7d", "index": 4},
                          "out-dated": {"text": "veraltet", "color": "#999999", "index": 5}
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {"id": "byName", "options": "Pegel"},
                "properties": [{"id": "unit", "value": "cm"}, {"id": "decimals", "value": 0}]
              },
              {
                "matcher": {"id": "byName", "options": "Fluss-km"},
                "properties": [{"id": "decimals", "value": 1}]
              },
              {
                "matcher": {"id": "byRegexp", "options": "^(lat|lon|Label)$"},
                "properties": [{"id": "custom.hideFrom", "value": {"legend": true, "tooltip": true, "viz": false}}]
              }
            ]
          },
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 14},
          "id": 21,
          "options": {
            "basemap": {"type": "default", "name": "Karte", "config": {}},
            "controls": {"mouseWheelZoom": false, "showAttribution": true, "showDebug": false, "showMeasure": false, "showScale": false, "showZoom": true},
            "layers": [
              {
                "type": "markers",
                "name": "Pegel",
                "config": {
                  "showLegend": false,
                  "style": {
                    "color": {"field": "Zustand", "fixed": "blue"},
                    "opacity": 0.9,
                    "rotation": {"fixed": 0, "max": 360, "min": -360, "mode": "mod"},
                    "size": {"fixed": 8, "max": 15, "min": 2},
                    "symbol": {"fixed": "img/icons/marker/circle.svg", "mode": "fixed"},
                    "symbolAlign": {"horizontal": "center", "vertical": "center"},
                    "text": {"field": "Label", "fixed": "", "mode": "field"},
                    "textConfig": {"fontSize": 12, "offsetX": 0, "offsetY": -12, "textAlign": "center", "textBaseline": "bottom"}
                  }
                },
                "location": {"mode": "coords", "latitude": "lat", "longitude": "lon"},
                "tooltip": true
              }
            ],
            "tooltip": {"mode": "details"},
            "view": {"id": "fit", "allLayers": true, "padding": 40, "lat": 50.44, "lon": 7.39, "zoom": 9}
          },
          "targets": [
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "A",
              "type": "json",
              "source": "url",
              "url": "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude=${lat}&longitude=${lon}&radius=${umkreis}&waters=${gewaesser:percentencode}&timeseries=W&includeTimeseries=true&includeCurrentMeasurement=true",
              "url_options": {"method": "GET", "data": ""},
              "parser": "backend",
              "root_selector": "( $tc := function($t){ $join($map($split($lowercase($t),' '),function($w){ $uppercase($substring($w,0,1)) & $substring($w,1) }),' ') }; $map($^(km),function($s){ ( $n := $tc($s.shortname); $m := $s.timeseries[shortname='W'].currentMeasurement; {'Station':$n,'km':$s.km,'lat':$s.latitude,'lon':$s.longitude,'Pegel':$m.value,'Zustand':$m.stateMnwMhw,'Gemessen':$m.timestamp,'Label':$n & ' ' & $string($m.value) & ' cm'} ) }) )",
              "columns": [
                {"selector": "Station", "type": "string", "text": "Station"},
                {"selector": "km", "type": "number", "text": "Fluss-km"},
                {"selector": "Pegel", "type": "number", "text": "Pegel"},
                {"selector": "Zustand", "type": "string", "text": "Zustand"},
                {"selector": "Gemessen", "type": "timestamp", "text": "Gemessen"},
                {"selector": "lat", "type": "number", "text": "lat"},
                {"selector": "lon", "type": "number", "text": "lon"},
                {"selector": "Label", "type": "string", "text": "Label"}
              ],
              "format": "table"
            }
          ],
          "title": "Wasserstände ${gewaesser_name} — ${umkreis} km um ${ort}",
          "type": "geomap"
        },
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "dark-blue", "value": null},
                  {"color": "blue", "value": 10},
                  {"color": "green", "value": 15},
                  {"color": "yellow", "value": 20},
                  {"color": "orange", "value": 25}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Wassertemperatur"},
                "properties": [{"id": "unit", "value": "celsius"}, {"id": "decimals", "value": 1}]
              },
              {
                "matcher": {"id": "byRegexp", "options": "^(lat|lon|Label)$"},
                "properties": [{"id": "custom.hideFrom", "value": {"legend": true, "tooltip": true, "viz": false}}]
              }
            ]
          },
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 14},
          "id": 22,
          "options": {
            "basemap": {"type": "default", "name": "Karte", "config": {}},
            "controls": {"mouseWheelZoom": false, "showAttribution": true, "showDebug": false, "showMeasure": false, "showScale": false, "showZoom": true},
            "layers": [
              {
                "type": "markers",
                "name": "Wassertemperatur",
                "config": {
                  "showLegend": false,
                  "style": {
                    "color": {"field": "Wassertemperatur", "fixed": "blue"},
                    "opacity": 0.9,
                    "rotation": {"fixed": 0, "max": 360, "min": -360, "mode": "mod"},
                    "size": {"fixed": 8, "max": 15, "min": 2},
                    "symbol": {"fixed": "img/icons/marker/circle.svg", "mode": "fixed"},
                    "symbolAlign": {"horizontal": "center", "vertical": "center"},
                    "text": {"field": "Label", "fixed": "", "mode": "field"},
                    "textConfig": {"fontSize": 12, "offsetX": 0, "offsetY": -12, "textAlign": "center", "textBaseline": "bottom"}
                  }
                },
                "location": {"mode": "coords", "latitude": "lat", "longitude": "lon"},
                "tooltip": true
              }
            ],
            "tooltip": {"mode": "details"},
            "view": {"id": "fit", "allLayers": true, "padding": 40, "lat": 50.44, "lon": 7.39, "zoom": 7.5}
          },
          "targets": [
            {
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
              "refId": "A",
              "type": "json",
              "source": "url",
              "url": "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations.json?latitude=${lat}&longitude=${lon}&radius=${umkreis_temp}&timeseries=WT&includeTimeseries=true&includeCurrentMeasurement=true",
              "url_options": {"method": "GET", "data": ""},
              "parser": "backend",
              "root_selector": "$map($[$toMillis(timeseries[shortname='WT'].currentMeasurement.timestamp) > $millis() - 86400000],function($s){ ( $n := $join($map($split($lowercase($s.shortname),' '),function($w){ $uppercase($substring($w,0,1)) & $substring($w,1) }),' '); $g := $uppercase($substring($s.water.shortname,0,1)) & $lowercase($substring($s.water.shortname,1)); $m := $s.timeseries[shortname='WT'].currentMeasurement; {'Station':$n,'Gewässer':$g,'lat':$s.latitude,'lon':$s.longitude,'Wassertemperatur':$m.value,'Gemessen':$m.timestamp,'Label':$n & ' (' & $g & ') ' & $replace($formatNumber($m.value,'0.0'),'.',',') & ' °C'} ) })",
              "columns": [
                {"selector": "Station", "type": "string", "text": "Station"},
                {"selector": "Gewässer", "type": "string", "text": "Gewässer"},
                {"selector": "Wassertemperatur", "type": "number", "text": "Wassertemperatur"},
                {"selector": "Gemessen", "type": "timestamp", "text": "Gemessen"},
                {"selector": "lat", "type": "number", "text": "lat"},
                {"selector": "lon", "type": "number", "text": "lon"},
                {"selector": "Label", "type": "string", "text": "Label"}
              ],
              "format": "table"
            }
          ],
          "title": "Wassertemperatur — ${umkreis_temp} km um ${ort}",
          "type": "geomap"
        },
        {
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "dark-blue", "value": null},
                  {"color": "blue", "value": 0},
                  {"color": "green", "value": 10},
                  {"color": "yellow", "value": 20},
                  {"color": "orange", "value": 25},
                  {"color": "red", "value": 30}
                ]
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "Wetter"},
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                            "0": {"text": "Klar", "index": 0},
                            "1": {"text": "Überwiegend klar", "index": 1},
                            "2": {"text": "Teils bewölkt", "index": 2},
                            "3": {"text": "Bedeckt", "index": 3},
                            "45": {"text": "Nebel", "index": 4},
                            "48": {"text": "Reifnebel", "index": 5},
                            "51": {"text": "Leichter Nieselregen", "index": 6},
                            "53": {"text": "Nieselregen", "index": 7},
                            "55": {"text": "Starker Nieselregen", "index": 8},
                            "56": {"text": "Gefrierender Nieselregen", "index": 9},
                            "57": {"text": "Starker gefrierender Nieselregen", "index": 10},
                            "61": {"text": "Leichter Regen", "index": 11},
                            "63": {"text": "Regen", "index": 12},
                            "65": {"text": "Starker Regen", "index": 13},
                            "66": {"text": "Gefrierender Regen", "index": 14},
