apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-write
  namespace: {{ .Release.Namespace }}
  {{- if and .Values.writeAuth.enabled .Values.writeAuth.encryptedUsers }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Values.writeAuth.secretName }}@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: vm-write.tech.homeserver
      http:
        paths:
          - path: /api/v1/write
            pathType: Prefix
            backend:
              service:
                name: vmsingle-monitoring-victoria-metrics-k8s-stack
                port:
                  number: 8428
