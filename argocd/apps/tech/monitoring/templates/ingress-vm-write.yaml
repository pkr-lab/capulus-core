apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-write
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: vm-write.tech.homeserver
      http:
        paths:
          - path: /api/v1/write
            pathType: Prefix
            backend:
              service:
                name: vmsingle-monitoring-victoria-metrics-k8s-stack
                port:
                  number: 8428
