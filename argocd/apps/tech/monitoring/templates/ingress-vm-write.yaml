apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vm-write
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ if and .Values.writeAuth.enabled .Values.writeAuth.encryptedUsers }}{{ .Release.Namespace }}-{{ .Values.writeAuth.secretName }}@kubernetescrd,{{ end }}kube-system-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vm-write.tech.homeserver
      http:
        paths:
          - path: /api/v1/write
            pathType: Prefix
            backend:
              service:
                name: vmsingle-monitoring-victoria-metrics-k8s-stack
                port:
                  number: 8428
