{{- if .Values.n8nWebhookToken.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.n8nWebhookToken.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  encryptedData:
    token: {{ .Values.n8nWebhookToken.encryptedData | quote }}
  template:
    metadata:
      name: {{ .Values.n8nWebhookToken.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
