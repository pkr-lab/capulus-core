apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: banana-pi-availability
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: banana-pi.availability
      interval: 30s
      rules:
        - alert: BananaPiAlarmmonitorDown
          expr: |
            absent_over_time(up{job="node-exporter", instance="vereinsheim-alarmmonitor"}[10m])
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Vereinsheim-Alarmmonitor nicht erreichbar"
            description: >-
              Der Banana-Pi-Alarmmonitor "vereinsheim-alarmmonitor" hat seit
              mehr als 10 Minuten keine Metriken mehr gepusht (vmagent-Push
              via Tailscale down oder Geraet selbst nicht erreichbar). Loest
              zusaetzlich zum ntfy-Alarm ein Zammad-Ticket via n8n aus
              (info@edv-kretzer.de).
