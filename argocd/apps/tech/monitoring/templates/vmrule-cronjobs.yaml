apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cronjobs-health
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: cronjobs.health
      interval: 1m
      rules:

        - alert: BackupJobStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob=~".*backup.*"}) > 30 * 3600
              unless on(namespace, cronjob)
            kube_cronjob_spec_suspend == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Backup {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} seit ueber 30 h ohne Erfolg"
            description: >-
              Der CronJob {{`{{ $labels.cronjob }}`}} (Namespace {{`{{ $labels.namespace }}`}}) war zuletzt vor
              mehr als 30 Stunden erfolgreich. Job-Logs pruefen (`kubectl -n {{`{{ $labels.namespace }}`}}
              logs job/<letzter Job>`); es fehlt mindestens eine Datensicherung.

        - alert: CronJobStale
          expr: |
            (time() - kube_cronjob_status_last_successful_time{cronjob!~".*backup.*"})
              > on(namespace, cronjob)
            clamp_min(
              1.5 * (kube_cronjob_next_schedule_time - on(namespace, cronjob) kube_cronjob_status_last_schedule_time),
              36 * 3600
            )
              unless on(namespace, cronjob)
            kube_cronjob_spec_suspend == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{`{{ $labels.namespace }}`}}/{{`{{ $labels.cronjob }}`}} ueberfaellig"
            description: >-
              Der CronJob {{`{{ $labels.cronjob }}`}} (Namespace {{`{{ $labels.namespace }}`}}) war zuletzt vor
              {{`{{ $value | humanizeDuration }}`}} erfolgreich, laenger als das 1,5-fache seines Zeitplans
              (mindestens 36 h; ausgesetzte CronJobs werden ignoriert).
