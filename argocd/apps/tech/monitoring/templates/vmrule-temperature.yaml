apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: thermal-temperature
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: thermal.temperature
      interval: 30s
      rules:
        - alert: HostHighTemperature
          expr: max by (host) (node_hwmon_temp_celsius) >= 95
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{ $labels.host }}" }} ist kurz vor der Hitze-Abschaltung"
            description: >-
              Der heißeste Sensor auf {{ "{{ $labels.host }}" }} liegt seit mindestens 3 Minuten bei
              {{ `{{ $value | printf "%.0f" }}` }}°C (Schwelle: 95°C). Der thermal_watchdog fährt den Host
              ab 100°C über 90 Sekunden herunter.
