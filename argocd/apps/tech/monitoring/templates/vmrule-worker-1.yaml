apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: worker-1-availability
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: worker-1.availability
      interval: 30s
      rules:
        - alert: worker-1Down
          expr: |
            (
              (
                up{job=~".*node-exporter.*", instance=~"192\\.168\\.178\\.96.*"} == 0
              ) or (
                kube_node_status_condition{
                  node="worker-1",
                  condition="Ready",
                  status="true"
                } == 0
              )
            )
            unless on() (kube_node_spec_unschedulable{node="worker-1"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "worker-1 nicht erreichbar"
            description: >-
              worker-1 (192.168.178.96) antwortet seit mehr als 1 Minute nicht mehr.
              Node-Exporter oder k8s-Node sind ausgefallen.

        - alert: Worker1Schlaeft
          expr: |
            (kube_node_spec_unschedulable{node="worker-1"} == 1)
            and on(node)
            (kube_node_status_condition{node="worker-1", condition="Ready", status="true"} == 0)
          for: 5m
          labels:
            severity: none
          annotations:
            summary: "worker-1 ist absichtlich aus (cordoned und nicht Ready)"
            description: >-
              Signalalarm fuer Alertmanager-Inhibit-Regeln. Solange er aktiv ist, werden Folgealarme
              des schlafenden worker-1 (DaemonSet-Pods, kubelet, Scrape-Ziele, entw-vm) unterdrueckt.

        - alert: InfotafelAus
          expr: |
            up{job="infotafel-node-exporter"} == 0
          for: 5m
          labels:
            severity: none
          annotations:
            summary: "Infotafel ist ausgeschaltet"
            description: >-
              Signalalarm fuer Alertmanager-Inhibit-Regeln. Die Infotafel wird zeitgesteuert
              heruntergefahren, ihr TargetDown ist dann erwartet.
