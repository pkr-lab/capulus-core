# ArgoCD-Hub (TECH + PROD): Metriken des application-controllers. Der Controller-Pod
# oeffnet den Port `metrics` (8082) immer, die NetworkPolicy `argocd-application-controller`
# erlaubt Zugriff aus jedem Namespace - dafuer ist keine Aenderung an ArgoCD noetig.
# Grundlage der Regeln in vmrule-argocd.yaml (`argocd_app_info` mit health_status,
# sync_status, operation). Der separate ENTW-ArgoCD (eigener Cluster) ist nicht erfasst.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: argocd-application-controller
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/name: argocd-application-controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
