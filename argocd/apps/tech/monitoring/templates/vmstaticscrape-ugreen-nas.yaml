# UGREEN NAS (192.168.178.97, docs/2-betrieb-hardware/20000-nas-storage.md) läuft auf eigener
# UGOS-Firmware und ist nicht Teil des k3s-Clusters — kann daher nicht per
# VMNodeScrape/DaemonSet erfasst werden. Stattdessen zwei manuell auf dem NAS
# laufende Docker-Container (node-exporter + smartctl-exporter, siehe
# docs/2-betrieb-hardware/20000-nas-storage.md "Monitoring") werden per VMStaticScrape angezapft.
# `host: ugreen-nas` (+ `kind: nas`) ist der Filter der Hardware-Dashboards
# (dashboards/hardware/, siehe docs/2-betrieb-hardware/20060-hardware-monitoring.md):
# CPU/RAM/Netzwerk/Temperatur/Fuellstand des NAS erscheinen dadurch automatisch
# neben den k3s-Nodes und VMs.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ugreen-nas-node-exporter
  namespace: {{ .Release.Namespace }}
spec:
  jobName: ugreen-nas-node-exporter
  targetEndpoints:
    - targets:
        - "192.168.178.97:9100"
      labels:
        job: node-exporter
        instance: ugreen-nas
        host: ugreen-nas
        kind: nas
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: ugreen-nas-smartctl-exporter
  namespace: {{ .Release.Namespace }}
spec:
  jobName: ugreen-nas-smartctl-exporter
  targetEndpoints:
    - targets:
        - "192.168.178.97:9633"
      labels:
        job: smartctl-exporter
        instance: ugreen-nas
        host: ugreen-nas
        kind: nas
