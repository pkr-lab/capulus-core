apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: prod-vm-node-exporter
  namespace: {{ .Release.Namespace }}
spec:
  jobName: prod-vm-node-exporter
  targetEndpoints:
    - targets:
        - "192.168.178.99:9100"
      labels:
        job: node-exporter
        instance: prod-vm
        host: prod-vm
        kind: vm
---
