---

victoria-metrics-k8s-stack:
  global:
    clusterLabel: homeserver
    cluster:
      dnsDomain: cluster.local.

  victoria-metrics-operator:
    enabled: true
    crds:
      plain: true
      cleanup:
        enabled: false
    admissionWebhooks:
      policy: Ignore
    operator:
      disable_prometheus_converter: false

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "15d"
      replicaCount: 1
      extraArgs:
        memory.allowedPercent: "60"
        maxConcurrentInserts: "16"
        relabelConfig: /etc/vm/configs/vmsingle-relabel/relabel.yml
      configMaps:
        - vmsingle-relabel
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
      nodeSelector:
        kubernetes.io/hostname: homeserver
      affinity: {}

  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      scrapeInterval: 30s
      externalLabels:
        cluster: homeserver
      extraArgs:
        promscrape.streamParse: "true"
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  vmalert:
    enabled: true
    spec:
      selectAllByDefault: true
      evaluationInterval: 30s

  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
      secrets:
        - alert-caller-token
        - n8n-webhook-token
    config:
      route:
        receiver: blackhole
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - matchers:
              - alertname="Watchdog"
            receiver: watchdog
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
          - matchers:
              - alertname="InfoInhibitor"
            receiver: blackhole
          - matchers:
              - page="true"
            receiver: phone
            repeat_interval: 15m
            continue: true
          - matchers:
              - alertname=~"InfoInhibitor|Watchdog"
            receiver: blackhole
          - matchers:
              - alertname="BananaPiAlarmmonitorDown"
            receiver: n8n-banana-pi-down
            continue: true
          - matchers:
              - severity="critical"
            receiver: ntfy
      receivers:
        - name: blackhole
        - name: watchdog
          webhook_configs:
            - url: 'http://alert-caller.alert-caller.svc.cluster.local:9310/watchdog'
              send_resolved: false
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/vm/secrets/alert-caller-token/token
            - url: 'http://100.123.214.4:9310/watchdog'
              send_resolved: false
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/vm/secrets/alert-caller-token/token
        - name: phone
          webhook_configs:
            - url: 'http://alert-caller.alert-caller.svc.cluster.local:9310/alert'
              send_resolved: false
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/vm/secrets/alert-caller-token/token
        - name: ntfy
          webhook_configs:
            - url: 'http://ntfy-bridge.ntfy-bridge.svc.cluster.local:8080/alert'
              send_resolved: false
        - name: n8n-banana-pi-down
          webhook_configs:
            - url: 'http://n8n.n8n.svc.cluster.local/webhook/banana-pi-down'
              send_resolved: false
              http_config:
                authorization:
                  type: Bearer
                  credentials_file: /etc/vm/secrets/n8n-webhook-token/token
      inhibit_rules:
        - target_matchers:
            - severity=~"warning|info"
          source_matchers:
            - severity=critical
          equal:
            - namespace
            - alertname


  defaultRules:
    create: true
    rules:
      TooHighMemoryUsage:
        spec:
          for: 15m
          labels:
            severity: warning
    groups:
      etcd:
        create: false
      kubeScheduler:
        create: false
      kubernetesSystemScheduler:
        create: false
      kubernetesSystemControllerManager:
        create: false

  defaultDashboards:
    enabled: true
    defaultTimezone: browser
    dashboards:
      node-exporter-full:
        enabled: true
      victoriametrics-vmalert:
        enabled: true
      victoriametrics-operator:
        enabled: true

  grafana:
    enabled: true
    defaultDashboardsTimezone: browser

    plugins:
      - victoriametrics-metrics-datasource
      - yesoreyeram-infinity-datasource
      - victoriametrics-logs-datasource
      - grafana-polystat-panel

    admin:
      existingSecret: "grafana-admin"

    rbac:
      create: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472

    initChownData:
      enabled: false

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    sidecar:
      datasources:
        enabled: true
        resource: configmap
        label: grafana_datasource
        labelValue: "1"
      dashboards:
        enabled: true
        resource: configmap
        label: grafana_dashboard
        labelValue: "1"
        folder: /var/lib/grafana/dashboards
        folderAnnotation: grafana_folder
        searchNamespace: monitoring,pacman
        provider:
          name: default
          orgid: 1
          foldersFromFilesStructure: true

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations: {}
      labels: {}
      path: /
      pathType: Prefix
      hosts:
        - grafana.tech.homeserver
        - grafana-tech.pke-lab.de
      tls: []

    vmScrape:
      enabled: true

    grafana.ini:
      server:
        domain: grafana-tech.pke-lab.de
        root_url: "https://grafana-tech.pke-lab.de"

  prometheus-node-exporter:
    enabled: true
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 2
    vmScrape:
      spec:
        jobLabel: jobLabel
        selector:
          matchLabels:
            app.kubernetes.io/name: '{{ include "prometheus-node-exporter.name" (index .Subcharts "prometheus-node-exporter") }}'
        endpoints:
          - port: metrics
            relabelConfigs:
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: host
              - target_label: kind
                replacement: server
            metricRelabelConfigs:
              - action: drop
                source_labels: [mountpoint]
                regex: "/var/lib/kubelet/pods.+"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  kubelet:
    enabled: true
  kubeApiServer:
    enabled: true
  coreDns:
    enabled: true

  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

alertCallerToken:
  enabled: true
  secretName: alert-caller-token
  encryptedData: ""

n8nWebhookToken:
  enabled: true
  secretName: n8n-webhook-token
  encryptedData: ""

dashboardApps:
  - { name: alamos-apager, namespace: alamos-apager, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: carplay-api, namespace: carplay-api, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: mediamtx, namespace: mediamtx, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: n8n, namespace: n8n, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: ollama, namespace: ollama, folder: "Anwendungen (TECH)", hasIngress: false }
  - { name: pacman, namespace: pacman, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: uptime-kuma, namespace: uptime-kuma, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: vaultwarden, namespace: vaultwarden, folder: "Anwendungen (TECH)", hasIngress: true }
  - { name: alert-caller, namespace: alert-caller, folder: "Plattform (TECH)", hasIngress: false }
  - { name: argo-workflows, namespace: argo-workflows, folder: "Plattform (TECH)", hasIngress: false }
  - { name: cert-manager, namespace: cert-manager, folder: "Plattform (TECH)", hasIngress: false }
  - { name: cloudflared, namespace: cloudflared, folder: "Plattform (TECH)", hasIngress: false }
  - { name: headlamp, namespace: headlamp, folder: "Plattform (TECH)", hasIngress: false }
  - { name: immich-storage, namespace: immich-storage, folder: "Plattform (TECH)", hasIngress: false }
  - { name: kubeseal-webgui, namespace: kubeseal-webgui, folder: "Plattform (TECH)", hasIngress: false }
  - { name: lldap, namespace: lldap, folder: "Plattform (TECH)", hasIngress: true }
  - { name: logging, namespace: logging, folder: "Plattform (TECH)", hasIngress: false }
  - { name: minio, namespace: minio, folder: "Plattform (TECH)", hasIngress: false }
  - { name: nas-storage, namespace: nas-storage, folder: "Plattform (TECH)", hasIngress: false }
  - { name: ntfy, namespace: ntfy, folder: "Plattform (TECH)", hasIngress: true }
  - { name: ntfy-bridge, namespace: ntfy-bridge, folder: "Plattform (TECH)", hasIngress: false }
  - { name: pihole, namespace: pihole, folder: "Plattform (TECH)", hasIngress: true }
  - { name: sealed-secrets, namespace: sealed-secrets, folder: "Plattform (TECH)", hasIngress: false }
  - { name: semaphore, namespace: semaphore, folder: "Plattform (TECH)", hasIngress: true }
