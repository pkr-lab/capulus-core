{{- if and .Values.resticBackup.enabled .Values.resticBackup.encryptedPassword }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.resticBackup.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  encryptedData:
    password: {{ .Values.resticBackup.encryptedPassword | quote }}
  template:
    metadata:
      name: {{ .Values.resticBackup.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
