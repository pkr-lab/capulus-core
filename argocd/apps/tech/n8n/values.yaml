---
replicaCount: 1

image:
  # Custom image with n8n-nodes-imap + wwebjs/Chromium baked in, see ./image/Dockerfile.
  # Gebaut/gepusht über .github/workflows/build-images.yml bei jeder
  # Änderung an image/Dockerfile (siehe argocd/apps/tech/pacman/README.md,
  # Abschnitt "Image bauen"). Tag manuell aus dem Workflow-Run-Summary
  # übernehmen.
  repository: ghcr.io/pkr-lab/n8n-custom
  pullPolicy: IfNotPresent
  tag: "sha-e580ac2"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: n8n.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: nas
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /home/node/.n8n

env:
  N8N_HOST: "n8n.prod.homeserver"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  WEBHOOK_URL: "http://n8n.prod.homeserver/"
  N8N_SECURE_COOKIE: "false"
  TZ: Europe/Berlin
  DB_TYPE: sqlite
  N8N_BASIC_AUTH_ACTIVE: "true"
  NODES_EXCLUDE: "[]"
  NODE_FUNCTION_ALLOW_EXTERNAL: "wwebjs,qrcode"
  N8N_RESTRICT_FILE_ACCESS_TO: "/data/xibosignage-inbox;/data/xibosignage-display"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

affinity: {}

nodeSelector: {}
tolerations: []

# ============================================================

xibosignage:
  enabled: true
  nfsServer: "192.168.178.97"
  inbox:
    nfsPath: "/volume1/k8s-storage/xibosignage-inbox"
    mountPath: /data/xibosignage-inbox
    size: 20Gi
  display:
    nfsPath: "/volume1/k8s-storage/xibosignage-display"
    mountPath: /data/xibosignage-display
    size: 20Gi
