---
replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/n8n-custom
  pullPolicy: IfNotPresent
  tag: "sha-55581ad"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
  hosts:
    - host: n8n.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: n8n-tech.pkr-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /home/node/.n8n

env:
  N8N_HOST: "n8n-tech.pkr-lab.de"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_EDITOR_BASE_URL: "https://n8n-tech.pkr-lab.de"
  WEBHOOK_URL: "https://n8n-tech.pkr-lab.de/"
  N8N_SECURE_COOKIE: "true"
  TZ: Europe/Berlin
  DB_TYPE: sqlite
  NODES_EXCLUDE: "[]"
  NODE_FUNCTION_ALLOW_BUILTIN: "child_process,crypto,fs,tls"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/homeserver-ca/homeserver-root-ca.pem"
  N8N_RESTRICT_FILE_ACCESS_TO: "/data/xibosignage-inbox;/data/xibosignage-display;/data/instagram-bilder"
  N8N_GRACEFUL_SHUTDOWN_TIMEOUT: "570"

secrets:
  enabled: true
  name: n8n-mattermost
  encryptedWebhookUrl: ""

secretEnv:
  MATTERMOST_NEWS_WEBHOOK_URL:
    secretName: n8n-mattermost
    secretKey: webhook-url

terminationGracePeriodSeconds: 600

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

affinity: {}

nodeSelector:
  kubernetes.io/hostname: homeserver
tolerations: []

resticBackup:
  enabled: true
  secretName: n8n-restic
  encryptedPassword: ""
  image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  schedule: "20 2 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 5Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

ollamaPc:
  enabled: true
  mountPath: /opt/ollama-pc
  env:
    OLLAMA_URL: "http://192.168.178.66:11434"
    OLLAMA_MODEL: "gemma3:27b-it-q8_0"
    OLLAMA_NUM_CTX: "16384"
    OLLAMA_TEMPERATURE: "0.3"
    OLLAMA_KEEP_ALIVE: "5m"
    OLLAMA_HEALTH_TIMEOUT_SECONDS: "3"
    OLLAMA_WAKE_MODE: "none"
    OLLAMA_WAKE_TIMEOUT_SECONDS: "120"
    OLLAMA_PRELOAD_TIMEOUT_SECONDS: "900"
    OLLAMA_REQUEST_TIMEOUT_SECONDS: "1200"
    OLLAMA_PROMPTS_DIR: "/opt/ollama-pc/prompts"
    OLLAMA_KNOWLEDGE_WARN_RATIO: "0.5"
    OLLAMA_KURSLINKS_FILE: "/opt/ollama-pc/knowledge-refs/kurslinks.json"

xibosignage:
  enabled: true
  nfsServer: "192.168.178.97"
  inbox:
    nfsPath: "/volume1/k8s-storage/xibosignage-inbox"
    mountPath: /data/xibosignage-inbox
    size: 20Gi
  display:
    nfsPath: "/volume1/k8s-storage/xibosignage-display"
    mountPath: /data/xibosignage-display
    size: 20Gi

instagram:
  enabled: true
  publicHost: instagram-bilder-prod.pkr-lab.de
  publicPath: /webhook/instagram-bild
  bilder:
    mountPath: /data/instagram-bilder
    sizeLimit: 512Mi
  # Webhook für Instagram-Direktnachrichten (Workflow instagram-dm-antworten). Gleicher Host wie die Bild-URL.
  dm:
    enabled: true
    publicPath: /webhook/instagram-dm
