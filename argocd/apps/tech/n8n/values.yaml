---
replicaCount: 1

image:
  repository: ghcr.io/pkr-lab/n8n-custom
  pullPolicy: IfNotPresent
  tag: "sha-6f3c34f"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5678

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: n8n.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /home/node/.n8n

env:
  N8N_HOST: "n8n.prod.homeserver"
  N8N_PORT: "5678"
  N8N_PROTOCOL: "http"
  N8N_EDITOR_BASE_URL: "https://n8n.prod.homeserver"
  WEBHOOK_URL: "https://n8n.prod.homeserver/"
  N8N_SECURE_COOKIE: "true"
  TZ: Europe/Berlin
  DB_TYPE: sqlite
  NODES_EXCLUDE: "[]"
  NODE_FUNCTION_ALLOW_BUILTIN: "child_process,crypto,tls"
  N8N_RESTRICT_FILE_ACCESS_TO: "/data/xibosignage-inbox;/data/xibosignage-display;/data/instagram-bilder"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

affinity: {}

nodeSelector:
  kubernetes.io/hostname: homeserver
tolerations: []

resticBackup:
  enabled: true
  secretName: n8n-restic
  encryptedPassword: ""
  image: alpine:3.24
  schedule: "20 2 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 5Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

xibosignage:
  enabled: true
  nfsServer: "192.168.178.97"
  inbox:
    nfsPath: "/volume1/k8s-storage/xibosignage-inbox"
    mountPath: /data/xibosignage-inbox
    size: 20Gi
  display:
    nfsPath: "/volume1/k8s-storage/xibosignage-display"
    mountPath: /data/xibosignage-display
    size: 20Gi

instagram:
  enabled: true
  publicHost: instagram-bilder-prod.pke-lab.de
  publicPath: /webhook/instagram-bild
  bilder:
    mountPath: /data/instagram-bilder
    sizeLimit: 512Mi
