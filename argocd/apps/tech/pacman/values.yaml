fullnameOverride: "pacman"

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/pkr-lab/pacman
  tag: "sha-852d58c3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: pacman-prod.pkr-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

geoip:
  enabled: true
  updaterImage:
    repository: curlimages/curl
    tag: "8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93"

config:
  trustedProxyCidrs: "10.42.0.0/16"
  rateLimitPerMinute: 60

trainingMode:
  enabled: true

nodeSelector: {}

tolerations:
  - key: capulus.homeserver/protected
    operator: Exists
    effect: PreferNoSchedule
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - controlplane-1
