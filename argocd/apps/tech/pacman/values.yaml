fullnameOverride: "pacman"

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

image:
  repository: ghcr.io/pkr-lab/pacman
  tag: "sha-e399f22"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: pacman-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

geoip:
  enabled: true
  updaterImage:
    repository: curlimages/curl
    tag: "8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac"

config:
  trustedProxyCidrs: "10.42.0.0/16"
  rateLimitPerMinute: 60

trainingMode:
  enabled: true
