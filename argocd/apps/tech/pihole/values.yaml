---
replicaCount: 1

image:
  repository: pihole/pihole
  pullPolicy: IfNotPresent
  tag: "2026.07.2"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW

service:
  type: ClusterIP
  port: 80
  targetPort: 80

dnsService:
  type: NodePort
  port: 53
  nodePort: 30053

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pihole.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /etc/pihole

adminSecret:
  enabled: true
  secretName: pihole-webpassword
  encryptedPassword: ""

config:
  timezone: "Europe/Berlin"
  dnsUpstreams: "192.168.178.1"
  dnsListeningMode: "all"

extraEnv: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
