---
sealed-secrets:
  fullnameOverride: sealed-secrets-controller

  image:
    registry: docker.io
    repository: bitnami/sealed-secrets-controller
    tag: "0.39.1"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 150m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  podSecurityContext:
    enabled: true
    fsGroup: 65534

  containerSecurityContext:
    enabled: true
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

  rbac:
    create: true
    clusterRole: true

  serviceAccount:
    create: true
