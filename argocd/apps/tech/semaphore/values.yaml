---

replicaCount: 1

image:
  repository: semaphoreui/semaphore
  pullPolicy: IfNotPresent
  tag: "v2.19.16@sha256:3707a971a57fdc5ac99a184bf83f2efb7d00cbeec8fb08a16a8028f77229e141"

nameOverride: ""
fullnameOverride: ""

scheduleTimezone: "Europe/Berlin"

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: semaphore.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressApi:
  enabled: true
  host: semaphore-api.tech.homeserver

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

bootstrapSecretName: semaphore-bootstrap

vaultPasswordMountDir: /var/run/semaphore-secrets
