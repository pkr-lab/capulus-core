---

replicaCount: 1

image:
  repository: semaphoreui/semaphore
  pullPolicy: IfNotPresent
  tag: "v2.20.23@sha256:00e6733dbca9a2bddf77e048f34f9002027c8a6f549a8cde18d13101e84a19c3"

nameOverride: ""
fullnameOverride: ""

scheduleTimezone: "Europe/Berlin"

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: semaphore.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressApi:
  enabled: true
  host: semaphore-api.tech.homeserver

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

bootstrapSecretName: semaphore-bootstrap

vaultPasswordMountDir: /var/run/semaphore-secrets
