{{- if .Values.secrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticket-gate.labels" . | nindent 4 }}
spec:
  encryptedData:
    HMAC_SECRET: {{ .Values.secrets.encryptedHmacSecret | quote }}
    SMTP_PASSWORD: {{ .Values.secrets.encryptedSmtpPassword | quote }}
    ZAMMAD_TOKEN: {{ .Values.secrets.encryptedZammadToken | quote }}
  template:
    metadata:
      name: {{ .Values.secrets.name }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
