apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        entryPoint: metrics
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
    ports:
      metrics:
        port: 9100
        expose:
          default: false
        protocol: TCP
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
