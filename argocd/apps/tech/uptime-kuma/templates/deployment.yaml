apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-kuma.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uptime-kuma.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uptime-kuma.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uptime-kuma.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "uptime-kuma.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.restore.enabled .Values.resticBackup.enabled .Values.persistence.enabled }}
      initContainers:
        - name: restore
          image: {{ .Values.restore.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -e /data/kuma.db ]; then
                echo "kuma.db vorhanden, kein Restore"
                exit 0
              fi
              echo "keine kuma.db, stelle aus dem Restic-Backup wieder her"
              restic --no-lock restore latest --host "$BACKUP_HOST" --tag "$BACKUP_TAG" \
                --target /restore --exclude /sources/data/error.log
              test -s /restore/stage/data/kuma.db
              cp -a /restore/sources/data/. /data/
              cp -a /restore/stage/data/kuma.db /data/kuma.db
              echo "Restore fertig"
          env:
            - name: RESTIC_REPOSITORY
              value: /repo
            - name: RESTIC_CACHE_DIR
              value: /cache
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.resticBackup.secretName }}
                  key: password
            - name: BACKUP_HOST
              value: {{ include "uptime-kuma.fullname" . | quote }}
            - name: BACKUP_TAG
              value: {{ include "uptime-kuma.fullname" . | quote }}
          resources:
            {{- toYaml .Values.restore.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: restic-repo
              mountPath: /repo
              readOnly: true
            - name: restore-tmp
              mountPath: /restore
            - name: restore-cache
              mountPath: /cache
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: homeserver-ca
              mountPath: /etc/ssl/homeserver-ca
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "uptime-kuma.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: homeserver-ca
          configMap:
            name: {{ include "uptime-kuma.fullname" . }}-ca
        {{- if and .Values.restore.enabled .Values.resticBackup.enabled .Values.persistence.enabled }}
        - name: restic-repo
          persistentVolumeClaim:
            claimName: {{ include "uptime-kuma.fullname" . }}-restic
            readOnly: true
        - name: restore-tmp
          emptyDir: {}
        - name: restore-cache
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
