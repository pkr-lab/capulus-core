---
replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  tag: "2.5.7@sha256:4b95dbe7ac5343b768f8e04e3035ccd59997872b1a35ab9b0f082d2cc279070e"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false

env:
  PUID: "1000"
  PGID: "1000"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/homeserver-ca/homeserver-root-ca.pem"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
  hosts:
    - host: uptime-kuma.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressPublic:
  enabled: true
  host: status-prod.pkr-lab.de
  corsOrigins:
    - https://www.pkr-docs.de
    - https://pkr-docs.de

ingressNative:
  enabled: true
  host: uptime-kuma-native.prod.homeserver

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resticBackup:
  enabled: true
  secretName: uptime-kuma-restic
  encryptedPassword: ""
  schedule: "50 2 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 2Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity: {}

nodeSelector:
  kubernetes.io/hostname: controlplane-1
tolerations:
  - key: capulus.homeserver/protected
    operator: Exists
    effect: PreferNoSchedule
