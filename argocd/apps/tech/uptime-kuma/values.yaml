---
replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  tag: "2.5.12@sha256:8e4b6bef96417ec98a35dc103c99cc64fc229a01e584e56d95d9004d2003c02a"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false

env:
  PUID: "1000"
  PGID: "1000"
  NODE_EXTRA_CA_CERTS: "/etc/ssl/homeserver-ca/homeserver-root-ca.pem"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: uptime-kuma.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

ingressPublic:
  enabled: true
  host: status-prod.pkr-lab.de
  corsOrigins:
    - https://www.pkr-docs.de
    - https://pkr-docs.de

ingressNative:
  enabled: true
  host: uptime-kuma-native.prod.homeserver

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resticBackup:
  enabled: true
  secretName: uptime-kuma-restic
  encryptedPassword: ""
  schedule: "50 2 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 2Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Stellt kuma.db und die uebrigen Daten aus dem letzten Restic-Backup wieder
# her, wenn /app/data noch keine kuma.db enthaelt (leeres PVC, z. B. nach
# Knotenverlust). Braucht resticBackup.enabled; das Repo wird nur lesend
# eingehangen (restic --no-lock). Ein Pod-Neustart mit vorhandener kuma.db
# fasst nichts an.
restore:
  enabled: true
  image: "restic/restic:0.20.0@sha256:93999df80d4ac6cb148e82d2ef1fe6a81996f17ff535e772723538211b31555a"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity: {}

# Kein fester Knoten mehr: Die Daten liegen auf einem local-path-PVC, das beim
# ersten Start auf dem Knoten angelegt wird, auf dem der Pod landet. Ist der
# Knoten dauerhaft weg, PVC loeschen -> der Init-Container "restore" holt den
# letzten Stand aus dem Restic-Backup (siehe restore.* oben).
nodeSelector: {}
tolerations:
  - key: capulus.homeserver/protected
    operator: Exists
    effect: PreferNoSchedule
