{{- if and .Values.ingress.enabled .Values.adminRestriction.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "vaultwarden.fullname" . }}-admin-nur-intern
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.adminRestriction.sourceRange | nindent 6 }}
{{- end }}
