{{- if and .Values.resticBackup.enabled .Values.resticBackup.encryptedPassword -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vaultwarden.fullname" . }}-restic-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.resticBackup.schedule | quote }}
  timeZone: {{ .Values.backup.timezone | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "vaultwarden.selectorLabels" . | nindent 8 }}
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "vaultwarden.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: "{{ .Values.backup.image }}"
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTIC_REPOSITORY
                  value: /repo
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.resticBackup.secretName }}
                      key: password
              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache sqlite restic >/dev/null
                  sqlite3 -readonly /source/db.sqlite3 ".backup '/stage/db.sqlite3'"
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /stage /source --host vaultwarden --tag vaultwarden \
                    --exclude '/source/db.sqlite3*' --exclude '/source/icon_cache' --exclude '/source/tmp'
                  restic forget --host vaultwarden --keep-daily {{ .Values.resticBackup.keepDaily }} --keep-weekly {{ .Values.resticBackup.keepWeekly }} --keep-monthly {{ .Values.resticBackup.keepMonthly }} --prune
                  restic check --read-data-subset=5%
                  echo "fertig: $(date -Iseconds)"
              resources:
                {{- toYaml .Values.resticBackup.resources | nindent 16 }}
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: repo
                  mountPath: /repo
                - name: stage
                  mountPath: /stage
                - name: cache
                  mountPath: /cache
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: {{ include "vaultwarden.fullname" . }}-data
            - name: repo
              persistentVolumeClaim:
                claimName: {{ include "vaultwarden.fullname" . }}-restic
            - name: stage
              emptyDir: {}
            - name: cache
              emptyDir: {}
{{- end }}
