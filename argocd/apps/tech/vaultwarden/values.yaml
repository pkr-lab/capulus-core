---
replicaCount: 1

image:
  repository: vaultwarden/server
  pullPolicy: IfNotPresent
  tag: "1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: vault.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: vault-tech.pkr-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

adminRestriction:
  enabled: true
  hosts:
    - vault-tech.pkr-lab.de
  sourceRange:
    - 192.168.178.0/24
    - 100.64.0.0/10

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /data

env:
  DOMAIN: "https://vault-tech.pkr-lab.de"
  WEBSOCKET_ENABLED: "true"
  SIGNUPS_ALLOWED: "false"
  INVITATIONS_ALLOWED: "true"
  TZ: Europe/Berlin
  SMTP_HOST: mxe9f8.netcup.net
  SMTP_PORT: "465"
  SMTP_SECURITY: force_tls
  SMTP_FROM_NAME: Vaultwarden

adminSecret:
  enabled: true
  secretName: vaultwarden-admin
  encryptedAdminToken: ""

smtpSecret:
  enabled: true
  secretName: vaultwarden-smtp
  encryptedSmtpPassword: ""
  encryptedSmtpUsername: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

resticBackup:
  enabled: true
  secretName: vaultwarden-restic
  encryptedPassword: ""
  schedule: "10 2 * * *"
  storageClassName: nas
  size: 5Gi
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

backup:
  enabled: true
  schedule: "30 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: nas
  size: 2Gi
  image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
