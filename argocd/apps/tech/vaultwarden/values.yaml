---
replicaCount: 1

image:
  repository: vaultwarden/server
  pullPolicy: IfNotPresent
  tag: "1.37.3"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: vault.tech.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: vault-tech.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /data

env:
  DOMAIN: "https://vault-tech.pke-lab.de"
  WEBSOCKET_ENABLED: "true"
  SIGNUPS_ALLOWED: "false"
  INVITATIONS_ALLOWED: "true"
  TZ: Europe/Berlin
  SMTP_HOST: mxe9f8.netcup.net
  SMTP_PORT: "465"
  SMTP_SECURITY: force_tls
  SMTP_FROM: info@edv-kretzer.de
  SMTP_FROM_NAME: Vaultwarden
  SMTP_USERNAME: info@edv-kretzer.de

adminSecret:
  enabled: true
  secretName: vaultwarden-admin
  encryptedAdminToken: ""

smtpSecret:
  enabled: true
  secretName: vaultwarden-smtp
  encryptedSmtpPassword: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

backup:
  enabled: true
  schedule: "30 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  storageClassName: nas
  size: 2Gi
  image: alpine:3.24
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
