{{- if .Values.formSperre.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zammad-form-sperre
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zammad-wrapper.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- toYaml .Values.formSperre.sourceRange | nindent 6 }}
{{- end }}
