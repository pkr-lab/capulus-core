{{- if .Values.resticBackup.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  name: zammad-restic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zammad-wrapper.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.resticBackup.size }}
  storageClassName: {{ .Values.resticBackup.storageClassName }}
{{- end }}
