---

secrets:
  enabled: true
  name: zammad-secrets
  encryptedPostgresPass: ""
  encryptedPostgresPassword: ""
  encryptedRedisPassword: ""

zammad:
  ingress:
    enabled: true
    className: traefik
    replicas: 1
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    hosts:
      - host: zammad.tech.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: support-tech.pke-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  secrets:
    postgresql:
      useExisting: true
      secretKey: postgresql-pass
      secretName: zammad-secrets
    redis:
      useExisting: true
      secretKey: redis-password
      secretName: zammad-secrets

  zammadConfig:
    initJob:
      randomName: false

    elasticsearch:
      enabled: false
      initialisation: false

    memcached:
      enabled: true

    postgresql:
      enabled: true
      db: zammad_production
      user: zammad
      pass: ""

    redis:
      enabled: true
      pass: ""

    storageVolume:
      enabled: false

    nginx:
      replicas: null
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

    railsserver:
      replicas: null
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    scheduler:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1.5Gi

    websocket:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    initContainers:
      zammad:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
      postgresql:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi

  postgresql:
    enabled: true
    auth:
      username: zammad
      database: zammad_production
      existingSecret: zammad-secrets
      secretKeys:
        userPasswordKey: postgresql-password
    volumePermissions:
      enabled: true
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        size: 50Gi
      nodeSelector:
        kubernetes.io/hostname: homeserver
      affinity: {}
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  redis:
    auth:
      enabled: true
      existingSecret: zammad-secrets
      existingSecretPasswordKey: redis-password
    updateStrategy:
      rollingUpdate:
        maxUnavailable: null
    persistence:
      storageClass: nas
      size: 8Gi
    affinity: {}
