---

secrets:
  enabled: true
  name: zammad-secrets
  encryptedPostgresPass: ""
  encryptedPostgresPassword: ""
  encryptedRedisPassword: ""

resticBackup:
  enabled: true
  secretName: zammad-restic
  encryptedPassword: ""
  schedule: "0 3 * * *"
  timezone: "Europe/Berlin"
  storageClassName: nas
  size: 10Gi
  postgres:
    host: zammad-postgresql
    user: zammad
    database: zammad_production
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 6
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

schedulerRestart:
  enabled: true
  schedule: "30 4 * * 0"
  timezone: "Europe/Berlin"
  image: alpine/k8s:1.30.14
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

formSperre:
  enabled: true
  hosts:
    - support-tech.pkr-lab.de
  paths:
    - /api/v1/form_submit
    - /api/v1/form_config
  sourceRange:
    - 127.0.0.1/32

zammad:
  ingress:
    enabled: true
    className: traefik
    replicas: 1
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
    hosts:
      - host: zammad.tech.homeserver
        paths:
          - path: /
            pathType: Prefix
      - host: support-tech.pkr-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  secrets:
    postgresql:
      useExisting: true
      secretKey: postgresql-pass
      secretName: zammad-secrets
    redis:
      useExisting: true
      secretKey: redis-password
      secretName: zammad-secrets

  zammadConfig:
    initJob:
      randomName: false

    elasticsearch:
      enabled: false
      initialisation: false

    memcached:
      enabled: true

    postgresql:
      enabled: true
      db: zammad_production
      user: zammad
      pass: ""

    redis:
      enabled: true
      pass: ""

    storageVolume:
      enabled: false

    nginx:
      replicas: null
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

    railsserver:
      replicas: null
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    scheduler:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 2.5Gi

    websocket:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    initContainers:
      zammad:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
      postgresql:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumePermissions:
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false

  postgresql:
    enabled: true
    auth:
      username: zammad
      database: zammad_production
      existingSecret: zammad-secrets
      secretKeys:
        userPasswordKey: postgresql-password
    volumePermissions:
      enabled: true
    primary:
      persistence:
        enabled: true
        storageClass: local-path
        size: 50Gi
      nodeSelector:
        kubernetes.io/hostname: homeserver
      affinity: {}
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  redis:
    auth:
      enabled: true
      existingSecret: zammad-secrets
      existingSecretPasswordKey: redis-password
    updateStrategy:
      rollingUpdate:
        maxUnavailable: null
    persistence:
      storageClass: nas
      size: 8Gi
    affinity: {}
