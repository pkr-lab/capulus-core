apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinyteller.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # Das Frontend-Image (ghcr.io/jaydee94/tiny-teller-frontend) hat den
    # Upstream-Host "backend" fest in seiner nginx-Config (Docker-Compose-
    # Erbe). Dieser Service existiert nur, damit "backend" innerhalb des
    # Namespace per DNS aufloest -- kein eigenstaendiger Endpoint, zeigt auf
    # dieselben Pods wie der eigentliche "{{ include "tinyteller.fullname" . }}-backend"-Service.
    reason: "nginx upstream 'backend' DNS-Alias, siehe Kommentar oben"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tinyteller.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
