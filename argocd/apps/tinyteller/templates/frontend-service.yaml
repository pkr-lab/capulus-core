apiVersion: v1
kind: Service
metadata:
  name: {{ include "tinyteller.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tinyteller.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tinyteller.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
