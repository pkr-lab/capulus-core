---
replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  tag: "1.23.15"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: uptime-kuma.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity: {}

# local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
# wird — fest auf homeserver, damit es nicht vom Scheduler zufällig auf
# worker-0/worker-1 landet (docs/16-nas-storage.md → Migrations-Notiz).
nodeSelector:
  kubernetes.io/hostname: homeserver
tolerations: []
