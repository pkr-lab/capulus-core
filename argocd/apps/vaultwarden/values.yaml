---
replicaCount: 1

image:
  repository: vaultwarden/server
  pullPolicy: IfNotPresent
  # Pinned für Reproduzierbarkeit. Releases:
  # https://github.com/dani-garcia/vaultwarden/releases
  tag: "1.36.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Das offizielle vaultwarden-Image läuft als root (kein USER im Dockerfile) —
# anders als n8n/gotify kann hier kein runAsNonRoot gesetzt werden.
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: traefik
  # Bewusst KEIN Authentik-ForwardAuth vor Vaultwarden: die Bitwarden-Apps/
  # Browser-Erweiterungen sprechen direkt die API an (Master-Passwort + eigenes
  # 2FA übernehmen die Absicherung) — ein ForwardAuth-Redirect vor der API
  # würde Login/Sync der Clients brechen.
  annotations: {}
  hosts:
    - host: vault.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  # Bewusst auf "local-path" (Homeserver-System-SSD) belassen — ein Umzug
  # auf die NFS-"nas"-StorageClass wurde erwogen, aber verworfen: das NAS
  # erzwingt inzwischen all_squash (kein no_root_squash mehr verfügbar,
  # siehe docs/16-nas-storage.md), worunter chmod/chown-lastige Container
  # leiden. Vaultwarden selbst braucht das zwar nicht, aber die tägliche
  # Sicherung unten (backup-cronjob.yaml) spiegelt die Daten stattdessen
  # regelmäßig auf die NAS — bestes aus beiden Welten: schnelle lokale
  # SSD im Betrieb, Redundanz auf dem NAS (und von dort per restic weiter
  # auf die externe USB-Platte, siehe docs/36-nas-backup.md).
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /data

env:
  # Öffentliche Basis-URL — wird von Vaultwarden für Links (E-Mails, Icons,
  # U2F/WebAuthn-Origin-Check) genutzt. Muss zur extern erreichbaren Domain
  # passen (siehe argocd/apps/cloudflared/values.yaml).
  DOMAIN: "https://vault.pke-lab.de"
  # Seit Vaultwarden 1.30 läuft der Websocket-Server auf demselben Port wie
  # die HTTP-API — kein separater Port/Service nötig.
  WEBSOCKET_ENABLED: "true"
  # Nach dem Anlegen des eigenen Accounts (siehe docs/32-vaultwarden.md)
  # auf "false" setzen, damit der Server nicht offen für neue Registrierungen
  # im Internet steht.
  SIGNUPS_ALLOWED: "true"
  # Deaktiviert die (ohnehin meist ungenutzte) öffentliche Organisations-
  # Registrierung.
  INVITATIONS_ALLOWED: "true"
  TZ: Europe/Berlin

# Admin-Token für die /admin-Oberfläche, aus dem SealedSecret in
# templates/sealedsecret.yaml. Siehe docs/32-vaultwarden.md für den
# kubeseal-Workflow, der `encryptedAdminToken` unten befüllt.
adminSecret:
  enabled: true
  secretName: vaultwarden-admin
  # Generiert mit (Argon2-Hash empfohlen statt Klartext-Token):
  #   docker run --rm vaultwarden/server:1.36.0 /vaultwarden hash
  #   echo -n '<PHC-Hash-aus-obigem-Befehl>' \
  #     | kubeseal --raw --namespace vaultwarden --name vaultwarden-admin \
  #         --controller-namespace sealed-secrets \
  #         --controller-name sealed-secrets-controller --from-file=/dev/stdin
  encryptedAdminToken: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================
# Tägliche Sicherung der lokalen Vaultwarden-Daten auf die NAS
# ============================================================
# Läuft VOR dem täglichen restic-Lauf auf dem NAS selbst (02:00 Uhr,
# siehe docs/36-nas-backup.md), damit dieser eine frische Kopie snapshotet.
# db.sqlite3 läuft im WAL-Modus — ein simpler Dateikopie wäre inkonsistent,
# daher `sqlite3 .backup` (nutzt SQLites eigene Online-Backup-API, sicher
# gegen einen parallel schreibenden Vaultwarden-Prozess). Restliche Dateien
# (rsa_key.pem, Attachments, Sends) werden per rsync gespiegelt.
backup:
  enabled: true
  schedule: "30 1 * * *"
  timezone: "Europe/Berlin"
  suspend: false
  # Ziel-PVC auf der NAS — eigene, kleine PVC statt die Files direkt in
  # nextcloud-artige Storage-Pfade zu mischen.
  storageClassName: nas
  size: 2Gi
  image: alpine:3.20
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
