---
apiVersion: v2
name: immich
description: |
  Immich — Foto-/Video-Backup vom Handy (Google-Photos-Ersatz) inkl.
  Gesichtserkennung und Timeline. Eigene PostgreSQL- (mit VectorChord-
  Extension für die KI-Ähnlichkeitssuche) und Redis-Instanzen. Sämtliche
  Persistenz (Fotobibliothek, Postgres, ML-Modell-Cache) liegt auf der
  dedizierten "immich-nas"-StorageClass (/volume2/immich-storage,
  getrennt vom generischen "nas"-Export k3s-storage — siehe
  docs/35-immich.md und argocd/apps/platform/immich-storage/).

  Web-Interface:
    http://immich.prod.homeserver
    https://immich-prod.pke-lab.de (Cloudflare Tunnel — nötig für Handy-
    Auto-Backup außerhalb von LAN/Tailscale)

  Komponenten:
    - immich-server (ghcr.io/immich-app/immich-server)
    - immich-machine-learning (Gesichtserkennung, CLIP-Suche)
    - PostgreSQL 14 + VectorChord (ghcr.io/immich-app/postgres)
    - Valkey/Redis (Job-Queue)
type: application
version: 0.1.0
appVersion: "v3.1.0"
keywords:
  - immich
  - photos
  - backup
  - media
home: https://immich.app
sources:
  - https://github.com/immich-app/immich
maintainers:
  - name: home-server-admin
