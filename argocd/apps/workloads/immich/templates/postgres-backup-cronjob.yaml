{{- if .Values.backup.enabled -}}
# pg_dump-Backup auf die NAS — Muster wie
# argocd/apps/platform/authentik/templates/postgres-backup-cronjob.yaml.
# Ergaenzt (nicht ersetzt) das Datei-Level-Restic-Backup von immich-nas
# (docs/2-betrieb-hardware/20010-nas-backup.md) um einen transaktions-
# konsistenten Dump, der sich auch einzeln zurueckspielen laesst.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "immich.fullname" . }}-postgres-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "immich.postgresql.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timezone | quote }}
  suspend: {{ .Values.backup.suspend }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.name }}
                      key: db-password
              command:
                - sh
                - -c
                - |
                  set -eu
                  DATE=$(date +%Y%m%d-%H%M%S)
                  # Frisch gestartete Pods koennen die ersten Sekunden nach
                  # dem Start noch keine Cross-Pod-Service-Verbindung
                  # aufbauen (Netzwerk-Startup-Race, reproduzierbar
                  # beobachtet am 2026-09-18, siehe docs/4-planung/40080).
                  # Auf Erreichbarkeit warten statt sofort zu verbinden.
                  for i in $(seq 1 15); do
                    pg_isready -h {{ include "immich.postgresql.fullname" . }} -U {{ .Values.postgresql.username }} && break
                    sleep 2
                  done
                  pg_dump -h {{ include "immich.postgresql.fullname" . }} \
                    -U {{ .Values.postgresql.username }} \
                    -d {{ .Values.postgresql.database }} \
                    -F c -f "/backup/immich-${DATE}.dump"
                  # Nur die letzten 7 Dumps behalten (groesser als bei
                  # Authentik/Vaultwarden - die Immich-DB ist deutlich
                  # groesser, siehe docs/4-planung/40080-multi-cluster-entw-prod-tech.md).
                  cd /backup && ls -1t immich-*.dump | tail -n +8 | xargs -r rm --
                  echo "==> fertig: $(date -Iseconds)"
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "immich.fullname" . }}-postgres-backup
{{- end }}
