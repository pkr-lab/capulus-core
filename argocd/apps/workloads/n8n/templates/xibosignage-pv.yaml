{{- if .Values.xibosignage.enabled -}}
# Statische NFS-PVs mit FESTEM Pfad auf dem UGREEN NAS (statt dynamisch vom
# nfs-subdir-external-provisioner vergeben) — siehe docs/44-xibosignage.md
# und docs/16-nas-storage.md ("Fixer Pfad statt dynamischer Subdir-Name").
# Der feste Pfad ist Voraussetzung dafür, dass sowohl n8n (dieser Mount),
# der Raspberry-Pi-Kiosk (ansible/roles/xibo_kiosk, per rohem NFS-Mount)
# als auch die vom Nutzer selbst eingerichtete OnlineSync denselben Ordner
# ansprechen können — eine dynamisch vom Provisioner benannte PVC-
# Unterverzeichnis-ID wäre dafür nicht vorhersagbar.
#
# "xibosignage-inbox": OnlineSync legt hier Rohdateien ab, n8n verarbeitet
# (Resize) und verschiebt sie in "xibosignage-display".
# "xibosignage-display": wird vom Pi-Kiosk read-only per NFS gemountet und
# per Slideshow angezeigt.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xibosignage-inbox-pv
  labels:
    app.kubernetes.io/part-of: xibosignage
spec:
  capacity:
    storage: {{ .Values.xibosignage.inbox.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: {{ .Values.xibosignage.nfsServer }}
    path: {{ .Values.xibosignage.inbox.nfsPath }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xibosignage-display-pv
  labels:
    app.kubernetes.io/part-of: xibosignage
spec:
  capacity:
    storage: {{ .Values.xibosignage.display.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: {{ .Values.xibosignage.nfsServer }}
    path: {{ .Values.xibosignage.display.nfsPath }}
{{- end }}
