{{- if .Values.nextcloud.ingressNative.enabled }}
# Bypass-Ingress ohne ForwardAuth — Ziel des "Native Anmeldung"-Links,
# zwingend für Desktop-/Mobile-Sync-Clients. Siehe
# docs/d-sicherheit/d0071-native-login-fallback.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nextcloud.fullname" . }}-native
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  {{- if .Values.nextcloud.ingress.className }}
  ingressClassName: {{ .Values.nextcloud.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.nextcloud.ingressNative.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nextcloud.fullname" . }}
                port:
                  name: http
{{- end }}
