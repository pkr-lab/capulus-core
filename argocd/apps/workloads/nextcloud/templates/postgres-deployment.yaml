apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud.postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nextcloud.postgresql.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Pflicht bei RWO-PVCs: kein zweiter Pod darf parallel auf dasselbe
  # Volume zugreifen, während der alte noch terminiert.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nextcloud.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      # Siehe docs/20-wikijs.md — als UID/GID 999 direkt starten, damit der
      # interne chown-Fixup übersprungen wird (scheitert sonst auf dem
      # NFS-Mount der "nas"-StorageClass).
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.persistence.enabled }}
      # local-path legt das Volume-Verzeichnis als root:root (0777) an — fsGroup
      # setzt nur die Gruppe, nicht den Owner. Der Container läuft direkt als
      # UID/GID 999 (siehe Kommentar oben), der eigene chmod-Fixup von Postgres
      # scheitert daher mit "Operation not permitted" (chmod braucht Owner-Match).
      # Fix: einmalig als root vorab chownen.
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 999:999 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.username | quote }}
                - -d
                - {{ .Values.postgresql.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.username | quote }}
                - -d
                - {{ .Values.postgresql.database | quote }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nextcloud.postgresql.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
