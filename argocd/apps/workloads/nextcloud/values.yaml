---
# ============================================================
# Nextcloud — wrapper values
#
# Secrets-Block (SealedSecret):
#   DB- und Admin-Passwort mit kubeseal versiegeln und hier eintragen.
#   Anleitung: docs/3-apps-workloads/300b0-nextcloud.md → Abschnitt "Secrets versiegeln"
# ============================================================

secrets:
  enabled: true
  name: nextcloud-secrets
  # Versiegeln (zwei Keys, ein Secret):
  #   echo -n 'DB_PASSWORT' | kubeseal --raw --namespace nextcloud \
  #     --name nextcloud-secrets --controller-namespace sealed-secrets \
  #     --controller-name sealed-secrets-controller
  # kubeseal --raw erlaubt nur EINEN Key pro Aufruf — siehe docs/3-apps-workloads/300b0-nextcloud.md
  # für den vollständigen Multi-Key-Workflow (--merge-into).
  encryptedDbPassword: ""
  encryptedAdminPassword: ""

# ============================================================
# Nextcloud App
# ============================================================
nextcloud:
  # Nur wirksam solange autoscaling.enabled=false ist (siehe unten) —
  # danach übernimmt der HPA die Replica-Anzahl.
  replicaCount: 1

  # Mehrere App-Pods sind hier — trotz ReadWriteOnce html/data-PVCs (siehe
  # persistence unten) — sicher: Nextcloud nutzt das eigene Redis (siehe
  # redis-Block unten, per REDIS_HOST-Env in templates/nextcloud-deployment.yaml
  # verdrahtet) für verteiltes Datei-Locking. Solange der Storage geteilt UND
  # das Locking extern (Redis) ist, unterstützt Nextclouds Architektur
  # mehrere Web/App-Pods gleichzeitig. Die PVCs bleiben trotzdem RWO/NFS —
  # daher zusätzlich podAffinity (siehe templates/nextcloud-deployment.yaml),
  # damit alle Replicas auf demselben Node laufen.
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

  image:
    repository: nextcloud
    pullPolicy: IfNotPresent
    # ACHTUNG — NICHT ungeprüft hochziehen, siehe Kommentar unten:
    # tatsächlich auf der PVC installierte Version ist 34.0.2.1
    # (verifiziert per `require version.php; implode(".", $OC_Version)`
    # gegen die echte "html"-PVC, 2026-08-17). Ein Tag-Wechsel auf eine
    # andere Version löst beim nächsten Pod-Start Nextclouds Upgrade-Pfad
    # aus — und der ist auf dieser NAS aktuell fatal, s.u.
    #
    # ROLLBACK 2026-08-30: Renovate-PR #201 hat den Tag trotz dieser
    # Warnung auf 34.0.3-apache angehoben (automatisierter Merge, Kommentar
    # hier wurde dabei nicht gelesen) — Pod ging exakt in den unten
    # beschriebenen endlosen CrashLoopBackOff. Zurückgesetzt auf 34.0.2-apache,
    # passend zur echten PVC-Version, bis ein sicherer Upgrade-Weg (s.u.
    # "Andere Lösung"/S3-Storage) existiert.
    tag: "34.0.2-apache"

  # Offizielles Apache-Image läuft als root (kein USER im Dockerfile,
  # Apache-Master-Prozess braucht Port 80). Analog zu Vaultwarden kein
  # runAsNonRoot.
  #
  # ACHTUNG (Stand 2026-07-26, überholt): Der Kommentar hier lautete
  # früher, die "nas"-StorageClass sei mit no_root_squash exportiert und
  # root-Schreibzugriff funktioniere daher — das NAS erzwingt inzwischen
  # all_squash (kein no_root_squash mehr verfügbar), auch root-Requests
  # werden gesquasht.
  #
  # WICHTIG (Stand 2026-08-17): all_squash macht insbesondere **Image-
  # Versions-Upgrades auf dieser NAS aktuell unmöglich**, nicht nur
  # einzelne Dateizugriffe. Ursache: der offizielle Entrypoint wählt seine
  # rsync-Optionen für den App-Code-Sync anhand von `id -u`: als root
  # `-rlDog --chown www-data:www-data` (versucht Owner/Group auf JEDER
  # einzelnen der tausenden App-Dateien zu setzen, sobald `version.php`
  # auf der PVC von der Image-Version abweicht). Jeder einzelne chown
  # schlägt unter all_squash mit "Operation not permitted" fehl, rsync
  # beendet sich mit Exit 23, der Container crasht — bei jedem Neustart
  # erneut, endlos (empirisch reproduziert: ein Tag-Bump auf 34.0.3 löste
  # genau das aus, siehe Commit-Historie).
  #
  # Als Nicht-Root (`id -u` != 0) wählt der Entrypoint zwar automatisch
  # die chown-freie rsync-Variante (`-rlD`) — das wurde geprüft und
  # verworfen: das Image ist nicht für beliebige Nicht-Root-UIDs gebaut
  # (z. B. ist /usr/local/etc/php/conf.d/ nur für root beschreibbar, dort
  # schreibt der Entrypoint u. a. die Redis-Session-Config hinein —
  # "Permission denied" schon vor dem eigentlichen App-Sync, verifiziert
  # per Testpod). Root beibehalten ist daher aktuell die einzig praktikable
  # Option — mit der Konsequenz, dass Versions-Upgrades manuell/vorsichtig
  # gehandhabt werden müssen (Tag NICHT einfach hochziehen), bis eine
  # grundsätzlichere Lösung (z. B. Primärspeicher auf S3/MinIO umstellen,
  # siehe docs/3-apps-workloads/300b0-nextcloud.md) ansteht.
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false

  adminUser: admin

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: nextcloud.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      # Externer Host — per Cloudflare-Tunnel-Wildcard (cloudflared) an
      # Traefik weitergereicht, siehe docs/c-netzwerk-dns/c0040-domain-tiers.md.
      - host: nextcloud-prod.pke-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Trusted Domains: intern (*.homeserver, Traefik) + extern (Cloudflare
  # Tunnel, siehe argocd/apps/platform/cloudflared/values.yaml). Ohne beide Einträge
  # weist Nextcloud Requests mit "Access through untrusted domain" ab.
  trustedDomains: "nextcloud.prod.homeserver nextcloud-prod.pke-lab.de"

  # Erzwingt den öffentlichen Host für alle von Nextcloud generierten URLs
  # (v. a. Freigabe-/Share-Links) — unabhängig davon, über welchen der
  # beiden trustedDomains-Hosts man gerade zugreift. Gesetzt via
  # templates/nextcloud-fix-config-job.yaml (occ, s. dortiger Kommentar zur
  # Begründung). Interne Erreichbarkeit über nextcloud.prod.homeserver
  # bleibt unverändert bestehen.
  overwriteProtocol: "https"
  overwriteHost: "nextcloud-prod.pke-lab.de"
  overwriteCliUrl: "https://nextcloud-prod.pke-lab.de"

  persistence:
    html:
      enabled: true
      storageClassName: nas
      size: 5Gi
      accessMode: ReadWriteOnce
    data:
      enabled: true
      storageClassName: nas
      size: 100Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  nodeSelector: {}
  # affinity ist fest im Deployment-Template verdrahtet (Co-location wegen
  # RWO-Storage, siehe templates/nextcloud-deployment.yaml) und daher hier
  # kein konfigurierbarer Wert mehr.
  tolerations: []

# ============================================================
# PostgreSQL (eigenes Deployment, kein Bitnami-Subchart)
# Persistenz auf der "nas"-StorageClass (docs/2-betrieb-hardware/20000-nas-storage.md)
# ============================================================
postgresql:
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "16-alpine"

  database: nextcloud
  username: nextcloud

  service:
    port: 5432

  persistence:
    enabled: true
    # War auf "nas" (NFS), bis das UGREEN-NAS all_squash statt no_root_squash
    # erzwang und jedes chmod/chown des DB-Containers scheiterte (docs/2-betrieb-hardware/20000-nas-storage.md).
    # Postgres-Datenverzeichnis ist reiner State, gehört daher auf lokalen
    # Storage — Files/Blobs (html/data oben) bleiben bewusst auf "nas".
    storageClassName: local-path
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
  # wird — fest auf homeserver (aktuell ohnehin der einzige Ready-Node).
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - homeserver

# ============================================================
# Redis (Datei-Locking + Transactional-Cache, kein PVC nötig —
# reiner Lock-/Cache-Zustand, unkritisch bei Neustart)
# ============================================================
redis:
  image:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "7-alpine"

  service:
    port: 6379

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
