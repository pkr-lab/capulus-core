---
# Wird ausschliesslich vom n8n-Workflow "Zammad Externer KI-Lauf (taeglich)"
# zwischen 0 und 1 hin- und hergeschaltet (kubectl-scale-aequivalenter PATCH
# auf die Scale-Subresource, siehe docs/3-apps-workloads/300xx-ollama.md).
# ArgoCD ignoriert /spec/replicas fuer dieses Deployment bewusst (siehe
# argocd/bootstrap/root-applicationset.yaml) -- sonst wuerde selfHeal den
# Pod waehrend eines laufenden KI-Laufs sofort wieder auf 0 zuruecksetzen.
replicaCount: 0

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  tag: "0.3.14"

nameOverride: ""
fullnameOverride: ""

# Name der n8n-ServiceAccount (anderer Namespace) fuer das Scale-RBAC unten
# (templates/role-n8n-scaler.yaml) -- muss zu
# argocd/apps/workloads/n8n/values.yaml -> serviceAccount.name passen
# (Default dort ist der Release-Name "n8n").
n8nNamespace: n8n
n8nServiceAccountName: n8n

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 11434
  targetPort: 11434

persistence:
  enabled: true
  storageClassName: nas
  size: 20Gi
  accessMode: ReadWriteOnce
  mountPath: /root/.ollama

# Gegen die tatsaechliche Node-Kapazitaet geprueft (19.08.2026):
# "kubectl describe node worker-0" -> Allocatable nur 4 CPU / ~7.3Gi RAM
# (Lenovo M90q). Der alte Default (6 CPU / 8Gi Requests) lag ueber der
# gesamten Node-Kapazitaet -- der Pod waere nie ueber Pending
# hinausgekommen. Andere Pods auf worker-0 sind nur kleine
# DaemonSets/zot (~150m CPU / ~256Mi Requests zusammen), Ollama bekommt
# also den Grossteil der Node fuer sich.
resources:
  requests:
    cpu: "3"
    memory: 5Gi
  limits:
    cpu: "4"
    memory: 6500Mi

nodeSelector:
  kubernetes.io/hostname: worker-0

affinity: {}
tolerations: []
