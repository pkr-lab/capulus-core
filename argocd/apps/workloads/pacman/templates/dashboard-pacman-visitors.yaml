{{/*
Grafana-Sidecar durchsucht per searchNamespace: ALL alle Namespaces nach
grafana_dashboard: "1" (siehe argocd/apps/platform/monitoring/values.yaml),
das Dashboard muss also nicht im monitoring-Namespace liegen.

Verifiziert gegen die echte VictoriaLogs-Instanz (17.08.2026, per direkter
LogsQL-Query über `kubectl port-forward svc/logging-victoria-logs-single-server
9428:9428` + `/select/logsql/query`): der ursprünglich angenommene
Stream-Label-Name `namespace` existiert nicht, das victoria-logs-collector-
Setup labelt tatsächlich mit `kubernetes.pod_namespace`. Ebenso heißt das
Nachrichtenfeld `_msg` (VictoriaLogs-Standardfeld), nicht `msg`.

ACHTUNG: Die vier "client_fingerprint"-Panels (Geräte-Fingerprint +
Autofill) sind NICHT gegen echte Daten verifiziert — client-seitiges
Tooling blockierte den Verifizierungsversuch (Sandbox-Policy). Syntax
folgt exakt dem bereits verifizierten Muster der http_access-Panels
(gleiches Namespace-Label, gleiche `_msg:"..."`-Filterform, nur anderer
Message-Typ/andere Feldnamen aus main.go/handleFingerprint) — nach dem
ersten echten `client_fingerprint`-Log in Grafana Explore gegenprüfen.
Details/Kontext: docs/57-pacman-visitor-tracking.md.
*/}}
{{- if .Values.geoip.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-pacman-visitors
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  pacman-visitors.json: |
    {
      "annotations": {"list": []},
      "description": "pacman — Besucher-IPs (inkl. IPv6), GeoIP-Standort und Client-Fingerprint aus den Zugriffslogs. Schulungszweck, siehe docs/57-pacman-visitor-tracking.md.",
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"http_access\" | stats count() requests",
              "refId": "A"
            }
          ],
          "title": "Requests (Zeitraum)",
          "type": "stat"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"http_access\" | stats count_uniq(remote_ip) unique_ips",
              "refId": "A"
            }
          ],
          "title": "Eindeutige Besucher-IPs (Zeitraum)",
          "type": "stat"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "description": "Anzahl Seitenaufrufe, für die der Browser-Fingerprint (Canvas/WebGL/Audio/Timezone/Hardware) erfolgreich erfasst wurde, siehe fingerprint.js.",
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 5,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"client_fingerprint\" | stats count() fingerprints",
              "refId": "A"
            }
          ],
          "title": "Geräte-Fingerprints erfasst",
          "type": "stat"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "description": "Anzahl Seitenaufrufe, bei denen die Autofill-Köder-Felder tatsächlich vom Browser mit gespeicherten Profildaten (Name/E-Mail/Telefon/Adresse) befüllt wurden — der eigentliche 'Aha-Moment' der Schulung. Rot sobald > 0.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 6,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"client_fingerprint\" AND (autofill_name:* OR autofill_email:* OR autofill_tel:* OR autofill_address:* OR autofill_postal:*) | stats count() autofill_hits",
              "refId": "A"
            }
          ],
          "title": "⚠ Autofill-Treffer (echte Personendaten)",
          "type": "stat"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "description": "Nur Zeilen mit aufgelöstem GeoIP-Standort (geo_lat/geo_lon gesetzt) — erfordert geoip.enabled: true und eine geladene GeoLite2-DB, sonst bleibt die Karte leer.",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 4},
          "id": 3,
          "options": {
            "basemap": {"config": {}, "name": "Basemap", "type": "osm-standard"},
            "controls": {"mouseWheelZoom": true, "showAttribution": true, "showDebug": false, "showMeasure": false, "showScale": false, "showZoom": true},
            "layers": [
              {
                "config": {
                  "showLegend": true,
                  "style": {
                    "color": {"fixed": "semi-dark-orange"},
                    "opacity": 0.8,
                    "rotation": {"fixed": 0, "max": 360, "min": -360, "mode": "mod"},
                    "size": {"fixed": 6, "max": 15, "min": 2},
                    "symbol": {"fixed": "img/icons/marker/circle.svg", "mode": "fixed"},
                    "textConfig": {"fontSize": 12, "offsetX": 0, "offsetY": 0, "textAlign": "center", "textBaseline": "middle"}
                  }
                },
                "location": {"latitude": "geo_lat", "longitude": "geo_lon", "mode": "coords"},
                "name": "Besucher",
                "tooltip": true,
                "type": "markers"
              }
            ],
            "view": {"allLayers": true, "id": "zero", "lat": 20, "lon": 0, "zoom": 1.5}
          },
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"http_access\" AND geo_lat:* | fields geo_lat, geo_lon, geo_city, geo_country_name, remote_ip, user_agent",
              "refId": "A"
            }
          ],
          "title": "Besucher-Standorte (GeoIP)",
          "type": "geomap"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 16},
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Time"}]
          },
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"http_access\" | fields _time, remote_ip, geo_country_name, geo_city, path, status, user_agent, accept_language, sec_ch_ua_platform, dnt, sec_gpc",
              "refId": "A"
            }
          ],
          "title": "Letzte Zugriffe",
          "type": "table"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "description": "Ein Eintrag pro Seitenaufruf mit erfasstem Browser-Fingerprint (fingerprint.js) — Timezone, Bildschirm/Hardware, sowie Canvas-/WebGL-/Audio-Fingerprint-Hashes sind auch ohne Cookies über mehrere Besuche hinweg wiedererkennbar.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 26},
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Time"}]
          },
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"client_fingerprint\" | fields _time, remote_ip, timezone, screen_width, screen_height, pixel_ratio, hardware_concurrency, device_memory, platform, languages, connection_type, canvas_fp, webgl_renderer, audio_fp, webrtc_local_ip",
              "refId": "A"
            }
          ],
          "title": "Geräte-Fingerprint (ohne Zutun des Besuchers erfasst)",
          "type": "table"
        },
        {
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
          "description": "Nur Zeilen, bei denen mindestens ein Autofill-Köderfeld tatsächlich vom Browser befüllt wurde — echte Personendaten aus dem gespeicherten Autofill-Profil des Besuchers, ohne dass er etwas eingegeben oder ein sichtbares Formular gesehen hat. Der zentrale Beweis für die Schulung.",
          "fieldConfig": {
            "defaults": {"custom": {"cellOptions": {"type": "color-background"}}},
            "overrides": [
              {
                "matcher": {"id": "byRegexp", "options": "autofill_.*"},
                "properties": [{"id": "custom.cellOptions", "value": {"type": "color-background"}}, {"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]
              }
            ]
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 36},
          "id": 8,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Time"}]
          },
          "targets": [
            {
              "datasource": {"type": "victoriametrics-logs-datasource", "uid": "${datasource}"},
              "expr": "{kubernetes.pod_namespace=\"pacman\"} _msg:\"client_fingerprint\" AND (autofill_name:* OR autofill_email:* OR autofill_tel:* OR autofill_address:* OR autofill_postal:*) | fields _time, remote_ip, autofill_name, autofill_email, autofill_tel, autofill_address, autofill_postal",
              "refId": "A"
            }
          ],
          "title": "⚠ Abgegriffene Personendaten (Autofill-Harvesting)",
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["pacman", "schulung", "geoip", "fingerprinting"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "label": "Datasource",
            "name": "datasource",
            "query": "victoriametrics-logs-datasource",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "browser",
      "title": "pacman — Besucher (IP/GeoIP/Fingerprint)",
      "uid": "pacman-visitors"
    }
{{- end }}
