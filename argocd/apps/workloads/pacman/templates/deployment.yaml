apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacman.fullname" . }}
  labels:
    {{- include "pacman.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pacman.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacman.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.geoip.enabled }}
      initContainers:
        # Downloads the DB-IP City Lite database (free, no account/license
        # key needed, CC BY 4.0 — attribution in README.md) into the shared
        # emptyDir on every pod start. Deliberately non-blocking (|| echo):
        # a failed download must NOT crash-loop the pod — pacman-server
        # already degrades gracefully to IP-only logging when no DB is
        # present, see server/cmd/server/main.go.
        - name: geoip-update
          image: "{{ .Values.geoip.updaterImage.repository }}:{{ .Values.geoip.updaterImage.tag }}"
          command:
            - sh
            - -c
            - >-
              curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-$(date +%Y-%m).mmdb.gz"
              | gunzip -c > /geoip/city.mmdb
              || echo 'DB-IP download failed - continuing without GeoIP DB' >&2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: geoip-db
              mountPath: /geoip
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.geoip.enabled }}
          env:
            - name: GEOIP_DB_PATH
              value: /geoip/city.mmdb
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.geoip.enabled }}
          volumeMounts:
            - name: geoip-db
              mountPath: /geoip
              readOnly: true
          {{- end }}
      {{- if .Values.geoip.enabled }}
      volumes:
        - name: geoip-db
          emptyDir: {}
      {{- end }}
