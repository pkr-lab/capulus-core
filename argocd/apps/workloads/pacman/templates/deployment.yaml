apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pacman.fullname" . }}
  labels:
    {{- include "pacman.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pacman.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pacman.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.geoip.enabled }}
      initContainers:
        # Refreshes the GeoLite2-City DB into the shared emptyDir on every
        # pod start. Deliberately non-blocking (|| true): with a still-empty
        # or invalid MaxMind license key this must NOT crash-loop the pod —
        # pacman-server already degrades gracefully to IP-only logging when
        # no DB is present, see server/cmd/server/main.go.
        - name: geoip-update
          image: "{{ .Values.geoip.updaterImage.repository }}:{{ .Values.geoip.updaterImage.tag }}"
          command:
            - sh
            - -c
            - "geoipupdate || echo 'geoipupdate failed (missing/invalid MaxMind license key?) - continuing without GeoIP DB' >&2"
          env:
            - name: GEOIPUPDATE_EDITION_IDS
              value: "GeoLite2-City"
            - name: GEOIPUPDATE_DB_DIR
              value: /geoip
            - name: GEOIPUPDATE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.geoip.secretName }}
                  key: {{ .Values.geoip.accountIdKey }}
            - name: GEOIPUPDATE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.geoip.secretName }}
                  key: {{ .Values.geoip.licenseKeyKey }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: geoip-db
              mountPath: /geoip
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.geoip.enabled }}
          env:
            - name: GEOIP_DB_PATH
              value: /geoip/GeoLite2-City.mmdb
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.geoip.enabled }}
          volumeMounts:
            - name: geoip-db
              mountPath: /geoip
              readOnly: true
          {{- end }}
      {{- if .Values.geoip.enabled }}
      volumes:
        - name: geoip-db
          emptyDir: {}
      {{- end }}
