fullnameOverride: "pacman"

replicaCount: 1

image:
  # Über kaniko-build-push gebaut und gepusht, siehe README.md dieses
  # Charts. Nach dem ersten Push hier Repository/Tag setzen.
  repository: ghcr.io/pkr-lab/pacman
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    # Externer Host — per Cloudflare-Tunnel-Wildcard (cloudflared) an
    # Traefik weitergereicht, siehe docs/56-domain-tiers.md.
    - host: pacman-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
