fullnameOverride: "pacman"

# Only used while autoscaling.enabled is false — the HPA takes over
# replica count once autoscaling is enabled (see below).
replicaCount: 1

# CPU-only: stateless static/Go server, no memory-bound workload. No
# ReadWriteOnce storage involved, so no podAffinity co-location concern
# either (see docs/39-hpa-autoscaling.md).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

image:
  # Über kaniko-build-push gebaut und gepusht, siehe README.md dieses
  # Charts. Nach dem ersten Push hier Repository/Tag setzen.
  repository: ghcr.io/pkr-lab/pacman
  tag: "v8"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    - host: pacman-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# GeoIP-Anreicherung der Zugriffslogs (Schulungszweck: zeigt, was ein
# Webserver über Besucher herausfinden kann — IP inkl. IPv6, Standort).
# Quelle: DB-IP City Lite (db-ip.com, CC BY 4.0) — kostenlos, kein Account/
# License-Key nötig, monatlicher Direct-Download, siehe README.md. Default
# an, da das der eigentliche Zweck der App ist (siehe docs/57). Schlägt
# der DB-Download trotzdem mal fehl, läuft pacman-server weiter (loggt
# dann nur die rohe IP), siehe server/cmd/server/main.go.
geoip:
  enabled: true
  updaterImage:
    repository: curlimages/curl
    tag: "8.11.0"

# Schulungs-Erweiterung (siehe README.md "Bestenliste"): koppelt das
# Namensfeld im Nickname-Overlay (src/nickname.js) an dieselbe versteckte
# Autofill-Ernte (E-Mail/Tel/Adresse/PLZ), die fingerprint.js's
# harvestAutofill() bereits für die eigene Ecke nutzt (siehe
# docs/57-pacman-visitor-tracking.md). Standardmäßig AUS.
#
# ACHTUNG: Dieser Host ist über ingress.hosts (s. o.) öffentlich ohne
# Auth/IP-Allowlist erreichbar (pacman-prod.pke-lab.de). enabled: true
# wirkt serverseitig für JEDEN Request auf "/" — nicht nur für eine
# informierte, freiwillig teilnehmende Gruppe, sondern für jeden, der die
# URL in diesem Zeitraum aufruft (Suchmaschinen-Crawler, alte Links,
# zufällige Besucher eingeschlossen). Nur für die Dauer der jeweiligen
# Unterrichtsstunde aktivieren und danach wieder auf false zurücksetzen
# (neues Chart-Release, s. README.md) — der Serverstart loggt bei
# enabled: true zusätzlich eine "training mode ENABLED"-Warnzeile als
# Erinnerung (siehe main.go).
trainingMode:
  enabled: true
