fullnameOverride: "pacman"

# Only used while autoscaling.enabled is false — the HPA takes over
# replica count once autoscaling is enabled (see below).
replicaCount: 1

# CPU-only: stateless static/Go server, no memory-bound workload. No
# ReadWriteOnce storage involved, so no podAffinity co-location concern
# either (see docs/39-hpa-autoscaling.md).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

image:
  # Über kaniko-build-push gebaut und gepusht, siehe README.md dieses
  # Charts. Nach dem ersten Push hier Repository/Tag setzen.
  repository: ghcr.io/pkr-lab/pacman
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    # Externer Host — per Cloudflare-Tunnel-Wildcard (cloudflared) an
    # Traefik weitergereicht, siehe docs/56-domain-tiers.md.
    - host: pacman-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# GeoIP-Anreicherung der Zugriffslogs (Schulungszweck: zeigt, was ein
# Webserver über Besucher herausfinden kann — IP inkl. IPv6, Standort).
# Quelle: DB-IP City Lite (db-ip.com, CC BY 4.0) — kostenlos, kein Account/
# License-Key nötig, monatlicher Direct-Download, siehe README.md. Default
# aus: pacman-server läuft auch ohne DB klaglos weiter (loggt dann nur die
# rohe IP), siehe server/cmd/server/main.go.
geoip:
  enabled: false
  updaterImage:
    repository: curlimages/curl
    tag: "8.11.0"
