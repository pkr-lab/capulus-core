fullnameOverride: "pacman"

replicaCount: 1

image:
  # Über kaniko-build-push gebaut und gepusht, siehe README.md dieses
  # Charts. Nach dem ersten Push hier Repository/Tag setzen.
  repository: ghcr.io/pkr-lab/pacman
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: pacman.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    # Externer Host — per Cloudflare-Tunnel-Wildcard (cloudflared) an
    # Traefik weitergereicht, siehe docs/56-domain-tiers.md.
    - host: pacman-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# GeoIP-Anreicherung der Zugriffslogs (Schulungszweck: zeigt, was ein
# Webserver über Besucher herausfinden kann — IP inkl. IPv6, Standort).
# Default aus: kein MaxMind-Account/License-Key vorhanden. pacman-server
# läuft auch ohne DB klaglos weiter (loggt dann nur die rohe IP), siehe
# server/cmd/server/main.go. Aktivierungsschritte: README.md.
geoip:
  enabled: false
  secretName: pacman-maxmind
  accountIdKey: account-id
  licenseKeyKey: license-key
  # Platzhalter — mit kubeseal gegen den Cluster versiegeln und hier
  # einsetzen, siehe README.md. Erst danach enabled: true setzen.
  encryptedAccountId: "REPLACE_ME_SEALED_ACCOUNT_ID"
  encryptedLicenseKey: "REPLACE_ME_SEALED_LICENSE_KEY"
  updaterImage:
    repository: ghcr.io/maxmind/geoipupdate
    tag: "v8.0.0"
