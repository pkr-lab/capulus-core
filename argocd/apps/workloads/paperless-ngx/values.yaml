---
replicaCount: 1

image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  pullPolicy: IfNotPresent
  # v3-Sprung von 2.20.15 (Zwischenschritt, siehe git log). Config war schon
  # sauber fuer v3: PAPERLESS_SECRET_KEY + PAPERLESS_DBENGINE bereits gesetzt,
  # keine deprecated Env-Vars, keine Verschluesselung im Einsatz. Such-Index
  # baut sich beim ersten Start automatisch neu auf (Whoosh -> tantivy).
  tag: "3.0.5"

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  persistence:
    enabled: true
    storageClassName: nas
    size: 1Gi
    accessMode: ReadWriteOnce

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: paperless.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  data:
    enabled: true
    storageClassName: nas
    size: 20Gi
    accessMode: ReadWriteOnce
  media:
    enabled: true
    storageClassName: nas
    size: 50Gi
    accessMode: ReadWriteOnce
  consume:
    enabled: true
    storageClassName: nas
    size: 5Gi
    accessMode: ReadWriteOnce
  export:
    enabled: true
    storageClassName: nas
    size: 10Gi
    accessMode: ReadWriteOnce

env:
  PAPERLESS_REDIS: "redis://localhost:6379"
  PAPERLESS_DBENGINE: "sqlite"
  PAPERLESS_TIME_ZONE: "Europe/Berlin"
  # OCR: Deutsch + Englisch — weitere Sprachen per "deu+eng+fra" ergänzen
  PAPERLESS_OCR_LANGUAGE: "deu+eng"
  PAPERLESS_OCR_LANGUAGES: "deu eng"
  PAPERLESS_URL: "https://paperless.prod.pke-lab.de"
  # Anzahl Worker/Threads — für Home Lab reicht 1
  PAPERLESS_TASK_WORKERS: "1"
  PAPERLESS_THREADS_PER_WORKER: "1"
  # Secret Key — in Produktion per SealedSecret übergeben.
  # Vorläufig ein fester Wert; nach Deploy sofort per SealedSecret ersetzen.
  PAPERLESS_SECRET_KEY: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

affinity: {}

nodeSelector: {}
tolerations: []
