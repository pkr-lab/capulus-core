---
replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  tag: "2.4.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Das Image (louislam/uptime-kuma) hat kein USER-Directive und erwartet
# root: der eigene Entrypoint (/app/extra/entrypoint.sh) chownt /app/data
# selbst zu $PUID:$PGID und droppt danach per setpriv auf diese UID/GID.
# Mit erzwungenem runAsUser/runAsNonRoot startet der Container nie als root,
# der interne chown scheitert dann immer mit "Operation not permitted" —
# unabhängig von der StorageClass oder der tatsächlichen Volume-Ownership
# (chown auf 0:0, da PUID/PGID ohne die Env-Vars unten auf 0 defaulten).
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false

# Steuert den Privilege-Drop im Entrypoint (chown + setpriv), siehe Kommentar
# oben — läuft am Ende trotzdem als UID/GID 1000, nur der Startprozess ist
# root.
env:
  PUID: "1000"
  PGID: "1000"
  # Damit HTTP(s)-Monitore gegen *.homeserver (interne CA, siehe
  # docs/d-sicherheit/d0040-internal-tls.md) nicht mit UNABLE_TO_VERIFY_LEAF_SIGNATURE
  # fehlschlagen — Node.js vertraut sonst nur seinem eingebauten Root-Store.
  NODE_EXTRA_CA_CERTS: "/etc/ssl/homeserver-ca/homeserver-root-ca.pem"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: uptime-kuma.prod.homeserver
      paths:
        - path: /
          pathType: Prefix
    # Öffentlich erreichbar über die bestehende *.pke-lab.de-Wildcard-Route
    # von cloudflared (kein Änderung an cloudflared nötig, siehe
    # docs/e-externe-erreichbarkeit/e0010-cloudflare-deploy.md → "Neuen Dienst freigeben"). Bewusst
    # "status" statt "uptime-kuma" im Hostnamen, damit die eingesetzte
    # Software nicht schon aus der URL erkennbar ist. Nur die öffentliche
    # Status-Page-API (/api/status-page/...) wird von der "Updates"-Seite
    # auf edv-kretzer.de per Hintergrund-Request abgefragt (keine direkte
    # Verlinkung, kein iframe) — das restliche Dashboard bleibt hinter dem
    # Admin-Login.
    - host: status-prod.pke-lab.de
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity: {}

# local-path bindet den Pod an den Node, auf dem die PVC zuerst provisioniert
# wird — fest auf homeserver, damit es nicht vom Scheduler zufällig auf
# worker-0/worker-1 landet (docs/2-betrieb-hardware/20000-nas-storage.md → Migrations-Notiz).
nodeSelector:
  kubernetes.io/hostname: homeserver
tolerations: []
