---
image:
  repository: python
  tag: "3.14-slim"
  pullPolicy: IfNotPresent

# CronJob-Schedule (Standard: alle 15 Minuten).
schedule: "*/15 * * * *"
timezone: "Europe/Berlin"
# Sync wurde manuell verifiziert (Pfad, README/DEPLOY, nummerierte Titel) —
# CronJob läuft ab jetzt automatisch alle 15 Minuten.
suspend: false
concurrencyPolicy: Forbid
failedJobsHistoryLimit: 3
successfulJobsHistoryLimit: 3

github:
  owner: "pkr-lab"
  repo: "capulus-core"
  branch: "main"
  docsPath: "docs"
  # Zusätzliche Root-Level-Dateien, die direkt unter wikijs.pathPrefix
  # (statt unter wikijs.docsSubpath) gespiegelt werden. `slug` bestimmt
  # sowohl den Wiki.js-Seitenpfad als auch den Fallback-Titel.
  extraFiles:
    - path: "README.md"
      slug: "ReadMe"
  # Optionaler GitHub-PAT (nur für Contents-Listing-Anfragen relevant, nicht
  # für die Datei-Downloads über raw.githubusercontent.com). sync.py listet
  # docs/ eine Ebene rekursiv (1 Call für docs/ selbst + 1 pro
  # Unterordner/Kategorie, aktuell ~11 Calls/Lauf) — bei 15-Minuten-Takt
  # macht das ~44 Contents-API-Calls/h, noch unter dem unauthenticated-Limit
  # von 60 req/h, aber mit wenig Puffer für weitere Kategorie-Unterordner.
  # Name/Key eines VORHANDENEN Secrets im Namespace — wird NICHT von diesem
  # Chart angelegt.
  tokenSecretName: ""
  tokenSecretKey: token

wikijs:
  # Interner ClusterIP-Service statt der öffentlichen Cloudflare-Tunnel-URL:
  # Cloudflares Bot-Schutz blockt Requests von urllib (403, error code 1010),
  # da der Sync-Job ohnehin im selben Cluster wie Wiki.js läuft.
  url: "http://wikijs.wikijs.svc.cluster.local"
  # Wiki.js reserviert zweistellige Pfad-Segmente (z. B. "en") für das
  # Locale — es wird NICHT Teil von pathPrefix, sondern separat gesetzt
  # und von Wiki.js automatisch vor den Pfad gehängt.
  locale: "en"
  pathPrefix: "Github/capulus-core"
  # Unterordner unterhalb von pathPrefix, in den die docs/*.md-Dateien
  # gespiegelt werden. github.extraFiles landen dagegen direkt unter
  # pathPrefix (siehe oben).
  docsSubpath: "docs"
  tokenSecretName: wiki-docs-sync-wikijs-token
  tokenSecretKey: token

# Sealed Secret für den Wiki.js-API-Token
# (Administration → Utilities → API Access in Wiki.js).
secrets:
  enabled: true
  name: wiki-docs-sync-wikijs-token
  # Versiegeln: echo -n '<TOKEN>' | kubeseal --raw --namespace wiki-docs-sync \
  #             --name wiki-docs-sync-wikijs-token \
  #             --controller-namespace sealed-secrets \
  #             --controller-name sealed-secrets-controller
  encryptedToken: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
