---
# ============================================================
# Wiki.js — wrapper values
#
# Secrets-Block (SealedSecret):
#   DB-Passwort mit kubeseal versiegeln und hier eintragen.
#   Anleitung: docs/3-apps-workloads/30030-wikijs.md → Abschnitt "Secrets versiegeln"
# ============================================================

secrets:
  enabled: true
  name: wikijs-secrets
  # Versiegeln: echo -n 'WERT' | kubeseal --raw --namespace wikijs \
  #             --name wikijs-secrets --controller-namespace sealed-secrets \
  #             --controller-name sealed-secrets-controller
  # Derselbe Wert wird von Postgres (POSTGRES_PASSWORD) und Wiki.js
  # (DB_PASS) gelesen — nur EIN kubeseal-Aufruf nötig.
  encryptedDbPassword: ""

# ============================================================
# Wiki.js App
# ============================================================
wikijs:
  # Nur wirksam solange autoscaling.enabled=false ist (siehe unten) —
  # danach übernimmt der HPA die Replica-Anzahl.
  # Temporär auf 0 für die Postgres-16→18-Migration (docs/3-apps-workloads/30030-wikijs.md
  # → Datenbank-Major-Upgrade). Nach erfolgreichem Restore wieder auf 1 setzen.
  replicaCount: 0

  # Seiten/Assets liegen zwar vollständig in PostgreSQL, aber Wiki.js
  # cached API-Enable-Status/Key-Validierung offenbar pro Pod-Instanz ohne
  # Sync zwischen Replicas (ohne Redis o. Ä.) — mehrere gleichzeitig aktive
  # Pods führten zu inkonsistenten "API Key invalid"/"API disabled"-Fehlern
  # beim wiki-docs-sync. maxReplicas daher vorerst auf 1 gedeckelt.
  autoscaling:
    # Temporär deaktiviert für die Postgres-16→18-Migration — sonst
    # überschreibt der HPA (minReplicas: 1) den replicaCount: 0 oben.
    # Nach erfolgreichem Restore wieder auf true setzen.
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  image:
    repository: ghcr.io/requarks/wiki
    pullPolicy: IfNotPresent
    # Pinned für Reproduzierbarkeit. Releases: https://github.com/requarks/wiki/releases
    tag: "2.5.314"

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    hosts:
      - host: wiki.prod.homeserver
        paths:
          - path: /
            pathType: Prefix
      # Externer Host — per Cloudflare-Tunnel-Wildcard (cloudflared) an
      # Traefik weitergereicht, siehe docs/c-netzwerk-dns/c0040-domain-tiers.md.
      - host: wiki-prod.pke-lab.de
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Wiki.js speichert Seiten UND Assets vollständig in PostgreSQL (siehe
  # docs/3-apps-workloads/30030-wikijs.md) — der App-Pod selbst braucht kein PVC und keine
  # NodeAffinity, im Gegensatz zu Postgres unten.
  nodeSelector: {}
  affinity: {}
  tolerations: []

# ============================================================
# PostgreSQL (eigenes Deployment, kein Bitnami-Subchart)
# Persistenz auf der "nas"-StorageClass (docs/2-betrieb-hardware/20000-nas-storage.md)
# ============================================================
postgresql:
  image:
    repository: postgres
    pullPolicy: IfNotPresent
    tag: "16-alpine"

  database: wiki
  username: wikijs

  service:
    port: 5432

  persistence:
    enabled: true
    storageClassName: nas
    size: 20Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  affinity: {}
