---
apiVersion: v2
name: xibosignage
description: |
  Xibo CMS — Open-Source Digital-Signage-Verwaltung (Layouts, Playlists,
  Displays, Zeitpläne). Bündelt CMS-Web, XMR (Message-Relay), MySQL,
  Memcached und QuickChart als eigene Deployments (kein Bitnami-Subchart,
  1:1 aus dem offiziellen xibosignage/xibo-docker docker-compose.yml
  übernommen), siehe docs/44-xibosignage.md.

  Die eigentliche Wiedergabe läuft NICHT über einen offiziellen/inoffiziellen
  Xibo-Player (Raspberry Pi wird von Xibo nicht unterstützt) — stattdessen
  liest ein Chromium-Kiosk auf dem Pi direkt einen NFS-Ordner
  (`xibosignage-display`, siehe ansible/roles/xibo_kiosk). Das Xibo-CMS
  dient als zentrale Medien-/Asset-Verwaltung.

  Web-Interface:
    http://xibo.prod.homeserver

  Komponenten:
    - Xibo CMS 4.5 (ghcr.io/xibosignage/xibo-cms)
    - Xibo XMR 1.3 (ghcr.io/xibosignage/xibo-xmr)
    - MySQL 8.4 (offizielles mysql-Image, eigenes Deployment)
    - Memcached (Session-/Objekt-Cache)
    - QuickChart (Chart-Widget-Rendering)
type: application
version: 0.1.0
appVersion: "4.5.0"
keywords:
  - xibo
  - digital-signage
  - cms
home: https://xibosignage.com
sources:
  - https://github.com/xibosignage/xibo-cms
  - https://github.com/xibosignage/xibo-docker
maintainers:
  - name: home-server-admin
