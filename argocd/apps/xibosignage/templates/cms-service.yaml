apiVersion: v1
kind: Service
metadata:
  name: {{ include "xibosignage.cms.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xibosignage.cms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cms.service.type }}
  ports:
    - port: {{ .Values.cms.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "xibosignage.cms.selectorLabels" . | nindent 4 }}
