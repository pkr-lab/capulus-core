{{- if .Values.quickchart.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xibosignage.quickchart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xibosignage.quickchart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3400
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "xibosignage.quickchart.selectorLabels" . | nindent 4 }}
{{- end }}
