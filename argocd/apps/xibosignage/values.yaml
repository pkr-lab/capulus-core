---
# ============================================================
# Xibo CMS — wrapper values
#
# Secrets-Block (SealedSecret):
#   DB-Passwort mit kubeseal versiegeln und hier eintragen.
#   Anleitung: docs/44-xibosignage.md → Abschnitt "Secrets versiegeln"
# ============================================================

secrets:
  enabled: true
  name: xibosignage-secrets
  # Versiegeln: echo -n 'WERT' | kubeseal --raw --namespace xibosignage \
  #             --name xibosignage-secrets --controller-namespace sealed-secrets \
  #             --controller-name sealed-secrets-controller
  # Derselbe Wert wird von MySQL (MYSQL_PASSWORD) und Xibo CMS (MYSQL_PASSWORD)
  # gelesen — nur EIN kubeseal-Aufruf nötig.
  encryptedDbPassword: ""

# ============================================================
# MySQL (eigenes Deployment, offizielles Image — kein Bitnami-Subchart,
# gleiches Vorgehen wie bei wikijs/immich, siehe docs/20-wikijs.md)
# Persistenz auf der "nas"-StorageClass (docs/16-nas-storage.md)
# ============================================================
mysql:
  image:
    repository: mysql
    pullPolicy: IfNotPresent
    # Identisch zur Version aus dem offiziellen xibosignage/xibo-docker
    # docker-compose.yml.
    tag: "8.4"

  database: cms
  username: cms

  service:
    port: 3306

  persistence:
    enabled: true
    storageClassName: nas
    size: 10Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  affinity: {}

# ============================================================
# XMR (Xibo Message Relay) — ZeroMQ-Broker zwischen CMS und Playern.
# Für den Chromium-Kiosk-Ansatz (kein echter Xibo-Player) aktuell
# ungenutzt, aber Teil der offiziellen CMS-Referenzarchitektur und von
# der CMS-Oberfläche selbst erwartet (Player-Nachrichten, Preview).
# ============================================================
xmr:
  image:
    repository: ghcr.io/xibosignage/xibo-xmr
    pullPolicy: IfNotPresent
    tag: "1.3"

  service:
    port: 9505

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# ============================================================
# Memcached — Objekt-/Session-Cache, von cms-web über
# CMS_USE_MEMCACHED/MEMCACHED_HOST erwartet.
# ============================================================
memcached:
  image:
    repository: memcached
    pullPolicy: IfNotPresent
    tag: "alpine"
  # -m 15: 15 MiB Cache-Größe, identisch zum offiziellen docker-compose.yml.
  args: ["-m", "15"]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 100Mi

# ============================================================
# QuickChart — rendert Chart-Widgets (z.B. Wetter/Statistik-Layouts)
# serverseitig als PNG. Optional, aber Teil der offiziellen Referenz.
# ============================================================
quickchart:
  enabled: true
  image:
    repository: ianw/quickchart
    pullPolicy: IfNotPresent
    tag: "latest"

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# ============================================================
# Xibo CMS (cms-web)
# ============================================================
cms:
  replicaCount: 1

  image:
    repository: ghcr.io/xibosignage/xibo-cms
    pullPolicy: IfNotPresent
    tag: "release-4.5.0"

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: xibo.homeserver
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Siehe https://github.com/xibosignage/xibo-docker/blob/master/config.env.template
  # für alle verfügbaren Variablen (SMTP, Upload-Limits, ...).
  env:
    CMS_SERVER_NAME: "xibo.homeserver"
    CMS_USE_MEMCACHED: "true"
    # Xibo führt periodische Wartungs-Tasks (Layout-Status, Thumbnails,
    # Stats-Aggregation, Player-Actions) über einen eingebauten Cron im
    # Container aus, wenn dieser aktiviert ist — ohne ihn bleiben Displays
    # und Layouts nach dem ersten Sync nicht mehr aktuell.
    XTR_ENABLED: "true"
    # Große Fotos vom Handy/NAS-Sync sollen nicht am Upload-Limit scheitern.
    CMS_PHP_POST_MAX_SIZE: "512M"
    CMS_PHP_UPLOAD_MAX_FILESIZE: "512M"
    CMS_PHP_MAX_EXECUTION_TIME: "600"

  # Erwartet vom Xibo-CMS-Image als eigenständige NFS-Squash-Identität
  # (UGREEN-NAS all_squash auf 1000:10, siehe docs/16-nas-storage.md und
  # das identische Problem/Fix bei wikijs/immich). Falls das CMS-Image
  # zum ersten Start root braucht (chown auf /var/www/cms/library o.ä.),
  # siehe docs/44-xibosignage.md → Fehlerbehebung.
  securityContext:
    runAsUser: 1000
    runAsGroup: 10
    fsGroup: 10

  persistence:
    # Xibo verwaltet diesen Ordner exklusiv selbst (Medien-Bibliothek,
    # interne Dateinamen/Hashes) — NICHT der Ordner, in den n8n/OnlineSync
    # Rohdateien legt (das ist argocd/apps/n8n xibosignage-inbox/-display,
    # siehe docs/44-xibosignage.md).
    library:
      enabled: true
      storageClassName: nas
      size: 50Gi
      accessMode: ReadWriteOnce
    # Bündelt custom/backup/userscripts/ca-certs (aus dem offiziellen
    # docker-compose.yml) auf einer kleinen, gemeinsamen PVC mit
    # unterschiedlichen subPaths — spart drei winzige PVCs.
    state:
      enabled: true
      storageClassName: nas
      size: 2Gi
      accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

  affinity: {}
  nodeSelector: {}
  tolerations: []
