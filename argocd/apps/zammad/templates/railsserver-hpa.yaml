---
# Hand-rolled HPA — the upstream zammad chart has no autoscaling/hpa keys in
# its values schema, so this wrapper defines its own HorizontalPodAutoscaler
# instead of toggling a chart-native flag. scaleTargetRef.name is the literal
# Deployment name rendered by the upstream chart (verified via `helm template`),
# not a Helm include, since we don't own that chart's templates.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zammad-railsserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zammad-wrapper.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zammad-railsserver
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
