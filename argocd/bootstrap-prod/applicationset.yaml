---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-server-apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/pkr-lab/capulus-core.git"
        revision: "main"
        directories:
          - path: "argocd/apps/prod/nas-storage"
          - path: "argocd/apps/prod/immich-storage"
          - path: "argocd/apps/prod/traefik-config"
  template:
    metadata:
      name: "prod-{{.path.basename}}"
    spec:
      project: prod
      source:
        repoURL: "https://github.com/pkr-lab/capulus-core.git"
        targetRevision: "main"
        path: "{{.path.path}}"
      destination:
        name: prod
        namespace: "{{.path.basename}}"
      ignoreDifferences:
        - group: bitnami.com
          kind: SealedSecret
          jsonPointers:
            - /status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-server-apps-prod-charts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/pkr-lab/capulus-core.git"
        revision: "main"
        files:
          - path: "argocd/apps/prod/*/Chart.yaml"
  template:
    metadata:
      name: "prod-{{.path.basename}}"
    spec:
      project: prod
      source:
        repoURL: "https://github.com/pkr-lab/capulus-core.git"
        targetRevision: "main"
        path: "{{.path.path}}"
        helm:
          releaseName: "{{.path.basename}}"
      destination:
        name: prod
        namespace: "{{.path.basename}}"
      ignoreDifferences:
        - group: bitnami.com
          kind: SealedSecret
          jsonPointers:
            - /status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
