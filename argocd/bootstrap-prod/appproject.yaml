---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: >-
    PROD-Cluster (prod-vm): vom TECH-Hub verwaltet. Wird schrittweise um
    Apps aus argocd/apps/prod/ erweitert.
  sourceRepos:
    - "https://github.com/pkr-lab/capulus-core.git"
  destinations:
    - name: prod
      namespace: sealed-secrets
    - name: prod
      namespace: nas-storage
    - name: prod
      namespace: immich-storage
    - name: prod
      namespace: demo-app
    - name: prod
      namespace: cloudflared
    - name: prod
      namespace: authentik
    - name: prod
      namespace: mealie
    - name: prod
      namespace: paperless-ngx
    - name: prod
      namespace: wikijs
    - name: prod
      namespace: wiki-docs-sync
    - name: prod
      namespace: nextcloud
    - name: prod
      namespace: immich
    - name: prod
      namespace: xibosignage
    - name: prod
      namespace: example-whoami
    - name: prod
      namespace: tinyteller
    - name: prod
      namespace: cert-manager
    - name: prod
      namespace: traefik-config
    - name: prod
      namespace: kube-system
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
