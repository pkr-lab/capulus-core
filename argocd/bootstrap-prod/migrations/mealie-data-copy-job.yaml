apiVersion: batch/v1
kind: Job
metadata:
  name: mealie-data-copy
  namespace: mealie
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Quelle:"; ls -la /old | head -20
              find /new -mindepth 1 -delete
              (cd /old && tar cf - .) | (cd /new && tar xpf -)
              echo "Ziel:"; ls -la /new | head -20
              du -sh /old /new
          volumeMounts:
            - name: old
              mountPath: /old
              readOnly: true
            - name: new
              mountPath: /new
      volumes:
        - name: old
          nfs:
            server: 192.168.178.97
            path: /volume1/k8s-storage/mealie-mealie-data-pvc-1227f51e-55d0-43a3-a2af-87394b1db648
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: mealie-data
