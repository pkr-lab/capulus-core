# Kopiert die Nextcloud-Dateien (data ~11 GB, html ~1 GB) aus den TECH-Verzeichnissen auf dem NAS
# in die neuen PROD-Volumes (PVCs nextcloud-data / nextcloud-html). Manuell in PROD anwenden,
# NICHT per ArgoCD (siehe README.md in diesem Ordner):
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl apply -f -' < argocd/bootstrap-prod/migrations/nextcloud-data-copy-job.yaml
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl -n nextcloud logs job/nextcloud-data-copy'
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl -n nextcloud delete job nextcloud-data-copy'
#
# NUR mit gestoppter TECH-Nextcloud-App und PROD-App auf 0. Die Datenbank wird separat per
# pg_dumpall/pg_dump uebernommen (liegt auf local-path, nicht auf dem NAS). Das Zielvolume wird
# vor dem Kopieren geleert. Laeuft als uid 1000 / gid 10 wie die Dateien (all_squash des NAS);
# config.php (Modus 640, Besitzer 1000) und data (770, Gruppe 10) bleiben so lesbar.
apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-data-copy
  namespace: nextcloud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 10
        fsGroup: 10
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              for v in html data; do
                echo "== $v: Quelle"; ls -la /old/$v | head -14
                find /new/$v -mindepth 1 -delete
                (cd /old/$v && tar cf - .) | (cd /new/$v && tar xpf -)
                echo "== $v: Ziel"; ls -la /new/$v | head -14
              done
              ls -l /new/html/config/config.php
              du -sh /old/html /new/html /old/data /new/data
          volumeMounts:
            - {name: old-html, mountPath: /old/html, readOnly: true}
            - {name: new-html, mountPath: /new/html}
            - {name: old-data, mountPath: /old/data, readOnly: true}
            - {name: new-data, mountPath: /new/data}
      volumes:
        - name: old-html
          nfs:
            server: 192.168.178.97
            path: /volume1/k8s-storage/nextcloud-nextcloud-html-pvc-f86288ef-3f6c-497f-bc2d-b6abc72cf1e3
            readOnly: true
        - name: new-html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: old-data
          nfs:
            server: 192.168.178.97
            path: /volume1/k8s-storage/nextcloud-nextcloud-data-pvc-a52431f5-c5c4-410f-9f0e-016474538aec
            readOnly: true
        - name: new-data
          persistentVolumeClaim:
            claimName: nextcloud-data
