# ForwardAuth-Middleware fuer PROD-Apps hinter Authentik-SSO. Der Name
# "authentik" im Namespace "authentik" entspricht dem Annotations-Wert
# `authentik-authentik@kubernetescrd`, den die App-Ingresses aus TECH schon
# verwenden - die Ingresses muessen in PROD nicht geaendert werden.
#
# Die Middleware ruft den REMOTE-OUTPOST in PROD (outpost.yaml) auf, nicht den
# eingebetteten Outpost in TECH. Grund: ein Aufruf ueber den Traefik in TECH
# scheitert (404), weil der dortige Traefik X-Forwarded-Host fuer fremde
# Absender ueberschreibt und Authentik die App nicht mehr zuordnen kann; ein
# direkter Zugriff auf den Authentik-Service ist wegen NetworkPolicy und der
# maskierten Quell-IP (ServiceLB) keine Option.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: authentik
spec:
  forwardAuth:
    address: "http://authentik-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
