apiVersion: batch/v1
kind: Job
metadata:
  name: wikijs-postgres-copy
  namespace: wikijs
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 10
        fsGroup: 10
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Quelle:"; ls -la /old; cat /old/pgdata_fixed_pg18/PG_VERSION
              find /new -mindepth 1 -delete
              mkdir /new/pgdata_fixed_pg18
              (cd /old/pgdata_fixed_pg18 && tar cf - .) | (cd /new/pgdata_fixed_pg18 && tar xpf -)
              chmod 700 /new/pgdata_fixed_pg18
              echo "Ziel:"; ls -la /new; ls -ld /new/pgdata_fixed_pg18; cat /new/pgdata_fixed_pg18/PG_VERSION
              du -sh /old/pgdata_fixed_pg18 /new/pgdata_fixed_pg18
          volumeMounts:
            - {name: old, mountPath: /old, readOnly: true}
            - {name: new, mountPath: /new}
      volumes:
        - name: old
          nfs:
            server: 192.168.178.97
            path: /volume1/k8s-storage/wikijs-wikijs-postgresql-data-pvc-01906f97-d61c-4a39-a1c9-4b908c460daf
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: wikijs-postgresql-data
