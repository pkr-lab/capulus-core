# Kopiert die Xibo-Daten (MySQL ~1,1 GB, CMS-Bibliothek ~14 MB, CMS-State) aus den TECH-Verzeichnissen auf
# dem NAS in die neuen PROD-Volumes (PVCs xibosignage-mysql-data / -cms-library / -cms-state). Manuell in PROD
# anwenden, NICHT per ArgoCD (siehe README.md in diesem Ordner):
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl apply -f -' < argocd/bootstrap-prod/migrations/xibosignage-data-copy-job.yaml
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl -n xibosignage logs job/xibosignage-data-copy'
#   ssh ubuntu@192.168.178.99 'sudo k3s kubectl -n xibosignage delete job xibosignage-data-copy'
#
# NUR mit gestopptem TECH-CMS und -MySQL (cms/mysql replicaCount 0) und PROD auf 0: die MySQL-Dateien muessen
# konsistent sein. Von MySQL nur das aktuelle Verzeichnis mysql-data-v26 (subPath im Chart); die alten 8.4-Daten
# (Rueckfall des Upgrades) bleiben in TECH. Ziele werden vor dem Kopieren geleert. Laeuft als uid 1000 / gid 10
# (NAS all_squash), MySQL verlangt Besitzer uid 1000 und Modus der Dateien/Ordner unveraendert (tar -p).
apiVersion: batch/v1
kind: Job
metadata:
  name: xibosignage-data-copy
  namespace: xibosignage
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 10
        fsGroup: 10
      containers:
        - name: copy
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              echo "== mysql (mysql-data-v26)"; ls -ld /old/mysql/mysql-data-v26
              find /new/mysql -mindepth 1 -delete
              mkdir /new/mysql/mysql-data-v26
              (cd /old/mysql/mysql-data-v26 && tar cf - .) | (cd /new/mysql/mysql-data-v26 && tar xpf -)
              chmod 750 /new/mysql/mysql-data-v26 2>/dev/null || true
              ls -ld /new/mysql/mysql-data-v26
              for v in library state; do
                echo "== $v"; ls -la /old/$v | head -8
                find /new/$v -mindepth 1 -delete
                (cd /old/$v && tar cf - .) | (cd /new/$v && tar xpf -)
              done
              du -sh /old/mysql/mysql-data-v26 /new/mysql/mysql-data-v26 /old/library /new/library /old/state /new/state
              echo FERTIG
          volumeMounts:
            - {name: old-mysql, mountPath: /old/mysql, readOnly: true}
            - {name: new-mysql, mountPath: /new/mysql}
            - {name: old-library, mountPath: /old/library, readOnly: true}
            - {name: new-library, mountPath: /new/library}
            - {name: old-state, mountPath: /old/state, readOnly: true}
            - {name: new-state, mountPath: /new/state}
      volumes:
        - name: old-mysql
          nfs: {server: 192.168.178.97, path: /volume1/k8s-storage/xibosignage-xibosignage-mysql-data-pvc-7d918278-f7a4-409d-bbda-a298ca73d65c, readOnly: true}
        - name: new-mysql
          persistentVolumeClaim: {claimName: xibosignage-mysql-data}
        - name: old-library
          nfs: {server: 192.168.178.97, path: /volume1/k8s-storage/xibosignage-xibosignage-cms-library-pvc-0b91789a-4e21-49f5-8573-ffde57c39c0f, readOnly: true}
        - name: new-library
          persistentVolumeClaim: {claimName: xibosignage-cms-library}
        - name: old-state
          nfs: {server: 192.168.178.97, path: /volume1/k8s-storage/xibosignage-xibosignage-cms-state-pvc-f06971a0-f488-478e-81ad-acafa18be083, readOnly: true}
        - name: new-state
          persistentVolumeClaim: {claimName: xibosignage-cms-state}
