---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tech
  namespace: argocd
spec:
  description: >-
    TECH-Cluster (homeserver): Plattform- und Betriebs-Apps (frueher platform + workloads). NetworkPolicy-Stufen haengen an den Listen argocd_platform_apps / argocd_workloads_apps.
  sourceRepos:
    - "https://github.com/pkr-lab/capulus-core.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: sealed-secrets
    - server: https://kubernetes.default.svc
      namespace: kubeseal-webgui
    - server: https://kubernetes.default.svc
      namespace: authentik
    - server: https://kubernetes.default.svc
      namespace: lldap
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: logging
    - server: https://kubernetes.default.svc
      namespace: gotify
    - server: https://kubernetes.default.svc
      namespace: gotify-bridge
    - server: https://kubernetes.default.svc
      namespace: ntfy
    - server: https://kubernetes.default.svc
      namespace: ntfy-bridge
    - server: https://kubernetes.default.svc
      namespace: cloudflared
    - server: https://kubernetes.default.svc
      namespace: pihole
    - server: https://kubernetes.default.svc
      namespace: coredns-custom
    - server: https://kubernetes.default.svc
      namespace: nas-storage
    - server: https://kubernetes.default.svc
      namespace: immich-storage
    - server: https://kubernetes.default.svc
      namespace: minio
    - server: https://kubernetes.default.svc
      namespace: argo-workflows
    - server: https://kubernetes.default.svc
      namespace: semaphore
    - server: https://kubernetes.default.svc
      namespace: headlamp
    - server: https://kubernetes.default.svc
      namespace: traefik-config
    - server: https://kubernetes.default.svc
      namespace: alamos-apager
    - server: https://kubernetes.default.svc
      namespace: alamos-relay
    - server: https://kubernetes.default.svc
      namespace: carplay-api
    - server: https://kubernetes.default.svc
      namespace: github-release-watcher
    - server: https://kubernetes.default.svc
      namespace: mediamtx
    - server: https://kubernetes.default.svc
      namespace: n8n
    - server: https://kubernetes.default.svc
      namespace: ollama
    - server: https://kubernetes.default.svc
      namespace: pacman
    - server: https://kubernetes.default.svc
      namespace: uptime-kuma
    - server: https://kubernetes.default.svc
      namespace: vaultwarden
    - server: https://kubernetes.default.svc
      namespace: zammad
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
