        revision: "main"
        directories:
          - path: "argocd/apps/workloads/*"
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: workloads
      source:
        repoURL: "https://github.com/pkr-lab/capulus-core.git"
        targetRevision: "main"
        path: "{{.path.path}}"
