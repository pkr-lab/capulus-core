# XcodeGen project spec (https://github.com/yonaskolb/XcodeGen).
#
# Generated .xcodeproj files are near-impossible to hand-author or diff
# correctly outside Xcode itself, so — like every other reproducible-infra
# piece in this repo (Helm charts instead of hand-edited k8s YAML) — the
# actual project is generated from this text file, not committed.
#
# Setup (once): brew install xcodegen
# Generate:     cd ios && xcodegen generate
# Then open HomeserverDashboard.xcodeproj in Xcode.

name: HomeserverDashboard

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  HomeserverDashboard:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: HomeserverDashboard
        excludes:
          - "Info.plist"
          - "HomeserverDashboard.entitlements"
    info:
      path: HomeserverDashboard/Info.plist
      # XcodeGen *writes* this file from these properties on every
      # `generate` — it does NOT merge with hand-edited content already at
      # that path, it overwrites it outright. Everything the app needs
      # (display name, launch screen, orientation, the ATS exception for
      # *.homeserver) has to live here, in project.yml, not in the plist
      # file itself, or it silently disappears on the next `xcodegen
      # generate` and the app starts refusing every http://*.homeserver
      # request.
      properties:
        CFBundleDisplayName: "Homeserver Dashboard"
        LSRequiresIPhoneOS: true
        # The layout isn't built for iPad's resizable Split View/Slide
        # Over/Stage Manager windows (no size-class-driven multi-column
        # UI) — without this, iPadOS launches it as a small floating
        # window instead of filling the screen.
        UIRequiresFullScreen: true
        # Modern (iOS 14+) empty-dict form gives a plain launch screen
        # without hand-authoring LaunchScreen.storyboard XML, which can't
        # be meaningfully validated without Xcode itself; this is Apple's
        # own current recommendation.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad has no notion of a locked-portrait "phone" app — Apple
        # expects rotation support there. iPhone stays portrait-only above.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # carplay-api.homeserver (and every other *.homeserver service) is
        # plain HTTP behind Traefik — see Constants.swift for why.
        NSAppTransportSecurity:
          NSExceptionDomains:
            homeserver:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # Alltag-Modus > Tankstellen: findet die nächste Nicht-Shell/Aral-
        # Station per Tankerkönig-Umkreissuche (siehe LocationManager.swift).
        NSLocationWhenInUseUsageDescription: "Wird verwendet, um im Alltag-Modus die nächstgelegene Tankstelle (ohne Shell/Aral) zu finden."
        # Requested on demand (see LocationManager.requestLocation()) when
        # only "Ungefährer Standort" is granted — otherwise the Tankerkönig
        # radius search can miss stations that are genuinely nearby.
        NSLocationTemporaryUsageDescriptionDictionary:
          TankstellenSuche: "Für die Umkreissuche nach Tankstellen wird kurzzeitig eine genaue Standortangabe benötigt — sonst kann eine tatsächlich nahe Tankstelle knapp außerhalb des Suchradius fallen."
    entitlements:
      path: HomeserverDashboard/HomeserverDashboard.entitlements
    settings:
      base:
        PRODUCT_NAME: "Homeserver Dashboard"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.homeserver-dashboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2" # Universal — iPhone and iPad, no Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  HomeserverDashboard:
    build:
      targets:
        HomeserverDashboard: all
    run:
      config: Debug
    archive:
      config: Release
