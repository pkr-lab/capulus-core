name: HomeserverDashboard

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  HomeserverDashboard:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: HomeserverDashboard
        excludes:
          - "Info.plist"
          - "HomeserverDashboard.entitlements"
    info:
      path: HomeserverDashboard/Info.plist
      properties:
        CFBundleDisplayName: "Homeserver Dashboard"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSExceptionDomains:
            homeserver:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocationWhenInUseUsageDescription: "Wird verwendet, um im Alltag-Modus die nächstgelegene Tankstelle (ohne Shell/Aral) zu finden."
        NSLocationTemporaryUsageDescriptionDictionary:
          TankstellenSuche: "Für die Umkreissuche nach Tankstellen wird kurzzeitig eine genaue Standortangabe benötigt — sonst kann eine tatsächlich nahe Tankstelle knapp außerhalb des Suchradius fallen."
    entitlements:
      path: HomeserverDashboard/HomeserverDashboard.entitlements
    settings:
      base:
        PRODUCT_NAME: "Homeserver Dashboard"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.homeserver-dashboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  HomeserverDashboard:
    build:
      targets:
        HomeserverDashboard: all
    run:
      config: Debug
    archive:
      config: Release
